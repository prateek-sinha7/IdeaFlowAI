# =============================================================================
# VelocityAI gitleaks configuration.
# =============================================================================
# Location: ci/gitleaks.toml (moved from the repo root). Passed explicitly via
# `--config ci/gitleaks.toml`; gitleaks only auto-discovers `.gitleaks.toml` at
# the --source root, so the flag is REQUIRED now that this file lives in ci/.
# Consumed by .github/workflows/ci.yml (`fast-checks` + `security-scan-secrets`
# jobs) — previously by the retired infra/buildspec.yml pre_build phase, same
# invocation.
# Extends gitleaks' built-in rule set (so all default detectors stay active on
# real, shipping code) and adds a PATH allowlist for directories that
# legitimately contain EXAMPLE / TEST / PLACEHOLDER secret-shaped strings.
#
# Rationale: the CI gate runs `gitleaks detect --no-git --redact --no-banner -v
# --source .` over the entire working tree. Without this allowlist it flags
# fixtures and docs that are intentionally fake (e.g. the AWS documentation
# example keys, RSA test blocks, `ghp_0123...` fixtures, `CHANGE_ME` env
# placeholders). Those are not real credentials, so they are scoped out by
# path here.
#
# IMPORTANT: only NON-SHIPPING paths are allowlisted. Application source
# (backend/app, backend/agents non-test, frontend/src), and real infrastructure
# (infra/terraform except the localstack throwaway layer, infra/scripts) are
# still scanned with the full default rule set. Do NOT add shipping paths here.
# If a genuine secret needs scoping, prefer a narrow regex/stopword over a path.

title = "VelocityAI gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Non-shipping paths containing example/test/placeholder secrets."
paths = [
  # Test fixtures (deliberately fake secrets used to exercise detection logic).
  '''backend/tests/.*''',
  '''frontend/e2e/.*''',
  # Documentation and planning artifacts (illustrative examples only).
  '''docs/.*''',
  '''\.planning/.*''',
  # Committed local AI-tooling skills — example tokens in their docs.
  '''skills/.*''',
  # Env templates: placeholders only (CHANGE_ME / GENERATE-... / dev-secret-...).
  '''env-templates/.*''',
  # Any committed *.example template (e.g. app.env.example, *.tfvars.example).
  '''.*\.example$''',
  # LocalStack throwaway layer — values are explicit placeholders, never real.
  '''infra/terraform/localstack/.*''',
  # gitleaks' OWN config + ignore metadata, at any path.
  #
  # gitleaks auto-skips the config file passed to `--config` (detect.go:
  # `fragment.FilePath == d.Config.Path`) but does NOT skip the ignore file,
  # and — because `detect` scans the FULL git log, not just the working tree —
  # it does not skip historical copies of either file at their previous paths.
  # Two concrete consequences this rule exists for:
  #   1. The triage comments in `gitleaksignore` describe the very findings
  #      they suppress. A comment that named the offending AWS key ID
  #      re-triggered `aws-access-token` ON THE IGNORE FILE ITSELF, and stayed
  #      triggered from history even after the value was redacted at HEAD.
  #   2. These files moved from the repo root into `ci/`. The root copies are
  #      still in history and would otherwise be re-scanned unskipped.
  # Neither file ever legitimately holds a live credential — one holds
  # allowlist rules, the other holds `commit:file:rule:line` fingerprints —
  # so scoping both out by path loses no real coverage.
  '''(^|/)\.?gitleaks\.toml$''',
  '''(^|/)\.?gitleaksignore$''',
]

# Belt-and-suspenders: well-known *example* credentials that are published as
# fakes (AWS docs keys; Stripe-style sample keys used in API tutorials embedded
# in frontend/src/data/skills.ts). Recognize them as examples wherever they
# appear so a sample never trips the gate. Keep these SPECIFIC, never broad.
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  '''sk_live_abc123''',
]

# NOTE: gitleaks' [allowlist] table has no `fingerprints` key (only `paths`,
# `regexes`, `commits`, `stopwords` — see gitleaks/config/allowlist.go). Six
# specific historical findings (4 false positives + 2 confirmed-expired dead
# secrets) are triaged individually by exact finding fingerprint instead, via
# `ci/gitleaksignore`, passed with `-i ci/gitleaksignore`. (gitleaks only
# auto-loads an ignore file named `.gitleaksignore` from the --source root, so
# the flag is REQUIRED now that it lives in ci/.) See that file for the full
# rationale per finding.
