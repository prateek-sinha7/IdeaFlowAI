# =============================================================================
# VelocityAI gitleaks configuration.
# =============================================================================
# Location: ci/gitleaks.toml (moved from the repo root). Passed explicitly via
# `--config ci/gitleaks.toml`; gitleaks only auto-discovers `.gitleaks.toml` at
# the --source root, so the flag is REQUIRED now that this file lives in ci/.
# Consumed by .github/workflows/ci.yml, the `security` matrix leg `secrets` — a
# single site. This once named `fast-checks` + `security-scan-secrets`; neither
# job exists after single-owner consolidation. Previously consumed by the retired
# infra/buildspec.yml pre_build phase, same invocation.
# Extends gitleaks' built-in rule set (so all default detectors stay active on
# real, shipping code) and adds a PATH allowlist for directories that
# legitimately contain EXAMPLE / TEST / PLACEHOLDER secret-shaped strings.
#
# Rationale: the CI gate (.github/scripts/ci-gitleaks.sh) runs `gitleaks detect
# --redact --no-banner --source .` over the full git HISTORY, not just the
# working tree (there is no `--no-git`). Without this allowlist it flags
# fixtures and docs that are intentionally fake (e.g. the AWS documentation
# example keys, RSA test blocks, `ghp_0123...` fixtures, `CHANGE_ME` env
# placeholders). Those are not real credentials, so they are scoped out by
# path here.
#
# IMPORTANT: only NON-SHIPPING paths are allowlisted. Application source
# (backend/app, backend/agents non-test, frontend/src), and real infrastructure
# (infra/terraform except the localstack throwaway layer, infra/scripts) are
# still scanned with the full default rule set. Do NOT add shipping paths here.
# If a genuine secret needs scoping, prefer a narrow regex/stopword over a path.

title = "VelocityAI gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Non-shipping paths containing example/test/placeholder secrets."
paths = [
  # Test fixtures (deliberately fake secrets used to exercise detection logic).
  '''backend/tests/.*''',
  '''frontend/e2e/.*''',
  # The root-level Playwright/e2e framework and its suites. Same class and same
  # justification as `backend/tests/.*` above — non-shipping test code whose
  # fixtures are deliberately fake. Added after run 35964176737 reported
  # `github-pat` on a constant literally named FAKE_PAT ("...NotARealTokenAnd
  # NeverWas...") and `generic-api-key` on a run-id UUID used as a route param.
  '''(^|/)tests/.*''',
  # Documentation and planning artifacts (illustrative examples only).
  '''docs/.*''',
  '''\.planning/.*''',
  # Bug-line proof store: raw pytest/probe output and mocked-API dumps. Run ids
  # (UUIDs) beside the word "token" trip generic-api-key; none are credentials.
  '''evidence/.*''',
  # Generated knowledge-store and search-index cards. Same class as `docs/` and
  # `.planning/` above: prose artifacts, never a credential store. Added after
  # `generic-api-key` fired on the literal path string `mcp/integrations` inside
  # a phase card — and it fired from TWO trees for the same text, which is the
  # signature of generated/duplicated documentation rather than a real secret.
  '''\.knowledge/.*''',
  '''\.searchable/.*''',
  # Committed local AI-tooling skills — example tokens in their docs.
  '''skills/.*''',
  # Committed local AI-tooling agent definitions and orchestration workflows.
  # These files contain dev-seed credentials (e.g. local login password for the
  # dev instance) used by the AI-powered testing/bug-fixing agents. The values
  # are the same dev-seed credentials already present in velocity.json and the
  # env-templates; they are not live secrets. Same class of non-shipping tooling
  # as `skills/.*` above.
  '''^\.claude/.*''',
  # Env templates: placeholders only (CHANGE_ME / GENERATE-... / dev-secret-...).
  '''env-templates/.*''',
  # Any committed *.example template (e.g. app.env.example, *.tfvars.example).
  '''.*\.example$''',
  # LocalStack throwaway layer — values are explicit placeholders, never real.
  '''infra/terraform/localstack/.*''',
  # gitleaks' OWN config + ignore metadata, at any path.
  #
  # gitleaks auto-skips the config file passed to `--config` (detect.go:
  # `fragment.FilePath == d.Config.Path`) but does NOT skip the ignore file,
  # and — because `detect` scans the FULL git log, not just the working tree —
  # it does not skip historical copies of either file at their previous paths.
  # Two concrete consequences this rule exists for:
  #   1. The triage comments in `gitleaksignore` describe the very findings
  #      they suppress. A comment that named the offending AWS key ID
  #      re-triggered `aws-access-token` ON THE IGNORE FILE ITSELF, and stayed
  #      triggered from history even after the value was redacted at HEAD.
  #   2. These files moved from the repo root into `ci/`. The root copies are
  #      still in history and would otherwise be re-scanned unskipped.
  # Neither file ever legitimately holds a live credential — one holds
  # allowlist rules, the other holds `commit:file:rule:line` fingerprints —
  # so scoping both out by path loses no real coverage.
  '''(^|/)\.?gitleaks\.toml$''',
  '''(^|/)\.?gitleaksignore$''',
]

# Belt-and-suspenders: well-known *example* credentials that are published as
# fakes (AWS docs keys; Stripe-style sample keys used in API tutorials embedded
# in frontend/src/data/skills.ts). Recognize them as examples wherever they
# appear so a sample never trips the gate. Keep these SPECIFIC, never broad.
#
# `verify_exp=not allow_expired` is NOT an example credential — it is the
# literal source text of a real, shipping boolean kwarg call in
# backend/app/core/identity.py (`verify_cognito_access_token(token,
# verify_exp=not allow_expired)`). `generic-api-key` matches it as an
# assignment-shaped value
# near the keyword "token". This used to be triaged via two LINE-PINNED
# fingerprints in ci/gitleaksignore (identity.py:133 and :159); every
# unrelated edit above those lines shifted them and silently re-broke the
# suppression (observed: the second entry drifted to line 161 and failed CI
# again without the underlying finding changing at all). An exact-substring
# regex match on the finding's own text is immune to line drift and no
# broader than a fingerprint — same specificity, without the maintenance tax.
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  '''sk_live_abc123''',
  # NOTE: gitleaks' allowlist `regexes` match against the EXTRACTED SECRET
  # value (finding.Secret), not the full matched line. For this finding the
  # `generic-api-key` rule's capture group stops at the space before
  # `allow_expired` (Secret == "verify_exp=not"), so a regex requiring the
  # full "verify_exp=not allow_expired" string never matches and silently
  # fails to suppress anything. Match the actual extracted secret instead.
  '''verify_exp=not''',
  # --- Triaged from run 35964176737. Each entry is the EXACT extracted secret
  # --- as reported by `gitleaks detect` without --redact, for the same reason
  # --- the verify_exp note above gives: guessing the capture boundary silently
  # --- suppresses nothing.
  #
  # A Python keyword argument, not a credential. The `generic-api-key` rule
  # anchors on the substring "token" inside `max_tokens` and then captures the
  # next assignment-shaped token on the line, which here is an identifier passed
  # to a function:
  #   reasoning_fields(model_id, effort, max_tokens,
  #                    disable_thinking=disable_thinking)
  # This lives in backend/app (SHIPPING source), so a path allowlist is
  # forbidden by this file's own header — a regex is the only correct tool.
  '''disable_thinking=disable_thinking''',
  # A Vitest fixture token in IntegrationsCard.copyFeedback.test.tsx, sitting
  # beside `token_prefix: "vai_abc"` in the same object literal. The component
  # under test only copies the string to the clipboard. Colocated under
  # frontend/src, which is shipping source, so again: regex, not path.
  '''vai_abc123secret''',
]

# NOTE: gitleaks' [allowlist] table has no `fingerprints` key (only `paths`,
# `regexes`, `commits`, `stopwords` — see gitleaks/config/allowlist.go). Four
# specific historical findings (2 remaining false positives + 2
# confirmed-expired dead secrets) are triaged individually by exact finding
# fingerprint instead, via `ci/gitleaksignore`, passed with
# `-i ci/gitleaksignore`. (gitleaks only auto-loads an ignore file named
# `.gitleaksignore` from the --source root, so the flag is REQUIRED now that
# it lives in ci/.) See that file for the full rationale per finding. The two
# `identity.py` `verify_exp=not allow_expired` findings were migrated OUT of
# that line-pinned list and into the `regexes` allowlist above — see the
# comment there for why.
