# docker-compose.yml
#
# VelocityAI app stack — backend (FastAPI/uvicorn) + frontend (Next.js standalone).
#
# Postgres and nginx run NATIVELY on the host, not in this file (see
# docs/SIMPLE_AWS_DEPLOYMENT.md). Postgres stays native so its data dir on the
# separate encrypted EBS volume matches what the backup/DR path expects.
# Nginx stays native because it terminates TLS using host-managed certbot
# certs that must survive independently of app-image rebuilds.
#
# Two run modes:
#   Local dev:  `docker compose build && docker compose up -d` (local build context)
#   Production: `docker compose pull && docker compose up -d` (ECR images pinned
#               via BACKEND_IMAGE / FRONTEND_IMAGE in /etc/velocityai/app.env)
# `${BACKEND_IMAGE:-velocityai-backend:local}` falls back to the local-build
# tag when unset, so one compose file serves both modes.

name: velocityai

services:
  backend:
    image: ${BACKEND_IMAGE:-velocityai-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        # OpenDesign reference tree lives at repo root, outside ./backend.
        # Mirrors the CI buildx --build-context opendesign=skills/opendesign.
        opendesign: ./skills/opendesign
    restart: unless-stopped
    env_file:
      # Production: /etc/velocityai/app.env (written by velocityai-load-secrets).
      # Local dev: ./app.env (see app.env.example). Compose merges both in
      # order, so ./app.env overrides /etc/velocityai/app.env when present.
      - path: /etc/velocityai/app.env
        required: false
      - path: ./app.env
        required: false
    extra_hosts:
      # host-gateway lets the container reach Postgres at host.docker.internal:5432
      # (the host's loopback Postgres). Do NOT use network_mode: host instead —
      # that removes container network isolation entirely.
      - "host.docker.internal:host-gateway"
    ports:
      # 127.0.0.1-only: nginx (on the host) is the sole client. Defence in
      # depth against a misconfigured security group.
      - "127.0.0.1:8000:8000"
    volumes:
      # EBS-backed data dirs so skills/runs survive instance replacement.
      - /opt/velocityai/data/skills:/app/skills
      - /opt/velocityai/data/runs:/app/runs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      # Backend holds ~100MB per running pipeline; 8G ceiling mirrors §15.1
      # capacity numbers. Limits map to the cgroup memory.max on this host.
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    logging:
      # Cap json-file size so it can't fill /var/lib/docker and OOM the host.
      # Production overrides this to awslogs — see docker-compose.prod.yml.
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    # Long-lived WebSocket pipelines can stream for tens of minutes; 30s grace
    # lets uvicorn drain in-flight frames instead of the default 10s KillTimeout.
    stop_grace_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-velocityai-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked at BUILD time (Next.js inlines NEXT_PUBLIC_* at build, not
        # runtime). CI populates these from the deployment FQDN. Empty
        # defaults are fine for local dev (relative URLs via nginx).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # node:20-bookworm-slim ships neither wget nor curl, so probe with
      # Node's http client instead. 127.0.0.1 (not localhost): the standalone
      # server binds IPv4 only, and Debian resolves localhost to ::1 first.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    depends_on:
      # Wait for backend health so the frontend's SSR layer doesn't 502 while
      # the backend is still starting.
      backend:
        condition: service_healthy
