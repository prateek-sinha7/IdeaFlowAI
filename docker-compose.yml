# docker-compose.yml
#
# VelocityAI app stack — backend (FastAPI/uvicorn) + frontend (Next.js standalone).
#
# Postgres and nginx run NATIVELY on the host, not in this file (see
# docs/SIMPLE_AWS_DEPLOYMENT.md). Postgres stays native so its data dir on the
# separate encrypted EBS volume matches what the backup/DR path expects.
# Nginx stays native because it terminates TLS using host-managed certbot
# certs that must survive independently of app-image rebuilds.
#
# Two run modes:
#   Local dev:  `docker compose build && docker compose up -d` (local build context)
#   Production: `docker compose pull && docker compose up -d` (ECR images pinned
#               via BACKEND_IMAGE / FRONTEND_IMAGE in /etc/velocityai/app.env)
# `${BACKEND_IMAGE:-velocityai-backend:local}` falls back to the local-build
# tag when unset, so one compose file serves both modes.

name: velocityai

services:
  backend:
    image: ${BACKEND_IMAGE:-velocityai-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        # OpenDesign reference tree lives at repo root, outside ./backend.
        # Mirrors the CI buildx --build-context opendesign=skills/opendesign.
        opendesign: ./skills/opendesign
    restart: unless-stopped
    env_file:
      # Production: /etc/velocityai/app.env (written by velocityai-load-secrets).
      # Local dev: ./app.env (see app.env.example). Compose merges both in
      # order, so ./app.env overrides /etc/velocityai/app.env when present.
      - path: /etc/velocityai/app.env
        required: false
      - path: ./app.env
        required: false
    extra_hosts:
      # host-gateway lets the container reach Postgres at host.docker.internal:5432
      # (the host's loopback Postgres). Do NOT use network_mode: host instead —
      # that removes container network isolation entirely.
      - "host.docker.internal:host-gateway"
    ports:
      # 127.0.0.1-only: nginx (on the host) is the sole client. Defence in
      # depth against a misconfigured security group.
      - "127.0.0.1:8000:8000"
    volumes:
      # EBS-backed data dirs so skills/runs survive instance replacement.
      # :z relabels them for container access on SELinux-enforcing hosts
      # (Fedora/RHEL, the Podman VM); it is a no-op where SELinux is off.
      # Ownership is fixed at container start by docker-entrypoint.sh.
      - /opt/velocityai/data/skills:/app/skills:z
      - /opt/velocityai/data/runs:/app/runs:z
    healthcheck:
      # Python standard library probe (the backend image ships no curl). Same
      # probe as backend/Dockerfile's HEALTHCHECK; any exception exits 1, which
      # matches `curl -f`. Every backend image, including older rollback
      # digests, has `python` on PATH, so this override is rollback-safe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      # Backend holds ~100MB per running pipeline; 8G ceiling mirrors §15.1
      # capacity numbers. Limits map to the cgroup memory.max on this host.
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    logging:
      # Cap json-file size so it can't fill /var/lib/docker and OOM the host.
      # Production overrides this to awslogs — see docker-compose.prod.yml.
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    # Long-lived WebSocket pipelines can stream for tens of minutes; 30s grace
    # lets uvicorn drain in-flight frames instead of the default 10s KillTimeout.
    stop_grace_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-velocityai-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked at BUILD time — Next.js inlines NEXT_PUBLIC_* during the build,
        # so it cannot be changed by the runtime container env.
        #
        # CI DOES NOT SET THIS. The previous comment claimed "CI populates these
        # from the deployment FQDN", which was true of the retired CodeBuild
        # scripts (scripts/deploy.sh still does it) but is the opposite of the
        # current design: deploy.yml's "Build + push frontend" step passes NO
        # NEXT_PUBLIC_* build args on purpose (D-4), so one env-agnostic image
        # promotes dev -> stage -> prod unchanged and talks to its backend
        # through relative URLs that nginx terminates.
        #
        # The arg is KEPT because it is not dead for local development:
        # `NEXT_PUBLIC_API_URL=http://localhost:8000 docker compose up` is a
        # documented workflow (docs/ENVIRONMENT_CONFIGURATION.md) for running
        # the frontend against a backend on the host rather than behind nginx.
        # Empty — the default — is what every pipeline-built image gets.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    # No `healthcheck:` here on purpose. The image's own HEALTHCHECK
    # (frontend/Dockerfile) is the probe: it uses the image's absolute node
    # path (/nodejs/bin/node in distroless, which has no shell and no node on
    # PATH). An override here would pin one image's filesystem layout, and a
    # rollback to an older digest would then report unhealthy.
    #
    # Runtime hardening (see .agents/tasks/frontend-image-hardening-plan.md).
    # The app code in the image is root-owned; the process runs as 10001.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      # Next's server cache (next/image output). Owned by the image's UID so
      # the server can write it while the rest of the filesystem is read-only.
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # tini as PID 1: reaps zombies and forwards signals to node.
    init: true
    deploy:
      resources:
        limits:
          memory: 1G
          # Process limit. Set only here: compose v2 rejects a service that
          # sets both `pids_limit` and `deploy.resources.limits.pids`.
          pids: 200
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    depends_on:
      # Wait for backend health so the frontend's SSR layer doesn't 502 while
      # the backend is still starting.
      backend:
        condition: service_healthy
