name: Setup backend
description: Install Python, uv, and cached venv (dev or prod deps)

inputs:
  dev-deps:
    description: Include dev dependencies (ruff, pyright, pytest, etc.)
    required: false
    default: "true"
  python-version:
    description: Python version to use
    required: false
    default: "3.12"
  frozen:
    description: >-
      Deprecated no-op. backend/uv.lock is gitignored (never committed), so
      there is no lockfile on the runner for `uv sync --frozen` to read.
      Dependencies are always installed from requirements*.txt regardless of
      this input. Kept only so existing callers that pass `frozen: "true"`
      don't fail on an unrecognized input.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: backend/requirements*.txt

    - name: Cache .venv
      id: venv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: backend/.venv
        key: venv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('backend/requirements-prod.txt', 'backend/requirements-dev.txt') }}-${{ inputs.dev-deps }}
        restore-keys: |
          venv-${{ runner.os }}-py${{ inputs.python-version }}-
          venv-${{ runner.os }}-

    - name: Install dependencies
      if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      working-directory: backend
      run: |
        set -euo pipefail
        uv venv --python ${{ inputs.python-version }}
        # Source of truth is requirements*.txt, not uv.lock: uv.lock is
        # gitignored (local dev convenience only) and never present on the
        # CI runner, so `uv sync --frozen` always fails here with
        # "Unable to find lockfile". Install with `uv pip install` instead.
        if [[ "${{ inputs.dev-deps }}" == "true" ]]; then
          uv pip install -r requirements-dev.txt
        else
          uv pip install -r requirements-prod.txt
        fi
