name: Setup frontend
description: Install Node.js and cache npm dependencies

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install npm dependencies
      shell: bash
      working-directory: frontend
      # `--no-audit` is deliberately NOT passed: it would silently skip npm's
      # install-time advisory check on every install, which is exactly the
      # "npm ci used to bypass audit" pattern Task 3.16 forbids. The dedicated
      # blocking `npm audit` step later in ci.yml is a separate, explicit
      # policy gate — it does not make a quieter install-time check redundant,
      # it is just the enforcement point. `--prefer-offline` only prefers the
      # local cache over the registry; it does not affect determinism because
      # `npm ci` already installs the exact resolved tree from
      # package-lock.json and fails if package.json disagrees with it.
      run: npm ci --prefer-offline
