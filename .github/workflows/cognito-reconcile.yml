# VelocityAI Cognito Reconciliation — drift report between the pool and the DB.
# =============================================================================
# Part of the Cognito-only auth migration (.kiro/specs/login/prompt.md Phase 2),
# which asks for "a manual GitHub workflow cognito-reconcile.yml in report
# mode".
#
# WHY A WORKFLOW AT ALL
# --------------------
# Cognito is the sole authentication authority; the local `users` row is a
# mapping plus an advisory projection. Those two stores can drift, and the
# dangerous direction is silent: a user deleted or disabled in the AWS console
# still has a local row that `resolve_principal` resolves, and any access token
# already in their hands stays offline-verifiable until its own `exp` (AWS
# documents this). Nobody holds EC2/SSH or direct database access to any
# environment, so an operator cannot go and look — this workflow is the channel,
# over the same SSM RunCommand path deploy.yml and provision.yml use.
#
# TWO MODES:
#   report        — read-only, and the DEFAULT. Prints the three drift classes:
#                   local rows with no live pool user, local rows active locally
#                   but disabled at the pool, and pool users with no local row
#                   (the last is informational only — just-in-time provisioning
#                   creates those on first sign-in). Changes nothing. Run this
#                   first, every time.
#   fix-disabled  — reports, then sets users.status='disabled' on local rows
#                   Cognito CONFIRMS are absent or disabled, advancing
#                   tokens_valid_from and clearing the stored refresh token in
#                   the same transaction. It never re-enables, never deletes a
#                   local row, and never creates one — see the reconciler's
#                   docstring for why each of those would be an authority
#                   inversion.
#
# SCHEDULED DAILY at 03:00 UTC, in `report` mode only, against dev only (stage
# and prod declare required reviewers; see the F-14 note on `reconcile`).
#
# The earlier version of this comment said "NOT SCHEDULED, deliberately", on the
# grounds that a scheduled run nobody reads is an alarm nobody hears. That
# objection is answered rather than ignored: the scheduled run FAILS the job when
# the report contains drift, so the alarm is a red run and a notification rather
# than a line in a log. That is also why the schedule is report-only.
#
# `fix-disabled` remains manual and reviewed, and is unreachable from the
# schedule — it revokes access, which is not something a cron should decide.
#
# A second scheduled job drains the deferred `AdminDeleteUser` queue
# (`retry-cognito-deletions` below), for the same reason: those rows exist
# because a Cognito delete failed after the local row was already gone, and
# nothing else retries them.
#
# NO SECRETS ARE INVOLVED. Unlike deploy.yml's config push, this fetches
# nothing from SSM and pipes nothing to stdin: the reconciler reads the pool
# with the EC2 instance role's own Cognito grants. Its output (user ids,
# emails, drift counts) is all already visible in the admin UI. (The
# admin-recovery.yml workflow this comment used to contrast against was
# deleted in Phase 4 of the Cognito-only auth migration -- it recovered a
# local break-glass admin that no longer exists.)
# =============================================================================

name: Cognito Reconcile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      mode:
        description: "report = read-only drift report. fix-disabled = also disable local rows Cognito confirms are gone/disabled (revokes access; never re-enables or deletes)."
        required: true
        type: choice
        options:
          - report
          - fix-disabled
        default: report

# CONCURRENCY IS DECLARED PER JOB, NOT HERE (F-10/F-29).
#
# * `matrix` only exists inside a job, so only a job-level group can name the
#   environment a scheduled leg actually targets. A workflow-level group that
#   resolves to the same `deploy-<env>` name as a job-level group deadlocks the
#   run on manual dispatch: GitHub cancels it with "Canceling since a deadlock
#   was detected for concurrency group ... between 'top level workflow' and
#   '<job>'". The workflow-level block that used to live here did exactly that.
# * Both jobs share `deploy-<env>` with deploy.yml's `deploy` job and
#   provision.yml, so a reconcile or retry never runs at the same time as a
#   deploy or provision on that environment's box (they `docker compose exec`
#   on the box a deploy runs `docker compose up` on).
# * GitHub keeps at most one running and one pending entry per group, and a
#   newly queued entry cancels an older PENDING one regardless of
#   `cancel-in-progress`. So a nightly run queued behind a running deploy can
#   supersede another pending entry in that group — including a pending
#   deploy, which must then be re-run. `cancel-in-progress: false` only
#   protects the RUNNING entry.

permissions:
  contents: read

# F-25: the AWS region fallback lives in .github/actions/aws-deploy-auth; every
# region site reads that action's `steps.aws.outputs.region`.

jobs:
  # F-14: THE SCHEDULED MATRIX COVERS ONLY ENVIRONMENTS WITH NO REQUIRED REVIEWER.
  #
  # It was [dev, stage, prod]. GitHub environment protection applies to any job
  # that references the environment, whatever triggered it — so once
  # .github/environments/{stage,prod}.json are actually applied (they declare 1 and
  # 2 required reviewers respectively, and today are NOT applied: all three live
  # environments have zero protection rules), each nightly run would sit waiting
  # for a human approval. A drift alarm that needs a nightly approval to fire is
  # not an alarm. That was a latent trap: correctly applying prod.json would have
  # silently stalled this job.
  #
  # `environment:` cannot simply be dropped to avoid it. The AWS role ARN and
  # instance id are Environment variables, and the OIDC trust policy matches
  # `repo:<owner>/<repo>:environment:<env>` with StringEquals
  # (infra/terraform/bootstrap/github_oidc.tf), so a job without an environment
  # gets a subject STS refuses.
  #
  # So: dev is checked nightly, automatically. stage and prod are checked by manual
  # dispatch, which IS reviewer-gated — and that is the right posture for a
  # workflow whose other mode (`fix-disabled`) revokes user access.
  #
  # TRADE-OFF, STATED PLAINLY: prod drift is no longer detected automatically. To
  # restore that without re-introducing the stall, give the read-only path its own
  # ungated environment plus a matching OIDC trust subject, then add it here.
  # backend/tests/unit/tools/ci/test_ruleset_workflow_contract.py
  # (TestScheduledJobsAreNotReviewerGated) fails the build if a reviewer-gated
  # environment is added back to a cron-reachable job.
  reconcile:
    name: Cognito Reconcile (${{ github.event_name == 'schedule' && matrix.environment || inputs.environment }}, ${{ github.event_name == 'schedule' && 'report' || inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # F-10/F-29: declared per job (see the note above `permissions:`), and the
    # group is computed from the SAME expression as `environment:`, so each
    # matrix leg serialises against its own environment's deploys. The old
    # workflow-level group resolved to `deploy-scheduled-reconcile` on a schedule,
    # which shares nothing with `deploy-dev`/`deploy-stage`/`deploy-prod`, so on
    # the only automatic path it defeated the very race it was documented to
    # prevent. Deriving the group from `matrix.environment` (rather than a literal)
    # keeps it correct if more environments are ever added to the schedule.
    concurrency:
      group: deploy-${{ github.event_name == 'schedule' && matrix.environment || inputs.environment }}
      cancel-in-progress: false
    strategy:
      # fail-fast: false so one environment's drift does not cancel the others'
      # reports — the whole point is to see every environment. Matches the
      # `security` and `container-scan` matrices in ci.yml. The
      # `retry-cognito-deletions` job below uses a byte-identical `include`.
      #
      # The dispatch branch builds a ONE-leg matrix from the chosen input
      # environment. It used to be `fromJson('[]')`, and GitHub fails a job whose
      # matrix is empty at strategy evaluation ("Matrix must define at least one
      # vector"), so a manual run never started. `format()` doubles the literal
      # braces (`{{ }}`) and `{0}` is the input, which is a choice-typed value
      # (dev/stage/prod), so nothing untrusted reaches the JSON.
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'schedule' && fromJson('[{"environment":"dev"}]') || fromJson(format('[{{"environment":"{0}"}}]', inputs.environment)) }}
    environment: ${{ github.event_name == 'schedule' && matrix.environment || inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      # Only the on-host script the SSM payload needs, plus the local composite
      # action this job invokes. .github/actions/ssm-run/ MUST stay listed:
      # `uses: ./...` resolves against the checked-out tree, so omitting it
      # fails the step with "Can't find 'action.yml'".
      - name: Checkout (reconcile payload only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/remote-cognito-reconcile.sh
            .github/actions/ssm-run/
            .github/actions/aws-deploy-auth/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The SAME per-environment deploy role deploy.yml/provision.yml use. Its
      # ssm:SendCommand grant is conditioned on ssm:resourceTag/Environment
      # matching this GitHub Environment's own name
      # (infra/terraform/bootstrap/github_oidc.tf), so a `dev` run physically
      # cannot command a `stage`/`prod`-tagged instance whatever value is pasted
      # into EC2_INSTANCE_ID.
      #
      # F-25: the aws-deploy-auth composite validates EC2_INSTANCE_ID (set, and
      # shaped like an instance id) before it mints the session. That replaced
      # this job's separate "Preflight — validate configuration" step.
      - name: Configure AWS credentials (OIDC — per-env deploy role)
        id: aws
        uses: ./.github/actions/aws-deploy-auth
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          instance-id: ${{ vars.EC2_INSTANCE_ID }}
          require-instance-id: "true"

      # Payload ASSEMBLY only — sending and polling are the ssm-run composite
      # action's job (F-05). No SSM parameter prefix is needed here: unlike
      # deploy.yml's config push, this payload fetches no secrets.
      - name: Build SSM reconcile payload
        id: build-payload
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
          MODE: ${{ github.event_name == 'schedule' && 'report' || inputs.mode }}
        run: |
          set -euo pipefail

          {
            echo '#!/bin/bash'
            echo "# Generated by .github/workflows/cognito-reconcile.yml -- do not edit on the box."
            echo "REGION='${AWS_REGION}'"
            echo "MODE='${MODE}'"
            cat .github/scripts/remote-cognito-reconcile.sh
          } > remote.sh

          echo "path=remote.sh" >> "$GITHUB_OUTPUT"

      # The reconciler pages ListUsers and runs one indexed query; it completes
      # in seconds for any realistic pool. The window is headroom for a cold
      # `docker compose exec` plus ListUsers pagination on a large pool.
      - name: Reconcile via SSM RunCommand
        id: reconcile
        uses: ./.github/actions/ssm-run
        with:
          script-path: ${{ steps.build-payload.outputs.path }}
          instance-id: ${{ steps.aws.outputs.instance-id }}
          aws-region: ${{ steps.aws.outputs.region }}
          comment: "velocityai cognito-reconcile ${{ github.event_name == 'schedule' && 'report' || inputs.mode }} (${{ github.repository }} run ${{ github.run_id }})"
          # send 120 s + execution 600 s must fit in the poll window (REL-22); the
          # job's timeout-minutes (15) still bounds the whole run.
          send-timeout-seconds: "120"
          execution-timeout-seconds: "600"
          poll-timeout-minutes: "12"

      # A SECOND, independent drift assertion at the workflow level.
      #
      # remote-cognito-reconcile.sh already greps its own report for `^DRIFT$`
      # and exits 1, which fails the SSM command and therefore the step above.
      # This re-checks the command's captured stdout here instead of trusting
      # that. The two are not redundant: the remote grep lives in a shell script
      # that is generated, concatenated and run on the box, and if that grep is
      # ever broken or the exit code swallowed, the drift becomes invisible while
      # the job still goes green — which is the failure mode a drift alarm cannot
      # afford. This assertion depends only on the text the box printed.
      #
      # `|| true` on the fetch: a lost invocation record must not be reported as
      # "no drift". The emptiness check below turns that into an explicit failure.
      - name: Assert no drift (scheduled report runs)
        if: github.event_name == 'schedule'
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
          INSTANCE_ID: ${{ steps.aws.outputs.instance-id }}
          COMMAND_ID: ${{ steps.reconcile.outputs.command-id }}
          DEPLOY_ENV: ${{ matrix.environment }}
        run: |
          set -euo pipefail

          : "${COMMAND_ID:?ssm-run did not report a command id}"

          OUTPUT="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'StandardOutputContent' --output text || true)"

          if [[ -z "$OUTPUT" ]]; then
            echo "::error::Could not read the reconcile output for ${DEPLOY_ENV}; treating as UNVERIFIED rather than clean."
            exit 1
          fi

          # Anchored to the reconciler's own final verdict line so the word
          # appearing in prose, an email address or a user id cannot trip it.
          # NO_DRIFT must not match, hence the anchors rather than a substring.
          if grep -qx 'DRIFT' <<<"$OUTPUT"; then
            echo "::error::Cognito/DB drift detected in ${DEPLOY_ENV}. Review the report above, then run this workflow manually with mode=fix-disabled if the findings are expected."
            exit 1
          fi

          echo "No drift in ${DEPLOY_ENV}."

  # Retry pending Cognito deletions. `--max-attempts 3` gives up faster on
  # persistent failures, leaving exhausted rows for operator review.
  #
  # F-14/F-27: this was `environment: prod` hardcoded, on a schedule-only
  # trigger, and later a hardcoded `'dev'` literal beside reconcile's matrix.
  #   * It now runs over THE SAME MATRIX as `reconcile`: a byte-identical
  #     `include` expression, `fail-fast: false`, and the same per-environment
  #     `deploy-<env>` concurrency group. The two jobs can no longer disagree
  #     about which environments the schedule covers; adding one is the same
  #     one-literal change in both (asserted by
  #     backend/tests/unit/tools/ci/test_cognito_reconcile_contracts.py).
  #   * The schedule is dev-only because stage and prod declare required
  #     reviewers (F-14, the long note on `reconcile` above), so a nightly run
  #     against them would queue for approval forever.
  #   * stage and prod are drained by a manual dispatch with `mode=fix-disabled`,
  #     which is reviewer-gated — and that pairing is coherent, because both are
  #     MUTATING operations: `fix-disabled` revokes access and this job deletes
  #     pool users. A `report` dispatch stays strictly read-only and does not
  #     run this job at all.
  retry-cognito-deletions:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fix-disabled')
    name: Retry Cognito Deletions (${{ github.event_name == 'schedule' && matrix.environment || inputs.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Shares the deploy concurrency group for this environment so it cannot race a
    # deploy's `docker compose up` — it runs `compose exec` on the same box.
    concurrency:
      group: deploy-${{ github.event_name == 'schedule' && matrix.environment || inputs.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'schedule' && fromJson('[{"environment":"dev"}]') || fromJson(format('[{{"environment":"{0}"}}]', inputs.environment)) }}
    environment: ${{ github.event_name == 'schedule' && matrix.environment || inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout (retry payload only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/
            .github/actions/ssm-run/
            .github/actions/aws-deploy-auth/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # F-25: the aws-deploy-auth composite adds the EC2_INSTANCE_ID shape check
      # this job never had, and runs it before the session is minted.
      - name: Configure AWS credentials (OIDC — per-env deploy role)
        id: aws
        uses: ./.github/actions/aws-deploy-auth
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          instance-id: ${{ vars.EC2_INSTANCE_ID }}
          require-instance-id: "true"

      - name: Build retry payload
        id: build-payload
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
        run: |
          set -euo pipefail

          {
            echo '#!/bin/bash'
            echo "# Generated by .github/workflows/cognito-reconcile.yml -- do not edit on the box."
            echo "REGION='${AWS_REGION}'"
            # `cat << EOF`, NOT `cat > - << EOF`. The latter redirects cat's
            # stdout to a file literally named `-`, so the whole payload landed
            # there and remote.sh received only the three echo lines above. The
            # generated script then ran, did nothing, and exited 0 — a green
            # scheduled job that never retried a single pending deletion.
            cat << 'EOF'
          set -euo pipefail

          : "${REGION:?REGION was not injected by cognito-reconcile.yml}"

          APP_DIR=/opt/velocityai
          ETC_DIR=/etc/velocityai
          APP_ENV="${ETC_DIR}/app.env"

          if [ ! -d "$APP_DIR" ]; then
              echo "[retry] FATAL: ${APP_DIR} does not exist — is this the right box?" >&2
              exit 1
          fi
          cd "$APP_DIR"

          if [ -f "$APP_ENV" ]; then
              for _name in BACKEND_IMAGE FRONTEND_IMAGE VELOCITYAI_ENVIRONMENT VELOCITYAI_CW_LOG_GROUP; do
                  _line="$(grep -E "^${_name}=" "$APP_ENV" | tail -n1 || true)"
                  if [ -n "$_line" ]; then
                      export "${_name}=${_line#*=}"
                  fi
              done
          fi
          export AWS_REGION="$REGION"

          compose_stack() {
              docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@"
          }

          if ! compose_stack ps --status running --services 2>/dev/null | grep -qx backend; then
              echo "[retry] FATAL: the backend container is not running. Deploy first." >&2
              compose_stack ps >&2 || true
              exit 1
          fi

          echo "[retry] === Retrying pending Cognito deletions (--max-attempts 3) ==="
          compose_stack exec -T backend python -m app.scripts.retry_cognito_deletions --apply --max-attempts 3

          echo "[retry] === Final status check ==="
          compose_stack exec -T backend python -m app.scripts.retry_cognito_deletions --report

          echo "[retry] SUCCESS"
          EOF
          } > remote.sh

          echo "path=remote.sh" >> "$GITHUB_OUTPUT"

      - name: Retry via SSM RunCommand
        uses: ./.github/actions/ssm-run
        with:
          script-path: ${{ steps.build-payload.outputs.path }}
          instance-id: ${{ steps.aws.outputs.instance-id }}
          aws-region: ${{ steps.aws.outputs.region }}
          comment: "velocityai cognito-retry (${{ github.repository }} run ${{ github.run_id }})"
          # send 120 s + execution 600 s must fit in the poll window (REL-22); the
          # job's timeout-minutes (15) still bounds the whole run.
          send-timeout-seconds: "120"
          execution-timeout-seconds: "600"
          poll-timeout-minutes: "12"
