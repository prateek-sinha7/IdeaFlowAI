name: Docker Build + Scan

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
        description: "'backend' or 'frontend'"
      build-context:
        required: true
        type: string
        description: "Build context directory (e.g., './backend')"
      dockerfile-path:
        required: true
        type: string
        description: "Path to Dockerfile (e.g., './backend/Dockerfile')"
      build-contexts:
        required: false
        type: string
        default: ""
        description: >-
          Extra named build contexts, one per line, `name=path` (e.g.
          'opendesign=./skills/opendesign'). Passed straight through to
          docker/build-push-action's `build-contexts` input. Required for the
          backend image, whose Dockerfile does `COPY --from=opendesign`.
      image-tag:
        required: true
        type: string
        description: "ECR image tag (e.g., 'v1.2.3' or 'main-latest')"
      push:
        required: false
        type: boolean
        default: false
        description: "Whether to push the image to ECR (true for deploy, false for PR)"
      registry:
        required: false
        type: string
        description: "ECR registry (e.g., '123456789.dkr.ecr.us-east-1.amazonaws.com')"
    outputs:
      digest:
        description: "Image digest (sha256:...)"
        value: ${{ jobs.build.outputs.digest }}
      image-ref:
        description: "Full image reference with digest"
        value: ${{ jobs.build.outputs.image-ref }}

env:
  # Keep in lockstep with ci.yml's workflow-level TRIVY_VERSION/TRIVY_SHA256 and
  # deploy.yml's copies of the same pair. Workflow-level `env:` cannot be shared
  # across workflow FILES, so a version bump is a three-file change; all three
  # sites carry a comment pointing at the others.
  TRIVY_VERSION: "0.69.3"
  TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
  GRYPE_VERSION: "0.75.0"

jobs:
  build:
    name: Build + Scan (${{ inputs.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.build.outputs.image-ref }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      - name: Build image
        id: build
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile-path }}
          build-contexts: ${{ inputs.build-contexts }}
          platforms: linux/amd64
          # Attestations require an exporter that can carry them (registry/oci).
          # On the PR path this build uses `outputs: type=docker` (below) so the
          # image lands in the local daemon for scanning, and buildkit rejects
          # provenance attestations for the docker exporter — asking for one
          # anyway fails the build. Gate it on `push`, which is exactly the
          # condition under which the registry exporter is in use.
          #
          # No `sbom:` flag: SBOM generation and its cosign attestation were
          # removed from this repo's pipeline (see deploy.yml's build job). The
          # enforced vulnerability signal is the blocking Trivy + Grype scan
          # below, not an SBOM artifact nothing consumed.
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          push: ${{ inputs.push }}
          # If pushing, include registry; if not, use docker.io as temporary ref
          tags: |
            ${{ inputs.push && format('{0}/{1}:{2}', inputs.registry, inputs.component, inputs.image-tag) || format('docker.io/library/{0}:local-{1}', inputs.component, inputs.image-tag) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: ${{ inputs.push && '' || 'type=docker' }}

      # Resolve ONE local image ID by digest so Trivy and Grype provably scan
      # the exact same bytes just built, not a mutable tag that could be
      # re-tagged between steps. `docker images --digests` on the freshly
      # loaded `type=docker` image reports the CONTENT digest as `<none>`
      # (untagged locally, unpushed), so the digest that matters here is the
      # one build-push-action itself already resolved: `steps.build.outputs.digest`.
      - name: Resolve local image reference (for scanning)
        run: |
          set -euo pipefail
          if [[ "${{ inputs.push }}" == "true" ]]; then
            IMAGE_REF="${{ inputs.registry }}/${{ inputs.component }}:${{ inputs.image-tag }}@${{ steps.build.outputs.digest }}"
          else
            # Local, unpushed image: build-push-action's `type=docker` output
            # loads it into the daemon under the tag below; the digest output
            # still identifies the exact content built. Both scanners below
            # are invoked against the TAG (the only reference the local
            # daemon can resolve without a registry) but we assert the
            # digest is non-empty first, so a build that produced no
            # resolvable digest fails closed instead of silently scanning
            # nothing.
            if [[ -z "${{ steps.build.outputs.digest }}" ]]; then
              echo "::error::build-push-action produced no digest for ${{ inputs.component }}; refusing to scan an unresolved image."
              exit 1
            fi
            IMAGE_REF="docker.io/library/${{ inputs.component }}:local-${{ inputs.image-tag }}"
          fi
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "Resolved image for scanning: ${IMAGE_REF} (digest ${{ steps.build.outputs.digest }})"

      # ── Phase 7: Image Scanning ────────────────────────────────────────

      # Installed the same way ci.yml's security-scan-iac job installs it: a
      # checksum-verified release binary via this repo's own composite action.
      #
      # This replaces `uses: aquasecurity/trivy-action@master`, which was wrong
      # twice over. (1) A MUTABLE ref — and mutable refs on this exact action are
      # not hypothetical: CVE-2026-33634 / GHSA-69fq-xp46-6x23 was attackers
      # force-pushing malicious commits onto aquasecurity/trivy-action's existing
      # version tags, which is the whole reason this repo installs scanners as
      # verified binaries (docs/CICD-DESIGN-DECISIONS.md#action-pinning-and-cve-2026-33634).
      # (2) trivy-action is a SCANNER, not an installer: invoked with only
      # `trivy-version` and no scan inputs it runs its own default scan rather
      # than leaving a `trivy` binary on PATH for the next step to call.
      - name: Install Trivy (checksum-verified)
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: trivy
          version: "v${{ env.TRIVY_VERSION }}"
          url: https://github.com/aquasecurity/trivy/releases/download/v${{ env.TRIVY_VERSION }}/trivy_${{ env.TRIVY_VERSION }}_Linux-64bit.tar.gz
          sha256: ${{ env.TRIVY_SHA256 }}
          archive-format: tar.gz
          binary-name: trivy

      - name: Scan image with Trivy (blocking on HIGH,CRITICAL)
        run: |
          set -euo pipefail
          
          echo "Scanning image: ${{ env.IMAGE_REF }}"
          
          # Zero-finding policy (bugfix 2.8): every resolved HIGH/CRITICAL
          # finding blocks regardless of fix availability. `--ignore-unfixed`
          # and the CVE ignorefile are deliberately NOT passed here — either
          # would let an unfixable-today finding report success, which is
          # exactly the suppression path this task removes. A genuinely
          # unfixable finding must be resolved by remediating the Dockerfile
          # (base image, package versions), not by adding it to an ignore
          # list.
          #
          # Captured into EXIT_CODE (not `set -e`'d straight through) so a
          # non-zero Trivy exit does not short-circuit the job before Grype
          # also gets to scan the same digest below — both engines must
          # report a verdict even when the first one fails.
          EXIT_CODE=0
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output trivy-${{ inputs.component }}.sarif \
            "${{ env.IMAGE_REF }}" || EXIT_CODE=$?

          if [[ "$EXIT_CODE" -ne 0 ]]; then
            echo "❌ Trivy scan failed (found HIGH or CRITICAL vulnerabilities)"
            echo "TRIVY_FAILED=1" >> "$GITHUB_ENV"
          else
            echo "✓ Trivy scan passed (no HIGH/CRITICAL vulns)"
            echo "TRIVY_FAILED=0" >> "$GITHUB_ENV"
          fi

      # Best-effort, and deliberately not a gate. The code-scanning upload needs
      # `security-events: write`, which is not always available to this workflow:
      # a nested reusable-workflow call cannot escalate past its caller's grant
      # (ci.yml's `container-scan` job grants it, but when ci.yml itself runs as
      # deploy.yml's `gate` it only holds `contents: read`), and fork PRs never
      # get it. The BLOCKING signal is the Trivy exit code in the step above, so a
      # 403 here must surface as a warning, not as a failed image scan.
      - name: Upload Trivy SARIF to GitHub Security (best-effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ccf74c947955fd1cf117aef6a0e4e66191ef6f61 # v3.25.4
        with:
          sarif_file: trivy-${{ inputs.component }}.sarif
          category: "trivy-${{ inputs.component }}"

      - name: Install Grype
        run: |
          set -euo pipefail
          
          mkdir -p /tmp/grype
          curl -sSL "https://github.com/anchore/grype/releases/download/v${{ env.GRYPE_VERSION }}/grype_${{ env.GRYPE_VERSION }}_linux_amd64.tar.gz" \
            -o /tmp/grype.tar.gz
          
          tar -xzf /tmp/grype.tar.gz -C /tmp/grype
          
          # Add to PATH
          echo "/tmp/grype" >> "$GITHUB_PATH"

      - name: Scan image with Grype (second engine, blocking on HIGH)
        run: |
          set -euo pipefail
          
          echo "Scanning image with Grype: ${{ env.IMAGE_REF }}"
          
          # EXIT_CODE must be initialised. This script runs under `set -u`, and
          # `|| EXIT_CODE=$?` only assigns on FAILURE — so on the success path
          # (grype exits 0) the variable was never set, and the `[[ $EXIT_CODE ...]]`
          # test below aborted the step with "EXIT_CODE: unbound variable".
          # A clean scan therefore failed the job, and only a clean scan did.
          EXIT_CODE=0
          # Zero-finding policy (bugfix 2.8): `--only-fixed` is deliberately
          # NOT passed. It previously matched Trivy's `--ignore-unfixed`
          # above so both engines shared one lenient policy — but that
          # policy is exactly what this task removes: every resolved
          # HIGH/CRITICAL finding blocks regardless of fix availability, so
          # a genuinely unfixable finding must be remediated (base image
          # swap, package removal), not filtered out of the scan.
          grype "${{ env.IMAGE_REF }}" \
            --fail-on high \
            --output json \
            > grype-results-${{ inputs.component }}.json || EXIT_CODE=$?
          
          if [[ "$EXIT_CODE" -ne 0 ]]; then
            echo "❌ Grype scan failed (found HIGH or higher severity vulnerabilities)"
            cat grype-results-${{ inputs.component }}.json
            echo "GRYPE_FAILED=1" >> "$GITHUB_ENV"
          else
            echo "✓ Grype scan passed"
            echo "GRYPE_FAILED=0" >> "$GITHUB_ENV"
          fi

      # Aggregate verdict: EITHER engine finding a blocking vulnerability
      # fails the job, run AFTER both scanners have had a chance to report
      # (Task 3.18: "run Trivy and Grype against that same digest even when
      # the first engine fails").
      - name: Enforce zero-finding policy (both engines)
        run: |
          set -euo pipefail
          if [[ "${TRIVY_FAILED:-1}" != "0" || "${GRYPE_FAILED:-1}" != "0" ]]; then
            echo "::error::Zero High/Critical policy violated for ${{ inputs.component }} (Trivy failed=${TRIVY_FAILED:-unset}, Grype failed=${GRYPE_FAILED:-unset})."
            exit 1
          fi
          echo "✓ Both Trivy and Grype report zero High/Critical findings for ${{ inputs.component }}."

      - name: Summary
        if: always()
        run: |
          cat << 'EOF'
          
          ================================
          Docker Build + Scan Complete
          ================================
          
          Component:  ${{ inputs.component }}
          Image Ref:  ${{ env.IMAGE_REF }}
          
          Scans Run:
            ✓ Trivy (HIGH,CRITICAL, exit-code 1)
            ✓ Grype (HIGH and above, fail-on high)
          
          Provenance: SLSA v1 Build Level 2 (signed by GitHub), push path only
          SBOM:       not generated (removed — see the build step's note)
          
          EOF
