# =============================================================================
# VelocityAI Deploy — build, push, and redeploy to EC2 via SSM RunCommand.
# =============================================================================
# Replaces the retired CodeBuild pipeline (infra/buildspec.yml) with GitHub
# Actions + OIDC: no static AWS keys, no SSH, no open port 22, and no Terraform
# anywhere in the pipeline.
#
# NO TERRAFORM IN CI/CD (locked design decision — docs/GITHUB_CICD_SETUP.md).
# The buildspec applied the `shared`, `foundation` and `app` layers on every
# build and then read `terraform output` to find the box and its config bucket.
# None of that happens here. Infrastructure is applied out-of-band by an
# operator; this workflow only builds images and redeploys containers. The two
# Terraform-derived inputs it still needs come from GitHub configuration and the
# checkout instead:
#
#   terraform output -raw instance_id    -> vars.EC2_INSTANCE_ID
#   terraform output -raw config_bucket  -> not needed; docker-compose.yml,
#       docker-compose.prod.yml and infra/scripts/reconcile-host-config.sh are
#       injected into the SSM payload straight from this commit, so a deploy can
#       never ship a compose file left over from an older `terraform apply`.
#
# The on-host half lives in .github/scripts/remote-deploy.sh — a committed,
# lintable file rather than a heredoc buried in this YAML. Read its header for
# the full buildspec-parity notes (first-boot wait, host-config reconcile exit
# contract, uid-10001 bind mounts, image-pin reconcile, pre-deploy pg_dump).
#
# Trigger matrix — ref -> environment -> image tag:
#
#   | Ref (merge target)   | Environment | Image tag                  |
#   |----------------------|-------------|----------------------------|
#   | refs/heads/dev       | dev         | dev-<commit>               |
#   | refs/heads/staging   | stage       | stage-<commit>             |
#   | refs/tags/v*         | prod        | <the tag itself>           |
#   | any branch, prod     | prod        | prod-<branch>-<commit>     |
#   | (break-glass only)   |             | (`/` in the branch -> `-`) |
#
#   `<commit>` is the first 12 chars of the commit SHA, so every merge to
#   dev/staging produces a distinct, traceable tag. A prod release is addressed
#   by its own release tag (e.g. v1.4.0) — never a commit tag — so what shipped
#   is named the same way in ECR, in git, and in the deploy log.
#
#   The break-glass row is reachable only via workflow_dispatch with
#   allow_untagged_prod=true. Its tag MUST include the commit: it used to be the
#   bare branch name, and because these ECR repositories are IMMUTABLE the tag
#   `main` could only be pushed once — so the second and every later emergency
#   deploy found `:main` already present, adopted that first run's digest, and
#   skipped the build entirely. It shipped stale bytes precisely when knowing
#   what you are shipping matters most.
#
#   Prod additionally requires (a) required-reviewer approval on the `prod`
#   GitHub Environment, and (b) that the tagged commit is an ancestor of
#   origin/main. "From main" is ENFORCED, not assumed: a v* tag can be cut on
#   any commit, so the tag name alone proves nothing. Pair with GitHub-side
#   protected tag rules + the prod Environment's tag restrictions.
#
#   - workflow_dispatch -> manual choice of environment (same tag scheme;
#     selecting prod still needs a v* ref unless allow_untagged_prod is set).
#
# Every branch above is matched explicitly in `resolve`; an unmapped ref fails
# rather than defaulting to dev.
#
# Artifact flow: images are built ONCE per commit, pushed to IMMUTABLE ECR
# repositories under a single tag, and then deployed BY DIGEST. No `-latest`
# alias participates in a deploy, and a re-run adopts the existing image's
# digest rather than re-pushing it.
#
# NOTE: branch names and environment names are intentionally NOT 1:1 —
# the `staging` BRANCH deploys to the `stage` ENVIRONMENT, matching the
# short names already used by the live AWS infra (EC2 `Environment` tags,
# SSM `/velocityai/<env>/*` prefixes, and the deploy role's
# `ssm:resourceTag/Environment` condition are all `dev`/`stage`/`prod`,
# not `dev`/`staging`/`production`).
#
# Decisions locked (D-1..D-6):
#   D-1: Parameter Store for env transfer
#   D-2: Inline compose in the SSM command (no S3 dependency)
#   D-3: OIDC subject is matched EXACTLY, per environment. Each GitHub
#        Environment maps to its OWN IAM role, trusted only for
#        repo:<owner>/<repo>:environment:<that env> (StringEquals, no globs —
#        a glob would also admit other similarly-named orgs/repos). One shared
#        ECR-only build role; three single-environment deploy roles.
#        See infra/terraform/bootstrap/github_oidc.tf.
#   D-4: Env-agnostic frontend (no per-env baked NEXT_PUBLIC_* URLs)
#   D-5: DATABASE_PASSWORD host-generated (GitHub never pushes it)
#   D-6: app-level ENV host-anchored to `production` (GitHub never pushes it)
#
# Action pinning: same SHA-pinned convention as ci.yml, per CVE-2026-33634.
# See the ci.yml header for the full rationale.
# =============================================================================

name: Deploy

on:
  push:
    branches:
      - dev
      - staging
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      allow_untagged_prod:
        description: "BREAK-GLASS: allow deploying prod from a non-v* ref (e.g. a branch). Use ONLY in emergencies when you cannot cut a tag."
        required: false
        type: boolean
        default: false

# NOTE: concurrency is declared on the `deploy` JOB (not here at workflow level)
# so it can read `needs.resolve.outputs.environment` instead of re-implementing
# the trigger -> environment mapping. A workflow-level `concurrency:` cannot see
# the `needs` context, which would force a duplicate copy of the mapping that
# could silently drift out of sync with the `resolve` job.
#
# Serialising only `deploy` is also the correct scope: the race is on the shared
# EC2 instance, not on `build` (which pushes independent, tag-distinct images).

# Least-privilege DEFAULT for every job: read the repo, nothing else. The AWS
# OIDC token (`id-token: write`) is granted per JOB, only on the two jobs that
# actually call sts:AssumeRoleWithWebIdentity (`build`, `deploy`). Declaring it
# workflow-wide handed a mintable AWS-audience token to `gate` (which is
# deliberately AWS-blind) and `resolve` (which only does string arithmetic),
# widening what a compromised action in either could reach for.
permissions:
  contents: read

env:
  # F-25: the AWS region fallback lives in .github/actions/aws-deploy-auth; every
  # region site reads that action's `steps.aws.outputs.region`.

  # The branch a prod release must descend from. The `resolve` job refuses a
  # prod deploy whose commit is not contained in this branch, so a v* tag cut
  # on an unmerged/unreviewed commit cannot reach production.
  PROD_SOURCE_BRANCH: main

  # F-08: the ECR repository names, previously inlined verbatim at 6 sites in
  # this file (probe, build+push tags x2, post-push image scans x2, deploy-record
  # params x2). One rename now touches one line instead of six, and a typo in
  # any one of the six copies can no longer silently point a step at the
  # wrong repository.
  BACKEND_ECR_REPO: velocityai/backend
  FRONTEND_ECR_REPO: velocityai/frontend

  # F-08: trivy version/checksum for the image-scan steps in `build` below.
  # MUST stay identical to ci.yml's env.TRIVY_VERSION / env.TRIVY_SHA256 (the
  # Terraform-config scan in the `security` matrix leg `iac`, and the image scans
  # in `container-scan`) — workflow-level `env:` cannot be shared across separate
  # workflow FILES, so this is a second, deliberately parallel copy of TWO. Bump
  # both together; tests/unit/tools/ci/test_toolchain_pins.py enforces it.
  TRIVY_VERSION: "0.69.3"
  TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
  # Grype, for the same post-push scan: the pushed digests are now checked by
  # BOTH engines through .github/scripts/ci-image-scan.sh, exactly as ci.yml's
  # container-scan checks the locally built image. Same parallel-copy rule as
  # trivy above; test_toolchain_pins.py asserts both files agree.
  GRYPE_VERSION: "0.119.0"
  GRYPE_SHA256: "3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b"

jobs:
  # ---------------------------------------------------------------------------
  # CI gate — lint, test, and security scan on the same commit being deployed.
  # BLOCKS `build`, which in turn blocks `deploy`. It used to run in parallel
  # with build to save wall time, but that let a red commit publish images to
  # the shared registry; a few minutes of pipeline latency is the correct price
  # for "nothing unreviewed ever reaches ECR".
  #
  # NO `secrets:` BLOCK, and none is possible. ci.yml declares no
  # `workflow_call.secrets` inputs at all, so there is nothing to map: passing
  # any secret here would be rejected by the workflow parser. The gate is
  # therefore AWS-blind by construction rather than by convention — not even
  # `secrets: inherit` could hand it the AWS/OIDC material, and no
  # `environment:` is declared here either, so this job never mints an OIDC
  # token and the production reviewer gate stays on build/deploy alone.
  #
  # NO `timeout-minutes:` HERE. A job that calls a reusable workflow accepts
  # only name/uses/with/secrets/needs/if/permissions/strategy/concurrency —
  # `timeout-minutes` (like `runs-on`) is rejected by the workflow parser, which
  # is a STARTUP failure: the whole run dies before any job is created, the graph
  # cannot be rendered, and the run is titled by file path instead of `name:`.
  # The gate's time budget belongs to the called workflow: every job in ci.yml
  # declares its own `timeout-minutes` (10-30), so nothing here is unbounded.
  # ---------------------------------------------------------------------------
  # THE GATE RUNS FOR EVERY ENVIRONMENT, INCLUDING dev (F-03).
  #
  # It used to be SKIPPED for `dev` via `if: environment != 'dev'`. The stated
  # reason was that four mandatory signals reported red on pre-existing product
  # and dependency debt (frontend coverage, two dependency audits, e2e skips —
  # see .github/CI_STATUS.md) and blocked every dev deploy for reasons unrelated
  # to the commit being shipped. That reason was real; the remedy was not
  # proportionate. Skipping the gate discarded EVERY mandatory signal to avoid
  # 4 — so every dev deploy went out with no lint, no tests, no coverage gate, no
  # secret scan, no dependency audit and no container scan. Combined with ci.yml
  # having no `push` trigger for `dev` at the time, a dev deploy was evaluated by
  # nothing whatsoever.
  #
  # The replacement is a per-signal downgrade. `advisory_signals` names exactly
  # the signals that are still red on debt — now two (frontend-evidence,
  # frontend-e2e). The two dependency-audit signals were retired when pip-audit
  # and npm audit were folded into the Trivy/Grype container scans, whose only
  # exceptions are the dated entries in backend/tools/ci/scan_accepts.py. Each
  # advisory signal still RUNS, still REPORTS, and its real state is still
  # recorded in the evidence manifest — it just does not block THIS deploy. The
  # other signals block dev exactly as they block stage and prod.
  #
  # The mechanism cannot be widened from here. The allowlist and a hard expiry
  # date per entry live in backend/tools/ci/signal_registry.py, the gate rejects
  # any id that is not on the allowlist or is past its date, only a measured
  # `failure` is excusable (never a skipped/cancelled/missing verdict), and a
  # downgraded run does not publish the `ci-required` merge status. See
  # backend/tests/unit/tools/ci/test_ci_gate.py.
  #
  # WHEN THE DEBT IS PAID: delete the `advisory_signals` line below. Nothing else
  # needs to change, and the expiry dates in the registry will force the
  # conversation if it is forgotten.
  #
  # `needs: resolve` is required for the `if:` on the `with:` expression to read
  # the resolved environment. Both keys are legal on a reusable-workflow-call job
  # (unlike `timeout-minutes` — see the note above).
  gate:
    name: CI gate
    needs: resolve
    # TEMPORARY TESTING: gate disabled so deploy runs without waiting on CI.
    # REVERT: delete this `if: false` and restore the two `needs.gate.result == 'success'` checks.
    if: false
    # STARTUP-FAILURE FIX: a called reusable workflow cannot request MORE token
    # permission than the calling job grants, and GitHub enforces this while
    # BUILDING the graph — before any `if:` is evaluated and before any job is
    # created. ci.yml's `ci-required` job declares `statuses: write` (its only
    # elevated permission), so with the workflow-level `contents: read` alone
    # this call was rejected with "the nested job is requesting
    # 'statuses: write', but is only allowed 'statuses: none'". The whole run
    # died as `startup_failure` with zero jobs — including for `dev`, where the
    # gate is skipped, because skipping happens after graph construction.
    #
    # Granted on THIS JOB only, not workflow-level, so `resolve`/`build`/
    # `deploy` keep their existing envelopes. The gate stays AWS-blind: no
    # `id-token: write` here, so it still cannot mint a token for STS.
    #
    # `pull-requests: read` for the same reason (F-15): ci.yml's `changes` job
    # requests it for dorny/paths-filter. The filter step itself only runs on
    # pull_request, so a deploy always evaluates every signal, but the
    # permission check happens at graph construction regardless — without this
    # grant every deploy would die as `startup_failure` again.
    # backend/tests/unit/tools/ci/test_ci_graph_contracts.py asserts this job
    # grants every permission any ci.yml job requests.
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/ci.yml
    with:
      intent_id: deploy-${{ github.run_id }}
      # dev ONLY. The conditional is written as an allowlist of one rather than
      # as `!= 'prod'` so that a NEW environment is strictly gated by default —
      # the same reasoning the old skip condition used, kept deliberately.
      # stage and prod receive an empty string, which makes these signals
      # blocking for them. backend/tests/unit/tools/ci/test_workflow_contracts.py
      # asserts this expression names no environment other than dev.
      #
      # COMMA-separated and on ONE line on purpose. A YAML plain scalar folds a
      # line break into a SPACE, so writing these ids across several lines
      # would hand the gate one unsplittable token and fail the aggregate with a
      # confusing "not a registered signal". The gate accepts commas or newlines;
      # commas are the form that survives YAML folding.
      advisory_signals: ${{ needs.resolve.outputs.environment == 'dev' && 'frontend-evidence,frontend-e2e' || '' }}

  # ---------------------------------------------------------------------------
  # Resolve which environment and image tag to use based on the trigger event.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve environment + tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      sha_short: ${{ steps.resolve.outputs.sha_short }}
    steps:
      # Full history (fetch-depth: 0) is required by the prod ancestry gate
      # below — `git merge-base --is-ancestor` cannot answer anything on the
      # single-commit tree a default shallow checkout produces.
      - name: Checkout (full history for the prod ancestry gate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Resolve
        id: resolve
        env:
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          ALLOW_UNTAGGED_PROD: ${{ github.event.inputs.allow_untagged_prod }}
          EVENT_NAME: ${{ github.event_name }}
          # PROD_SOURCE_BRANCH is NOT re-declared here: workflow-level `env:` is
          # already inherited by every step, and writing
          # `PROD_SOURCE_BRANCH: ${{ env.PROD_SOURCE_BRANCH }}` would hit the
          # same-key collision documented in the header (a lookup of a key being
          # defined in the same block resolves to empty).
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA:0:12}"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"

          # ── Ref -> (environment, image tag) — the ONLY mapping ────────
          #   refs/heads/dev     -> dev    : dev-<commit>
          #   refs/heads/staging -> stage  : stage-<commit>
          #   refs/tags/v*       -> prod   : <the tag itself>
          #
          # Every branch is matched EXPLICITLY. There is deliberately no
          # catch-all "anything else is dev": adding a branch to the `on:` push
          # filter would then silently deploy it to the dev environment under a
          # dev-<sha> tag. An unrecognised ref is a configuration error, so it
          # fails here instead.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ENV="$DISPATCH_ENV"
            case "$ENV" in
              prod)
                # A dispatched prod deploy from a v* tag uses the tag itself —
                # that is the normal, documented path.
                #
                # BREAK-GLASS from a branch is different, and the naive
                # `TAG="${GITHUB_REF_NAME}"` was unsafe. ECR repos here are
                # IMMUTABLE, so the tag `main` can only ever be pushed once.
                # The FIRST break-glass run from main pushed `:main`; every
                # LATER one found `:main` already in the registry, and the probe
                # below adopted that old digest and skipped the build entirely.
                # So the second and every subsequent emergency deploy silently
                # shipped the bytes from the first one — exactly when being sure
                # what you are shipping matters most.
                #
                # Making the tag commit-unique fixes it. `/` is not legal in an
                # ECR tag, so a branch like `hotfix/db` becomes `hotfix-db`.
                # The `prod-` prefix keeps the tag out of the dev-/stage- name
                # space and under the ECR lifecycle's reserved prod- prefix, so a
                # branch named `dev-x` can never mint a dev-* tag (REL-12).
                if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                  TAG="${GITHUB_REF_NAME}"
                else
                  TAG="prod-$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')-${SHA_SHORT}"
                fi
                ;;
              stage) TAG="stage-${SHA_SHORT}" ;;
              dev)   TAG="dev-${SHA_SHORT}" ;;
              *)
                echo "::error::Unknown dispatch environment '$ENV' (expected dev, stage or prod)."
                exit 1
                ;;
            esac
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ENV="prod"
            TAG="${GITHUB_REF_NAME}"
          elif [[ "$GITHUB_REF" == "refs/heads/staging" ]]; then
            ENV="stage"
            TAG="stage-${SHA_SHORT}"
          elif [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            ENV="dev"
            TAG="dev-${SHA_SHORT}"
          else
            echo "::error::Ref '${GITHUB_REF}' has no environment mapping. Expected refs/heads/dev, refs/heads/staging, or refs/tags/v*."
            echo "::error::If this ref should deploy, add it to BOTH the 'on:' push filter and this mapping."
            exit 1
          fi

          # ── Prod tag enforcement ──────────────────────────────────────
          # Prod MUST deploy from a v* TAG REF. The allow_untagged_prod dispatch
          # input is the documented escape hatch for emergencies where cutting a
          # tag is impossible.
          #
          # This tests $GITHUB_REF, not $TAG. Testing the resolved tag name for
          # `^v` was a bypass: a branch whose name merely starts with "v"
          # (`vnext`, `v2-rewrite`) produced a tag that passed the check, so a
          # prod deploy from an untagged branch proceeded WITHOUT the break-glass
          # flag and without the warning that flag prints. What the gate is
          # actually asserting is "this release is addressed by a release tag",
          # which is a property of the ref, not of a string derived from it.
          if [[ "$ENV" == "prod" && "$GITHUB_REF" != refs/tags/v* ]]; then
            if [[ "$ALLOW_UNTAGGED_PROD" != "true" ]]; then
              echo "::error::Prod deploys require a v* tag (got '$TAG'). If this is an emergency, re-run with allow_untagged_prod=true."
              exit 1
            fi
            echo "::warning::BREAK-GLASS: deploying prod from non-v* ref '$TAG' (allow_untagged_prod=true)."
          fi

          # A tag ref that deploys to prod must be a release tag, not merely
          # `v*`: `vfoo` or `v1.2` would map to prod here yet never get a
          # release. Same grammar as release.yml (no `+build` suffix: `+` is not
          # a legal ECR tag character) (REL-04).
          if [[ "$GITHUB_REF" == refs/tags/* ]] \
              && [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag is not vMAJOR.MINOR.PATCH[-prerelease]; refusing to deploy it to prod."
            exit 1
          fi

          # ECR tags allow [A-Za-z0-9._-] only, and the SSM payload embeds this
          # value in a single-quoted shell assignment. Reject anything else here
          # rather than discovering it as a push failure or a broken payload.
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Resolved image tag '$TAG' is not a valid ECR tag."
            exit 1
          fi

          # ── Prod ancestry enforcement ─────────────────────────────────
          # A v* tag can be created on ANY commit — a feature branch, a fork's
          # merge commit, a reverted line of history — and the trigger above
          # maps every v* tag straight to prod. Tag-name matching therefore
          # proves nothing about what is being released. Require that the
          # commit being deployed is contained in ${PROD_SOURCE_BRANCH}, i.e.
          # that it went through the branch's review/protection rules.
          #
          # This is the workflow-side half of the control. The other half is
          # GitHub-side and cannot be expressed here: protected tag rules plus
          # the prod Environment's required reviewers and deployment tag
          # restrictions (docs/GITHUB_CICD_SETUP.md §3.1). Both are needed —
          # this check would be bypassable on its own by editing the workflow
          # on the branch being deployed.
          if [[ "$ENV" == "prod" ]]; then
            # Break-glass skips ancestry for branch refs only. A tag ref always
            # gets the check: a tag can be cut on any commit (REL-04).
            if [[ "$ALLOW_UNTAGGED_PROD" == "true" && "$GITHUB_REF" != refs/tags/* ]]; then
              echo "::warning::BREAK-GLASS: skipping the ${PROD_SOURCE_BRANCH} ancestry check for '${GITHUB_REF_NAME}'. The prod Environment's reviewer approval is the only remaining gate."
            else
              git fetch --no-tags --quiet origin "+refs/heads/${PROD_SOURCE_BRANCH}:refs/remotes/origin/${PROD_SOURCE_BRANCH}" || {
                echo "::error::Could not fetch origin/${PROD_SOURCE_BRANCH} to verify release ancestry."
                exit 1
              }
              if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${PROD_SOURCE_BRANCH}"; then
                echo "::error::Refusing prod deploy: commit ${GITHUB_SHA} is not an ancestor of origin/${PROD_SOURCE_BRANCH}. Merge the release to ${PROD_SOURCE_BRANCH} and re-tag. For an emergency, dispatch from a branch ref with allow_untagged_prod=true (break-glass, reviewer-gated); tag refs are always checked."
                exit 1
              fi
              echo "Prod ancestry verified: ${GITHUB_SHA} is contained in origin/${PROD_SOURCE_BRANCH}."
            fi
          fi

          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved: env=$ENV tag=$TAG sha=$SHA_SHORT"

  # ---------------------------------------------------------------------------
  # Build backend + frontend images and push to ECR.
  # Images are env-agnostic (D-4): one image per commit, promoted across envs by
  # DIGEST. Outputs the two digests the deploy job pins on the host.
  # ---------------------------------------------------------------------------
  build:
    name: Build + Push
    runs-on: ubuntu-24.04
    # `gate` is a REQUIRED dependency, not a parallel bystander: without it, a
    # commit that fails lint/tests/secret scanning would still publish images
    # to the shared registry before the
    # gate reported red. tests/ci/test_workflow_contracts.py::
    # test_build_depends_on_gate enforces this in CI — do not remove `gate`
    # from `needs` without updating that test's contract at the same time.
    needs: [gate, resolve]
    # F-03: the gate now runs for EVERY environment, so this condition no longer
    # needs — and must not have — an escape hatch for a skipped gate.
    #
    # It previously read `needs.gate.result == 'success' || environment == 'dev'`,
    # whose second clause meant "dev may reach ECR with no evaluation at all".
    # With the gate always running, `needs.gate.result == 'success'` is the only
    # acceptable condition for every environment, and a red gate on dev now stops
    # the build exactly as it does on prod.
    #
    # `!cancelled()` is kept so a cancelled run does not report a confusing
    # failure here, and it still fails closed on a broken `resolve`: if `resolve`
    # fails, `gate` (which needs it) is skipped, `needs.gate.result` is 'skipped',
    # and this job does not run.
    if: ${{ !cancelled() && needs.resolve.result == 'success' }} # TEMP: gate bypassed (was needs.gate.result == 'success')
    # 90, was 60: the post-push scan now runs BOTH engines against BOTH pushed
    # digests (each engine pulls the image itself), on top of the two builds.
    timeout-minutes: 90
    environment: ${{ needs.resolve.outputs.environment }}
    # Only this job and `deploy` mint an AWS OIDC token (see the workflow-level
    # `permissions:` note).
    permissions:
      id-token: write
      contents: read
    outputs:
      # The digests every downstream consumer deploys. A tag is a mutable
      # pointer even on an immutable repo (it can be created, and it is what a
      # human reads); a digest is the content itself.
      backend_digest: ${{ steps.digests.outputs.backend_digest }}
      frontend_digest: ${{ steps.digests.outputs.frontend_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      # The BUILD role: ECR push/pull only. It holds no SSM, KMS or EC2
      # permissions, so a compromised build step cannot write an environment's
      # config or reach a host — that authority lives only in the per-env
      # deploy roles assumed by the `deploy` job.
      #
      # F-25: region resolution + OIDC live in the aws-deploy-auth composite
      # (FIX-NODE20-01's configure-aws-credentials v6.2.3 pin moved there). No
      # instance id: this job commands no host.
      - name: Configure AWS credentials (OIDC — build role)
        id: aws
        uses: ./.github/actions/aws-deploy-auth
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      # ── Idempotent re-run guard (required by IMMUTABLE repositories) ──
      # The shared ECR repos are IMMUTABLE (infra/terraform/modules/ecr), so
      # re-pushing an existing tag is rejected with
      # ImagePushNotAllowedException. That is the point — a release tag must
      # keep meaning the same bytes — but it also means a re-run of a workflow
      # whose push already succeeded must NOT try again. Probe first: if the
      # tag is already in the registry, adopt its digest and skip the build.
      # This is also what makes "build once, promote by digest" literally true
      # for a redeploy of an existing tag.
      - name: Probe ECR for an existing image for this tag
        id: probe
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail

          probe_repo() {
            local repo="$1" out="$2"
            local digest err_file rc=0
            # A missing tag is the NORMAL case (first build of this commit) and
            # must not fail the step. Everything else must.
            #
            # This previously used `2>/dev/null || true` and treated an empty
            # result as "not present", which conflated three very different
            # outcomes: the tag is absent, the role is not authorized, and the
            # registry/network is unreachable. The last two were silently
            # reported as absence — and the consequence is not merely a wasted
            # build: on an IMMUTABLE repository a build+push against a tag that
            # DOES already exist fails with ImagePushNotAllowedException, so a
            # transient describe-images error turned a clean re-run into a hard
            # push failure with a misleading error.
            err_file="$(mktemp)"
            if ! digest="$(aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>"$err_file")"; then
              rc=1
            fi
            if [[ "$rc" -ne 0 ]]; then
              if grep -q 'ImageNotFoundException\|RepositoryNotFoundException' "$err_file"; then
                # Genuine absence. RepositoryNotFoundException is included
                # because a brand-new environment may not have the repository
                # yet; the push below creates nothing, so it will fail loudly
                # and legibly if that is the real problem.
                digest=""
              else
                cat "$err_file" >&2
                echo "::error::Could not determine whether ${repo}:${IMAGE_TAG} already exists in ECR."
                echo "::error::This is NOT the same as the tag being absent, so the build must not proceed: on an IMMUTABLE repository, pushing a tag that already exists fails with ImagePushNotAllowedException."
                echo "::error::Check the build role's ecr:DescribeImages grant and that the repository '${repo}' exists in ${AWS_REGION}."
                rm -f "$err_file"
                exit 1
              fi
            fi
            rm -f "$err_file"
            if [[ -n "$digest" && "$digest" != "None" ]]; then
              echo "  ${repo}:${IMAGE_TAG} already present -> ${digest}"
              echo "${out}_digest=${digest}" >> "$GITHUB_OUTPUT"
              echo "${out}_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "  ${repo}:${IMAGE_TAG} not present -> will build"
              echo "${out}_exists=false" >> "$GITHUB_OUTPUT"
            fi
          }

          probe_repo "${{ env.BACKEND_ECR_REPO }}" "backend"
          probe_repo "${{ env.FRONTEND_ECR_REPO }}" "frontend"

      - name: Set up Docker Buildx
        if: steps.probe.outputs.backend_exists != 'true' || steps.probe.outputs.frontend_exists != 'true'
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      # Build flags:
      #   provenance: mode=max  — SLSA Build Level 2 attestation, signed by
      #       GitHub and attached in ECR. Kept: it costs nothing, needs no extra
      #       tooling or IAM, and nothing in the deploy path depends on reading
      #       it back.
      #   platforms: linux/amd64  the EC2 host is x86_64; never publish an image
      #       whose architecture depends on the runner GitHub happens to give us
      #
      #   NO `sbom:` FLAG — deliberately. It was set to `true` alongside a
      #   `cosign attest --predicate sbom-<component>.spdx.json` step that could
      #   never work: buildkit attaches its SBOM as an OCI attestation in the
      #   registry and writes no such file to the runner, so the attest call
      #   always failed and was swallowed by a trailing `|| true`. Both the flag
      #   and the cosign steps are gone rather than left as decoration. The
      #   dependency-vulnerability signal this repo actually enforces is the
      #   Trivy/Grype scan of the pushed digest (TEMPORARILY advisory, see the TODO
      #   at the scan steps below), below and in ci.yml's
      #   container-scan job.
      - name: Build + push backend
        id: build-backend
        if: steps.probe.outputs.backend_exists != 'true'
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          context: ./backend
          # The opendesign named context mirrors docker-compose.yml's
          # build.additional_contexts and the retired buildspec's
          # `--build-context opendesign=skills/opendesign`: the OpenDesign
          # reference tree lives at the repo ROOT, outside ./backend, and
          # backend/Dockerfile bakes it in with
          # `COPY --from=opendesign . ./opendesign/` (read at runtime via
          # OD_ROOT=/app/opendesign). Without it every OpenDesign gallery is
          # empty in deployed environments.
          build-contexts: |
            opendesign=./skills/opendesign
          platforms: linux/amd64
          provenance: mode=max
          push: true
          # ONE tag per build. The `<env>-latest` alias is deliberately gone:
          # on an IMMUTABLE repository it could not be re-pushed anyway (tag
          # mutability is repository-wide on aws provider ~> 5.x), and a
          # floating alias has no place in a deploy path that now ships
          # digests. Rollback targets are the previous digest (kept on the box,
          # see remote-deploy.sh §7) or the previous release tag, both exact.
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPO }}:${{ needs.resolve.outputs.image_tag }}
          # Per-component scope. Without one, both images write the SAME default
          # GHA cache scope with mode=max, so each build evicts the other's layers
          # and every deploy is effectively a cold build. `deploy-` keeps these
          # separate from ci.yml's `ci-<component>` scopes, so layers produced by
          # an untrusted PR evaluation are never consumed by a deployment build.
          cache-from: type=gha,scope=deploy-backend
          cache-to: type=gha,mode=max,scope=deploy-backend

      - name: Build + push frontend
        id: build-frontend
        if: steps.probe.outputs.frontend_exists != 'true'
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          context: ./frontend
          platforms: linux/amd64
          provenance: mode=max
          push: true
          # No NEXT_PUBLIC_* build args (D-4): the frontend is built
          # env-agnostic and uses relative URLs that nginx terminates, so the
          # same image promotes dev -> stage -> prod unchanged.
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPO }}:${{ needs.resolve.outputs.image_tag }}
          # See the backend step: per-component, deploy-only cache scope.
          cache-from: type=gha,scope=deploy-frontend
          cache-to: type=gha,mode=max,scope=deploy-frontend

      # ── Resolve the digests this run will deploy ──────────────────────
      # Either the freshly built digest (build-push-action's `digest` output)
      # or the one the probe adopted. Fail loudly if neither is available: an
      # empty digest must never fall through to a tag-based deploy, because
      # that would silently restore exactly the mutable-pointer behaviour this
      # is here to remove.
      - name: Resolve image digests
        id: digests
        env:
          BACKEND_BUILT: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_BUILT: ${{ steps.build-frontend.outputs.digest }}
          BACKEND_PROBED: ${{ steps.probe.outputs.backend_digest }}
          FRONTEND_PROBED: ${{ steps.probe.outputs.frontend_digest }}
        run: |
          set -euo pipefail

          # Explicit if/else rather than `[[ -z x ]] && y=z`: that form returns
          # non-zero when the test is false, which is a latent `set -e` trap.
          resolve_digest() {
            local name="$1" built="$2" probed="$3" digest=""
            if [[ -n "$built" ]]; then
              digest="$built"
            else
              digest="$probed"
            fi
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not resolve a valid ${name} image digest (got '${digest}')."
              exit 1
            fi
            echo "${name}_digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "${name}: ${digest}"
          }

          resolve_digest "backend" "$BACKEND_BUILT" "$BACKEND_PROBED"
          resolve_digest "frontend" "$FRONTEND_BUILT" "$FRONTEND_PROBED"

      # ── Image vulnerability scan (ADVISORY on HIGH,CRITICAL - TEMPORARY) ──────────
      # TODO(security): TEMPORARY - vulnerability scans are WARN-ONLY (advisory) as of 2026-10-11.
      # In future this must be changed back to BLOCKING, and the outstanding High/Critical
      # vulnerabilities must be fixed (see backend/tools/ci/scan_accepts.py and scan reports).
      # As of 2026-10-11 these steps are warn-only again by an explicit owner decision.
      # A finding is reported (warnings + step summary + scan-results/*-verdict.json)
      # but no longer stops `deploy` or the writing of the `deploy/*` recovery
      # parameter, in every environment including prod. The container-scan[*]
      # signals are deliberately NOT in advisory_signals; they are warn-only at the
      # source (SCAN_GATE_MODE: warn in ci.yml container-scan and below).
      #
      # F-04: this gate was WARN-ONLY. Both steps still scanned and still
      # printed the table, but converted a finding into a `::warning::` and let
      # the job continue — so a HIGH or CRITICAL vulnerability could reach ECR
      # *and* be deployed, in every environment, with nothing else stopping it.
      # It is blocking again, unconditionally: dev, stage and prod alike.
      #
      # WHERE THIS SITS IN THE LAYERING. It is the SECOND image scan of the same
      # commit, and deliberately so:
      #   1. ci.yml's `container-scan` job builds both images from source and
      #      scans each with BOTH Trivy and Grype (plus a Trivy scan of
      #      frontend/package-lock.json). That job is part of the `gate` this
      #      workflow depends on, and since F-03 the gate runs for every
      #      environment — so nothing reaches `build` unless those signals were
      #      already green for this exact revision.
      #   2. THESE steps scan the bytes that were actually PUSHED, addressed by
      #      immutable digest. They confirm that what landed in the registry is
      #      what CI certified, and they are the only scans that can see the
      #      pushed artifact at all.
      # Both currently only warn on findings. A finding here after a green container-scan means the
      # pushed image and the locally built one differ, which is worth failing a
      # deploy over on its own.
      #
      # ONE SCRIPT, ONE POLICY. These steps run .github/scripts/ci-image-scan.sh
      # with IMAGE_SOURCE=registry — the same script, the same two engines and
      # the same gate as ci.yml. It previously ran a bare
      # `trivy image --exit-code 1`, which could never agree with CI once CI
      # applied reviewed exceptions: every accepted finding would pass the gate
      # and then block here. No --ignore-unfixed and no --ignorefile anywhere;
      # the only exceptions are the dated, per-package entries in
      # backend/tools/ci/scan_accepts.py, which fail the build when they expire
      # or stop matching anything.
      #
      # KNOWN BACKLOG and where each item went (see scan_accepts.py for the
      # reviewed justification of every accepted entry):
      #   Debian    zlib1g     CVE-2023-45853 — accepted until 2026-12-31
      #     (MiniZip is not built into zlib1g; no bookworm fix). Ends with a
      #     base-image move to a zlib >= 1.3.1 release.
      #   node-pkg  image-size CVE-2025-71329 / CVE-2025-71330 — accepted until
      #     2026-12-31 (no fix published; pptxgenjs runs sandboxed). Ends when
      #     the client-side .pptx export and pptxgenjs are removed.
      #   python    ecdsa      CVE-2024-23342 — accepted until 2026-12-31 (only
      #     RS256 is used; the EC signing path is unreachable). Ends with the
      #     PyJWT migration.
      #   python    setuptools CVE-2025-47273 — NOT accepted: it has a fix, so
      #     backend/Dockerfile upgrades the system interpreter's setuptools.
      #
      # SUPPLY-CHAIN NOTE. The gate needs the backend environment
      # (`setup-backend`), so this privileged job installs the ci-tools group
      # (defusedxml, pyyaml, requests) from the committed, hash-pinned uv.lock.
      # `uv sync --locked` refuses anything the lock does not pin, and CI's
      # container-scan runs the same gate on the same group; the trade was made
      # so deploy and CI cannot disagree about the policy.
      #
      # F-08: versions/checksums come from env.TRIVY_* / env.GRYPE_* at the top
      # of this file — see the note there for why they are deliberate,
      # separately-maintained copies of ci.yml's identical values.
      - name: Install trivy
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: trivy
          version: "v${{ env.TRIVY_VERSION }}"
          url: https://github.com/aquasecurity/trivy/releases/download/v${{ env.TRIVY_VERSION }}/trivy_${{ env.TRIVY_VERSION }}_Linux-64bit.tar.gz
          sha256: ${{ env.TRIVY_SHA256 }}
          archive-format: tar.gz
          binary-name: trivy

      - name: Install grype
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: grype
          version: "v${{ env.GRYPE_VERSION }}"
          url: https://github.com/anchore/grype/releases/download/v${{ env.GRYPE_VERSION }}/grype_${{ env.GRYPE_VERSION }}_linux_amd64.tar.gz
          sha256: ${{ env.GRYPE_SHA256 }}
          archive-format: tar.gz
          binary-name: grype

      # ci-tools: ci-image-scan.sh only runs `python -m tools.ci.scan_accepts`
      # and `python -m tools.ci.ci_gate`, so this privileged job installs just
      # the ci-tools group from the lock, not the full prod+dev graph.
      - name: Setup backend (ci-tools only, for the exceptions list and the scanner gate)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "ci-tools"

      # Disk headroom for two remote image exports plus both vulnerability DBs.
      # Same reasoning as ci.yml's container-scan (F-36): the builder cache is
      # dead weight once the images are pushed, and the preinstalled toolchains
      # removed here are never used by this job. The rest of the tool cache is
      # kept because setup-backend resolved its Python from it.
      - name: Reclaim runner disk before scanning
        run: |
          set -euo pipefail
          docker builder prune --all --force
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      # Advisory (TEMPORARY), with NO wrapper (continue-on-error and `|| true` stay
      # forbidden): SCAN_GATE_MODE=warn makes the gate exit 0 on findings and on
      # missing/empty/unparseable reports, so `deploy` and the `deploy/*` recovery
      # parameter are not blocked. The script still fails (and stops
      # `deploy`) on misconfiguration: an IMAGE_REF not pinned by digest, or an
      # invalid COMPONENT/IMAGE_SOURCE/SCAN_GATE_MODE.
      # TODO(security): TEMPORARY - vulnerability scans are WARN-ONLY (advisory) as of 2026-10-11.
      # In future this must be changed back to BLOCKING, and the outstanding High/Critical
      # vulnerabilities must be fixed (see backend/tools/ci/scan_accepts.py and scan reports).
      - name: Scan the pushed backend digest (Trivy + Grype, advisory - TEMPORARY)
        env:
          # TODO(security): TEMPORARY - vulnerability scans are WARN-ONLY (advisory) as of 2026-10-11.
          # In future this must be changed back to BLOCKING, and the outstanding High/Critical
          # vulnerabilities must be fixed (see backend/tools/ci/scan_accepts.py and scan reports).
          SCAN_GATE_MODE: warn
          IMAGE_REF: ${{ vars.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPO }}@${{ steps.digests.outputs.backend_digest }}
          COMPONENT: backend
          IMAGE_SOURCE: registry
          PRODUCER_PREFIX: deploy-image-scan
        run: bash .github/scripts/ci-image-scan.sh scan-results

      # `!cancelled()` so the frontend verdict is still recorded when the backend
      # scan is red. The job still fails if the backend step failed on misconfiguration.
      - name: Scan the pushed frontend digest (Trivy + Grype, advisory - TEMPORARY)
        if: ${{ !cancelled() }}
        env:
          # TODO(security): TEMPORARY - vulnerability scans are WARN-ONLY (advisory) as of 2026-10-11.
          # In future this must be changed back to BLOCKING, and the outstanding High/Critical
          # vulnerabilities must be fixed (see backend/tools/ci/scan_accepts.py and scan reports).
          SCAN_GATE_MODE: warn
          IMAGE_REF: ${{ vars.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPO }}@${{ steps.digests.outputs.frontend_digest }}
          COMPONENT: frontend
          IMAGE_SOURCE: registry
          PRODUCER_PREFIX: deploy-image-scan
        run: bash .github/scripts/ci-image-scan.sh scan-results

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-${{ github.run_id }}-image-scan-evidence
          path: scan-results/
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Deploy: push config to SSM, redeploy via SSM RunCommand, health-check.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (${{ needs.resolve.outputs.environment }})
    runs-on: ubuntu-24.04
    # `gate` is required here too, even though `build` already needs it
    # transitively: GitHub Actions does not enforce transitive `needs`, only
    # what is declared. Listing `gate` explicitly means a future edit that
    # drops it from `build`'s `needs` does not silently also drop it from the
    # path to `deploy`. tests/ci/test_workflow_contracts.py::
    # test_deploy_depends_on_gate enforces this in CI.
    needs: [resolve, gate, build]
    # Same shape as `build`'s condition above (see the F-03 note there for why
    # the `environment == 'dev'` escape hatch is gone), plus an explicit demand
    # that `build` SUCCEEDED — a skipped build produces no digests, and this job
    # would go on to assemble an SSM payload out of empty strings.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.build.result == 'success' }} # TEMP: gate bypassed (was needs.gate.result == 'success')
    timeout-minutes: 50
    environment: ${{ needs.resolve.outputs.environment }}
    # See the workflow-level `permissions:` note — the AWS token is minted per
    # job, not workflow-wide.
    permissions:
      id-token: write
      contents: read
    # Only one deploy per environment at a time — prevents two runs racing
    # `docker compose up` on the same box. Single source of truth for the
    # environment name is the `resolve` job (see the note in the header).
    #
    # cancel-in-progress: FALSE. It was `true`, justified by "preventing the
    # deadlock where multiple runs stack up in the concurrency queue unable to
    # execute". That deadlock does not exist: GitHub holds at most ONE pending
    # run per concurrency group, and a newer pending run supersedes the older
    # pending one rather than joining a growing queue. So queuing cannot stack
    # up and cannot deadlock.
    #
    # What `true` DID do is cancel a RUNNING deploy. This job's work is not
    # interruptible: "Redeploy via SSM RunCommand" is a single call that pulls
    # images, rewrites /etc/velocityai/app.env, runs `docker compose up`,
    # reconciles nginx and the CloudWatch agent, and runs a health gate with
    # rollback. Cancelling the runner mid-flight does NOT cancel the SSM command
    # — the box keeps going, unobserved — and if it does stop partway the host is
    # left half-applied with no rollback, because the rollback lives at the end
    # of the very script that was interrupted. It also skips "Record deployed
    # digests", so a rebuilt host would recover onto the PREVIOUS release while
    # the new one is partly live.
    #
    # Queuing is therefore the only safe policy. provision.yml shares this group
    # name for the same reason.
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    steps:
      # Only the four files the SSM payload carries, plus the local composite
      # action this job invokes. Cone mode is off because the set mixes
      # root-level files with nested paths; cone mode selects whole
      # directories and would pull far more than this.
      #
      # .github/actions/ssm-run/ MUST stay in this list: `uses: ./...` resolves
      # against the checked-out tree, so a sparse checkout that omits it fails
      # the step with "Can't find 'action.yml' ... under
      # .github/actions/ssm-run" — at deploy time, after the image build has
      # already burned 11 minutes. Add any new local action you `uses:` here.
      - name: Checkout (deploy payload only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            infra/scripts/bootstrap-ec2.sh
            docker-compose.yml
            docker-compose.prod.yml
            infra/scripts/reconcile-host-config.sh
            infra/scripts/velocityai-load-secrets.sh
            infra/scripts/lib/host-common.sh
            .github/scripts/remote-deploy.sh
            .github/scripts/upload-host-config.sh
            .github/actions/ssm-run/
            .github/actions/aws-deploy-auth/
          sparse-checkout-cone-mode: false
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      # The PER-ENVIRONMENT deploy role. AWS_DEPLOY_ROLE_ARN is set on each
      # GitHub Environment to that environment's own role
      # (velocityai-gha-deploy-<env>), whose trust policy names exactly one
      # OIDC subject and whose permissions name exactly one SSM prefix and one
      # EC2 `Environment` tag value. Consequences worth stating plainly:
      #   * a dev run physically cannot write /velocityai/prod/* or command a
      #     prod-tagged box, even with a wrong EC2_INSTANCE_ID;
      #   * pasting the wrong environment's role ARN into an Environment fails
      #     at STS with "Not authorized to perform sts:AssumeRoleWithWebIdentity"
      #     instead of quietly deploying with someone else's authority.
      # It holds no ECR permissions: the box pulls images with its instance
      # role (remote-deploy.sh §8).
      #
      # F-25: the aws-deploy-auth composite also validates EC2_INSTANCE_ID
      # (set, and shaped like an instance id) BEFORE it mints the session. This
      # job previously only checked that it was set.
      - name: Configure AWS credentials (OIDC — per-env deploy role)
        id: aws
        uses: ./.github/actions/aws-deploy-auth
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          instance-id: ${{ vars.EC2_INSTANCE_ID }}
          require-instance-id: "true"

      # B-15: fail the job at its FIRST step when the Environment is
      # mis-configured, rather than ~600 lines later at "Build SSM deploy
      # payload" (ECR_REGISTRY) or after the deploy has
      # already landed at "Refresh host config in S3"
      # (VELOCITYAI_BACKUP_BUCKET / VELOCITYAI_KMS_KEY_ID). The late
      # backup-bucket check was the worst of these: by the time it fired, the
      # release was live but the S3 config a rebuilt host boots from was stale.
      # Nothing here touches the host or AWS state, so an early exit is free.
      - name: Preflight — required environment variables
        env:
          DEPLOY_ENV: ${{ needs.resolve.outputs.environment }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          VELOCITYAI_BACKUP_BUCKET: ${{ vars.VELOCITYAI_BACKUP_BUCKET }}
          VELOCITYAI_KMS_KEY_ID: ${{ vars.VELOCITYAI_KMS_KEY_ID }}
        run: |
          set -euo pipefail
          # EC2_INSTANCE_ID is validated by the aws-deploy-auth step above.
          : "${ECR_REGISTRY:?ECR_REGISTRY is not set on the '${DEPLOY_ENV}' GitHub Environment}"
          : "${VELOCITYAI_BACKUP_BUCKET:?VELOCITYAI_BACKUP_BUCKET is not set on the '${DEPLOY_ENV}' GitHub Environment (see docs/GITHUB_CICD_SETUP.md)}"
          : "${VELOCITYAI_KMS_KEY_ID:?VELOCITYAI_KMS_KEY_ID is not set on the '${DEPLOY_ENV}' GitHub Environment (see docs/GITHUB_CICD_SETUP.md)}"
          echo "Preflight OK for '${DEPLOY_ENV}'."

      # ── Push config from GitHub variables/secrets to SSM ──────────────
      # Only parameters with non-empty values are pushed. The on-host
      # `velocityai-load-secrets` script applies its documented fallbacks for
      # anything absent from SSM (e.g. CORS_ORIGINS / PUBLIC_BASE_URL default
      # to the box's FQDN).
      - name: Push config to SSM Parameter Store
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
          # The prefix is NOT hard-coded. provision.yml and the bootstrap.env it
          # writes both honour VELOCITYAI_PARAM_PREFIX, and the on-host loader
          # reads whatever prefix bootstrap.env recorded — so if that variable is
          # set for an environment and this step ignored it, the deploy would
          # write config the host never reads. The default reproduces the
          # previous literal exactly.
          #
          # If set, the variable MUST be identical for provision and deploy on
          # the same environment. See docs/GITHUB_CICD_SETUP.md.
          SSM_PREFIX: ${{ vars.VELOCITYAI_PARAM_PREFIX || format('/velocityai/{0}', needs.resolve.outputs.environment) }}
          DEPLOY_ENV: ${{ needs.resolve.outputs.environment }}
          # Secrets
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          # Bootstrap-admin step removed: Cognito-only. See docs/architecture/authentication-and-authorization.md.
          # Cognito app-client secret — a SECRET, not a variable: it is a live
          # credential used to compute SECRET_HASH on AdminInitiateAuth
          # (backend/app/core/cognito.py compute_secret_hash). Read it out of
          # the foundation layer with
          #   terraform -chdir=infra/terraform/foundation output -raw cognito_client_secret
          # (or the Cognito console → App client → Show client secret) and paste
          # it into the environment's GitHub secret. Leave it UNSET to keep
          # Terraform as the sole owner — see the preserve-if-empty note below.
          COGNITO_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
          # Variables
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          ACCESS_TOKEN_EXPIRE_HOURS: ${{ vars.ACCESS_TOKEN_EXPIRE_HOURS }}
          HANDOFF_MAX_TRANSCRIPT_BYTES: ${{ vars.HANDOFF_MAX_TRANSCRIPT_BYTES }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          BEDROCK_INFERENCE_PROFILE_ID: ${{ vars.BEDROCK_INFERENCE_PROFILE_ID }}
          BEDROCK_CODING_MODEL_ID: ${{ vars.BEDROCK_CODING_MODEL_ID }}
          # Bootstrap-admin step removed: Cognito-only. See docs/architecture/authentication-and-authorization.md.
          # ── Cognito + auth flags ────────────────────────────────────────────
          # The six keys the application actually reads (Settings fields in
          # backend/app/core/config.py) and the canonical loader allowlist
          # in infra/scripts/velocityai-load-secrets.sh. The deploy installs
          # that exact loader before it reads SSM, so no provisioning run is
          # needed when an allowlist change ships.
          #
          # AUTH_PROVIDER, AUTH_ALLOW_LEGACY_JWT, and BREAK_GLASS_ENABLED were
          # REMOVED in Phase 4 of the Cognito-only auth migration: the backend's
          # Settings class no longer declares any of the three, Cognito is the
          # sole authentication authority unconditionally, and there is no
          # local-password fallback left to gate or dual-accept toward. See
          # MERGE_NOTES.md §18.
          #
          # DUAL OWNERSHIP, DELIBERATELY NON-DESTRUCTIVE, for what remains.
          # Every one of these six is also published by Terraform's foundation
          # layer (infra/terraform/modules/secrets/main.tf). They are pushed
          # here with the `preserve-if-empty` policy, NOT `delete-if-empty`: an
          # unset GitHub value means "the pipeline does not manage this key",
          # never "delete whatever Terraform wrote". Using delete-if-empty here
          # would make the first deploy after this block landed erase a live
          # pool config and crash-loop the backend at boot on
          # CognitoMisconfigured (config.py) — Cognito being unconditional now
          # makes that failure mode reachable on EVERY environment, not only one
          # that opted into AUTH_PROVIDER=cognito.
          #
          # So there are two supported postures per environment, and both work:
          #   * Terraform-owned (default): leave all six unset in GitHub. Deploy
          #     touches nothing; `terraform apply` on foundation stays the single
          #     writer. This is the recommended posture for the pool identifiers
          #     and the client secret.
          #   * Pipeline-owned: set them on the GitHub Environment. Useful for
          #     ADMIN_MFA_REQUIRED, which an operator may flip per environment
          #     more often than the pool is recreated.
          # Mixing is fine — ownership is per key, not per block.
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          # Empty falls back to AWS_REGION inside the app (core/cognito.py
          # _region), so it only needs setting when the pool lives outside the
          # deploy region.
          COGNITO_REGION: ${{ vars.COGNITO_REGION }}
          ADMIN_MFA_REQUIRED: ${{ vars.ADMIN_MFA_REQUIRED }}
          # Mirrors a CONSTRAINT AWS imposes, not a feature toggle: a pool with
          # email OTP as a second factor cannot also use email for account
          # recovery, so /api/auth/forgot-password must say so instead of
          # returning its usual generic 202. Terraform sources this from the
          # cognito module's DERIVED email_mfa_active output, which is why
          # leaving it Terraform-owned is usually correct — a hand-set GitHub
          # value can disagree with the pool that actually exists.
          AUTH_EMAIL_MFA_ENABLED: ${{ vars.AUTH_EMAIL_MFA_ENABLED }}
          # specs/014 — host capacity matrix + admission gate. Only these two
          # are wired as GitHub Environment variables; every other
          # HOST_CAPACITY_* setting is left at its Settings default
          # (app/core/config.py) and changed there directly if ever needed —
          # not worth a GitHub var per field. Not secrets; String,
          # delete-if-empty.
          HOST_CAPACITY_METRIC_NAMESPACE: ${{ vars.HOST_CAPACITY_METRIC_NAMESPACE }}
          # The operator-supplied EC2 instance id override (specs/014 §10
          # Resolutions Q3) — delivered as an ordinary Environment variable,
          # never pasted into source or Terraform.
          HOST_CAPACITY_INSTANCE_IDS: ${{ vars.HOST_CAPACITY_INSTANCE_IDS }}
          # The project CMK that encrypts this environment's SecureString
          # parameters. Set KMS_KEY_ALIAS on the GitHub Environment to the
          # actual alias in the account (e.g. `velocityai-dev-euc1`); the
          # `alias/` prefix is optional and normalised below. Left empty, the
          # legacy `alias/velocityai[-<env>]` convention is derived instead.
          KMS_KEY_ALIAS: ${{ vars.KMS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          # ── WHAT THIS STEP WRITES ─────────────────────────────────────
          # Copy the right row when adding a key. The POLICY column is the part
          # that is easy to get wrong, and getting it wrong is silent: see the
          # FIX-SSM-01 note below put_param for what each one means.
          #
          #   KEY                              TYPE          POLICY
          #   ------------------------------   ------------  -----------------
          #   SECRET_KEY                       SecureString  required
          #   LANGSMITH_API_KEY                SecureString  delete-if-empty
          #   CORS_ORIGINS                     String        delete-if-empty
          #   PUBLIC_BASE_URL                  String        delete-if-empty
          #   ACCESS_TOKEN_EXPIRE_HOURS        String        delete-if-empty
          #   HANDOFF_MAX_TRANSCRIPT_BYTES     String        delete-if-empty
          #   LANGSMITH_TRACING                String        delete-if-empty
          #   LANGSMITH_PROJECT                String        delete-if-empty
          #   COGNITO_USER_POOL_ID             String        preserve-if-empty
          #   COGNITO_CLIENT_ID                String        preserve-if-empty
          #   COGNITO_CLIENT_SECRET            SecureString  preserve-if-empty
          #   COGNITO_REGION                   String        preserve-if-empty
          #   ADMIN_MFA_REQUIRED               String        preserve-if-empty
          #   AUTH_EMAIL_MFA_ENABLED           String        preserve-if-empty
          #   HOST_CAPACITY_METRIC_NAMESPACE   String        delete-if-empty
          #   HOST_CAPACITY_INSTANCE_IDS       String        delete-if-empty
          #   llm/region                       String        required
          #   llm/model_id                     String        delete-if-empty
          #   llm/inference_profile_id         String        delete-if-empty
          #   llm/coding_model_id              String        delete-if-empty
          #
          # Choosing a POLICY:
          #   required          the app cannot start without it — an empty GitHub
          #                     value must FAIL the deploy, never wipe a live one
          #   delete-if-empty   GitHub is the sole owner; clearing it in GitHub
          #                     must clear it in SSM so the host's documented
          #                     fallback applies instead of a stale value
          #   preserve-if-empty ANOTHER writer also owns this key (today: the
          #                     Cognito/auth block, also published by Terraform's
          #                     foundation layer). "GitHub has no value" means
          #                     "GitHub does not manage this", NOT "delete it"
          #
          # NOT written here, deliberately: DATABASE_PASSWORD (generated on the
          # box, D-5), the app-level ENV (host-anchored to production, D-6), and
          # everything under deploy/ (written by the digest-recording step below).
          #
          # ── Validate the resolved parameter prefix ────────────────────
          # SSM_PREFIX comes from a GitHub variable, so its shape is checked
          # before it is concatenated into ~30 parameter names. A malformed or
          # empty value would otherwise silently write the whole config tree to
          # the wrong place (or to a name the API rejects one key at a time).
          # SSM parameter names allow alphanumerics, '_', '.', '-' and '/', and
          # the prefix must be absolute and must not end in a slash (put_param
          # appends "/${key}" itself).
          if [[ ! "$SSM_PREFIX" =~ ^/[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::Resolved SSM prefix '${SSM_PREFIX}' is not a valid absolute SSM parameter path."
            echo "::error::Check the VELOCITYAI_PARAM_PREFIX variable on the '${DEPLOY_ENV}' GitHub Environment; it must look like /velocityai/${DEPLOY_ENV}."
            exit 1
          fi
          if [[ "$SSM_PREFIX" == */ ]]; then
            echo "::error::Resolved SSM prefix '${SSM_PREFIX}' must not end with a slash."
            exit 1
          fi

          # ── Resolve the project CMK alias ─────────────────────────────
          # The instance role's kms-decrypt policy grants Decrypt ONLY on this
          # key, with a PARAMETER_ARN encryption-context condition, so omitting
          # --key-id would let SSM re-key the parameter under alias/aws/ssm and
          # the box would lose the ability to read its own secrets.
          #
          # FIX-KMS-01: the alias used to be DERIVED from the environment name
          # (`alias/velocityai` for prod, `alias/velocityai-<env>` otherwise),
          # which silently assumed the account's aliases follow that exact
          # convention. They do not — the dev key is `velocityai-dev-euc1` (it
          # carries a region suffix) — so every deploy failed at the first
          # SecureString push with `InvalidKeyId ... alias/velocityai-dev is
          # not found`. The alias is now an explicit per-environment INPUT
          # (vars.KMS_KEY_ALIAS), with the old derivation kept only as a
          # fallback so environments that do match the convention keep working.
          if [[ -n "${KMS_KEY_ALIAS:-}" ]]; then
            # Accept both `velocityai-dev-euc1` and `alias/velocityai-dev-euc1`
            # so the variable can be pasted straight from the KMS console,
            # which shows the alias without the prefix.
            KMS_ALIAS="${KMS_KEY_ALIAS#alias/}"
            KMS_ALIAS="alias/${KMS_ALIAS}"
            echo "Using KMS alias from vars.KMS_KEY_ALIAS: ${KMS_ALIAS}"
          elif [[ "$DEPLOY_ENV" == "prod" ]]; then
            KMS_ALIAS="alias/velocityai"
            echo "::warning::vars.KMS_KEY_ALIAS is not set on the '${DEPLOY_ENV}' environment — falling back to the derived alias ${KMS_ALIAS}."
          else
            KMS_ALIAS="alias/velocityai-${DEPLOY_ENV}"
            echo "::warning::vars.KMS_KEY_ALIAS is not set on the '${DEPLOY_ENV}' environment — falling back to the derived alias ${KMS_ALIAS}."
          fi

          # Validate the SHAPE only — deliberately NOT `aws kms describe-key`.
          # The deploy role is granted exactly one KMS action, kms:Encrypt,
          # under a `kms:ViaService = ssm.<region>.amazonaws.com` condition
          # (infra/terraform/bootstrap/github_oidc.tf,
          # sid=KMSEncryptSecureStringViaSSM). A direct KMS call is therefore
          # denied twice over — DescribeKey is not in the policy, and ViaService
          # rejects anything that does not arrive through SSM — so a preflight
          # probe would fail on a perfectly good alias. The authoritative check
          # is the first put-parameter below, whose InvalidKeyId is translated
          # into actionable guidance by put_param's error handler.
          # KMS alias names allow alphanumerics plus _ - / (and must not use the
          # reserved alias/aws/ prefix, which is the AWS-managed key this step
          # exists to avoid).
          if [[ ! "$KMS_ALIAS" =~ ^alias/[A-Za-z0-9/_-]+$ ]]; then
            echo "::error::Resolved KMS alias '${KMS_ALIAS}' is not a valid alias name."
            echo "::error::Set KMS_KEY_ALIAS on the '${DEPLOY_ENV}' GitHub Environment to the alias shown in the KMS console (e.g. velocityai-dev-euc1)."
            exit 1
          fi
          if [[ "$KMS_ALIAS" == alias/aws/* ]]; then
            echo "::error::KMS alias '${KMS_ALIAS}' is an AWS-managed key. SecureStrings must use the project CMK so the instance role's scoped kms:Decrypt grant still applies."
            exit 1
          fi

          # FIX-SSM-01: explicit desired-state semantics per parameter, instead
          # of the previous blanket "empty value -> skip (leave whatever SSM
          # already has)". A skip silently preserved a STALE value: clearing
          # LANGSMITH_API_KEY/LANGSMITH_TRACING in GitHub, for example, did not
          # disable tracing if an older SSM value existed, because the host
          # loader re-reads the old parameter on every deploy. Semantics now:
          #   required        -> empty value FAILS the deploy (never silently
          #                      proceed on a missing secret the app needs)
          #   delete-if-empty -> empty value DELETES the existing parameter,
          #                      so the host loader's own documented fallback
          #                      (a default, or the box's FQDN, etc.) applies
          #                      instead of a value GitHub no longer sets
          #   preserve-if-empty -> empty value is a NO-OP: the existing
          #                      parameter is left exactly as it is. For keys
          #                      this pipeline SHARES with another writer —
          #                      today that is the Cognito/auth block, which
          #                      Terraform's foundation layer also publishes
          #                      (infra/terraform/modules/secrets/main.tf).
          #                      "GitHub has no value" means "GitHub does not
          #                      manage this key", NOT "delete it". Choosing
          #                      delete-if-empty for a shared key would make
          #                      every deploy an instruction to erase the other
          #                      writer's value.
          # Values are never echoed for any outcome — only key names and the
          # action taken (created/updated/deleted/unchanged/skipped).
          declare -i PARAMS_PUSHED=0 PARAMS_DELETED=0 PARAMS_UNCHANGED=0 PARAMS_SKIPPED=0 PARAMS_NOT_CLEARED=0
          declare -a NOT_CLEARED_KEYS=()

          # A delete-if-empty key the deploy role is not allowed to probe or
          # delete. Recorded (key name only) and reported once, as a warning,
          # after the push — see the AccessDenied branches in put_param.
          note_not_cleared() {
            local key="$1" action="$2"
            echo "  not cleared: ${key} (empty in GitHub; deploy role lacks ${action})"
            NOT_CLEARED_KEYS+=("$key")
            PARAMS_NOT_CLEARED+=1
          }

          put_param() {
            local key="$1" value="$2" type="${3:-String}" policy="${4:-delete-if-empty}"
            if [[ -z "$value" ]]; then
              if [[ "$policy" == "required" ]]; then
                echo "::error::Required config value for '${key}' is empty — refusing to deploy without it."
                exit 1
              fi
              if [[ "$policy" == "preserve-if-empty" ]]; then
                # No AWS call at all — deliberately, and NOT because of the
                # role's permissions (github_oidc.tf sid=SSMManageParameters
                # grants ssm:GetParameter; the live role may lag it). An
                # unmanaged key is simply not this pipeline's business on this
                # run: we do not need to know whether the other owner has
                # written one, because either way the action is the same —
                # nothing.
                echo "  skipped: ${key} (not set in GitHub — left to its other owner, e.g. terraform)"
                PARAMS_SKIPPED+=1
                return
              fi
              # delete-if-empty: remove any existing parameter so the host's
              # own fallback/default takes effect, rather than leaving a
              # stale value from a previous deploy in place.
              #
              # The existence probe MUST distinguish "there is no such
              # parameter" from "the call failed". It previously used
              # `2>/dev/null` and treated every non-zero exit as absence, so an
              # AccessDenied was silently reported as "no existing parameter".
              # Only ParameterNotFound means absent. github_oidc.tf
              # (sid=SSMManageParameters) grants Get and Delete, but the live
              # role may lag it (PutParameter only), so AccessDenied on the
              # probe or the delete is reported as "not cleared" plus one
              # aggregated warning, NOT a failure: the stale value stays, as it
              # always did, but visibly. Any other error still fails the deploy.
              #
              # NO `--with-decryption`, deliberately. This is an existence check
              # only. For a SecureString the call returns ciphertext and makes
              # no KMS request, so the deploy role needs no kms:Decrypt grant —
              # and must not have one, since it has no reason to read back the
              # secrets it writes.
              local probe_err probe_rc=0
              probe_err="$(mktemp)"
              if ! aws ssm get-parameter \
                --name "${SSM_PREFIX}/${key}" \
                --region "$AWS_REGION" \
                --no-cli-pager >/dev/null 2>"$probe_err"; then
                probe_rc=1
              fi
              if [[ "$probe_rc" -eq 0 ]]; then
                rm -f "$probe_err"
                local del_err
                del_err="$(mktemp)"
                if ! aws ssm delete-parameter \
                  --name "${SSM_PREFIX}/${key}" \
                  --region "$AWS_REGION" \
                  --no-cli-pager >/dev/null 2>"$del_err"; then
                  if grep -q 'AccessDenied' "$del_err"; then
                    rm -f "$del_err"
                    note_not_cleared "$key" "ssm:DeleteParameter"
                    return
                  fi
                  cat "$del_err" >&2
                  echo "::error::Failed to delete '${key}' after it was cleared in GitHub."
                  echo "::error::The parameter exists, so the stale value is still live on the host. Confirm ssm:DeleteParameter is granted to the '${DEPLOY_ENV}' deploy role (infra/terraform/bootstrap/github_oidc.tf, sid=SSMManageParameters)."
                  rm -f "$del_err"
                  exit 1
                fi
                rm -f "$del_err"
                echo "  deleted: ${key} (cleared in GitHub — host default/fallback now applies)"
                PARAMS_DELETED+=1
              elif grep -q 'ParameterNotFound' "$probe_err"; then
                rm -f "$probe_err"
                echo "  unchanged: ${key} (empty, no existing parameter)"
                PARAMS_UNCHANGED+=1
              elif grep -q 'AccessDenied' "$probe_err"; then
                rm -f "$probe_err"
                note_not_cleared "$key" "ssm:GetParameter"
              else
                cat "$probe_err" >&2
                echo "::error::Could not determine whether '${key}' exists in SSM, so it cannot be cleared safely."
                rm -f "$probe_err"
                exit 1
              fi
              return
            fi
            # An ARRAY, not a word-split string: `--key-id $KMS_ALIAS` inside an
            # unquoted variable only works by accident and breaks the moment an
            # alias contains anything unusual.
            local -a kms_args=()
            local suffix=""
            if [[ "$type" == "SecureString" ]]; then
              kms_args=(--key-id "$KMS_ALIAS")
              suffix=" -> ${KMS_ALIAS}"
            fi
            # --value is passed from a shell variable, never interpolated into a
            # log line, and stdout is discarded: put-parameter echoes back the
            # parameter metadata, and for a SecureString we do not want any of
            # that in the run log.
            #
            # stderr IS captured (not discarded) so an InvalidKeyId can be
            # turned into the one instruction that actually fixes it. It is
            # safe to surface: put-parameter's error messages describe the key
            # and parameter name, never the --value. On any other error the
            # captured stderr is re-emitted verbatim so nothing is swallowed.
            local err_file rc=0
            err_file="$(mktemp)"
            if ! aws ssm put-parameter \
              --name "${SSM_PREFIX}/${key}" \
              --value "$value" \
              --type "$type" \
              --overwrite \
              "${kms_args[@]}" \
              --region "$AWS_REGION" \
              --no-cli-pager >/dev/null 2>"$err_file"; then
              rc=1
            fi
            if [[ "$rc" -ne 0 ]]; then
              cat "$err_file" >&2
              if grep -q 'InvalidKeyId' "$err_file"; then
                echo "::error::SSM rejected the KMS key '${KMS_ALIAS}' while writing '${key}'."
                echo "::error::The alias must exist in ${AWS_REGION} in this account. Copy it from the KMS console (e.g. velocityai-dev-euc1) into the KMS_KEY_ALIAS variable on the '${DEPLOY_ENV}' GitHub Environment."
              elif grep -q 'AccessDenied' "$err_file"; then
                echo "::error::The deploy role was denied writing '${key}'. Confirm ssm:PutParameter on parameter/velocityai/${DEPLOY_ENV}/* (github_oidc.tf sid=SSMManageParameters). If this is a SecureString, also confirm the '${KMS_ALIAS}' key ARN is included in github_cicd_kms_key_arns for the '${DEPLOY_ENV}' role (infra/terraform/bootstrap/github_oidc.tf)."
              fi
              rm -f "$err_file"
              exit 1
            fi
            rm -f "$err_file"
            echo "  pushed: ${key} (${type}${suffix})"
            PARAMS_PUSHED+=1
          }

          echo "Pushing config to SSM under ${SSM_PREFIX}/..."

          # SecureString params (secrets). DATABASE_PASSWORD is deliberately
          # absent (D-5): it is generated on the box by bootstrap-ec2.sh and
          # written to SSM from there. So is the app-level ENV (D-6).
          # SECRET_KEY is the app's session/JWT signing secret — required,
          # never delete-on-empty (an accidental blank GitHub secret must fail
          # loudly, not silently wipe the running app's signing key).
          put_param "SECRET_KEY"              "$SECRET_KEY"              "SecureString" "required"
          put_param "LANGSMITH_API_KEY"       "$LANGSMITH_API_KEY"       "SecureString" "delete-if-empty"
          # Bootstrap-admin step removed: Cognito-only. See docs/architecture/authentication-and-authorization.md.

          # String params (plain config) — all optional/defaulted on the host
          # loader, so an empty GitHub value deletes the SSM override and lets
          # the host's own documented default/fallback apply.
          put_param "CORS_ORIGINS"                 "$CORS_ORIGINS"                 "String" "delete-if-empty"
          put_param "PUBLIC_BASE_URL"              "$PUBLIC_BASE_URL"              "String" "delete-if-empty"
          put_param "ACCESS_TOKEN_EXPIRE_HOURS"    "$ACCESS_TOKEN_EXPIRE_HOURS"    "String" "delete-if-empty"
          put_param "HANDOFF_MAX_TRANSCRIPT_BYTES" "$HANDOFF_MAX_TRANSCRIPT_BYTES" "String" "delete-if-empty"
          put_param "LANGSMITH_TRACING"            "$LANGSMITH_TRACING"            "String" "delete-if-empty"
          put_param "LANGSMITH_PROJECT"             "$LANGSMITH_PROJECT"            "String" "delete-if-empty"
          # Bootstrap-admin step removed: Cognito-only. See docs/architecture/authentication-and-authorization.md.

          # ── Cognito + auth flags ─────────────────────────────────────
          # See the long note in this step's `env:` block for the dual-ownership
          # rationale. All are preserve-if-empty, so an environment that leaves
          # them unset in GitHub keeps Terraform as the sole writer and this
          # section is a no-op for it.
          #
          # AUTH_PROVIDER's coherence gate (asserting the pool trio is present
          # whenever the pipeline claims "provider = cognito") was removed in
          # Phase 4 along with the variable itself: Cognito is now
          # unconditionally the sole authentication authority, so there is no
          # provider SWITCH left to validate — the backend's own
          # `_validate_cognito_config()` (core/config.py) already refuses to
          # boot outside development without a configured pool, which is the
          # real fail-fast guard now. This workflow still cannot verify what SSM
          # already holds (the deploy role has no ssm:GetParameter), so a
          # missing pool remains a health-gate failure rather than a deploy-time
          # one — that trade-off is unchanged from before this removal.
          #
          # Explicit if/then throughout this block, never `[[ test ]] && x=y`:
          # that form evaluates to the test's status, which is a latent `set -e`
          # trap — the same reasoning already recorded on `resolve_digest` in the
          # build job.

          # Shape checks on the two identifiers — a typo here reaches the app as
          # a pool that does not exist, and the first symptom is every login
          # failing at runtime rather than anything visible at deploy time.
          if [[ -n "${COGNITO_USER_POOL_ID:-}" && ! "$COGNITO_USER_POOL_ID" =~ ^[a-z]{2}-[a-z]+-[0-9]+_[A-Za-z0-9]+$ ]]; then
            echo "::error::COGNITO_USER_POOL_ID ('${COGNITO_USER_POOL_ID}') is not a user-pool id. Expected <region>_<suffix>, e.g. eu-central-1_AbC123xyz."
            exit 1
          fi
          if [[ -n "${COGNITO_CLIENT_ID:-}" && ! "$COGNITO_CLIENT_ID" =~ ^[a-z0-9]{16,}$ ]]; then
            echo "::error::COGNITO_CLIENT_ID is not an app-client id (expected 16+ lowercase alphanumerics)."
            exit 1
          fi

          # The two remaining flags land on `bool` Settings fields. pydantic v2
          # coerces a known set of strings ('1/on/t/true/y/yes' and
          # '0/off/f/false/n/no', case-insensitive) and raises ValidationError on
          # anything else — and because that error is raised while constructing
          # the module-level `settings` object, it takes the whole app down at
          # import time over a typo in a GitHub variable. Validate against
          # exactly that set, then normalise to true/false so the SSM tree reads
          # uniformly regardless of what an operator typed.
          #
          # `declare -g` (not bare `declare`) is required: inside this loop we
          # are at script scope, but bare `declare` would still be the wrong
          # habit to copy into a function, where it creates a local.
          for flag_name in ADMIN_MFA_REQUIRED AUTH_EMAIL_MFA_ENABLED; do
            flag_value="${!flag_name:-}"
            if [[ -z "$flag_value" ]]; then
              continue
            fi
            flag_lower="$(printf '%s' "$flag_value" | tr '[:upper:]' '[:lower:]')"
            case "$flag_lower" in
              1|on|t|true|y|yes)  flag_norm="true" ;;
              0|off|f|false|n|no) flag_norm="false" ;;
              *)
                echo "::error::${flag_name} must be a boolean (got '${flag_value}'). Accepted: true/false (also 1/0, yes/no, on/off). pydantic rejects anything else and the backend fails to start."
                exit 1
                ;;
            esac
            declare -g "${flag_name}=${flag_norm}"
          done

          put_param "COGNITO_USER_POOL_ID"   "${COGNITO_USER_POOL_ID:-}"   "String"       "preserve-if-empty"
          put_param "COGNITO_CLIENT_ID"      "${COGNITO_CLIENT_ID:-}"      "String"       "preserve-if-empty"
          put_param "COGNITO_CLIENT_SECRET"  "${COGNITO_CLIENT_SECRET:-}"  "SecureString" "preserve-if-empty"
          put_param "COGNITO_REGION"         "${COGNITO_REGION:-}"         "String"       "preserve-if-empty"
          put_param "ADMIN_MFA_REQUIRED"     "${ADMIN_MFA_REQUIRED:-}"     "String"       "preserve-if-empty"
          put_param "AUTH_EMAIL_MFA_ENABLED" "${AUTH_EMAIL_MFA_ENABLED:-}" "String"       "preserve-if-empty"

          # specs/014 — host capacity matrix + admission gate. Only these two
          # are pushed from GitHub Environment variables; every other
          # HOST_CAPACITY_* setting (thresholds, gate on/off, poll interval,
          # etc.) is left at its Settings default (app/core/config.py) and
          # changed there directly if a non-default value is ever needed.
          # Plain config, never secrets.
          put_param "HOST_CAPACITY_METRIC_NAMESPACE"       "$HOST_CAPACITY_METRIC_NAMESPACE"       "String" "delete-if-empty"
          put_param "HOST_CAPACITY_INSTANCE_IDS"           "$HOST_CAPACITY_INSTANCE_IDS"           "String" "delete-if-empty"

          # Bedrock LLM config (under the llm/ sub-prefix the host loader maps
          # to AWS_REGION / BEDROCK_* — any other key name is silently dropped).
          # llm/region always has a value (the resolved AWS_REGION), so it is
          # never empty; the rest follow the same delete-if-empty semantics.
          put_param "llm/region"               "$AWS_REGION"                   "String" "required"
          put_param "llm/model_id"             "$BEDROCK_MODEL_ID"             "String" "delete-if-empty"
          put_param "llm/inference_profile_id" "$BEDROCK_INFERENCE_PROFILE_ID" "String" "delete-if-empty"
          put_param "llm/coding_model_id"      "$BEDROCK_CODING_MODEL_ID"      "String" "delete-if-empty"

          echo "Config push complete: ${PARAMS_PUSHED} pushed, ${PARAMS_DELETED} deleted, ${PARAMS_UNCHANGED} unchanged, ${PARAMS_SKIPPED} skipped (owned elsewhere), ${PARAMS_NOT_CLEARED} not cleared."
          if (( PARAMS_NOT_CLEARED > 0 )); then
            echo "::warning::${PARAMS_NOT_CLEARED} key(s) are empty in GitHub but could not be cleared in SSM (${NOT_CLEARED_KEYS[*]}): the '${DEPLOY_ENV}' deploy role lacks ssm:GetParameter and/or ssm:DeleteParameter. Any existing SSM value for them stays live on the host. An AWS admin must apply infra/terraform/bootstrap/github_oidc.tf (sid=SSMManageParameters: ssm:GetParameter + ssm:DeleteParameter on /velocityai/${DEPLOY_ENV}/*)."
          fi

      # ── Bedrock inference profile / region consistency check ──────────
      # FIX-BEDROCK-01: the deployed AWS_REGION and the configured Bedrock
      # cross-region inference profile must target the same geography.
      # Cross-region inference profiles are prefixed by geography (`eu.`,
      # `us.`, `apac.`, ...) and Bedrock only accepts invoking a profile from
      # within its own supported source region set — invoking a `us.*`
      # profile from an `eu-central-1` deployment fails at the FIRST real
      # request, not at deploy time, because the existing health gate only
      # checks HTTP availability and never calls Bedrock. That failure mode
      # is exactly what this catches before it reaches production: a healthy
      # container serving 200s on /health while every actual AI request 400s.
      # This is deliberately a prefix/consistency check, not a full
      # GetInferenceProfile API call — the deploy role does not carry (and
      # should not need) bedrock:GetInferenceProfile just to lint a config
      # value; a functional smoke test against the live endpoint is a
      # separate, larger change (invoking the model costs money and adds
      # latency to every deploy) and is intentionally not implemented here.
      - name: Validate Bedrock inference profile matches deploy region
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
          BEDROCK_INFERENCE_PROFILE_ID: ${{ vars.BEDROCK_INFERENCE_PROFILE_ID }}
          DEPLOY_ENV: ${{ needs.resolve.outputs.environment }}
        run: |
          set -euo pipefail

          if [[ -z "$BEDROCK_INFERENCE_PROFILE_ID" ]]; then
            echo "BEDROCK_INFERENCE_PROFILE_ID is not set — nothing to validate (host will use its own default)."
            exit 0
          fi

          # Map the deploy region to its Bedrock cross-region-profile geography
          # prefix. Extend this map if/when the project deploys into another
          # geography (ap-*, ca-*, etc.) — an unmapped region is treated as
          # "unknown geography" and only a warning is emitted, never a hard
          # failure, since a project-specific mapping cannot be exhaustive.
          case "$AWS_REGION" in
            eu-*) EXPECTED_PREFIX="eu." ;;
            us-*) EXPECTED_PREFIX="us." ;;
            ap-*) EXPECTED_PREFIX="apac." ;;
            *)    EXPECTED_PREFIX="" ;;
          esac

          if [[ -z "$EXPECTED_PREFIX" ]]; then
            echo "::warning::No known Bedrock geography prefix mapping for region '${AWS_REGION}' — skipping profile/region consistency check."
            exit 0
          fi

          if [[ "$BEDROCK_INFERENCE_PROFILE_ID" != "$EXPECTED_PREFIX"* ]]; then
            echo "::error::BEDROCK_INFERENCE_PROFILE_ID ('${BEDROCK_INFERENCE_PROFILE_ID}') does not match the deploy region's Bedrock geography."
            echo "::error::Deploy region '${AWS_REGION}' expects a profile prefixed '${EXPECTED_PREFIX}' (e.g. '${EXPECTED_PREFIX}anthropic.claude-...')."
            echo "::error::Set BEDROCK_INFERENCE_PROFILE_ID on the '${DEPLOY_ENV}' GitHub Environment to a profile prefixed '${EXPECTED_PREFIX}'."
            echo "::error::A mismatched profile passes the HTTP health gate (it never calls Bedrock) and only fails on the first real user request."
            exit 1
          fi

          echo "Bedrock inference profile '${BEDROCK_INFERENCE_PROFILE_ID}' matches deploy region '${AWS_REGION}' geography ('${EXPECTED_PREFIX}*')."

      # ── Build the SSM payload ──────────────────────────────────────────
      # Prelude of literal shell assignments + .github/scripts/remote-deploy.sh
      # catted in verbatim — never a heredoc. Full rationale (a real outage
      # this shape prevents): docs/CICD-DESIGN-DECISIONS.md#the-ssm-runcommand-heredoc-incident-why-payloads-are-built-not-inlined
      # Only payload ASSEMBLY happens here; sending and polling are delegated
      # to the ssm-run composite action below (F-05).
      - name: Build SSM deploy payload
        id: build-payload
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
          INSTANCE_ID: ${{ steps.aws.outputs.instance-id }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          DEPLOY_ENV: ${{ needs.resolve.outputs.environment }}
          # The exact bytes to run, resolved and scanned by the `build` job.
          # The tag still travels for logging/labelling only.
          BACKEND_DIGEST: ${{ needs.build.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.build.outputs.frontend_digest }}
        run: |
          set -euo pipefail

          : "${INSTANCE_ID:?EC2_INSTANCE_ID is not set for the '${DEPLOY_ENV}' environment}"
          : "${ECR_REGISTRY:?ECR_REGISTRY is not set for the '${DEPLOY_ENV}' environment}"

          # ECR_REGISTRY lands in a single-quoted assignment (REGISTRY='...') that
          # the box executes as root. Same allow-list as provision.yml's
          # preflight; the value is not echoed (SEC-10).
          if [[ ! "$ECR_REGISTRY" =~ ^[0-9]{12}\.dkr\.ecr(-fips)?\.[a-z0-9-]+\.amazonaws\.com(\.cn)?$ ]]; then
            echo "::error::ECR_REGISTRY has an unexpected format; refusing to embed it in the host payload (value not shown)."
            exit 1
          fi

          # Re-validate the digests on the way into the payload. The prelude
          # below is literal shell, so a malformed value would otherwise become
          # a broken image reference discovered only on the box, mid-deploy.
          for d in "$BACKEND_DIGEST" "$FRONTEND_DIGEST"; do
            if [[ ! "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Refusing to deploy: invalid image digest '$d' from the build job."
              exit 1
            fi
          done

          # gzip -9 before base64: the deploy payload contains only versioned
          # host config from this commit. The box reverses this with
          # `base64 -d | gunzip -c` before installing it.
          COMPOSE_GZ="$(gzip -9 -c docker-compose.yml | base64 -w 0)"
          COMPOSE_PROD_GZ="$(gzip -9 -c docker-compose.prod.yml | base64 -w 0)"
          RECONCILE_GZ="$(gzip -9 -c infra/scripts/reconcile-host-config.sh | base64 -w 0)"
          SECRETS_LOADER_GZ="$(gzip -9 -c infra/scripts/velocityai-load-secrets.sh | base64 -w 0)"
          HOST_COMMON_GZ="$(gzip -9 -c infra/scripts/lib/host-common.sh | base64 -w 0)"

          {
            echo '#!/bin/bash'
            echo "# Generated by .github/workflows/deploy.yml — do not edit on the box."
            echo "REGISTRY='${ECR_REGISTRY}'"
            echo "REGION='${AWS_REGION}'"
            echo "IMAGE_TAG='${IMAGE_TAG}'"
            echo "DEPLOY_ENV='${DEPLOY_ENV}'"
            echo "BACKEND_DIGEST='${BACKEND_DIGEST}'"
            echo "FRONTEND_DIGEST='${FRONTEND_DIGEST}'"
            echo "COMPOSE_GZ='${COMPOSE_GZ}'"
            echo "COMPOSE_PROD_GZ='${COMPOSE_PROD_GZ}'"
            echo "RECONCILE_GZ='${RECONCILE_GZ}'"
            echo "SECRETS_LOADER_GZ='${SECRETS_LOADER_GZ}'"
            echo "HOST_COMMON_GZ='${HOST_COMMON_GZ}'"
            # Comment-only lines are ~26 KB of remote-deploy.sh and pushed this
            # payload past ssm-run's 57,344-byte guard. bash never reads them, and
            # the script has no heredocs, so the executed code is unchanged.
            sed -E '/^[[:space:]]*#/d' .github/scripts/remote-deploy.sh
          } > remote.sh

          echo "path=remote.sh" >> "$GITHUB_OUTPUT"


      # NO IMAGE-SIGNATURE GATE HERE — deliberately. Cosign signing (build job)
      # and `cosign verify` (this job) were removed: the deploy role holds NO
      # ECR permissions at all (infra/terraform/bootstrap/github_oidc.tf grants
      # ecr:* only to the shared BUILD role), and this job never logs into ECR,
      # so `cosign verify` could not read the signature it was asked to check.
      # The integrity guarantee that remains is the one that always did the real
      # work: the `build` job resolves an immutable sha256 DIGEST, scans exactly
      # those bytes, and this job ships that same digest into the SSM payload —
      # the host pulls by digest, so tampering would change the digest and the
      # pull would fail. If signature verification is reintroduced, it needs
      # ecr:GetAuthorizationToken + ecr:BatchGetImage on the per-env deploy role
      # and an ECR login step in this job first.

      # FIX-SSM-03: executionTimeout (the ON-BOX limit, 1800s = 30 min) must
      # stay BELOW both the polling window (35 min) and this job's own
      # timeout-minutes (50), or a box can keep mutating state (docker
      # compose, nginx, the CW agent) after CI has already given up and
      # reported failure — an orphaned command a LATER deploy's concurrency
      # group would then race against.
      - name: Redeploy via SSM RunCommand
        uses: ./.github/actions/ssm-run
        with:
          script-path: ${{ steps.build-payload.outputs.path }}
          instance-id: ${{ steps.aws.outputs.instance-id }}
          aws-region: ${{ steps.aws.outputs.region }}
          comment: "velocityai deploy ${{ needs.resolve.outputs.environment }} ${{ needs.resolve.outputs.image_tag }}"
          execution-timeout-seconds: "1800"
          poll-timeout-minutes: "35"

      # ── Make a REBUILT host boot on this commit's config, not the last provision's ──
      # Four of the files this deploy just applied are ALSO fetched from
      # s3://<bucket>/config/ by bootstrap-ec2.sh at boot time (and a fifth,
      # bootstrap-ec2.sh itself, by the first-boot unit of a rebuilt host):
      #
      #   docker-compose.yml, docker-compose.prod.yml,
      #   reconcile-host-config.sh, velocityai-load-secrets.sh
      #
      # deploy.yml ships them inline in the SSM payload, so the RUNNING host is
      # always current. But only provision.yml ever wrote that S3 prefix, and
      # provisioning happens once per instance. So a replaced or rebuilt box came
      # up on whatever the last PROVISION uploaded — potentially many deploys
      # stale. The concrete failure: velocityai-load-secrets.sh carries the
      # allowlist of SSM keys copied into the container environment, so an old
      # copy silently drops config keys the current app reads, and the box looks
      # healthy while misconfigured. Same class of problem for an old compose
      # file or an old nginx/CloudWatch reconcile.
      #
      # Runs only after the SSM step exited 0, i.e. the on-box health gate passed
      # (a rollback exits non-zero there). S3 therefore only ever advances to a
      # configuration that provably served traffic — never to one that was rolled
      # back. bootstrap-ec2.sh is in the list: the sha256 provision.yml checks is
      # computed and verified inside one provision run and never persisted, and
      # leaving it out made config/ a mixed-commit set after every deploy.
      #
      # No IAM change: sid ConfigObjectUpload on the per-env deploy role already
      # grants s3:PutObject + s3:GetObject on <bucket>/config/*.
      - name: Refresh host config artifacts in S3
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
          BACKUP_BUCKET: ${{ vars.VELOCITYAI_BACKUP_BUCKET }}
          KMS_KEY_ID: ${{ vars.VELOCITYAI_KMS_KEY_ID }}
          DEPLOY_ENV: ${{ needs.resolve.outputs.environment }}
        run: |
          set -euo pipefail

          # Both variables are REQUIRED. A deploy that cannot refresh these has
          # left S3 pointing at older config than the host is now running, and
          # the only symptom would appear later, on a rebuild, as a box quietly
          # running a configuration nobody deployed. Failing here is loud and
          # immediate; the app itself is already up and serving at this point, so
          # this failure does not take traffic down.
          if [[ -z "${BACKUP_BUCKET}" || -z "${KMS_KEY_ID}" ]]; then
            echo "::error::VELOCITYAI_BACKUP_BUCKET and VELOCITYAI_KMS_KEY_ID must both be set on the '${DEPLOY_ENV}' GitHub Environment."
            echo "::error::They are what lets a rebuilt host boot on the configuration this deploy just applied. See docs/GITHUB_CICD_SETUP.md."
            exit 1
          fi

          bash .github/scripts/upload-host-config.sh \
            "$BACKUP_BUCKET" "$KMS_KEY_ID" "$AWS_REGION" \
            infra/scripts/bootstrap-ec2.sh \
            docker-compose.yml \
            docker-compose.prod.yml \
            infra/scripts/reconcile-host-config.sh \
            infra/scripts/velocityai-load-secrets.sh \
            infra/scripts/lib/host-common.sh

          echo "A rebuilt ${DEPLOY_ENV} host will now boot on this commit's host configuration."

      # ── Record the deployed digests as the environment's recovery point ──
      # Reached only when the step above exited 0, i.e. the on-box script
      # completed AND its backend/frontend/nginx health gate passed (a rollback
      # or a failed gate exits non-zero there). So these two parameters always
      # name a release that provably served traffic in this environment.
      #
      # WHY THIS EXISTS: remote-deploy.sh §7 pins the digests into
      # /etc/velocityai/app.env on the box and nowhere else. That state dies
      # with the instance, so a replaced or rebuilt host had no way to learn
      # what it was supposed to run: bootstrap-ec2.sh fell back to Terraform's
      # var.image_tag (S3 config/deploy.env, default "main"), tried to pull a
      # tag CI had never built, and crash-looped. bootstrap-ec2.sh §10b now
      # reads these parameters FIRST, which makes a rebuild self-healing and
      # removes the pipeline from the disaster-recovery path.
      #
      # Written AFTER the gate, never before — recording at pull time would let
      # a rebuilt host adopt a version that had just failed and been rolled
      # back. Plain String, not SecureString: an image reference is not a
      # secret, and String needs no kms:Encrypt grant. The per-environment
      # deploy role's ssm:PutParameter on
      # arn:aws:ssm:<region>:<acct>:parameter/velocityai/<ENV>/* already covers
      # this path (github_oidc.tf sid=SSMManageParameters, which also grants
      # Get and Delete for the config step above), so no IAM change is required
      # for these three writes. The host loader
      # (velocityai-load-secrets) skips the deploy/ sub-prefix explicitly, so
      # these never leak into the container environment.
      - name: Record deployed digests for host self-recovery
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
          # Same resolution as "Push config to SSM Parameter Store" above — these
          # two MUST agree, because bootstrap-ec2.sh §10b reads deploy/* from the
          # prefix recorded in the host's own bootstrap.env.
          SSM_PREFIX: ${{ vars.VELOCITYAI_PARAM_PREFIX || format('/velocityai/{0}', needs.resolve.outputs.environment) }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          BACKEND_ECR_REPO: ${{ env.BACKEND_ECR_REPO }}
          FRONTEND_ECR_REPO: ${{ env.FRONTEND_ECR_REPO }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          BACKEND_DIGEST: ${{ needs.build.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.build.outputs.frontend_digest }}
        run: |
          set -euo pipefail

          # Same shape check as the config-push step. A bad prefix here is worse
          # than a bad prefix there: a rebuilt host reads deploy/* to decide
          # which images to run, so writing them to the wrong path silently
          # removes the self-recovery path this step exists to provide.
          if [[ ! "$SSM_PREFIX" =~ ^/[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::Resolved SSM prefix '${SSM_PREFIX}' is not a valid absolute SSM parameter path."
            echo "::error::Check the VELOCITYAI_PARAM_PREFIX variable on this GitHub Environment; it must match the value provision.yml used."
            exit 1
          fi
          if [[ "$SSM_PREFIX" == */ ]]; then
            echo "::error::Resolved SSM prefix '${SSM_PREFIX}' must not end with a slash."
            exit 1
          fi

          put_deploy_param() {
            local key="$1" value="$2"
            aws ssm put-parameter \
              --name "${SSM_PREFIX}/deploy/${key}" \
              --value "$value" \
              --type String \
              --overwrite \
              --region "$AWS_REGION" \
              --no-cli-pager >/dev/null
            echo "  recorded: deploy/${key} = ${value}"
          }

          echo "Recording the deployed release under ${SSM_PREFIX}/deploy/ ..."
          put_deploy_param "backend_image"  "${ECR_REGISTRY}/${BACKEND_ECR_REPO}@${BACKEND_DIGEST}"
          put_deploy_param "frontend_image" "${ECR_REGISTRY}/${FRONTEND_ECR_REPO}@${FRONTEND_DIGEST}"
          # Human-readable label for operators reading the parameter tree; the
          # digests above are what a rebuilt host actually deploys.
          put_deploy_param "image_tag"      "$IMAGE_TAG"
          echo "A rebuilt ${{ needs.resolve.outputs.environment }} host will now self-recover onto this release."
