# =============================================================================
# VelocityAI Admin Recovery — break-glass account access via SSM RunCommand.
# =============================================================================
# Exists because nobody holds EC2/SSH access to any environment: the only
# principal that can reach a box is this repo's per-environment GitHub OIDC
# deploy role, and the only channel it has is SSM RunCommand (same one
# deploy.yml and provision.yml already use). When the users table already has
# rows, deploy.yml's bootstrap step (remote-deploy.sh §12) deliberately does
# NOTHING — its whole contract is "any row -> skip" — so changing
# BOOTSTRAP_ADMIN_PASSWORD on the GitHub Environment has no effect on an
# existing account. This workflow is the audited path around that: it runs
# backend/app/scripts/recover_admin.py INSIDE the running backend container on
# the target box.
#
# TWO MODES:
#   report — read-only. Prints AUTH_PROVIDER, every user row (email, provider,
#            whether a local password_hash is set, tier, admin), and whether
#            the single-local-admin break-glass invariant currently holds.
#            Changes nothing. This is the default and what you should run
#            FIRST, every time.
#   reset  — creates admin_email if absent, or resets its password if present;
#            promotes it to admin + enterprise tier; on Cognito, provisions/
#            adopts the pool user with a PERMANENT password and both the
#            tier + flowin-admins groups. The password is the CURRENT value of
#            BOOTSTRAP_ADMIN_PASSWORD on this GitHub Environment — fetched by
#            the box itself from SSM, never by this workflow, and never
#            printed anywhere (see remote-admin-recovery.sh's header).
#
# NEVER DELETES A USER. ~9 tables carry a non-nullable FK to users.id with no
# cascade, so a delete-based "start clean" approach would either fail on those
# constraints or take workflow-run/artifact history with it. Resetting a
# password reaches the same outcome (a usable admin login) with none of that
# risk — see recover_admin.py's own docstring for the full reasoning.
#
# demote_other_local_admins clears is_admin on every OTHER auth_provider=local
# admin (a privilege REDUCTION, never an escalation — those accounts keep
# working, just without admin rights) so that
# core/identity.py::_local_admin_credential_is_permitted's "exactly one local
# admin" invariant holds again. Without it, more than one local admin means a
# login can SUCCEED and then 401 on the very next request
# (break_glass_invariant_violated in the audit log) — report mode tells you
# up front whether this environment is in that state.
# =============================================================================

name: Admin Recovery

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      mode:
        description: "report = read-only auth-state dump. reset = create/reset admin_email using the CURRENT BOOTSTRAP_ADMIN_PASSWORD secret on this GitHub Environment."
        required: true
        type: choice
        options:
          - report
          - reset
        default: report
      admin_email:
        description: "Administrator email to create/reset. Required when mode=reset. Leave blank to reuse this environment's BOOTSTRAP_ADMIN_EMAIL variable."
        required: false
        type: string
      demote_other_local_admins:
        description: "reset only: demote every OTHER local admin to non-admin, restoring the 'exactly one local admin' break-glass invariant. Never escalates anyone."
        required: false
        type: boolean
        default: false

# Same concurrency group name deploy.yml and provision.yml use for this
# environment, so a recovery run can never race a deploy's `docker compose`
# invocation on the same box.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: ${{ inputs.environment != 'prod' }}  # Phase 9: Cancel non-prod queues, timeout prod

permissions:
  contents: read

env:
  AWS_REGION_DEFAULT: eu-central-1

jobs:
  recover:
    name: Admin Recovery (${{ inputs.environment }}, ${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      # Only the on-host script the SSM payload needs.
      - name: Checkout (recovery payload only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/remote-admin-recovery.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      # The SAME per-environment deploy role deploy.yml/provision.yml use.
      # Its ssm:SendCommand grant is conditioned on
      # ssm:resourceTag/Environment matching this GitHub Environment's own
      # name (infra/terraform/bootstrap/github_oidc.tf), so a `dev` run
      # physically cannot command a `stage`/`prod`-tagged instance, whatever
      # value is pasted into EC2_INSTANCE_ID.
      - name: Configure AWS credentials (OIDC — per-env deploy role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION_DEFAULT }}

      # ── Preflight: assert every required variable, validate shapes ──────
      - name: Preflight — validate configuration
        id: preflight
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PARAM_PREFIX: ${{ vars.VELOCITYAI_PARAM_PREFIX }}
          DEPLOY_ENV: ${{ inputs.environment }}
          MODE: ${{ inputs.mode }}
          ADMIN_EMAIL_INPUT: ${{ inputs.admin_email }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
        run: |
          set -euo pipefail

          : "${INSTANCE_ID:?EC2_INSTANCE_ID is not set for the '${DEPLOY_ENV}' environment}"

          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "::error::EC2_INSTANCE_ID '${INSTANCE_ID}' does not look like an EC2 instance ID."
            exit 1
          fi

          RESOLVED_PREFIX="${PARAM_PREFIX:-/velocityai/${DEPLOY_ENV}}"
          echo "prefix=${RESOLVED_PREFIX}" >> "$GITHUB_OUTPUT"

          if [[ "$MODE" == "reset" ]]; then
            RESOLVED_EMAIL="${ADMIN_EMAIL_INPUT:-$BOOTSTRAP_ADMIN_EMAIL}"
            if [[ -z "$RESOLVED_EMAIL" ]]; then
              echo "::error::mode=reset requires either the admin_email input or a BOOTSTRAP_ADMIN_EMAIL variable on the '${DEPLOY_ENV}' environment."
              exit 1
            fi
            if [[ ! "$RESOLVED_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
              echo "::error::admin_email '${RESOLVED_EMAIL}' does not look like an email address."
              exit 1
            fi
            echo "admin_email=${RESOLVED_EMAIL}" >> "$GITHUB_OUTPUT"
            echo "Resolved admin_email: ${RESOLVED_EMAIL}"
          fi

      # ── Build the SSM payload ────────────────────────────────
      # F-05: sending and polling are delegated to the ssm-run composite
      # action (.github/actions/ssm-run) -- see that file's header for why
      # this ~60-line pair is no longer duplicated by hand across
      # deploy.yml/provision.yml/admin-recovery.yml. Only payload ASSEMBLY,
      # which differs per caller, stays here.
      - name: Build SSM recovery payload
        id: build-payload
        env:
          AWS_REGION: ${{ vars.AWS_REGION || env.AWS_REGION_DEFAULT }}
          PARAM_PREFIX: ${{ steps.preflight.outputs.prefix }}
          MODE: ${{ inputs.mode }}
          ADMIN_EMAIL: ${{ steps.preflight.outputs.admin_email }}
          # workflow_dispatch booleans render as the literal strings
          # "true"/"false"; the on-host script's gate uses "1"/"0" -- same
          # normalisation provision.yml already does for its own boolean
          # inputs, kept here rather than pushed into the script so the
          # script's contract stays a plain boolean flag regardless of caller.
          DEMOTE_OTHERS_INPUT: ${{ inputs.demote_other_local_admins }}
        run: |
          set -euo pipefail

          to01() { [ "$1" = "true" ] && echo 1 || echo 0; }
          DEMOTE_OTHERS="$(to01 "$DEMOTE_OTHERS_INPUT")"

          {
            echo '#!/bin/bash'
            echo "# Generated by .github/workflows/admin-recovery.yml -- do not edit on the box."
            echo "REGION='${AWS_REGION}'"
            echo "PARAM_PREFIX='${PARAM_PREFIX}'"
            echo "MODE='${MODE}'"
            echo "ADMIN_EMAIL='${ADMIN_EMAIL}'"
            echo "DEMOTE_OTHERS='${DEMOTE_OTHERS}'"
            cat .github/scripts/remote-admin-recovery.sh
          } > remote.sh

          echo "path=remote.sh" >> "$GITHUB_OUTPUT"

      # recover_admin.py runs in well under a minute; the window is generous
      # headroom for a cold `docker compose exec`.
      - name: Recover via SSM RunCommand
        uses: ./.github/actions/ssm-run
        with:
          script-path: ${{ steps.build-payload.outputs.path }}
          instance-id: ${{ vars.EC2_INSTANCE_ID }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION_DEFAULT }}
          comment: "velocityai admin-recovery ${{ inputs.mode }} (${{ github.repository }} run ${{ github.run_id }})"
          send-timeout-seconds: "600"
          execution-timeout-seconds: "600"
          poll-timeout-minutes: "10"
