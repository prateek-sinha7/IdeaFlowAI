# =============================================================================
# Governance Drift — do the live rulesets match the committed ones?
# =============================================================================
# F-11: they did not, and nothing said so.
#
# `.github/rulesets/main.json` and `dev-staging.json` both declare a
# `required_status_checks` rule requiring the `ci-required` context. Neither live
# ruleset carried that rule. Read on 2026-09-23:
#
#   main-production-protection  -> deletion, non_fast_forward,
#                                  required_signatures, pull_request
#   dev-staging-protection      -> deletion, non_fast_forward, pull_request
#
# So CI did not block any merge, in either direction, while the committed files
# and `.github/CI_STATUS.md` both described it as the enforced merge gate. The
# divergence is even recorded in the repository:
# docs/CICD-RULESETS-DEPLOYMENT-SUMMARY.md says required_status_checks was removed
# "due to API schema mismatch" and that 1/10 gates were enforced. It is not a
# schema mismatch — the shape in those files is exactly what the REST rules API
# documents — but the note was right that the rule was not live.
#
# The same class of problem hid F-02 (a `creation` rule with no bypass actor, so
# no `v*` tag could be created by anyone, so production could not be released)
# and F-14 (three environments with zero protection rules while the committed
# JSON declared required reviewers).
#
# WHAT THIS WORKFLOW DOES
#   Reads the live rulesets and environments and compares them to the files. Any
#   divergence fails the run. It is READ-ONLY: it never applies anything, because
#   silently self-healing branch protection would be a worse failure mode than
#   drifting from it — an attacker who weakens a rule should not have the repo
#   quietly restore it and lose the evidence. Applying stays a deliberate operator
#   action via `.github/scripts/setup-rulesets.sh`.
#
# WHY IT IS NOT PART OF ci.yml
#   It needs `administration: read` to see ruleset and environment configuration,
#   and ci.yml is the unprivileged evaluator whose least-privilege envelope is
#   asserted by backend/tests/unit/tools/ci/test_ruleset_workflow_contract.py.
#   It is also not per-commit information: the live configuration changes when
#   somebody edits repository settings, which is not a commit at all.
# =============================================================================

name: Governance Drift

on:
  schedule:
    # Mondays 05:00 UTC, after the CodeQL weekly scan at 04:00.
    - cron: "0 5 * * 1"
  workflow_dispatch:
  # No pull_request trigger: this job holds GOVERNANCE_READ_TOKEN, and a
  # pull_request run executes the PR's own copy of this file. After merging a
  # governance change, run it by dispatch.

permissions:
  contents: read

concurrency:
  group: governance-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Compare live governance against the committed files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # `contents: read` is the whole GITHUB_TOKEN envelope this job needs,
      # because GITHUB_TOKEN is NOT the token that reads the governance API.
      #
      # This block used to also request `administration: read`. That is not a
      # workflow permission scope at all — the valid set is actions,
      # artifact-metadata, attestations, checks, contents, deployments,
      # discussions, id-token, issues, models, packages, pages, pull-requests,
      # repository-projects, security-events, statuses. "Administration" is a
      # GitHub App / fine-grained-PAT repository permission, and there is no way
      # to grant it to GITHUB_TOKEN. actionlint rejected it outright, which
      # failed the mandatory `repo-static` check on EVERY pull request — see
      # F-35. Worse, it was load-bearing in intent only: had actionlint not
      # caught it, the job would have 403'd at runtime instead, because
      # `GET /repos/{owner}/{repo}/rulesets` genuinely does require
      # Administration (read).
      #
      # So the read is done with an explicit fine-grained token instead, checked
      # for presence below. See GOVERNANCE_READ_TOKEN in the step after this.
      contents: read
    steps:
      - name: Checkout the exact evaluated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Fail CLOSED and say why. A drift detector that cannot authenticate must
      # not look like a drift detector that found nothing — that silent-pass mode
      # is precisely the F-11 failure this workflow exists to end. The same
      # reasoning as ci-gitleaks.sh: an absent report is a failed signal, not
      # evidence of zero findings.
      - name: Require the governance read token
        env:
          GOVERNANCE_READ_TOKEN: ${{ secrets.GOVERNANCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GOVERNANCE_READ_TOKEN}" ]]; then
            echo "::error::secrets.GOVERNANCE_READ_TOKEN is not set, so the live"
            echo "::error::rulesets and environments cannot be read and drift"
            echo "::error::cannot be detected. This job fails closed rather than"
            echo "::error::reporting a clean result it did not measure."
            echo "::error::"
            echo "::error::Create a fine-grained token scoped to THIS repository"
            echo "::error::with Repository permissions -> Administration: Read-only"
            echo "::error::(plus the default Metadata: Read-only), and store it as"
            echo "::error::the repository secret GOVERNANCE_READ_TOKEN. Read-only"
            echo "::error::is sufficient and is the maximum this workflow should"
            echo "::error::ever be given: it never applies anything."
            exit 1
          fi
          echo "GOVERNANCE_READ_TOKEN is present."

      - name: Compare rulesets and environments
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          # NOT the default GITHUB_TOKEN: the ruleset and environment endpoints
          # require the Administration permission, which GITHUB_TOKEN cannot hold.
          github-token: ${{ secrets.GOVERNANCE_READ_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const problems = [];
            const notes = [];

            // ---------------- rulesets ----------------
            const rulesetDir = '.github/rulesets';
            const liveList = await github.paginate(
              github.rest.repos.getRepoRulesets,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );

            for (const file of fs.readdirSync(rulesetDir).filter((f) => f.endsWith('.json'))) {
              const declared = JSON.parse(
                fs.readFileSync(path.join(rulesetDir, file), 'utf8'),
              );
              const summary = liveList.find((r) => r.name === declared.name);
              if (!summary) {
                problems.push(
                  `${file}: no live ruleset named '${declared.name}'. ` +
                  `Run .github/scripts/setup-rulesets.sh to create it.`,
                );
                continue;
              }

              const { data: live } = await github.rest.repos.getRepoRuleset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ruleset_id: summary.id,
              });

              if (live.enforcement !== declared.enforcement) {
                problems.push(
                  `${file}: enforcement is '${live.enforcement}' live, ` +
                  `'${declared.enforcement}' in the file`,
                );
              }

              // Rule TYPES are compared, not full parameters: GitHub normalises
              // and defaults parameters on write (it adds allowed_merge_methods,
              // dismissal_restriction and required_reviewers to a pull_request
              // rule, for instance), so a deep compare would be permanently red
              // for reasons nobody can act on. A missing or extra RULE is the
              // thing that changes what is enforced.
              const declaredTypes = new Set((declared.rules || []).map((r) => r.type));
              const liveTypes = new Set((live.rules || []).map((r) => r.type));

              for (const type of [...declaredTypes].sort()) {
                if (!liveTypes.has(type)) {
                  problems.push(
                    `${file}: rule '${type}' is declared but NOT live. ` +
                    `The file claims a protection the repository does not have.`,
                  );
                }
              }
              for (const type of [...liveTypes].sort()) {
                if (!declaredTypes.has(type)) {
                  problems.push(
                    `${file}: rule '${type}' is live but NOT declared. ` +
                    `Either add it to the file or remove it from the repository.`,
                  );
                }
              }

              // The required contexts are the one parameter set worth comparing
              // exactly: it is the merge gate, and it is what silently went
              // missing.
              const contexts = (rules) =>
                new Set(
                  (rules || [])
                    .filter((r) => r.type === 'required_status_checks')
                    .flatMap((r) =>
                      ((r.parameters || {}).required_status_checks || []).map(
                        (c) => c.context,
                      ),
                    ),
                );
              const declaredContexts = contexts(declared.rules);
              const liveContexts = contexts(live.rules);
              for (const ctx of [...declaredContexts].sort()) {
                if (!liveContexts.has(ctx)) {
                  problems.push(
                    `${file}: required status check '${ctx}' is declared but not ` +
                    `enforced live. Merges are NOT gated on it.`,
                  );
                }
              }

              // A rule that only bypass actors can satisfy needs a bypass actor
              // (F-02). Checked against LIVE state, since that is what applies.
              const bypassOnly = ['creation', 'update'].filter((t) => liveTypes.has(t));
              if (bypassOnly.length > 0 && (live.bypass_actors || []).length === 0) {
                problems.push(
                  `${file}: live ruleset restricts ${bypassOnly.join('/')} with an ` +
                  `empty bypass_actors list, so NOBODY can create or update a ` +
                  `matching ref.`,
                );
              }

              notes.push(`${file}: ${live.rules.length} live rule(s) — ${[...liveTypes].sort().join(', ')}`);
            }

            // ---------------- environments ----------------
            const envDir = '.github/environments';
            const { data: envList } = await github.rest.repos.getAllEnvironments({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const liveEnvs = new Map(
              (envList.environments || []).map((e) => [e.name, e]),
            );

            for (const file of fs.readdirSync(envDir).filter((f) => f.endsWith('.json'))) {
              const declared = JSON.parse(fs.readFileSync(path.join(envDir, file), 'utf8'));
              const name = declared.name || path.basename(file, '.json');
              const live = liveEnvs.get(name);
              if (!live) {
                problems.push(`${file}: environment '${name}' does not exist live`);
                continue;
              }

              const liveRules = live.protection_rules || [];
              const liveReviewerCount = liveRules
                .filter((r) => r.type === 'required_reviewers')
                .flatMap((r) => r.reviewers || []).length;
              const declaredReviewerCount = (declared.reviewers || []).length;

              if (declaredReviewerCount > 0 && liveReviewerCount === 0) {
                problems.push(
                  `${file}: declares ${declaredReviewerCount} required reviewer(s) ` +
                  `but the live '${name}' environment has none. Any claim that ` +
                  `deployments to '${name}' are approval-gated is false.`,
                );
              }

              const declaredPolicy = declared.deployment_branch_policy || null;
              if (declaredPolicy && !live.deployment_branch_policy) {
                problems.push(
                  `${file}: declares a deployment_branch_policy but the live ` +
                  `'${name}' environment has none, so ANY ref can deploy to it.`,
                );
              }

              notes.push(
                `${file}: live reviewers=${liveReviewerCount}, ` +
                `branch_policy=${live.deployment_branch_policy ? 'set' : 'none'}`,
              );
            }

            // ---------------- report ----------------
            core.startGroup('Live governance state');
            for (const note of notes) core.info(note);
            core.endGroup();

            if (problems.length > 0) {
              for (const problem of problems) core.error(problem);
              core.setFailed(
                `${problems.length} governance drift(s) between .github/rulesets + ` +
                `.github/environments and the live repository. The committed files ` +
                `are the intended state; apply them with ` +
                `.github/scripts/setup-rulesets.sh --repo ${context.repo.owner}/${context.repo.repo}, ` +
                `or change the files if the live state is correct. Do not leave them ` +
                `disagreeing: the files are what reviewers read before changing ` +
                `branch protection.`,
              );
              return;
            }

            core.info('No drift: live rulesets and environments match the committed files.');
