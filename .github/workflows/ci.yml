# =============================================================================
# VelocityAI CI — lint, test, and security-scan gate.
# =============================================================================
# This workflow has NO AWS access (no OIDC role, no secrets, no cloud calls).
# It is a pure quality gate:
#   - backend: ruff, pyright (import resolution), import-linter, vulture, pytest
#   - frontend: eslint, vitest, next build
#   - security-scan: gitleaks, checkov, trivy (config), tflint
#
# USAGE:
#   (a) Standalone — runs on push to `main` and on every pull_request.
#   (b) Reusable workflow — called by deploy.yml as a gate before deploy.
#       When called, it receives no secrets (AWS-blind) and inherits no
#       environment, so the prod reviewer gate stays on the deploy job only.
#
#   `dev` / `staging` / `v*` are deliberately NOT standalone push triggers:
#   deploy.yml fires on exactly those refs and calls this workflow as its
#   `gate` job (with `secrets: inherit`), so listing them here too would run
#   the whole suite twice on the same commit and report two independent
#   statuses for one push. THIS ONLY GIVES `dev`/`staging` PUSH COVERAGE IF
#   deploy.yml's `gate` job is actually wired into `build`'s and `deploy`'s
#   `needs:` (it was temporarily bypassed once — see git history around
#   commit 8f3042d6 — which left every push to `dev` with NO CI at all,
#   silently, because both the "runs on main/PR only" exclusion here AND the
#   gate bypass in deploy.yml were true at once). tests/ci/test_workflow_contracts.py
#   plus the "Deploy workflow gate contract" step in the test-debt job below
#   assert the gate dependency exists, specifically so this exclusion never
#   becomes a silent coverage gap again. PRs targeting `dev`/`staging` (prior
#   to merge) ARE covered here regardless, via the unfiltered `pull_request:`
#   trigger below.
#
# deploy.yml depends on this gate: no deploy lands without lint + test + scan
# passing on the same commit. This gate BLOCKS deploy.yml's `build` job (which
# blocks `deploy`), so no image is pushed to the shared ECR registry — not even
# under a throwaway tag — until this workflow is green on that commit. It used
# to run in parallel with build for speed, which meant a failing commit still
# published artifacts.
#
# NO TERRAFORM BINARY HERE. Terraform is not installed, initialised, planned or
# applied anywhere in CI/CD (locked design decision — see
# docs/GITHUB_CICD_SETUP.md). IaC coverage comes from static analysis only:
# checkov + trivy config + tflint read the .tf files without a provider or a
# backend. `terraform fmt`/`validate`, which the retired infra/buildspec.yml
# ran in its pre_build phase, are covered locally by .pre-commit-config.yaml.
#
# Action pinning: every third-party/first-party action below is pinned to a
# full commit SHA (never a mutable tag). security-scan installs gitleaks,
# checkov, trivy, and tflint as checksum-verified release binaries rather
# than via aquasecurity/trivy-action or aquasecurity/setup-trivy at all.
# Full incident rationale (CVE-2026-33634): F-07 —
# docs/CICD-DESIGN-DECISIONS.md#action-pinning-and-cve-2026-33634
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Reusable workflow entry point — deploy.yml calls this as a gate.
  workflow_call:

# Cancel superseded runs on the same branch/PR. When called as a reusable
# workflow, github.workflow resolves to the CALLER's name ("Deploy"), so we
# include github.event_name in the key to keep CI-invoked and Deploy-invoked
# runs in separate groups. PRs cancel in-progress; everything else queues.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default: this workflow only reads the repo. No job needs
# write access to contents, PRs, or (crucially) any AWS/OIDC token.
permissions:
  contents: read

# F-08: values that were previously hardcoded at multiple sites within this
# file (and, for TRIVY_*, duplicated a second time in deploy.yml) now have
# exactly one authoritative definition. A version/checksum bump or an ECR
# repo rename is now a one-line diff instead of a multi-site find-and-replace
# that is easy to apply incompletely.
env:
  # Consumed by security-scan's "Install trivy" step below AND by
  # deploy.yml's "Install trivy" step in the build job (deploy.yml declares
  # its own identical copy of these two values — see the note there — since
  # workflow-level `env:` cannot be shared across separate workflow FILES).
  # Bumping the version here requires the SAME bump in deploy.yml; both
  # locations are commented with a pointer to the other.
  TRIVY_VERSION: "0.69.3"
  TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"

  # The 6 Terraform roots this repo has, read by BOTH "Terraform validate"
  # and "Check for .terraform.lock.hcl" in the security-scan job (F-08: these
  # were previously two independent hardcoded copies of the same array).
  TF_ROOTS: "infra/terraform/app infra/terraform/bootstrap infra/terraform/foundation infra/terraform/localstack infra/terraform/shared infra/terraform/velocityai-alb"

jobs:
  # ---------------------------------------------------------------------------
  # Phase 8: Fast-fail tier — catches trivial errors in ~90 seconds, gates
  # all heavier jobs. Runs:
  #   - ruff format --check (formatting)
  #   - ruff check (linting)
  #   - python -m compileall (syntax)
  #   - migration_guard.py --verify (migration invariants)
  #   - gitleaks (secrets)
  #   - shellcheck / bash -n (shell syntax)
  #
  # Cost: ~1 min billable. If this job fails, everything else is skipped.
  # ---------------------------------------------------------------------------
  fast-checks:
    name: Fast checks (format / lint / compile / migrate / gitleaks / shell)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for gitleaks
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Setup backend (uv + venv)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "true"

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

      - name: ruff check (linting)
        working-directory: backend
        run: ruff check .

      - name: python -m compileall (syntax check)
        working-directory: backend
        run: python -m compileall -q app agents

      - name: migration_guard.py --verify
        working-directory: backend
        run: uv run --no-sync python scripts/migration_guard.py --verify

      # Phase 10: Workflow gate contract test — ensures gate cannot be removed
      - name: Workflow gate contract
        run: |
          pip install --no-cache-dir pyyaml==6.0.2
          python .github/scripts/check-workflow-gate-contract.py \
            .github/workflows/deploy.yml --verbose

      # gitleaks: secret scanning (see .gitleaks.toml)
      - name: Install gitleaks
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: gitleaks
          version: v8.30.1
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive-format: tar.gz
          binary-name: gitleaks

      - name: gitleaks detect (full history)
        run: gitleaks detect --redact --no-banner -v --config .gitleaks.toml --source .

      # Shell syntax checks
      - name: shellcheck (all .sh files)
        run: |
          find . -type f -name "*.sh" \
            -not -path "./.git/*" \
            -not -path "./.next/*" \
            -not -path "./node_modules/*" \
            -not -path "./.venv/*" \
            -not -path "./.terraform/*" \
            | xargs -r shellcheck --severity=error

      - name: bash -n (syntax check all scripts in .github)
        run: |
          find .github/scripts -type f -exec bash -n {} +

  # ---------------------------------------------------------------------------
  # Shell scripts — the on-host / on-runner bash scripts that SSM RunCommand
  # executes as root (remote-deploy.sh, remote-bootstrap.sh) or that provision
  # a box directly (bootstrap-ec2.sh, reconcile-host-config.sh, setup-infra.sh).
  # Several of these scripts' own header comments already claimed to be
  # "shellcheck'd and bash -n'd in CI" before any such job existed — this job
  # makes that claim true.
  #
  # `bash -n` is a pure parse check; shellcheck catches everything else
  # (unquoted expansions, unset-variable use under `set -u`, SC2064-style
  # trap quoting, etc.). The specific outage this class of check would have
  # caught: docs/CICD-DESIGN-DECISIONS.md#the-ssm-runcommand-heredoc-incident-why-payloads-are-built-not-inlined
  # ---------------------------------------------------------------------------
  shellcheck:
    name: Shell scripts (bash -n / shellcheck)
    runs-on: ubuntu-latest
    needs: [fast-checks]  # Phase 8: Depends on fast-checks
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config
      # (actions/runner-images Ubuntu2404-Readme.md lists it under Included
      # Software), so — unlike gitleaks/checkov/trivy/tflint below, none of
      # which are preinstalled — there is nothing to download here. This
      # avoids adding a checksum-verified download this workflow can't rotate
      # without someone independently re-verifying a new hash out of band; if
      # that ever changes, follow the same checksummed-binary pattern the
      # security-scan job uses.
      - name: shellcheck --version
        run: shellcheck --version

      - name: bash -n (parse check)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "bash -n: $f"
            bash -n "$f" || status=1
          done < <(find .github/scripts infra/scripts -type f -name '*.sh' -print0)
          exit "$status"

      # TODO(flip-to-failing): remove `|| true` once the FIRST real run's
      # findings against the existing scripts (bootstrap-ec2.sh,
      # reconcile-host-config.sh, remote-deploy.sh, setup-infra.sh, etc.) are
      # triaged. This job has never run before now, so — same posture as the
      # pip-audit/npm-audit warn-only steps above — it starts non-blocking
      # rather than asserting a clean bill of health nobody has confirmed.
      # `bash -n` above stays a hard gate regardless: a parse failure is
      # unambiguous and needs no triage.
      - name: shellcheck (warn-only until first-run findings are triaged)
        run: |
          shellcheck --severity=warning --shell=bash \
            .github/scripts/*.sh \
            infra/scripts/*.sh || true

  # ---------------------------------------------------------------------------
  # Test-debt enforcement (Requirements 32.3, 32.4, 32.5, 2.7)
  #
  # Three checks, all driven by backend/tests/ci/enforce_debt.py:
  #   record  — every entry in .planning/REMEDIATION-RECORD.md must carry the
  #             fields its section declares (owner, reason, unexpired date).
  #             Blocking: an incomplete waiver is never allowed to merge.
  #   counts  — collected pytest / Vitest / mocked-Playwright counts must equal
  #             the recorded baselines in .planning/test-baselines.yml.
  #   skips   — every skip/fixme must have a complete Disabled Tests entry.
  # ---------------------------------------------------------------------------
  test-debt:
    name: Test debt (record completeness / baseline counts)
    runs-on: ubuntu-latest
    needs: [fast-checks]  # Phase 8: Depends on fast-checks
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          frozen: "true"

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      # Phase 8: Cache Playwright browser (~400 MB, 90s install time)
      - name: Cache Playwright browser
        uses: actions/cache@13aacd865c20de90d75de3b17ebe84f7a17d57d2 # v4.0.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-

      # Needed only so `playwright test --list` can resolve the mocked project.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Blocking: the pytest-agents-a/pytest-agents-b jobs below hardcode their
      # file lists inline in a `run:` command rather than discovering
      # tests/agents/ dynamically. That already went stale once — two
      # characterization goldens (test_characterization_prototype_feature_revision.py,
      # test_characterization_prototype_large_revision.py) were added to the
      # directory and silently never ran in CI, which is exactly the failure
      # mode INV-3 exists to prevent. This step re-derives both shards' file
      # lists straight from this workflow file and diffs them against
      # `tests/agents/test_*.py` on disk, so a new test file that isn't added
      # to either shard fails the PR check instead of silently never running.
      - name: Verify pytest shard coverage (tests/agents/)
        run: |
          set -euo pipefail
          CI_YML=".github/workflows/ci.yml"

          on_disk="$(cd backend && find tests/agents -maxdepth 1 -name 'test_*.py' -printf '%f\n' | sort)"

          shard_files="$(
            awk '
              /name: pytest \(agents — shard [AB]/ { in_shard=1 }
              in_shard && /run: uv run/ { print; in_shard=0 }
            ' "$CI_YML" \
            | grep -oE 'tests/agents/test_[A-Za-z0-9_]+\.py' \
            | sed 's#tests/agents/##' \
            | sort -u
          )"

          missing="$(comm -23 <(echo "$on_disk") <(echo "$shard_files"))"

          if [[ -n "$missing" ]]; then
            echo "::error::The following tests/agents/test_*.py files exist on disk but are not listed in either pytest-agents-a or pytest-agents-b in ${CI_YML}:"
            echo "$missing" | sed 's/^/  /'
            echo "::error::Add each file to a shard's file list in ${CI_YML} before merging."
            exit 1
          fi

          echo "All $(echo "$on_disk" | wc -l) tests/agents/test_*.py files are covered by a pytest shard."

      # Blocking: asserts the deploy.yml gate contract directly (build/deploy
      # both transitively require `gate`, no bypass constructs on the gate
      # job, every job declares timeout-minutes, no secrets leak to `gate`).
      # This is the automated check that would have caught `gate` being
      # silently dropped from `needs:` (see the restored dependency in
      # deploy.yml) — it must run on every PR, not just exist unwired in the
      # repo. tests/ci/test_workflow_contracts.py is the single source of
      # truth for this contract; .github/scripts/check-workflow-gate-contract.py
      # is kept only as a standalone CLI for local debugging.
      - name: Deploy workflow gate contract
        working-directory: backend
        run: uv run --no-sync pytest tests/ci/test_workflow_contracts.py -v

      # Blocking: an incomplete or expired record entry fails the PR check.
      - name: Remediation Record completeness
        working-directory: backend
        run: uv run --no-sync python -m tests.ci.enforce_debt record

      # Blocking: baselines were refreshed to the current counts on 2026-09-15
      # as a recorded, owned change (see the Baseline Count Changes section of
      # .planning/REMEDIATION-RECORD.md). Any further drift must be recorded the
      # same way per Requirement 32.4.
      - name: Baseline test counts
        working-directory: backend
        run: uv run --no-sync python -m tests.ci.enforce_debt counts

      # TODO(flip-to-blocking): task 34.2 records an owner, reason, and expiry
      # for each pre-existing skip. Until then this step reports the inventory
      # rather than failing on debt it does not yet own.
      - name: Unrecorded skips (reporting until task 34.2 assigns owners)
        working-directory: backend
        continue-on-error: true
        run: uv run --no-sync python -m tests.ci.enforce_debt skips

  # ---------------------------------------------------------------------------
  # Backend pytest — sharded for parallelism within 15m timeout
  # 
  # Task 3.2: Partition into 4 coherent shards (agents-a, agents-b, unit, 
  # integration) with parallel execution. Each shard produces coverage + 
  # JUnit artifacts; merged after all shards complete.
  #
  # Timing projection:
  #   - agents-a: ~510s (8m30s)
  #   - agents-b: ~505s (8m20s)  
  #   - unit: ~157s (2m37s)
  #   - integration: ~37s (0m37s)
  # Parallel max duration: ~510s (8m30s) ✓ within 15m timeout
  # 
  # INV-3 requirement: all 6 characterization suites run in agents-a shard
  # with SNAPSHOT_UPDATE unset (default pytest behavior). Two of the six
  # (test_characterization_prototype_feature_revision.py,
  # test_characterization_prototype_large_revision.py) were added to
  # tests/agents/ after this shard's file list was written and were never
  # picked up — added back here. A hardcoded file list cannot notice a new
  # test file on its own; verify shard coverage after adding any new
  # tests/agents/test_*.py with:
  #   pytest --collect-only -q tests/agents/ | diff - <(this shard's list)
  # or migrate to pytest-split (see docs/CICD note) so file lists never need
  # hand-maintenance again.
  # ---------------------------------------------------------------------------
  pytest-agents-a:
    name: Backend (pytest agents shard A)
    runs-on: ubuntu-latest
    needs: [fast-checks, test-debt]  # Phase 8: Depends on fast-checks + test-debt
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          frozen: "true"

      - name: pytest (agents — shard A with coverage)
        run: uv run --no-sync pytest tests/agents/test_allowed_step_keys.py tests/agents/test_api_prefix_validator.py tests/agents/test_artifact_fallback_and_roster.py tests/agents/test_artifact_graph.py tests/agents/test_artifacts.py tests/agents/test_attach_replay_matrix.py tests/agents/test_audit_endpoints.py tests/agents/test_banned_patterns.py tests/agents/test_bedrock_cache_and_thinking.py tests/agents/test_budget.py tests/agents/test_cancel_stops_resumed_run.py tests/agents/test_capabilities_threading.py tests/agents/test_capability_resolution.py tests/agents/test_characterization_app_builder.py tests/agents/test_characterization_ppt.py tests/agents/test_characterization_prototype.py tests/agents/test_characterization_prototype_revision.py tests/agents/test_characterization_prototype_feature_revision.py tests/agents/test_characterization_prototype_large_revision.py tests/agents/test_chat_event_neutrality.py tests/agents/test_chat_history_compaction.py tests/agents/test_chunk_sanitizer.py tests/agents/test_clarify_llm_live.py tests/agents/test_code_validators.py tests/agents/test_compiled_plan_runs.py tests/agents/test_compiler.py tests/agents/test_compiler_subagents.py tests/agents/test_compiler_trust.py tests/agents/test_composed_fanout.py tests/agents/test_composer_skills_delivery.py tests/agents/test_concierge_capability.py tests/agents/test_constitution_prod.py tests/agents/test_context_message_oracle.py tests/agents/test_context_pack.py tests/agents/test_context_providers.py tests/agents/test_conversation_provider.py tests/agents/test_create_runner.py tests/agents/test_custom_agent_prompt.py tests/agents/test_declared_gate_streaming.py tests/agents/test_deep_agent_runner_hitl_live.py tests/agents/test_deliverable_resolvers.py tests/agents/test_edge_manifests.py tests/agents/test_engine_runner_error_arm.py tests/agents/test_exec_runs.py tests/agents/test_execution_context.py tests/agents/test_fanout.py tests/agents/test_fanout_cancel.py tests/agents/test_fanout_tool.py tests/agents/test_gate_revision_discriminator.py tests/agents/test_gate_stub_signature_drift.py tests/agents/test_gates.py tests/agents/test_guardrails.py tests/agents/test_heading_tasks_parser.py tests/agents/test_hooks.py tests/agents/test_id_alias_resolver.py tests/agents/test_image_input_wiring.py tests/agents/test_input_providers_run_images.py tests/agents/test_integration_providers.py tests/agents/test_integration_scopes.py tests/agents/test_internet_tool_provider.py tests/agents/test_isolation.py tests/agents/test_iss032_cache_tokens.py tests/agents/test_iss033_aux_token_fold_offline.py tests/agents/test_iss033a_fixloop_token_fold_offline.py tests/agents/test_iss034_cost_full.py tests/agents/test_iss056_clarify_quality_fixes.py tests/agents/test_json_tasks.py tests/agents/test_live_contract.py tests/agents/test_live_harness.py tests/agents/test_loader.py tests/agents/test_local_runtime.py tests/agents/test_manifest.py tests/agents/test_manifest_coverage.py tests/agents/test_manifest_parity.py tests/agents/test_mcp_catalog.py tests/agents/test_mcp_client.py -v \
          --cov=app \
          --cov=agents \
          --cov-report=term-missing:skip-covered \
          --cov-report= \
          --cov-fail-under=80 \
          --junitxml=junit-agents-a.xml
        env:
          COVERAGE_FILE: .coverage.agents-a

      - name: Upload coverage artifact (agents-a)
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: coverage-agents-a
          path: backend/.coverage.agents-a
          retention-days: 1

      - name: Upload JUnit artifact (agents-a)
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: junit-agents-a
          path: backend/junit-agents-a.xml
          retention-days: 1

  pytest-agents-b:
    name: Backend (pytest agents shard B)
    runs-on: ubuntu-latest
    needs: [fast-checks, test-debt]  # Phase 8: Depends on fast-checks + test-debt
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          frozen: "true"

      - name: pytest (agents — shard B with coverage)
        run: uv run --no-sync pytest tests/agents/test_mcp_compile_validation.py tests/agents/test_mcp_gating.py tests/agents/test_merge.py tests/agents/test_merge_conflict.py tests/agents/test_migration_ledger.py tests/agents/test_model_catalog.py tests/agents/test_model_fallback.py tests/agents/test_model_pricing.py tests/agents/test_nav_coverage.py tests/agents/test_parallel_group_strategy.py tests/agents/test_parent_run_ownership.py tests/agents/test_per_task_capture.py tests/agents/test_phase3_compaction.py tests/agents/test_phase3_cutover_verify.py tests/agents/test_phase3_parity.py tests/agents/test_phase3_token_delta_live.py tests/agents/test_phase5_fixloop_selection.py tests/agents/test_phase5_revision_validation.py tests/agents/test_phase6_frontend_consistency.py tests/agents/test_phase8_live.py tests/agents/test_phase8_resume.py tests/agents/test_prompt_contracts.py tests/agents/test_prototype_image_optin.py tests/agents/test_redo_gate_safety.py tests/agents/test_redo_prompt_contract.py tests/agents/test_registry.py tests/agents/test_registry_capabilities.py tests/agents/test_registry_discovery.py tests/agents/test_registry_helpers.py tests/agents/test_repo_diff.py tests/agents/test_repo_index.py tests/agents/test_repo_inventory.py tests/agents/test_repositories_persistence.py tests/agents/test_restart_resume.py tests/agents/test_resume_marker_workspace.py tests/agents/test_resume_ws_bridge.py tests/agents/test_revision_gating.py tests/agents/test_route_table.py tests/agents/test_routing_parity.py tests/agents/test_run_log.py tests/agents/test_runner_output_fallback.py tests/agents/test_sample_brownfield_workflow.py tests/agents/test_sample_wave_workflow.py tests/agents/test_sandbox_deliverable.py tests/agents/test_sc001_fanout.py tests/agents/test_sc001_gate_flag.py tests/agents/test_sc001_lane_router_concierge.py tests/agents/test_sc001_nonprototype_task_loop.py tests/agents/test_sc001_reconcile.py tests/agents/test_scratch_lock_fanout_race.py tests/agents/test_severity.py tests/agents/test_skill_directive_block.py tests/agents/test_skill_prompt_baseline.py tests/agents/test_skills_text_only_deliverable.py tests/agents/test_spec_revision_context.py tests/agents/test_spec_revision_cycles.py tests/agents/test_specs_from_plan.py tests/agents/test_sse_cutover_banned_patterns.py tests/agents/test_static_check.py tests/agents/test_steering_seam.py tests/agents/test_step_retry.py tests/agents/test_strategies.py tests/agents/test_subagent_runs.py tests/agents/test_task_identity.py tests/agents/test_task_list_gate_lineage.py tests/agents/test_text_only_prompt_hygiene.py tests/agents/test_tool_grant_invariants.py tests/agents/test_tool_permissions.py tests/agents/test_update_specs_enforcement.py tests/agents/test_uploaded_files_provider.py tests/agents/test_validators.py tests/agents/test_wave_runs.py tests/agents/test_wave_scheduler.py tests/agents/test_wire_parity.py -v \
          --cov=app \
          --cov=agents \
          --cov-report=term-missing:skip-covered \
          --cov-report= \
          --cov-fail-under=80 \
          --junitxml=junit-agents-b.xml
        env:
          COVERAGE_FILE: .coverage.agents-b

      - name: Upload coverage artifact (agents-b)
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: coverage-agents-b
          path: backend/.coverage.agents-b
          retention-days: 1

      - name: Upload JUnit artifact (agents-b)
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: junit-agents-b
          path: backend/junit-agents-b.xml
          retention-days: 1

  pytest-unit-and-integration:
    name: Backend (pytest unit + integration)
    runs-on: ubuntu-latest
    needs: [fast-checks, test-debt]  # Phase 8: Depends on fast-checks + test-debt
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          frozen: "true"

      # Phase 8: Merged job (unit + integration in one pass)
      - name: pytest (unit tests with coverage)
        run: uv run --no-sync pytest tests/unit -v \
          --cov=app \
          --cov=agents \
          --cov-report=term-missing:skip-covered \
          --cov-report= \
          --cov-fail-under=80 \
          --junitxml=junit-unit.xml
        env:
          COVERAGE_FILE: .coverage.unit

      - name: pytest (integration tests with coverage)
        run: uv run --no-sync pytest tests/integration -v \
          --cov=app \
          --cov=agents \
          --cov-report=term-missing:skip-covered \
          --cov-report= \
          --cov-fail-under=80 \
          --junitxml=junit-integration.xml
        env:
          COVERAGE_FILE: .coverage.integration

      - name: Upload coverage artifact (unit)
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: coverage-unit
          path: backend/.coverage.unit
          retention-days: 1

      - name: Upload coverage artifact (integration)
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: coverage-integration
          path: backend/.coverage.integration
          retention-days: 1

      - name: Upload JUnit artifact (unit)
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: junit-unit
          path: backend/junit-unit.xml
          retention-days: 1

      - name: Upload JUnit artifact (integration)
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: junit-integration
          path: backend/junit-integration.xml
          retention-days: 1

  # Merge and report coverage & JUnit after all shards complete
  test-results:
    name: Backend (merge coverage & JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pytest-agents-a, pytest-agents-b, pytest-unit-and-integration, fast-checks]  # Phase 8: Updated for merged job
    defaults:
      run:
        working-directory: backend
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          frozen: "true"

      - name: Download all coverage artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.0.0
        with:
          pattern: coverage-*
          path: backend/coverage-artifacts
          merge-multiple: false

      - name: Extract coverage files from artifacts
        run: |
          set -euo pipefail
          # Move .coverage.* files from subdirectories to current dir
          find backend/coverage-artifacts -name ".coverage.*" -exec mv {} backend/ \;
          ls -la backend/.coverage.* 2>/dev/null || echo "No .coverage files found"

      - name: Download all JUnit artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.0.0
        with:
          pattern: junit-*
          path: backend/
          merge-multiple: true

      - name: Merge coverage reports
        run: |
          # Combine all .coverage.<shard> files
          uv run --no-sync coverage combine .coverage.agents-a .coverage.agents-b .coverage.unit .coverage.integration
          
          # Generate all report formats
          uv run --no-sync coverage report --fail-under=80
          uv run --no-sync coverage html
          uv run --no-sync coverage json
          uv run --no-sync coverage xml

      - name: Display coverage summary
        run: |
          echo "=== COVERAGE SUMMARY ==="
          uv run --no-sync coverage report

      - name: Upload backend coverage HTML
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
          retention-days: 1  # Phase 8: Reduced from 30 to 1 day (PR-scoped data)

      - name: Upload merged JUnit report
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: backend-junit-report
          path: backend/junit-merged.xml
          retention-days: 1  # Phase 8: Reduced from 30 to 1 day

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@968872560f81e7bdde9272853e65f2507c0eca7c # v5.0.0
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # Phase 8: Split backend linting into two jobs:
  #   1. ruff-vulture: fast, dev deps only (~30s)
  #   2. backend: full deps needed for pyright import resolution
  ruff-vulture:
    name: Backend (ruff + vulture)
    runs-on: ubuntu-latest
    needs: [fast-checks]  # Phase 8: Depends on fast-checks
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Setup backend (uv + venv)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "true"

      - name: ruff (correctness rules)
        run: uv run --no-sync ruff check .

      - name: ruff (format check)
        run: uv run --no-sync ruff format --check --diff .

      - name: vulture (dead-code detection)
        run: uv run --no-sync vulture app/ agents/

  # Original backend job (now: pyright + import-linter + migration + bandit)
  backend:
    name: "Backend (Python linting: pyright / import-linter / bandit / migration)"
    runs-on: ubuntu-latest
    needs: [fast-checks, ruff-vulture]  # Phase 8: Depends on fast-checks + ruff-vulture
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          frozen: "true"

      - name: pyright (import resolution only)
        run: uv run --no-sync pyright

      - name: import-linter (kernel/ports boundary contracts)
        run: uv run --no-sync lint-imports

      - name: bandit (Python SAST security scanning)
        run: uv run --no-sync bandit -c pyproject.toml -r app agents -ll

      # Migration-chain integrity. Catches three things Alembic cannot see for
      # itself, all of which are silent until they reach a deployed database:
      #
      #   1. A RETROACTIVE EDIT to an already-released revision. `alembic_version`
      #      stores a revision ID, never a content hash, so editing a revision a
      #      database has already applied means `upgrade head` sees the stamped ID
      #      and does nothing — the edit reaches fresh databases only, and the two
      #      diverge permanently with no error anywhere. Making the DDL idempotent
      #      does NOT help: the code never runs. This is why the check is a source
      #      fingerprint (alembic/versions.lock) rather than a schema comparison —
      #      every schema-derived check (`alembic check`, upgrade-from-scratch)
      #      runs the edited file and therefore agrees with it.
      #   2. DUPLICATE revision IDs — Alembic keeps one file, silently drops the
      #      other from the graph, and reports multiple heads. Hit twice already
      #      (0031 re-homed to 0036, 0032 re-homed to 0037).
      #   3. MULTIPLE HEADS — `alembic upgrade head` then fails outright, and
      #      docker-entrypoint.sh runs it under `set -eu` before `exec uvicorn`,
      #      so the container crash-loops instead of reporting a failed step.
      #
      # Needs no database and no app config. Runs in the lint job deliberately so
      # it fails in seconds, before the Postgres jobs spend time provisioning.
      # When it fires on an intentional new migration, the fix is:
      #   cd backend && uv run python scripts/migration_guard.py --update
      # committed alongside the migration.
      - name: migration guard (retro-edit + duplicate-ID + single-head)
        run: uv run --no-sync python scripts/migration_guard.py --verify

      # TODO(flip-to-failing: 2026-08-01): remove `|| true` once pre-existing
      # findings are triaged. pip-audit checks requirements.txt against the
      # PyPI advisory database for known CVEs.
      - name: pip-audit (blocking)
        run: uv run --no-sync pip-audit -r requirements.txt

      # Phase 7: Scan Docker image on PR (no push, just build+scan)
      - name: Scan backend Docker image
        uses: ./.github/workflows/_docker.yml
        with:
          component: backend
          build-context: ./backend
          dockerfile-path: ./backend/Dockerfile
          image-tag: pr-${{ github.run_number }}
          push: false

  # ---------------------------------------------------------------------------
  # Backend Postgres integration — task.md DB-002/DB-001. The `backend` job
  # above runs entirely against SQLite (tests/conftest.py's default), which
  # never exercises real PostgreSQL migration application or the
  # transaction-level locking `uq_run_events_scope_seq` retry-on-IntegrityError
  # path depends on. This job is the missing CI wiring task.md's DB-002 calls
  # for: a Linux PostgreSQL service container, migrated to head, driving the
  # `requires_postgres`-marked suite (currently: the migration-head +
  # concurrent-seq-allocation proof in
  # tests/integration/test_db002_postgres_seq_concurrency.py, plus
  # tests/integration/test_bootstrap_admin_postgres.py).
  #
  # Uses GitHub's native Postgres SERVICE CONTAINER (not the docker-in-docker
  # fixture the tests ALSO support for local/no-CI-service environments) —
  # ubuntu-latest runners have the Docker daemon needed for services natively,
  # so this is the lower-overhead CI path; the docker-fixture tests
  # transparently reuse the SAME `postgresql+psycopg://` DSN shape either way.
  backend-postgres:
    name: Backend (PostgreSQL integration)
    runs-on: ubuntu-latest
    needs: [fast-checks, ruff-vulture]  # Phase 8: Depends on fast-checks + ruff-vulture
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          frozen: "true"

      - name: pytest (requires_postgres suite only)
        env:
          # The docker-fixture tests (test_phase8_resume.py, our own
          # test_db002_postgres_seq_concurrency.py) start their OWN throwaway
          # container via `docker run` rather than reading this env var — this
          # only feeds the ENV_VAR-gated suites (test_bootstrap_admin_postgres.py)
          # that expect an already-running instance.
          BOOTSTRAP_ADMIN_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          uv run --no-sync pytest tests/ -v -m requires_postgres

  # ---------------------------------------------------------------------------
  # Populated PostgreSQL Migration Test (Requirement 8)
  #
  # Task 9.1: Provision postgres:16 service and enforce 120-second health check.
  # This job tests the migration chain against populated data: seed at 0014,
  # upgrade to head, verify data integrity and schema parity.
  #
  # Key constraints:
  #   - Connection target MUST come exclusively from CI service configuration
  #   - NO fallback to local/developer defaults
  #   - Health check must complete within 120 seconds or abort with provisioning
  #     failure (distinct from test failure)
  #   - Database available for inspection on migration step failure
  # ---------------------------------------------------------------------------
  backend-postgres-populated-migration:
    name: Backend (PostgreSQL populated migration test)
    runs-on: ubuntu-latest
    needs: [fast-checks, ruff-vulture]  # Phase 8: Depends on fast-checks + ruff-vulture
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Wait for PostgreSQL availability (120s timeout)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          deadline=$(($(date +%s) + 120))
          until PGPASSWORD=postgres pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; do
            now=$(date +%s)
            if [ $now -ge $deadline ]; then
              echo "ERROR: PostgreSQL service not reachable within 120 seconds (provisioning failure)"
              exit 2
            fi
            sleep 2
          done
          echo "PostgreSQL ready after $(($deadline - $now + 120))s"

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          frozen: "true"

      - name: pytest (populated migration test)
        env:
          # Connection target from CI service configuration ONLY.
          # Test MUST skip with explicit unavailability indication if this env
          # var is not provided or if service is unreachable.
          POPULATED_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          uv run --no-sync pytest tests/ -v -m requires_postgres_populated_migration

  # ---------------------------------------------------------------------------
  # Frontend — Node 20 (matches frontend/Dockerfile + backend's pptx-builder
  # stage), npm only (package-lock.json is the lockfile of record).
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    needs: [fast-checks]  # Phase 8: Depends on fast-checks
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Check git status (lockfile drift detection)
        working-directory: frontend
        run: |
          git diff --exit-code package-lock.json || {
            echo "::error::package-lock.json is out of sync with package.json"
            echo "Run 'npm ci' or 'npm install' to update it"
            exit 1
          }

      - name: Typecheck (TypeScript - parallel with lint)
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test (single-pass with coverage)
        working-directory: frontend
        run: npm run test

      - name: E2E tests (Playwright mocked)
        working-directory: frontend
        run: npm run e2e

      - name: Upload frontend coverage HTML
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 1  # Phase 8: Reduced from 30 to 1 day (PR-scoped data)

      - name: Upload frontend coverage XML (for SonarCloud)
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: frontend-coverage-xml
          path: frontend/coverage/coverage-final.xml
          retention-days: 1

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@968872560f81e7bdde9272853e65f2507c0eca7c # v5.0.0
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: npm ls --omit=dev (detect lockfile drift)
        working-directory: frontend
        run: npm ls --omit=dev > /dev/null

      # Phase 7: Scan Docker image on PR (no push, just build+scan)
      - name: Scan frontend Docker image
        uses: ./.github/workflows/_docker.yml
        with:
          component: frontend
          build-context: ./frontend
          dockerfile-path: ./frontend/Dockerfile
          image-tag: pr-${{ github.run_number }}
          push: false

      # TODO(flip-to-high: 2026-09-01): Tighten to --audit-level=high once
      # initial critical findings are triaged. Starting at critical-only to
      # avoid a flood of newly-blocking findings that would delay PR merges.
      - name: npm audit (critical vulnerabilities blocking)
        working-directory: frontend
        run: npm audit --audit-level=critical

  # ---------------------------------------------------------------------------
  # Coverage Consolidation for SonarCloud (Task 4)
  #
  # This job downloads backend + frontend coverage artifacts from test-results
  # and frontend jobs, respectively, and prepares them in a consolidated
  # directory for SonarScanner to consume in the sonarcloud-analysis job.
  #
  # Coverage Flow:
  #   - Backend: pytest jobs → test-results (merge) → coverage.xml
  #   - Frontend: vitest → coverage/ (includes coverage.xml from v8 provider)
  #   - Consolidation: download both → prepare for SonarScanner
  # ---------------------------------------------------------------------------
  prepare-sonarcloud:
    name: Prepare coverage for SonarCloud
    runs-on: ubuntu-latest
    needs: [test-results, frontend, ruff-vulture]  # Phase 8: Added ruff-vulture dependency
    if: always()  # Run even if test-results or frontend jobs fail, so we can analyze partial coverage
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full repo history needed for SonarScanner to compute delta/new code
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Download backend coverage artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.0.0
        with:
          name: backend-coverage-report
          path: coverage-backend/

      - name: Download frontend coverage XML artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.0.0
        with:
          name: frontend-coverage-xml
          path: coverage-frontend/

      - name: Verify coverage files exist and are valid XML
        run: |
          set -euo pipefail
          echo "=== Backend Coverage Files ==="
          ls -lh coverage-backend/ || echo "No backend coverage files found"
          find coverage-backend -name "*.xml" -exec file {} \;
          echo ""
          echo "=== Frontend Coverage Files ==="
          ls -lh coverage-frontend/ || echo "No frontend coverage files found"
          find coverage-frontend -name "*.xml" -exec file {} \;

      - name: Create sonarcloud-coverage directory
        run: mkdir -p sonarcloud-coverage

      - name: Consolidate coverage files for SonarCloud
        run: |
          set -euo pipefail
          echo "Copying backend coverage..."
          if [ -f coverage-backend/coverage.xml ]; then
            cp coverage-backend/coverage.xml sonarcloud-coverage/coverage-backend.xml
            echo "✓ Copied coverage-backend.xml"
          else
            echo "⚠ WARNING: Backend coverage.xml not found" >&2
          fi
          
          echo "Copying frontend coverage..."
          if [ -f coverage-frontend/coverage-final.xml ]; then
            cp coverage-frontend/coverage-final.xml sonarcloud-coverage/coverage-frontend.xml
            echo "✓ Copied coverage-frontend.xml (from coverage-final.xml)"
          else
            echo "⚠ WARNING: Frontend coverage.xml not found" >&2
          fi
          
          echo ""
          echo "=== Consolidated Coverage Directory ==="
          ls -lh sonarcloud-coverage/

      - name: Validate consolidated coverage XML files
        run: |
          set -euo pipefail
          for file in sonarcloud-coverage/*.xml; do
            if [ -f "$file" ]; then
              echo "Validating: $file"
              head -1 "$file" | grep -q "<?xml" || echo "⚠ WARNING: $file does not start with XML declaration"
              wc -l "$file"
            fi
          done

      - name: Upload consolidated coverage artifact
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: sonarcloud-coverage
          path: sonarcloud-coverage/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # SonarCloud Analysis Job (Task 5)
  #
  # Runs SonarScanner CLI to analyze code and coverage reports, publishes
  # results to SonarCloud, and enforces quality gates. SonarCloud automatically
  # decorates PRs with check status and comments.
  #
  # Dependencies: prepare-sonarcloud (provides consolidated coverage artifacts)
  # Environment: SONAR_TOKEN (GitHub Organization Secret), SONAR_HOST_URL
  # ---------------------------------------------------------------------------
  sonarcloud-analysis:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [prepare-sonarcloud]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'  # Phase 9: Guard fork PRs from accessing secrets
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full repo history needed for SonarScanner to compute delta/new code
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Download consolidated coverage artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.0.0
        with:
          name: sonarcloud-coverage
          path: sonarcloud-coverage/

      - name: Verify coverage artifacts exist
        run: |
          echo "=== Coverage Artifacts ==="
          ls -lh sonarcloud-coverage/ || echo "No coverage artifacts found"

      - name: Install SonarScanner CLI (checksum-verified binary)
        run: |
          set -euo pipefail
          # SonarScanner latest stable release
          # To verify/update checksum: download the .zip file and run:
          #   sha256sum sonar-scanner-cli-<VERSION>-linux-x64.zip
          SONAR_VERSION="8.0.1.6346"
          # Checksum verified from official SonarSource release binaries:
          # https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip.sha256
          SONAR_CHECKSUM="4bd40bf8411ed104853e94a3746ec92bc92845fde2b27dbf5c33fb5cfa8ecbe9"
          SONAR_BINARY="sonar-scanner-cli-${SONAR_VERSION}-linux-x64"
          SONAR_ZIP="${SONAR_BINARY}.zip"
          
          echo "Downloading SonarScanner v${SONAR_VERSION}..."
          curl -sSL -o "${SONAR_ZIP}" \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${SONAR_ZIP}"
          
          # Verify checksum
          echo "${SONAR_CHECKSUM}  ${SONAR_ZIP}" | sha256sum -c -
          echo "✓ Checksum verified"
          
          echo "Extracting..."
          unzip -q "${SONAR_ZIP}"
          
          echo "Installing to /opt..."
          sudo mkdir -p /opt
          sudo mv "${SONAR_BINARY}" /opt/sonar-scanner
          sudo chmod +x /opt/sonar-scanner/bin/sonar-scanner
          
          echo "Verifying installation..."
          /opt/sonar-scanner/bin/sonar-scanner --version
          
          echo ""
          echo "✓ SonarScanner installed successfully"

      # F-08: sonar-scanner reads sonar-project.properties from the current
      # working directory (the repo root, where this step runs) by default —
      # organization/projectKey/projectName/sources/exclusions/
      # coverage.exclusions/coverageReportPaths were previously ALSO passed
      # here as -D flags with the identical values, which win over the
      # properties file on any conflict. That meant sonar-project.properties
      # was decorative documentation, not the actual config: a value changed
      # in one place silently had no effect unless the other copy was also
      # updated. Only `sonar.log.level`, which has no equivalent entry in the
      # properties file (deliberately: it's noisy and belongs at the
      # invocation, not committed config), stays as a -D flag.
      - name: Run SonarScanner analysis
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          /opt/sonar-scanner/bin/sonar-scanner -Dsonar.log.level=INFO

      - name: Display SonarCloud analysis results
        if: always()
        run: |
          cat << 'EOF'
          
          ✓ SonarScanner analysis completed
          
          ================================
          Next Steps
          ================================
          
          1. View analysis results:
             https://sonarcloud.io/dashboard?id=velocityai
          
          2. For PR checks:
             - SonarCloud will automatically post a check on your PR
             - Look for "SonarCloud Quality Gate" in the Checks section
             - Merge is blocked if the quality gate fails
          
          3. Troubleshooting:
             - If check doesn't appear: verify SONAR_TOKEN is set in GitHub Organization Secrets
             - If analysis is incomplete: check this job's logs for errors
             - For coverage issues: verify coverage artifacts were downloaded in prepare-sonarcloud job
          
          ================================
          EOF

  # ---------------------------------------------------------------------------
  # Security scan — gitleaks, checkov, trivy (config), tflint.
  #
  # Every scanner is installed as a direct, checksum-verified release binary
  # rather than via a third-party setup-* GitHub Action. This is a deliberate,
  # stricter-than-default choice for the trivy/tflint/gitleaks steps because of
  # CVE-2026-33634 (see workflow header) and the broader campaign it was part
  # of (compromised npm + PyPI packages in the same window) — pinning a
  # checksum we verify ourselves removes any dependency on a third party's
  # Phase 8: Split security-scan into 3 parallel jobs for speed
  # Job 1: secrets scanning (gitleaks)
  security-scan-secrets:
    name: Security scan (gitleaks)
    runs-on: ubuntu-latest
    needs: [fast-checks]  # Phase 8: Depends on fast-checks
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Install gitleaks
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: gitleaks
          version: v8.30.1
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive-format: tar.gz
          binary-name: gitleaks

      - name: gitleaks detect (full history)
        run: gitleaks detect --redact --no-banner -v --config .gitleaks.toml --source .

  # Job 2: IaC scanning (checkov + trivy config)
  security-scan-iac:
    name: Security scan (checkov / trivy config)
    runs-on: ubuntu-latest
    needs: [fast-checks]  # Phase 8: Depends on fast-checks
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "true"

      - name: checkov IaC scan
        run: checkov -d infra/terraform --config-file .checkov.yaml

      - name: Install trivy
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: trivy
          version: "v${{ env.TRIVY_VERSION }}"
          url: https://github.com/aquasecurity/trivy/releases/download/v${{ env.TRIVY_VERSION }}/trivy_${{ env.TRIVY_VERSION }}_Linux-64bit.tar.gz
          sha256: ${{ env.TRIVY_SHA256 }}
          archive-format: tar.gz
          binary-name: trivy

      - name: trivy config scan
        run: |
          trivy config --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --skip-dirs "**/examples/**" \
            --skip-dirs "**/localstack/**" \
            infra/terraform

  # Job 3: Terraform linting and validation (tflint + terraform fmt/validate)
  security-scan-terraform:
    name: Security scan (terraform validate / tflint)
    runs-on: ubuntu-latest
    needs: [fast-checks]  # Phase 8: Depends on fast-checks
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      - name: Install tflint
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: tflint
          version: v0.64.0
          url: https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip
          sha256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
          archive-format: zip
          binary-name: tflint

      - name: tflint init (fetch pinned ruleset plugins)
        env:
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/infra/terraform/.tflint.hcl
        run: tflint --chdir=infra/terraform --init

      - name: Install Terraform
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: terraform
          version: v1.11.0
          url: https://releases.hashicorp.com/terraform/1.11.0/terraform_1.11.0_linux_amd64.zip
          sha256: 32ca9c487ae91d62db5c1f21a0f6d99aac3a53dd2c8c8f6be3fc975f7968d0cd
          archive-format: zip
          binary-name: terraform

      - name: Terraform format check (recursive)
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate (per root)
        run: |
          set -euo pipefail
          status=0
          IFS=' ' read -r -a roots <<< "$TF_ROOTS"
          for root in "${roots[@]}"; do
            echo "Validating root: $root"
            if [ -d "$root" ]; then
              cd "$root"
              if ! terraform init -backend=false -input=false > /dev/null 2>&1; then
                echo "ERROR: terraform init failed for $root"
                status=1
              elif ! terraform validate; then
                echo "ERROR: terraform validate failed for $root"
                status=1
              fi
              cd - > /dev/null
            fi
          done
          exit "$status"

      - name: Check for .terraform.lock.hcl in provider-declaring roots
        run: |
          set -euo pipefail
          status=0
          IFS=' ' read -r -a roots <<< "$TF_ROOTS"
          for root in "${roots[@]}"; do
            if [ -d "$root" ]; then
              if grep -r 'provider\s*"' "$root" > /dev/null 2>&1; then
                if [ ! -f "$root/.terraform.lock.hcl" ]; then
                  echo "ERROR: $root declares a provider but has no committed .terraform.lock.hcl"
                  status=1
                fi
              fi
            fi
          done
          exit "$status"

      - name: tflint (recursive)
        env:
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/infra/terraform/.tflint.hcl
        run: tflint --chdir=infra/terraform --recursive --minimum-failure-severity=error

  # ---------------------------------------------------------------------------
  # ci-required — the single aggregation point for every job above.
  #
  # F-01: without this job, branch protection / repository rulesets would have
  # to enumerate all 14 job names above as separate required status checks.
  # That is brittle in both directions: renaming or removing a shard (as
  # happened when the pytest jobs were split into agents-a/agents-b/unit/
  # integration) silently drops a required check with no error anywhere, and
  # a new job someone forgets to add to the ruleset never blocks anything.
  # This job is the ONLY status check that should ever be named in a
  # required_status_checks list — see docs/GITHUB_CICD_SETUP.md.
  #
  # `if: always()` is required so this job still runs (and can report
  # failure) when an upstream job fails or is cancelled — the default
  # `if: success()` would skip it, and a SKIPPED required check does not
  # block a merge the way a FAILED one does.
  #
  # `needs` intentionally excludes sonarcloud-analysis and prepare-sonarcloud:
  # SonarCloud posts its own PR check ("SonarCloud Code Analysis") directly,
  # which is added to the ruleset as a second, independent required check.
  # Folding it in here would make this job depend on Sonar's availability,
  # which is an external service outside this repo's control.
  # ---------------------------------------------------------------------------
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - fast-checks  # Phase 8: First check, gates all else
      - backend  # Python checks
      - backend-postgres  # Backend integration
      - frontend  # Next.js checks
      - security-scan-secrets  # Phase 8: Security scan (gitleaks)
      - security-scan-iac  # Phase 8: Security scan (checkov/trivy)
      - security-scan-terraform  # Phase 8: Security scan (terraform validate)
    steps:
      - name: Assert every upstream job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          failed="$(echo "$RESULTS" | jq -r \
            'to_entries[] | select(.value.result != "success") | .key')"
          if [[ -n "$failed" ]]; then
            echo "::error::Required jobs did not succeed: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All required jobs succeeded."
