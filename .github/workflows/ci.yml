# =============================================================================
# VelocityAI CI — the single unprivileged evaluator
# =============================================================================
# One workflow, one owner per signal, every mandatory check blocking.
#
# WHAT THIS FILE IS
#   The complete CI evaluation for one exact revision. It runs on pull requests,
#   on pushes to main, on manual dispatch, and as a reusable gate called by
#   deploy.yml. It holds NO cloud, OIDC, deployment or repository-write
#   credentials, and it never pushes an image or touches Terraform state.
#
#   `deploy.yml` calls this file as its `gate` job. That gate must therefore
#   actually evaluate something: a previous iteration reduced this file to a stub
#   that only printed a deprecation notice, which silently un-gated every
#   deployment. Do not do that again — if this file stops failing on red code,
#   deploy.yml stops being protected.
#
# WHO PUBLISHES THE MERGE STATUS
#   Pull requests    : this workflow holds no secrets and no `statuses: write`,
#                      so it publishes no commit status. The trusted
#                      default-branch workflow `ci-authoritative.yml` consumes
#                      this run, attests the evaluator identity and the exact
#                      head, and is the sole publisher of `ci-required` for PRs
#                      (a fork-triggered token cannot write statuses at all).
#   Trusted intents  : push to main / workflow_dispatch / workflow_call publish
#                      `ci-required` inline from the `ci-required` job below.
#
# HOW A SIGNAL BECOMES A VERDICT
#   Every mandatory signal is registered in
#   backend/tools/ci/signal_registry.py with exactly one `owner_job`. The
#   `ci-evidence` job feeds every job result into
#   `python -m tools.ci.ci_gate aggregate`, which succeeds only if every
#   mandatory signal in the registry succeeded for THIS exact SHA (it prints
#   the registry-derived count). Job names below must match
#   the registry's `owner_job` values or the aggregate fails closed with
#   "owns no registered signal".
#
#   The one exception is the PATH FILTER (F-15), and it applies to pull
#   requests ONLY. The `changes` job reports which areas a PR left unchanged;
#   the jobs for those areas are skipped and their signals are recorded as
#   FILTERED in the manifest's `policy_filtered` list, apart from verdicts. The
#   policy — which signals may be filtered, when, and why a filtered signal is
#   not a missing one — is the docblock on `Signal.path_filter_area` in
#   backend/tools/ci/signal_registry.py. push, workflow_dispatch and
#   workflow_call (the deploy gate) always run every job.
#
# THE RULE THAT KEEPS THIS HONEST
#   No mandatory step may use `continue-on-error: true`, `|| true`, or a
#   trailing `exit 0`. Where several independent checks must all report even
#   though one failed, use `tools/ci/run_checks.py`, which runs every command
#   to completion, records a sub-verdict for each, and then exits non-zero.
#   Collecting evidence past a failure is fine; converting a failure into a pass
#   is not.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches:
      # F-03: `dev` and `staging` are here because they are DEPLOYING branches.
      # Previously only `main` was listed, so a push to dev — which deploy.yml
      # turns into a live deployment — produced no CI run of its own at all, and
      # the deploy's own gate was skipped for that environment. Between the two,
      # a dev deploy shipped with zero evaluation. Listing them makes the branch
      # tip evaluated on its own merits regardless of what the deploy does.
      - main
      - dev
      - staging
  workflow_dispatch:
    inputs:
      intent_id:
        description: >-
          Unique label for this manual evaluation. Two dispatches with different
          intent IDs must not cancel each other.
        required: true
        type: string
      advisory_signals:
        description: >-
          Newline- or comma-separated signal IDs to treat as ADVISORY for this
          run. Only IDs allowlisted as advisory_eligible in
          backend/tools/ci/signal_registry.py are accepted, and only before
          their recorded expiry date; anything else FAILS the aggregate. An
          advisory signal still runs, still reports, and its real state is still
          recorded — it simply does not block. A run that uses this does NOT
          publish the ci-required merge status.
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      intent_id:
        description: Unique label for this reusable invocation.
        required: false
        default: reusable
        type: string
      advisory_signals:
        description: >-
          See the workflow_dispatch input of the same name. deploy.yml passes
          this ONLY for the `dev` environment, to carry the two pre-existing
          red signals recorded in .github/CI_STATUS.md while keeping every other
          signal blocking. It is deliberately not a way to turn the gate off: the
          allowlist and the expiry dates live in the registry, not here.
        required: false
        default: ""
        type: string
    # No `secrets:` block, deliberately. This workflow needs no credential of
    # any kind, so it declares none: a caller cannot hand it something it has
    # no business holding, and there is nothing here for fork code to reach.

# Evaluation identity (Requirement 2.15). An explicit `inputs.intent_id` marks a
# trusted intent: a manual dispatch (where it is required) or a workflow_call
# (where the caller passes one, as deploy.yml's gate does). Such a run is keyed by
# its intent and is never cancelled by another run. In a called workflow the
# `github` context belongs to the CALLER, so `github.event_name` is `push` for the
# deploy gate and cannot tell it apart from CI's own push run; `inputs` is
# per-workflow and can. Pull requests and branch pushes carry no inputs, so they
# group WITHOUT the SHA and a newer head cancels an in-flight older one (F-24).
concurrency:
  group: >-
    ci-${{ github.repository }}-${{
      inputs.intent_id != ''
        && format('intent-{0}', inputs.intent_id)
        || (github.event_name == 'pull_request'
              && format('pr-{0}', github.event.pull_request.number)
              || format('branch-{0}', github.ref))
    }}
  cancel-in-progress: ${{ inputs.intent_id == '' && (github.event_name == 'pull_request' || github.event_name == 'push') }}

# Least privilege by default. Only `ci-required` widens this, to
# `statuses: write`, and `changes` to `pull-requests: read` (the path filter
# lists a PR's files through the REST API). No job requests id-token, packages,
# or contents: write. deploy.yml's `gate` job must grant every permission a job
# here requests, or every deploy dies as `startup_failure`
# (test_ci_graph_contracts.py asserts it).
permissions:
  contents: read

env:
  # Tool versions and checksums come from ci/toolchain-lock.json. They are
  # mirrored here because GitHub does not allow a workflow `env:` block to read
  # a file; tests/ci/test_ci_pin_contracts.py asserts the two agree, so a drift
  # is a failing signal rather than a silent divergence.
  # Two forms per tool, because the release URLs are not self-consistent: the
  # GitHub release TAG carries a leading `v` while the ARCHIVE FILENAME inside it
  # does not. Both forms are declared here so neither is a literal buried in a
  # URL — the actionlint and gitleaks URLs used to hardcode `actionlint_1.7.12_`
  # and `gitleaks_8.30.1_`, so bumping the version variable alone produced a URL
  # pointing at the new tag's directory with the OLD filename. That is a 404, not
  # a checksum mismatch, so the error named the download rather than the drift.
  #
  # tests/unit/tools/ci/test_ci_pin_contracts.py asserts each _BARE equals its
  # `v`-stripped counterpart, so the pair cannot drift apart silently.
  ACTIONLINT_VERSION: "v1.7.12"
  ACTIONLINT_VERSION_BARE: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  # ShellCheck keeps the `v` in BOTH the tag and the archive filename
  # (shellcheck-v0.11.0.linux.x86_64.tar.gz), so there is no _BARE form. The
  # project publishes no checksums file; the sha256 is the GitHub release-asset
  # digest, cross-checked against a locally recomputed hash (ci/toolchain-lock.json
  # `checksummed_download.shellcheck.verification_source`).
  SHELLCHECK_VERSION: "v0.11.0"
  SHELLCHECK_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
  GITLEAKS_VERSION: "v8.30.1"
  GITLEAKS_VERSION_BARE: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.69.3"
  TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
  # F-37 (2026-09-30): bumped from 0.75.0. That release reads the retired
  # schema-v5 vulnerability DB, which anchore stopped rebuilding, so every scan
  # died with "db could not be loaded: the vulnerability database was built 28
  # weeks ago (max allowed age is 5 days)" and wrote an empty report (run
  # 35971448862). The gate correctly failed closed, but nothing was scanned.
  # The sha256 below matches grype_0.119.0_checksums.txt AND the GitHub
  # release-asset digest for grype_0.119.0_linux_amd64.tar.gz.
  GRYPE_VERSION: "0.119.0"
  # F-31 (historical): this was de8f5eb8...b5b89, which is NOT the checksum anchore publishes
  # for the linux_amd64 archive of this release. Verified 2026-09-23 against the
  # `..._checksums.txt` asset attached to the grype release named by
  # GRYPE_VERSION above; the published value is the one recorded here.
  #
  # Consequence of the wrong value: install-checksummed-tool runs
  # `sha256sum -c`, so the "Install Grype" step failed outright, which failed
  # BOTH container-scan matrix legs before either scanner ran — leaving all four
  # container-scan[*] signals with no verdict and the aggregate unable to go
  # green. The `verified: false` flags in ci/toolchain-lock.json were honest
  # about these hashes being unattested; one of the four was simply wrong.
  #
  # (No literal URL here on purpose: test_no_tool_version_literal_remains_in_a_download_url
  # forbids a version literal anywhere in this file outside an expression, which
  # is what stopped the actionlint/gitleaks filename-vs-tag 404s.)
  GRYPE_SHA256: "3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b"
  # NOTE: the PostgreSQL service image is NOT declared here. A `services:`
  # block cannot read workflow `env:` — GitHub evaluates service definitions
  # before the env context is available — so a `POSTGRES_IMAGE` variable here
  # was silently unreferenced while looking like the pin. The literal lives on
  # the service's own `image:` line in backend-postgres, with ci/toolchain-lock.json
  # as the record.
  COVERAGE_MIN_BACKEND: "80"
  COVERAGE_MIN_FRONTEND: "80"

jobs:
  # ===========================================================================
  # changes — which areas a pull request changed (F-15 path filter)
  # ===========================================================================
  # Owns no signal. Its outputs gate the heavy jobs below, ON PULL REQUESTS
  # ONLY: on push / workflow_dispatch / workflow_call the filter step is
  # skipped and change_scope.py reports every area as changed, so every job
  # runs and nothing can be filtered.
  #
  # The decision lives in backend/tools/ci/change_scope.py (stdlib-only, run
  # with the runner's python3 from a one-file sparse checkout), so it is unit
  # tested rather than buried in expressions. A malformed filter output fails
  # this job; ci-evidence then passes no --filtered-area, the skipped jobs count
  # as SKIPPED, and the aggregate fails. Fail closed.
  #
  # Filter design: backend tests read frontend/src, compose files,
  # infra/scripts, specs/, .planning/, skills/ and .github/, so `backend` is
  # "everything except a short inert list", not `backend/**`. Any change to
  # `.github/**` or `ci/**` (`workflows`) runs everything.
  #
  # `workflows` also covers the SHARED CI tooling the area-gated jobs execute:
  # backend/tools/ci/** (run_checks.py, the ci_gate frontend-coverage and
  # scan-gate parsers, pin_authority's checkov version, scan_accepts), the
  # backend/tools package __init__ it imports through, and backend/uv.lock +
  # backend/pyproject.toml (the ci-tools group every gated job installs). A PR
  # touching only those would otherwise report frontend/infra unchanged and
  # FILTER the very jobs that run the changed code.
  # ===========================================================================
  changes:
    name: Change scope (path filter; pull requests only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter lists the PR's files through the REST API.
      pull-requests: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      infra: ${{ steps.scope.outputs.infra }}
      docker: ${{ steps.scope.outputs.docker }}
      workflows: ${{ steps.scope.outputs.workflows }}
      backend_image: ${{ steps.scope.outputs.backend_image }}
      frontend_image: ${{ steps.scope.outputs.frontend_image }}
      security_legs: ${{ steps.scope.outputs.security_legs }}
      container_components: ${{ steps.scope.outputs.container_components }}
      filtered_areas: ${{ steps.scope.outputs.filtered_areas }}
    steps:
      - name: Checkout the scope decision script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            backend/tools/ci/change_scope.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Filter changed paths (pull requests only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            workflows:
              - '.github/**'
              - 'ci/**'
              - 'backend/tools/__init__.py'
              - 'backend/tools/ci/**'
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
            backend:
              - '**'
              - '!docs/**'
              - '!.knowledge/**'
              - '!unit-test-prompt/**'
              - '!*.md'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
            docker:
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'docker-compose*.yml'
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            backend_image:
              - 'backend/**'
              - 'skills/opendesign/**'

      - name: Resolve the change scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          F_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          F_BACKEND: ${{ steps.filter.outputs.backend }}
          F_FRONTEND: ${{ steps.filter.outputs.frontend }}
          F_INFRA: ${{ steps.filter.outputs.infra }}
          F_DOCKER: ${{ steps.filter.outputs.docker }}
          F_BACKEND_IMAGE: ${{ steps.filter.outputs.backend_image }}
        run: python3 backend/tools/ci/change_scope.py

  # ===========================================================================
  # repo-static — actionlint, shell parse, ShellCheck, compose config
  # ===========================================================================
  # Owns: repo-static/actionlint, repo-static/bash-syntax, repo-static/shellcheck,
  #       repo-static/compose-config
  # All four run to completion via run_checks.py; the job then fails if any did.
  # Runner: ubuntu-24.04 (exact label, pin_authority.runner_image).
  # compose-config (F-19) renders docker-compose.yml alone and with
  # docker-compose.prod.yml, interpolated from the placeholder-only
  # ci/compose-ci.env, exactly as the hosts consume them.
  #
  # Never path-filtered: every repo-static signal has `path_filter_area=None`
  # in the registry, so this job runs on every event.
  # ===========================================================================
  repo-static:
    name: Repository static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Install actionlint
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: actionlint
          version: ${{ env.ACTIONLINT_VERSION }}
          url: https://github.com/rhysd/actionlint/releases/download/${{ env.ACTIONLINT_VERSION }}/actionlint_${{ env.ACTIONLINT_VERSION_BARE }}_linux_amd64.tar.gz
          sha256: ${{ env.ACTIONLINT_SHA256 }}
          archive-format: tar.gz
          binary-name: actionlint

      - name: Install ShellCheck
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: shellcheck
          version: ${{ env.SHELLCHECK_VERSION }}
          url: https://github.com/koalaman/shellcheck/releases/download/${{ env.SHELLCHECK_VERSION }}/shellcheck-${{ env.SHELLCHECK_VERSION }}.linux.x86_64.tar.gz
          sha256: ${{ env.SHELLCHECK_SHA256 }}
          archive-format: tar.gz
          archive-member: shellcheck-${{ env.SHELLCHECK_VERSION }}/shellcheck
          binary-name: shellcheck

      # ci-tools: run_checks.py is stdlib-only; the checks it runs are bash.
      - name: Setup backend (ci-tools only, for the check runner)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "ci-tools"

      # ShellCheck is installed from the checksum-verified pin above, not taken
      # from the runner image, so the version recorded here is the pinned
      # binary's and ci-shellcheck.sh fails if it is anything else.
      - name: Record tool versions
        run: |
          set -euo pipefail
          mkdir -p ci-results
          {
            actionlint --version
            shellcheck --version
            bash --version | head -n 1
            docker compose version
          } | tee ci-results/repo-static-tool-versions.txt

      - name: Run repository static checks (all, then fail if any failed)
        working-directory: backend
        env:
          SHELLCHECK_EXPECTED_VERSION: ${{ env.SHELLCHECK_VERSION }}
        run: |
          set -euo pipefail
          uv run --frozen python tools/ci/run_checks.py \
            ../ci/repo-static-checks.json \
            ../ci-results/repo-static-results.json \
            ../ci-results/repo-static-results.junit.xml

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-repo-static-evidence
          path: ci-results/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # backend-inventory — canonical pytest collection and partition proof
  # ===========================================================================
  # Owns: backend-inventory
  # Collects every node ID once and assigns each to exactly one partition using
  # real pytest MARKERS (not substring matching on the node ID text, which was
  # the previous approach and cannot work — markers never appear in a node ID).
  # ===========================================================================
  backend-inventory:
    name: Backend test inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    outputs:
      evaluation_sha: ${{ steps.sha.outputs.evaluation_sha }}
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Setup backend (frozen, dev deps)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "true"

      - name: Build canonical inventory and prove the partition
        working-directory: backend
        env:
          EVALUATION_SHA: ${{ steps.sha.outputs.evaluation_sha }}
        run: |
          set -euo pipefail
          mkdir -p ../ci-results
          uv run --frozen python -m tools.ci.inventory_cli \
            --tests-dir tests \
            --evaluation-sha "$EVALUATION_SHA" \
            --out ../ci-results/backend-inventory.json

      - name: Upload canonical inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-backend-inventory
          path: ci-results/backend-inventory.json
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # backend-static — Ruff, compile, Pyright, imports, Vulture, Bandit, migrations
  # ===========================================================================
  # Owns 8 signals, one sub-verdict each, shared setup, single execution.
  # ===========================================================================
  backend-static:
    name: Backend static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Setup backend (frozen, dev deps)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "true"

      - name: Run backend static checks (all, then fail if any failed)
        working-directory: backend
        env:
          # pyright's pip wrapper fetches its pinned npm build (the version
          # comes from the uv.lock `pyright==` pin, so this stays exact) and
          # then prints a "new pyright version available" nag into the check
          # output. The nag is noise in the evidence; the pin is deliberate.
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
        # run_checks.py prints each failed check's output as a log group +
        # ::error:: annotation and writes a verdict table to the step summary.
        run: |
          set -euo pipefail
          mkdir -p ../ci-results
          uv run --frozen python tools/ci/run_checks.py \
            ../ci/backend-static-checks.json \
            ../ci-results/backend-static-results.json \
            ../ci-results/backend-static-results.junit.xml

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-backend-static-evidence
          path: ci-results/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # backend-offline — the complete non-live, non-PostgreSQL pytest partition
  # ===========================================================================
  # Owns: backend-offline
  # Runs with CI_OFFLINE=1 so the provider/credential/egress guard is active,
  # then proves the characterization golden tree is byte-identical (INV-3).
  # ===========================================================================
  backend-offline:
    name: Backend offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [changes, backend-inventory]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    env:
      CI_OFFLINE: "1"
      SNAPSHOT_UPDATE: ""
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Setup backend (frozen, dev deps)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "true"

      # The offline partition is a mandatory gate: a skip counts as a failure in
      # verify-execution. The LibreOffice (FR-027a) and Chromium (render_check /
      # playwright tools) tests skip when their binary is absent, so install both
      # exactly as backend/Dockerfile does for production.
      - name: Install LibreOffice (same packages as backend/Dockerfile)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer \
            libreoffice-calc \
            libreoffice-impress \
            fonts-liberation
          soffice --version

      # Browser build is pinned by the locked `playwright==1.60.0` (uv.lock),
      # the same package the Dockerfile's `playwright install` runs from.
      - name: Install Chromium from the locked Playwright package
        working-directory: backend
        run: |
          set -euo pipefail
          uv run --frozen playwright install --with-deps chromium

      # The pptx tools (tests/agents/test_pptx_tools.py) spawn real `node` and
      # require pptxgenjs. `app/services/pptx_export.py` resolves it from
      # <repo>/frontend/node_modules outside Docker, which is exactly where a
      # developer's `npm install` puts it. Install it the same way every other
      # job does: `npm ci` from the committed frontend/package-lock.json, so the
      # pptxgenjs version is the locked one the Dockerfile also pins.
      - name: Setup frontend (npm ci from the committed lock, for pptxgenjs)
        uses: ./.github/actions/setup-frontend

      - name: Verify pptxgenjs resolves where pptx_export looks for it
        run: |
          set -euo pipefail
          test -f frontend/node_modules/pptxgenjs/package.json
          node -e "console.log('pptxgenjs', require('./frontend/node_modules/pptxgenjs/package.json').version)"

      - name: Download canonical inventory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-${{ needs.backend-inventory.outputs.evaluation_sha }}-backend-inventory
          path: ci-results/

      - name: Hash characterization goldens (before)
        run: bash .github/scripts/ci-golden-digest.sh ci-results/golden-before.sha256

      - name: Run the offline partition
        working-directory: backend
        env:
          COVERAGE_FILE: ${{ github.workspace }}/ci-results/.coverage.backend-offline
          # pytest imports `-p` plugins before any conftest runs, so `tools`
          # must already be importable at that point.
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uv run --frozen pytest tests \
            -m "not live and not requires_api_key and not requires_postgres and not requires_postgres_populated_migration" \
            -p tools.ci.execution_recorder \
            --execution-record="$GITHUB_WORKSPACE/ci-results/execution-backend-offline.json" \
            --cov=app --cov=agents --cov=tools \
            --cov-report=xml:"$GITHUB_WORKSPACE/ci-results/backend-offline-coverage.xml" \
            --junitxml="$GITHUB_WORKSPACE/ci-results/backend-offline-junit.xml" \
            -q

      - name: Verify every inventoried offline node executed exactly once
        if: always()
        working-directory: backend
        run: |
          set -euo pipefail
          uv run --frozen python -m tools.ci.inventory_cli verify-execution \
            --inventory "$GITHUB_WORKSPACE/ci-results/backend-inventory.json" \
            --execution "$GITHUB_WORKSPACE/ci-results/execution-backend-offline.json" \
            --partition offline

      - name: Verify characterization goldens unchanged
        if: always()
        run: bash .github/scripts/ci-golden-verify.sh ci-results/golden-before.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-backend-offline-evidence
          # .coverage.backend-offline is a dotfile. upload-artifact (v4.4+) skips
          # hidden files unless asked, which left backend-evidence nothing to
          # combine. The paths below are explicit, so no other dotfile is swept in.
          include-hidden-files: true
          path: |
            ci-results/.coverage.backend-offline
            ci-results/backend-offline-coverage.xml
            ci-results/backend-offline-junit.xml
            ci-results/execution-backend-offline.json
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # backend-postgres — the PostgreSQL-backed partition against a real service
  # ===========================================================================
  # Owns: backend-postgres
  # An unavailable service is a FAILED gate, never a skip and never a fallback
  # to SQLite (Requirement 2.12).
  # ===========================================================================
  backend-postgres:
    name: Backend PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes, backend-inventory]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    services:
      postgres:
        # Patch-level pin, not a floating `postgres:16`. A digest pin is
        # stronger still and is tracked in ci/toolchain-lock.json
        # (`runtime_pins.postgresql`), which is also where the bump is recorded.
        #
        # The literal is inline ON PURPOSE. `image: ${{ env.POSTGRES_IMAGE }}`
        # does not work: service containers are resolved before the workflow
        # `env` context exists, so the expression evaluates to empty and the job
        # fails to start. Do not "de-duplicate" this into a workflow-level env
        # variable — that is exactly the unreferenced variable that was just
        # removed from the `env:` block above.
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Setup backend (frozen, dev deps)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "true"

      - name: Download canonical inventory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-${{ needs.backend-inventory.outputs.evaluation_sha }}-backend-inventory
          path: ci-results/

      - name: Require a reachable PostgreSQL service (fail-closed)
        env:
          PGPASSWORD: ci_test_password
        run: bash .github/scripts/ci-postgres-ready.sh

      - name: Run the PostgreSQL partition
        working-directory: backend
        env:
          COVERAGE_FILE: ${{ github.workspace }}/ci-results/.coverage.backend-postgres
          PYTEST_DATABASE_URL: postgresql://ci_test:ci_test_password@localhost:5432/ci_test_ordinary
          # The name and driver scheme are the contract of
          # tests/integration/db/test_migration_populated.py (Req 8.8): it reads
          # exactly this variable and asserts the `postgresql+psycopg://` scheme
          # (psycopg v3, the driver the suite's other PostgreSQL tests use). A
          # differently-named variable is invisible to it and the node skips.
          POPULATED_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://ci_test:ci_test_password@localhost:5432/ci_test_populated_migration
          # See the note in backend-offline: `-p` plugins load before conftest.
          PYTHONPATH: .
        run: |
          set -euo pipefail
          # `--cov-fail-under=0` disables pyproject's per-run `fail_under = 80`
          # for THIS partition only. This run executes a handful of
          # requires_postgres nodes, so its own coverage is ~18% by construction
          # and would fail every run even with all nodes green. The 80% floor is
          # enforced on the merged offline+postgres data by backend-evidence
          # ("Enforce backend coverage threshold").
          uv run --frozen pytest tests \
            -m "requires_postgres or requires_postgres_populated_migration" \
            -p tools.ci.execution_recorder \
            --execution-record="$GITHUB_WORKSPACE/ci-results/execution-backend-postgres.json" \
            --cov=app --cov=agents --cov=tools --cov-fail-under=0 \
            --cov-report=xml:"$GITHUB_WORKSPACE/ci-results/backend-postgres-coverage.xml" \
            --junitxml="$GITHUB_WORKSPACE/ci-results/backend-postgres-junit.xml" \
            -q

      - name: Verify every inventoried PostgreSQL node executed exactly once
        if: always()
        working-directory: backend
        run: |
          set -euo pipefail
          uv run --frozen python -m tools.ci.inventory_cli verify-execution \
            --inventory "$GITHUB_WORKSPACE/ci-results/backend-inventory.json" \
            --execution "$GITHUB_WORKSPACE/ci-results/execution-backend-postgres.json" \
            --partition postgres

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-backend-postgres-evidence
          # Dotfile, same as backend-offline's upload above.
          include-hidden-files: true
          path: |
            ci-results/.coverage.backend-postgres
            ci-results/backend-postgres-coverage.xml
            ci-results/backend-postgres-junit.xml
            ci-results/execution-backend-postgres.json
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # backend-evidence — merge both partitions, then enforce 80% overall
  # ===========================================================================
  # Owns: backend-evidence
  # Runs with `if: always()` so a failed producer still produces an honest
  # verdict, but it REFUSES to merge an incomplete producer set: a missing or
  # failed partition fails this job rather than yielding a partial percentage.
  # ===========================================================================
  backend-evidence:
    name: Backend evidence and coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `always()` so a failed producer still yields an honest verdict here; the
    # area check keeps it skipped (FILTERED) on a PR that left the backend alone.
    if: always() && needs.changes.outputs.backend == 'true'
    needs: [changes, backend-inventory, backend-offline, backend-postgres]
    permissions:
      contents: read
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      # All THREE producers, not "both" — the step was named for two before
      # backend-inventory joined the set.
      - name: Require every backend producer to have succeeded
        env:
          INVENTORY_RESULT: ${{ needs.backend-inventory.result }}
          OFFLINE_RESULT: ${{ needs.backend-offline.result }}
          POSTGRES_RESULT: ${{ needs.backend-postgres.result }}
        run: |
          bash .github/scripts/ci-require-producers.sh \
            "backend-inventory=$INVENTORY_RESULT" \
            "backend-offline=$OFFLINE_RESULT" \
            "backend-postgres=$POSTGRES_RESULT"

      - name: Setup backend (frozen, dev deps)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "true"

      - name: Download offline evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-backend-offline-evidence
          path: ci-results/

      - name: Download PostgreSQL evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-backend-postgres-evidence
          path: ci-results/

      - name: Combine coverage from every mandatory producer
        working-directory: backend
        env:
          COVERAGE_FILE: ${{ github.workspace }}/ci-results/.coverage.merged
        run: |
          set -euo pipefail
          # `coverage combine` needs the per-partition data files present; both
          # were uploaded by their producers and downloaded above.
          uv run --frozen coverage combine \
            "$GITHUB_WORKSPACE/ci-results/.coverage.backend-offline" \
            "$GITHUB_WORKSPACE/ci-results/.coverage.backend-postgres"
          uv run --frozen coverage xml \
            -o "$GITHUB_WORKSPACE/ci-results/backend-coverage.xml"
          uv run --frozen coverage report --skip-covered | tail -n 20

      - name: Enforce backend coverage threshold
        working-directory: backend
        run: |
          set -euo pipefail
          uv run --frozen python -m tools.ci.ci_gate coverage-gate-backend \
            --coverage-xml "$GITHUB_WORKSPACE/ci-results/backend-coverage.xml" \
            --min "${{ env.COVERAGE_MIN_BACKEND }}"

      - name: Merge backend JUnit reports (create the file uploads reference)
        working-directory: backend
        run: |
          set -euo pipefail
          uv run --frozen python -m tools.ci.report_merger_cli junit \
            --out "$GITHUB_WORKSPACE/ci-results/junit-backend.xml" \
            "$GITHUB_WORKSPACE/ci-results/backend-offline-junit.xml" \
            "$GITHUB_WORKSPACE/ci-results/backend-postgres-junit.xml"

      - name: Upload merged backend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-backend-aggregate
          path: |
            ci-results/backend-coverage.xml
            ci-results/junit-backend.xml
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # frontend-build — the production standalone bundle, built ONCE
  # ===========================================================================
  # Owns: frontend-build
  # F-12: the production build used to run inside frontend-static and be
  # thrown away, while frontend-e2e tested the DEV server. This job builds the
  # Next.js standalone output once, assembles it the way frontend/Dockerfile's
  # runner stage does (public/ and .next/static/ copied into
  # .next/standalone/), and uploads it as a tarball. frontend-e2e serves exactly
  # these bytes with `node .next/standalone/server.js`.
  #
  # A tarball, not the directory: upload-artifact v4+ drops hidden files by
  # default, and the bundle lives under `.next/`.
  # ===========================================================================
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Setup frontend (npm ci from the committed lock)
        uses: ./.github/actions/setup-frontend

      # Next.js incremental build cache ("No build cache found" otherwise). Only
      # a speed-up: the key covers the lock + every source/config input, and a
      # stale restore can only make `next build` redo work, never skip a check.
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**', 'frontend/next.config.ts', 'frontend/tsconfig*.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Build the production bundle
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Parity with frontend/Dockerfile, which bakes NEXT_PUBLIC_API_URL=""
          # (relative URLs behind nginx). Unset, next.config.ts falls back to
          # http://localhost:8000, so E2E would test a different bundle than the
          # one that ships (REL-23).
          NEXT_PUBLIC_API_URL: ""
        run: npm run build

      # Same layout as frontend/Dockerfile's runner stage: server.js plus the
      # traced node_modules, with public/ and .next/static/ copied alongside.
      - name: Assemble and package the standalone bundle
        run: |
          set -euo pipefail
          cp -R frontend/public frontend/.next/standalone/public
          mkdir -p frontend/.next/standalone/.next
          cp -R frontend/.next/static frontend/.next/standalone/.next/static
          test -f frontend/.next/standalone/server.js
          mkdir -p ci-results
          tar -C frontend/.next/standalone -czf ci-results/frontend-standalone.tgz .

      - name: Upload the standalone bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-frontend-build
          path: ci-results/frontend-standalone.tgz
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # frontend-static — typecheck, lint
  # ===========================================================================
  # Owns: frontend-static/typecheck, frontend-static/lint
  # Both run to completion; the job fails if either did. The production build
  # is the separate `frontend-build` job (F-12).
  # ===========================================================================
  frontend-static:
    name: Frontend static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Setup frontend (npm ci from the committed lock)
        uses: ./.github/actions/setup-frontend

      # ci-tools: run_checks.py is stdlib-only; the checks it runs are npm.
      - name: Setup backend (ci-tools only, for the check runner)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "ci-tools"

      - name: Run frontend static checks (all, then fail if any failed)
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p ../ci-results
          uv run --frozen python tools/ci/run_checks.py \
            ../ci/frontend-static-checks.json \
            ../ci-results/frontend-static-results.json \
            ../ci-results/frontend-static-results.junit.xml

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-frontend-static-evidence
          path: ci-results/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # frontend-vitest — the complete Vitest inventory, once, with coverage
  # ===========================================================================
  # Owns: frontend-vitest
  # The 80% four-metric gate lives in frontend-evidence so that a coverage miss
  # is attributable separately from a test failure.
  # ===========================================================================
  frontend-vitest:
    name: Frontend unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Setup frontend (npm ci from the committed lock)
        uses: ./.github/actions/setup-frontend

      # Vitest's own `thresholds` block would also fail the command, but the
      # authoritative four-metric gate is frontend-evidence's, parsed from
      # coverage-summary.json. Disabling thresholds here keeps a coverage miss
      # from masquerading as a test failure.
      - name: Run the complete Vitest inventory with coverage
        working-directory: frontend
        run: |
          set -euo pipefail
          npx --no-install vitest --run \
            --coverage \
            --coverage.thresholds.lines=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 \
            --coverage.thresholds.statements=0 \
            --reporter=default \
            --reporter=github-actions \
            --reporter=junit \
            --outputFile.junit=../ci-results/frontend-vitest-junit.xml

      # Strict on purpose: this step only runs after Vitest succeeded, so every
      # file must exist. Vitest (working-directory: frontend) already writes the
      # junit report to <repo>/ci-results/ via `../ci-results/...`.
      - name: Stage coverage evidence
        run: |
          set -euo pipefail
          mkdir -p ci-results
          cp frontend/coverage/coverage-summary.json ci-results/
          cp frontend/coverage/lcov.info ci-results/frontend-lcov.info
          test -f ci-results/frontend-vitest-junit.xml

      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-frontend-vitest-evidence
          path: ci-results/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # frontend-e2e — the complete deterministic mocked Playwright project
  # ===========================================================================
  # Owns: frontend-e2e
  # Only this job installs a browser. An unconditional `test.skip` inside the
  # mocked project is an accepted-red baseline and fails this job.
  #
  # F-12: runs against the PRODUCTION server, not the dev server. It downloads
  # the standalone bundle `frontend-build` produced for this SHA and sets
  # PLAYWRIGHT_WEB_SERVER=standalone, so frontend/playwright.config.ts starts
  # `node .next/standalone/server.js` — the bytes the image ships. Locally the
  # config still defaults to `npm run dev`.
  # ===========================================================================
  frontend-e2e:
    name: Frontend end-to-end tests (mocked)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes, frontend-build]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Setup frontend (npm ci from the committed lock)
        uses: ./.github/actions/setup-frontend

      # Downloaded OUTSIDE ci-results/, so the evidence upload below does not
      # re-upload the bundle.
      - name: Download the standalone bundle built for this SHA
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-frontend-build
          path: ${{ runner.temp }}/frontend-build

      - name: Extract the standalone bundle
        run: |
          set -euo pipefail
          mkdir -p frontend/.next/standalone
          tar -xzf "$RUNNER_TEMP/frontend-build/frontend-standalone.tgz" -C frontend/.next/standalone
          test -f frontend/.next/standalone/server.js

      - name: Install Chromium from the locked Playwright package
        working-directory: frontend
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium

      - name: Reject accepted-red skips in the mandatory mocked project
        run: |
          set -euo pipefail
          mkdir -p ci-results
          ./.github/scripts/ci-e2e-no-accepted-red.sh \
            | tee ci-results/frontend-e2e-skip-audit.txt

      - name: Run the complete mocked project
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: ../ci-results/frontend-e2e-junit.xml
          # Serve the downloaded production bundle (playwright.config.ts).
          PLAYWRIGHT_WEB_SERVER: standalone
        run: |
          set -euo pipefail
          npx --no-install playwright test --project=mocked \
            --reporter=list,junit \
            --output=../ci-results/frontend-e2e-artifacts

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-frontend-e2e-evidence
          path: ci-results/
          retention-days: 7
          if-no-files-found: error

      - name: Upload failure diagnostics (best effort, non-authoritative)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-frontend-e2e-diagnostics
          path: |
            frontend/e2e/.report
            frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

  # ===========================================================================
  # frontend-evidence — enforce all four coverage metrics at 80%
  # ===========================================================================
  # Owns: frontend-evidence
  # ===========================================================================
  frontend-evidence:
    name: Frontend evidence and coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `always()` so a failed producer still yields an honest verdict here; the
    # area check keeps it skipped (FILTERED) on a PR that left frontend/ alone.
    if: always() && needs.changes.outputs.frontend == 'true'
    # E2E is NOT a producer of this job: it reads only Vitest coverage. E2E stays
    # an independent mandatory input of ci-evidence (PERF-03).
    needs: [changes, frontend-vitest]
    permissions:
      contents: read
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Require every frontend producer to have succeeded
        env:
          VITEST_RESULT: ${{ needs.frontend-vitest.result }}
        run: |
          bash .github/scripts/ci-require-producers.sh \
            "frontend-vitest=$VITEST_RESULT"

      - name: Setup backend (ci-tools only, for the coverage gate)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "ci-tools"

      - name: Download Vitest evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-frontend-vitest-evidence
          path: ci-results/

      - name: Enforce all four frontend coverage metrics
        working-directory: backend
        run: |
          set -euo pipefail
          uv run --frozen python -m tools.ci.ci_gate coverage-gate-frontend \
            --summary "$GITHUB_WORKSPACE/ci-results/coverage-summary.json" \
            --min "${{ env.COVERAGE_MIN_FRONTEND }}"

      - name: Upload merged frontend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-frontend-aggregate
          path: |
            ci-results/frontend-lcov.info
            ci-results/coverage-summary.json
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # security — secret scanning and IaC policy, one matrix
  # ===========================================================================
  # Owns 6 signals: security[secrets] and the five security[iac]/* sub-verdicts.
  #
  # The former `backend-deps` (pip-audit) and `frontend-deps` (npm audit) legs
  # are gone. Every dependency-vulnerability verdict now comes from Trivy or
  # Grype in `container-scan`:
  #   * backend: the image installs exactly `uv export --frozen --no-dev` from
  #     backend/uv.lock, so the image scan already covers every production
  #     Python package; pip-audit only added dev tooling that never ships.
  #   * frontend: the standalone Next.js image hides most packages inside
  #     compiled chunks, so `container-scan (frontend)` also runs `trivy fs`
  #     on frontend/package-lock.json (.github/scripts/ci-lockfile-scan.sh).
  #
  # (This job stays BLOCKING; only `container-scan` is temporarily advisory.)
  # Every leg ends in `ci_gate scan-gate`, which fails on any resolved
  # High/Critical finding regardless of fix availability. There is no baseline,
  # no --ignore-unfixed, and no suppression list.
  # ===========================================================================
  security:
    name: Security (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [changes]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # F-15: `secrets` is always a leg (security[secrets] is never
        # filterable); `iac` is dropped only on a pull request that left
        # infra/** unchanged, and its signals are then reported FILTERED.
        leg: ${{ fromJSON(needs.changes.outputs.security_legs) }}
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      #
      # fetch-depth stays 1 here even though the secrets leg needs full history:
      # this tree is thrown away and re-fetched by the composite, which applies
      # the real depth. Cloning all history twice would only cost time.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the exact evaluated revision (full history on the secrets leg)
        id: sha
        uses: ./.github/actions/checkout-exact
        with:
          # Quoted on purpose. GitHub expressions have no ternary, and the
          # `cond && A || B` idiom silently breaks when A is falsy: with an
          # unquoted 0, `true && 0` is 0, which is falsy, so `|| 1` wins and the
          # secrets leg would get a shallow clone — scanning one commit of
          # history instead of all of it, and reporting a clean result for it.
          # '0' is a non-empty string and therefore truthy.
          fetch-depth: ${{ matrix.leg == 'secrets' && '0' || '1' }}

      - name: Create evidence directory
        run: mkdir -p ci-results

      # Both legs end by running `tools.ci.ci_gate scan-gate` to turn their
      # reports into verdicts, so both need the backend environment. Only the
      # ci-tools group: the iac leg also reads tools.ci.pin_authority and runs
      # checkov through `uv tool run` (its own isolated environment).
      - name: Setup backend (ci-tools only, for the scanner gate)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "ci-tools"

      # ---- secrets -------------------------------------------------------
      - name: Install gitleaks
        if: matrix.leg == 'secrets'
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: gitleaks
          version: ${{ env.GITLEAKS_VERSION }}
          url: https://github.com/gitleaks/gitleaks/releases/download/${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION_BARE }}_linux_x64.tar.gz
          sha256: ${{ env.GITLEAKS_SHA256 }}
          archive-format: tar.gz
          binary-name: gitleaks

      - name: gitleaks detect (full history)
        if: matrix.leg == 'secrets'
        run: bash .github/scripts/ci-gitleaks.sh ci-results/gitleaks-report.json

      # ---- iac -----------------------------------------------------------
      - name: Setup Terraform
        if: matrix.leg == 'iac'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Setup TFLint
        if: matrix.leg == 'iac'
        # First-party action: verifies the release checksum and GPG signature
        # internally, which is stronger than an unverified curl. The version must
        # match tools/ci/pin_authority.py (tests/ci/test_toolchain_pins.py
        # asserts it).
        uses: terraform-linters/setup-tflint@19a52fbac37dacb22a09518e4ef6ee234f2d4987 # v4.0.0
        with:
          tflint_version: v0.64.0

      - name: Install Trivy
        if: matrix.leg == 'iac'
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: trivy
          version: v${{ env.TRIVY_VERSION }}
          url: https://github.com/aquasecurity/trivy/releases/download/v${{ env.TRIVY_VERSION }}/trivy_${{ env.TRIVY_VERSION }}_Linux-64bit.tar.gz
          sha256: ${{ env.TRIVY_SHA256 }}
          archive-format: tar.gz
          binary-name: trivy

      - name: Terraform fmt (format check)
        if: matrix.leg == 'iac'
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate (per root, backend disabled, never plan/apply)
        if: matrix.leg == 'iac'
        run: bash .github/scripts/ci-terraform-validate.sh

      # F-38: this used to be a bare `tflint --recursive --chdir=infra/terraform`.
      # `--recursive` behaves like `--chdir` into EACH module directory, and
      # config is loaded from the changed directory — so every layer looked for
      # its own `<layer>/.tflint.hcl`, found none, and linted with tflint's
      # built-in defaults. The shared ruleset (AWS plugin + terraform
      # `recommended` preset) declared in infra/terraform/.tflint.hcl never ran
      # in CI, and the AWS plugin was never even `--init`ed. An absolute
      # TFLINT_CONFIG_FILE applies the one ruleset to every directory, matching
      # the pre-commit hook and ci/README.md. GITHUB_TOKEN only raises the
      # GitHub API rate limit for the plugin download; it grants nothing else.
      - name: TFLint (shared ruleset, plugins initialised)
        if: matrix.leg == 'iac'
        env:
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/infra/terraform/.tflint.hcl
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tflint --chdir=infra/terraform --init
          tflint --chdir=infra/terraform --recursive --minimum-failure-severity=error

      - name: Checkov and Trivy config policy gates
        if: matrix.leg == 'iac'
        run: bash .github/scripts/ci-iac-scan.sh ci-results

      # ---- shared --------------------------------------------------------
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-security-${{ matrix.leg }}-evidence
          path: ci-results/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # container-scan — build locally, scan with BOTH engines, zero High/Critical
  # ===========================================================================
  # Owns 5 signals: container-scan[backend|frontend]/{trivy,grype} and
  # container-scan[frontend]/trivy-lockfile.
  # Both engines always run against the same local image, and the job fails if
  # EITHER reports a High/Critical finding. Nothing is pushed to a registry.
  #
  # The frontend leg also scans frontend/package-lock.json with `trivy fs`: the
  # standalone Next.js image compiles most dependencies into .next/ chunks that
  # carry no package.json, so the image scan alone cannot see them. This is the
  # replacement for the retired `npm audit` leg.
  #
  # The ONLY exceptions are the dated, per-package entries in
  # backend/tools/ci/scan_accepts.py, applied by both scan scripts before the
  # gate. While scans are advisory, an expired or stale entry only warns.
  #
  # CURRENT STATE: High/Critical findings WARN (advisory, TEMPORARY). Both scan
  # steps run with SCAN_GATE_MODE=warn, so findings, exceptions problems and
  # unusable reports become ::warning:: annotations plus a step summary instead of
  # failing. The real verdict stays in *-verdict.json (enforced: false). Build
  # and other failures still fail the job.
  # TODO(security): TEMPORARY - vulnerability scans are WARN-ONLY (advisory) as of 2026-10-11.
  # In future this must be changed back to BLOCKING, and the outstanding High/Critical
  # vulnerabilities must be fixed (see backend/tools/ci/scan_accepts.py and scan reports).
  # ===========================================================================
  container-scan:
    name: Container scan (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [changes]
    # F-15: a component is scanned unless a pull request left its image inputs
    # unchanged (any Docker-input change scans both). An empty matrix is
    # invalid, so the job is skipped instead and both images report FILTERED.
    if: needs.changes.outputs.container_components != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.container_components) }}
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Create evidence directory
        run: mkdir -p ci-results

      # DISK HEADROOM (F-36) — this job ran out of it, and the failure looked
      # like a security finding rather than the infrastructure fault it was.
      #
      # On run 35964176737 BOTH scanners died on the backend leg:
      #   trivy  FATAL ... failed to analyze layer: write
      #          /tmp/trivy-11243/docker-export-2273084950: no space left on device
      #   grype  could not copy file (... vulnerability.db): no space left on device
      #
      # The gate then reported "mandatory scanner report not found" and "report is
      # empty", which reads as a policy verdict. Nothing had been scanned at all.
      # Failing closed there is correct — an absent report is not evidence of zero
      # findings — but the cause was runner disk, not a CVE, and the message gave
      # no hint of that.
      #
      # What consumes the space: the built image, trivy's FULL uncompressed
      # docker-export into TMPDIR, trivy's ~116 MiB vulnerability DB, grype's own
      # DB, and the buildx layer cache. The `ubuntu-24.04` runner starts with roughly 14 GB
      # free on `/` alongside tens of GB of preinstalled toolchains this job never
      # touches.
      #
      # Deleting them is safe here and only here: the runner is ephemeral and
      # single-use, and nothing in this job needs .NET, Android, GHC, Boost or the
      # CodeQL bundle. The REST of /opt/hostedtoolcache is deliberately left
      # alone — `setup-backend` resolves its Python from there, so wiping the
      # whole tool cache would trade this failure for a different one.
      - name: Reclaim runner disk before building and scanning
        run: |
          set -euo pipefail
          echo "free space before reclaim:"
          df -h /
          # rm -rf on an absent path is a no-op, so no guards are needed.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "free space after reclaim:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      # BUILD CONTEXT — three things have to agree here, and two of them were
      # wrong in earlier revisions.
      #
      # 1. `file:` — the Dockerfiles live at backend/Dockerfile and
      #    frontend/Dockerfile. A previous revision pointed at
      #    ./Dockerfile.backend and ./Dockerfile.frontend, which do not exist,
      #    so both legs failed immediately at build.
      # 2. `context:` — must be the COMPONENT directory, not the repo root.
      #    Every COPY in both Dockerfiles is written relative to its own
      #    directory: backend/Dockerfile does `COPY pyproject.toml uv.lock ./`
      #    and `COPY app/ ./app/`; frontend/Dockerfile does
      #    `COPY package.json package-lock.json ./`. With `context: .` none of
      #    those paths resolve and the build fails on the first COPY.
      # 3. `build-contexts:` — backend/Dockerfile additionally does
      #    `COPY --chown=flowin:flowin --from=opendesign . ./opendesign/`. That
      #    named context is NOT a stage in the Dockerfile; it is supplied from
      #    outside, because skills/opendesign/ sits at the repo root, outside
      #    the ./backend context. Production supplies it via compose
      #    `build.additional_contexts`; buildx needs it as
      #    `--build-context opendesign=...`, which is what this input becomes.
      #    Without it the build fails with "failed to resolve source metadata
      #    for opendesign". The frontend leg needs no named context, hence the
      #    empty string.
      #
      # RELATION TO THE RELEASE BUILD (F-16). This build shares the release
      # build's INPUTS: the same context, the same Dockerfile, the same named
      # `opendesign` build context, and no build args. It differs ON PURPOSE,
      # for trust-class separation, so that nothing built here can ever feed a
      # deployment:
      #   * `push: false` + `load: true` — the image goes to the local daemon
      #     for scanning and never to a registry;
      #   * no `platforms:` — the runner's native linux/amd64, the same
      #     architecture the release build pins;
      #   * no `provenance` attestation — there is no published artifact to
      #     attest;
      #   * a separate `ci-<component>` cache scope, so layers built from
      #     untrusted PR code never reach the release build's
      #     `deploy-<component>` scope.
      # Because the bytes are therefore NOT the shipped bytes, deploy.yml scans
      # the PUSHED digests again after its release build, with the same
      # .github/scripts/ci-image-scan.sh and the same policy.
      - name: Build the ${{ matrix.component }} image locally (never pushed)
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          build-contexts: ${{ matrix.component == 'backend' && 'opendesign=./skills/opendesign' || '' }}
          push: false
          load: true
          tags: localhost/velocityai-${{ matrix.component }}:ci-${{ steps.sha.outputs.evaluation_sha }}
          # Cache scope is namespaced to CI and to the trust class so a fork's
          # layers can never be consumed by a deployment build.
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}

      # The image is now in the daemon's image store (`load: true`) and the layer
      # cache has already been exported to the GHA cache (`cache-to` completes as
      # part of the build step above). The BUILDER's local copy of that cache is
      # therefore dead weight for every step that follows — and on the backend leg
      # it is gigabytes of it, competing with trivy's image export for the same
      # filesystem. `docker builder prune` clears build cache only; it does not
      # touch the image store, so the tag the scanners resolve survives.
      - name: Reclaim the builder cache before scanning
        run: |
          set -euo pipefail
          docker builder prune --all --force
          echo "free space entering the scanners:"
          df -h /

      - name: Install Trivy
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: trivy
          version: v${{ env.TRIVY_VERSION }}
          url: https://github.com/aquasecurity/trivy/releases/download/v${{ env.TRIVY_VERSION }}/trivy_${{ env.TRIVY_VERSION }}_Linux-64bit.tar.gz
          sha256: ${{ env.TRIVY_SHA256 }}
          archive-format: tar.gz
          binary-name: trivy

      - name: Install Grype
        uses: ./.github/actions/install-checksummed-tool
        with:
          name: grype
          version: v${{ env.GRYPE_VERSION }}
          url: https://github.com/anchore/grype/releases/download/v${{ env.GRYPE_VERSION }}/grype_${{ env.GRYPE_VERSION }}_linux_amd64.tar.gz
          sha256: ${{ env.GRYPE_SHA256 }}
          archive-format: tar.gz
          binary-name: grype

      # ci-tools: the scan scripts only run tools.ci.scan_accepts and ci_gate.
      - name: Setup backend (ci-tools only, for the scanner gate)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "ci-tools"

      - name: Scan with both engines (advisory - TEMPORARY)
        env:
          # TODO(security): TEMPORARY - vulnerability scans are WARN-ONLY (advisory) as of 2026-10-11.
          # In future this must be changed back to BLOCKING, and the outstanding High/Critical
          # vulnerabilities must be fixed (see backend/tools/ci/scan_accepts.py and scan reports).
          SCAN_GATE_MODE: warn
          IMAGE_REF: localhost/velocityai-${{ matrix.component }}:ci-${{ steps.sha.outputs.evaluation_sha }}
          COMPONENT: ${{ matrix.component }}
        run: bash .github/scripts/ci-image-scan.sh ci-results

      # Frontend only. `!cancelled()` so the lockfile verdict is still recorded
      # when the image scan above is red: that is evidence collection past a
      # failure; the job still fails if the image-scan step failed for a non-finding reason.
      - name: Scan frontend/package-lock.json with Trivy (advisory - TEMPORARY)
        if: ${{ !cancelled() && matrix.component == 'frontend' }}
        env:
          # TODO(security): TEMPORARY - vulnerability scans are WARN-ONLY (advisory) as of 2026-10-11.
          # In future this must be changed back to BLOCKING, and the outstanding High/Critical
          # vulnerabilities must be fixed (see backend/tools/ci/scan_accepts.py and scan reports).
          SCAN_GATE_MODE: warn
        run: bash .github/scripts/ci-lockfile-scan.sh ci-results

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-container-${{ matrix.component }}-evidence
          path: ci-results/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # ci-evidence — the authoritative aggregate verdict
  # ===========================================================================
  # This job replaces the previous placeholder that read every upstream result
  # into a shell variable, echoed it, and then ran `exit 0` with a comment
  # saying failures do not fail the aggregate. It now delegates to
  # `tools.ci.ci_gate aggregate`, which succeeds only when every mandatory
  # signal succeeded for this exact SHA.
  #
  # Every signal is owned by a job in this file, on every event type. Nothing is
  # deferred to another workflow, so the manifest this job uploads is the
  # complete verdict and the finalizer only has to attest it.
  #
  # F-15: `--event` is always passed; `--filtered-area` only when the `changes`
  # job succeeded. A skipped job's signals then count as satisfied ONLY when
  # their registry `path_filter_area` was reported unchanged on a pull request.
  # They are listed in the manifest's `policy_filtered`, never in
  # `signal_states`, so the finalizer can tell filtered from missing. A skip
  # for any other reason is SKIPPED and fails the aggregate.
  # ===========================================================================
  ci-evidence:
    name: CI evidence (aggregate verdict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs:
      - changes
      - repo-static
      - backend-inventory
      - backend-static
      - backend-offline
      - backend-postgres
      - backend-evidence
      - frontend-build
      - frontend-static
      - frontend-vitest
      - frontend-e2e
      - frontend-evidence
      - security
      - container-scan
    permissions:
      contents: read
    outputs:
      # `evaluation_sha` and `advisory_applied` only. There was an
      # `outcome: ${{ steps.aggregate.outcome }}` output that nothing read: the
      # `ci-required` job below judges this job by `needs.ci-evidence.result`,
      # and the trusted finalizer reads the uploaded manifest. A step-level
      # `outcome` would also have been misleading to consume — it reports
      # `success` for a step that failed but was allowed to continue, which is
      # not the property any caller wants here.
      evaluation_sha: ${{ steps.sha.outputs.evaluation_sha }}
      # 'true' when at least one signal actually NEEDED its advisory downgrade
      # (F-03). Read by `ci-required` below to withhold the merge status: a green
      # `ci-required` asserts "all mandatory signals succeeded", and that
      # sentence must stay literally true.
      advisory_applied: ${{ steps.advisory.outputs.advisory_applied }}
    steps:
      # Bootstrap only: a local `uses: ./...` action is loaded from disk, so the
      # repo must exist before `checkout-exact` can be resolved. The composite
      # below is still the authoritative checkout. See F-33 in its action.yml.
      - name: Bootstrap the local actions (not the authoritative checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Checkout + SHA verification are one step (R-01): the verification is what
      # binds this job's artifact names and recorded verdicts to one revision, so
      # it must not be possible to check out without it.
      - name: Checkout the exact evaluated revision
        id: sha
        uses: ./.github/actions/checkout-exact

      - name: Setup backend (ci-tools only, for the aggregate gate)
        uses: ./.github/actions/setup-backend
        with:
          dev-deps: "ci-tools"

      - name: Compute the aggregate verdict
        id: aggregate
        working-directory: backend
        env:
          EVALUATION_SHA: ${{ steps.sha.outputs.evaluation_sha }}
          R_REPO_STATIC: ${{ needs.repo-static.result }}
          R_BACKEND_INVENTORY: ${{ needs.backend-inventory.result }}
          R_BACKEND_STATIC: ${{ needs.backend-static.result }}
          R_BACKEND_OFFLINE: ${{ needs.backend-offline.result }}
          R_BACKEND_POSTGRES: ${{ needs.backend-postgres.result }}
          R_BACKEND_EVIDENCE: ${{ needs.backend-evidence.result }}
          R_FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          R_FRONTEND_STATIC: ${{ needs.frontend-static.result }}
          R_FRONTEND_VITEST: ${{ needs.frontend-vitest.result }}
          R_FRONTEND_E2E: ${{ needs.frontend-e2e.result }}
          R_FRONTEND_EVIDENCE: ${{ needs.frontend-evidence.result }}
          R_SECURITY: ${{ needs.security.result }}
          R_CONTAINER_SCAN: ${{ needs.container-scan.result }}
          # F-15 path filter. The areas are only honoured when `changes`
          # itself succeeded; ci_gate additionally rejects any filtered area on
          # an event other than pull_request.
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FILTERED_AREAS: ${{ needs.changes.outputs.filtered_areas }}
          # Passed via env, never interpolated into the command line: this is a
          # workflow input, so it is caller-controlled text and must not be able
          # to become shell syntax. `inputs` is empty on pull_request and push,
          # so this is unavoidably "" for those events — which is what keeps the
          # downgrade unreachable from a pull request.
          ADVISORY_SIGNALS: ${{ inputs.advisory_signals }}
        run: |
          set -euo pipefail
          mkdir -p ../ci-results

          args=(
            --sha "$EVALUATION_SHA"
            --out "$GITHUB_WORKSPACE/ci-results/ci-evidence-manifest.json"
            --event "$EVENT_NAME"
            --job "repo-static=$R_REPO_STATIC"
            --job "backend-inventory=$R_BACKEND_INVENTORY"
            --job "backend-static=$R_BACKEND_STATIC"
            --job "backend-offline=$R_BACKEND_OFFLINE"
            --job "backend-postgres=$R_BACKEND_POSTGRES"
            --job "backend-evidence=$R_BACKEND_EVIDENCE"
            --job "frontend-build=$R_FRONTEND_BUILD"
            --job "frontend-static=$R_FRONTEND_STATIC"
            --job "frontend-vitest=$R_FRONTEND_VITEST"
            --job "frontend-e2e=$R_FRONTEND_E2E"
            --job "frontend-evidence=$R_FRONTEND_EVIDENCE"
            --job "security=$R_SECURITY"
            --job "container-scan=$R_CONTAINER_SCAN"
          )

          # One --filtered-area per comma-separated value, and ONLY when the
          # `changes` job succeeded. If it failed or was cancelled, nothing is
          # filtered: the jobs it gated stay SKIPPED and the aggregate fails.
          if [[ "$CHANGES_RESULT" == "success" ]]; then
            if [[ -n "$FILTERED_AREAS" ]]; then
              IFS=',' read -ra filtered_areas <<< "$FILTERED_AREAS"
              for area in "${filtered_areas[@]}"; do
                args+=(--filtered-area "$area")
              done
            fi
          else
            echo "::warning::the changes job concluded '$CHANGES_RESULT'; no area is path-filtered for this evaluation."
          fi

          # One --advisory per non-blank line. The gate also accepts a single
          # comma-separated value, but splitting here keeps the log readable.
          # Explicit `if`, never `[ -z x ] && continue`: that form evaluates to
          # the test's status and is a latent `set -e` trap.
          if [[ -n "${ADVISORY_SIGNALS//[[:space:]]/}" ]]; then
            echo "::notice::This evaluation requests advisory treatment for one or more signals."
            while IFS= read -r line; do
              signal="${line//[[:space:]]/}"
              if [[ -n "$signal" ]]; then
                args+=(--advisory "$signal")
              fi
            done <<< "${ADVISORY_SIGNALS//,/$'\n'}"
          fi

          uv run --frozen python -m tools.ci.ci_gate aggregate "${args[@]}"

      # Read from the manifest the gate just wrote, rather than re-deriving it:
      # the manifest is the artifact the trusted finalizer consumes, so the
      # status decision below and the attested evidence cannot disagree.
      - name: Report whether any signal needed its advisory downgrade
        id: advisory
        if: always()
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/ci-results/ci-evidence-manifest.json"
          applied=false
          if [[ -s "$manifest" ]]; then
            count="$(jq '.advisory_downgraded | length' "$manifest")"
            if [[ "$count" -gt 0 ]]; then
              applied=true
              echo "::warning title=Merge status withheld::${count} mandatory signal(s) were downgraded to advisory for this evaluation, so ci-required is NOT published. Strict outcome: $(jq -r '.strict_outcome' "$manifest")."
              jq -r '.advisory_downgraded | to_entries[] | "  advisory: \(.key) = \(.value)"' "$manifest"
            fi
          fi
          echo "advisory_applied=${applied}" >> "$GITHUB_OUTPUT"

      - name: Upload the aggregate manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ steps.sha.outputs.evaluation_sha }}-ci-evidence-manifest
          path: ci-results/ci-evidence-manifest.json
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # ci-required — publish the merge status for TRUSTED intents
  # ===========================================================================
  # Pull requests are published by ci-authoritative.yml instead; this job is
  # skipped for them so a single identity never gets two authoritative statuses.
  #
  # F-03: also skipped when any signal needed an advisory downgrade. The status
  # description this job writes is "All mandatory CI signals succeeded", and on a
  # downgraded run that is false. Publishing it anyway would be the worst
  # possible outcome of the advisory mechanism: a green required-status context,
  # satisfying branch protection, for an evaluation that did not strictly pass.
  # Withholding is safe for the caller that needs it — deploy.yml reads
  # `needs.gate.result`, not this status — and it means the ONLY way to get a
  # green `ci-required` is a strict pass.
  # ===========================================================================
  ci-required:
    name: Publish ci-required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.ci-evidence.outputs.advisory_applied != 'true'
    needs: [ci-evidence]
    permissions:
      # The only elevated permission anywhere in this workflow, and only here.
      statuses: write
    steps:
      - name: Publish the commit status for the exact evaluated SHA
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EVALUATION_SHA: ${{ needs.ci-evidence.outputs.evaluation_sha || github.sha }}
          AGGREGATE_RESULT: ${{ needs.ci-evidence.result }}
        with:
          script: |
            const sha = process.env.EVALUATION_SHA;
            const success = process.env.AGGREGATE_RESULT === 'success';
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed(`Refusing to publish a status for a malformed SHA: '${sha}'`);
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: success ? 'success' : 'failure',
              context: 'ci-required',
              description: success
                ? 'All mandatory CI signals succeeded'
                : 'One or more mandatory CI signals did not succeed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`Published ci-required=${success ? 'success' : 'failure'} for ${sha}`);
            if (!success) {
              core.setFailed('Aggregate verdict was not success.');
            }
