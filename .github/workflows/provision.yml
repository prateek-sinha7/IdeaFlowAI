# =============================================================================
# VelocityAI Provision — CI/CD replacement for Terraform's user_data.sh.tpl.
# =============================================================================
# Takes a HAND-CREATED (non-Terraform) EC2 instance from bare to fully
# provisioned: uploads the six config artifacts to S3 (the half Terraform's
# app layer normally does via aws_s3_object.*), then runs
# .github/scripts/remote-bootstrap.sh over SSM RunCommand, which writes
# /etc/velocityai/bootstrap.env, installs velocityai-firstboot.service (so a
# future reboot/rebuild self-heals without a CI run), and finally runs
# infra/scripts/bootstrap-ec2.sh itself — the same script a Terraform-managed
# box's first-boot unit runs, byte-for-byte.
#
# NOT part of the app-deploy loop: this workflow has no `build` job and never
# touches ECR. `.github/workflows/deploy.yml` is what starts/redeploys the
# app stack; run THIS workflow first (once) against a box that has never been
# bootstrapped, then run Deploy.
#
# ONE-TIME BY DESIGN: remote-bootstrap.sh's first gate exits 0 immediately if
# /var/lib/velocityai/.bootstrap-done already exists, so re-running this
# workflow against an already-provisioned box is a safe no-op unless you pass
# force=true (which re-runs bootstrap-ec2.sh — idempotent, but the app stack
# WILL restart).
#
# WHY MANUAL-ONLY (workflow_dispatch, no push trigger): provisioning is a
# rare, deliberate, per-instance action (new box, rebuild, disaster recovery),
# not something that should fire on every commit. The environment gate still
# applies (prod requires its configured reviewers), and `dry_run` lets you
# validate every precondition without writing anything to the box.
#
# See docs/GITHUB_CICD_SETUP.md "Provisioning a hand-created EC2" for the
# manual prerequisites this workflow cannot create for you (instance profile,
# attached data volume, DNS record, SSM DATABASE_PASSWORD parameter, ports
# 80/443, IMDSv2 http_tokens=required + hop_limit=2).
# =============================================================================

name: Provision

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      force:
        description: "Re-run bootstrap-ec2.sh even if this host is already provisioned (idempotent, but RESTARTS the app stack)."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Validate every precondition (SSM param, S3 upload, checksum) without writing anything to the box."
        required: false
        type: boolean
        default: false
      skip_db_password_check:
        description: "Skip the pre-flight check for an existing DATABASE_PASSWORD SSM parameter. Only for a box whose Postgres data dir already exists (recovery mode never reads it)."
        required: false
        type: boolean
        default: false

# Same concurrency GROUP NAME `deploy.yml`'s `deploy` job uses
# (deploy-<environment>), so a provision run and a deploy run against the same
# environment's box can never race `docker compose` / `bootstrap-ec2.sh`
# against each other. Provisioning is rare enough that queuing behind an
# in-flight deploy (or vice versa) is the right default over cancelling either.
#
# cancel-in-progress: FALSE, unconditionally. It was
# `${{ inputs.environment != 'prod' }}`, which contradicted the paragraph above
# on every non-prod environment: because the group is SHARED with deploy.yml, a
# dev provision run would cancel an IN-FLIGHT dev deploy — the exact race the
# shared group name exists to prevent — and leave that box half-deployed.
#
# The "cancel non-prod queues" intent it was written for does not apply anyway:
# GitHub holds at most one pending run per group and a newer pending run already
# supersedes the older one, so there is no queue to drain. And provisioning is
# even less interruptible than a deploy: it partitions and mounts the data
# volume, creates the Postgres cluster, and issues a TLS certificate.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

# Least-privilege default: only the one job that needs AWS declares
# `id-token: write` (see the job-level `permissions:` below).
permissions:
  contents: read

# F-25: the AWS region fallback lives in .github/actions/aws-deploy-auth; every
# region site reads that action's `steps.aws.outputs.region`.

jobs:
  provision:
    name: Provision (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      # Only the files the upload + SSM payload need, plus the local composite
      # action this job invokes. .github/actions/ssm-run/ MUST stay listed:
      # `uses: ./...` resolves against the checked-out tree, so omitting it
      # fails the step with "Can't find 'action.yml'". Add any new local action
      # you `uses:` here.
      - name: Checkout (provision payload only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            infra/scripts/bootstrap-ec2.sh
            infra/scripts/reconcile-host-config.sh
            infra/scripts/velocityai-load-secrets.sh
            infra/scripts/lib/host-common.sh
            docker-compose.yml
            docker-compose.prod.yml
            .github/scripts/remote-bootstrap.sh
            .github/scripts/upload-host-config.sh
            .github/actions/ssm-run/
            .github/actions/aws-deploy-auth/
          sparse-checkout-cone-mode: false
          persist-credentials: false  # Phase 9: Prevent GITHUB_TOKEN in .git/config

      # The SAME per-environment deploy role deploy.yml uses. It now also
      # carries the ConfigObjectUpload + KMSForConfigUploadViaS3 statements
      # (infra/terraform/bootstrap/github_oidc.tf) scoped to exactly this
      # environment's backup bucket's config/* prefix — a dev run cannot
      # write into stage's or prod's bucket, whatever variable value is
      # pasted into EC2_INSTANCE_ID or BACKUP_BUCKET.
      #
      # F-25: the aws-deploy-auth composite validates EC2_INSTANCE_ID (set,
      # and shaped like an instance id) before it mints the session; that
      # check moved here from the preflight below.
      - name: Configure AWS credentials (OIDC — per-env deploy role)
        id: aws
        uses: ./.github/actions/aws-deploy-auth
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          instance-id: ${{ vars.EC2_INSTANCE_ID }}
          require-instance-id: "true"

      # ── Preflight: assert every required variable, validate shapes, no side effects ──
      - name: Preflight — validate configuration
        id: preflight
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
          INSTANCE_ID: ${{ steps.aws.outputs.instance-id }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          BACKUP_BUCKET: ${{ vars.VELOCITYAI_BACKUP_BUCKET }}
          KMS_KEY_ID: ${{ vars.VELOCITYAI_KMS_KEY_ID }}
          FQDN: ${{ vars.VELOCITYAI_FQDN }}
          ACME_EMAIL: ${{ vars.VELOCITYAI_ACME_EMAIL }}
          PARAM_PREFIX: ${{ vars.VELOCITYAI_PARAM_PREFIX }}
          DATA_DEVICE: ${{ vars.VELOCITYAI_DATA_DEVICE }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          # EC2_INSTANCE_ID presence and shape are validated by the
          # aws-deploy-auth step above; INSTANCE_ID is its output, echoed below.
          : "${ECR_REGISTRY:?ECR_REGISTRY is not set for the '${DEPLOY_ENV}' environment}"
          : "${BACKUP_BUCKET:?VELOCITYAI_BACKUP_BUCKET is not set for the '${DEPLOY_ENV}' environment}"
          : "${KMS_KEY_ID:?VELOCITYAI_KMS_KEY_ID is not set for the '${DEPLOY_ENV}' environment}"
          : "${FQDN:?VELOCITYAI_FQDN is not set for the '${DEPLOY_ENV}' environment}"
          : "${ACME_EMAIL:?VELOCITYAI_ACME_EMAIL is not set for the '${DEPLOY_ENV}' environment}"

          if [[ ! "$BACKUP_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::VELOCITYAI_BACKUP_BUCKET '${BACKUP_BUCKET}' is not a valid S3 bucket name."
            exit 1
          fi

          # Anchored at both ends: the old pattern only checked the start, so any
          # suffix (quotes, `$(...)`, newlines) passed (SEC-10).
          if [[ ! "$KMS_KEY_ID" =~ ^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/(mrk-)?[0-9a-f-]+$ ]]; then
            echo "::error::VELOCITYAI_KMS_KEY_ID does not look like a KMS key ARN (expected arn:aws:kms:<region>:<account>:key/<id>; value not shown)."
            exit 1
          fi

          RESOLVED_PREFIX="${PARAM_PREFIX:-/velocityai/${DEPLOY_ENV}}"
          RESOLVED_DEVICE="${DATA_DEVICE:-/dev/nvme1n1}"

          # These values are written into single-quoted shell assignments in the
          # SSM payload and into an unquoted heredoc (bootstrap.env), both
          # executed as root on the host. A repository variable is an admin
          # setting, not trusted code, so allow-list the shape of each one here
          # and fail before anything is uploaded or sent (SEC-10). The value is
          # never echoed: it may be exactly the injection being rejected.
          require_format() {
            local name="$1" value="$2" pattern="$3"
            if [[ ! "$value" =~ $pattern ]]; then
              echo "::error::${name} has an unexpected format; refusing to embed it in the host payload (value not shown)."
              exit 1
            fi
          }
          require_format VELOCITYAI_FQDN "$FQDN" '^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$'
          require_format VELOCITYAI_ACME_EMAIL "$ACME_EMAIL" '^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,63}$'
          require_format ECR_REGISTRY "$ECR_REGISTRY" '^[0-9]{12}\.dkr\.ecr(-fips)?\.[a-z0-9-]+\.amazonaws\.com(\.cn)?$'
          require_format VELOCITYAI_PARAM_PREFIX "$RESOLVED_PREFIX" '^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$'
          require_format VELOCITYAI_DATA_DEVICE "$RESOLVED_DEVICE" '^/dev/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$'

          echo "prefix=${RESOLVED_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "device=${RESOLVED_DEVICE}" >> "$GITHUB_OUTPUT"

          echo "Resolved provisioning plan for '${DEPLOY_ENV}':"
          echo "  instance      : ${INSTANCE_ID}"
          echo "  region        : ${AWS_REGION}"
          echo "  backup bucket : ${BACKUP_BUCKET}"
          echo "  kms key       : ${KMS_KEY_ID}"
          echo "  fqdn          : ${FQDN}"
          echo "  ecr registry  : ${ECR_REGISTRY}"
          echo "  param prefix  : ${RESOLVED_PREFIX}"
          echo "  data device   : ${RESOLVED_DEVICE}"
          echo "  force         : ${{ inputs.force }}"
          echo "  dry_run       : ${{ inputs.dry_run }}"

      # ── Upload the six config artifacts to s3://<bucket>/config/ ──────────
      # Replaces the Terraform app layer's aws_s3_object.bootstrap_script /
      # .reconcile_script / .compose_yaml / .compose_prod_yaml for a box that
      # never had that apply run against it. `config/deploy.env` is
      # deliberately NOT uploaded — bootstrap-ec2.sh §10b/§18b treat its
      # absence as the legitimate pre-first-deploy state.
      - name: Upload config artifacts to S3
        id: upload
        env:
          AWS_REGION: ${{ steps.aws.outputs.region }}
          BACKUP_BUCKET: ${{ vars.VELOCITYAI_BACKUP_BUCKET }}
          KMS_KEY_ID: ${{ vars.VELOCITYAI_KMS_KEY_ID }}
        run: |
          set -euo pipefail

          # SSE detection, upload and head-object verification all live in
          # .github/scripts/upload-host-config.sh, because deploy.yml now has to
          # do the same thing after every redeploy (four of these five objects
          # are also fetched at BOOT time by bootstrap-ec2.sh, so S3 must track
          # the deployed commit rather than the last provision). Two copies of
          # that logic would drift; see the script's header for the full note.
          bash .github/scripts/upload-host-config.sh \
            "$BACKUP_BUCKET" "$KMS_KEY_ID" "$AWS_REGION" \
            infra/scripts/bootstrap-ec2.sh \
            infra/scripts/reconcile-host-config.sh \
            infra/scripts/velocityai-load-secrets.sh \
            infra/scripts/lib/host-common.sh \
            docker-compose.yml \
            docker-compose.prod.yml

          # The integrity control the box actually enforces (remote-bootstrap.sh
          # compares this against the object it downloads) is a hash of the
          # LOCAL checkout, computed before upload — not the S3 ETag, which is
          # an MD5 of the possibly-multipart upload and proves nothing about
          # what this workflow run intended to ship.
          BOOTSTRAP_SHA256="$(sha256sum infra/scripts/bootstrap-ec2.sh | awk '{print $1}')"
          echo "bootstrap_sha256=${BOOTSTRAP_SHA256}" >> "$GITHUB_OUTPUT"
          echo "bootstrap-ec2.sh sha256: ${BOOTSTRAP_SHA256}"

      # ── Build the SSM payload ────────────────────────────────
      # F-05: sending and polling are delegated to the ssm-run composite
      # action (.github/actions/ssm-run) -- see that file's header for why
      # this ~60-line pair is no longer duplicated by hand across
      # deploy.yml/provision.yml/cognito-reconcile.yml. Only payload ASSEMBLY,
      # which differs per caller, stays here.
      - name: Build SSM provision payload
        id: build-payload
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.aws.outputs.region }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          BACKUP_BUCKET: ${{ vars.VELOCITYAI_BACKUP_BUCKET }}
          KMS_KEY_ID: ${{ vars.VELOCITYAI_KMS_KEY_ID }}
          FQDN: ${{ vars.VELOCITYAI_FQDN }}
          ACME_EMAIL: ${{ vars.VELOCITYAI_ACME_EMAIL }}
          PARAM_PREFIX: ${{ steps.preflight.outputs.prefix }}
          DATA_DEVICE: ${{ steps.preflight.outputs.device }}
          BOOTSTRAP_SHA256: ${{ steps.upload.outputs.bootstrap_sha256 }}
          # workflow_dispatch boolean inputs render as the literal strings
          # "true"/"false", but remote-bootstrap.sh's gates use "1"/"0"
          # (documented in its own header). Normalised below rather than in
          # the script, so the script's contract stays a plain boolean flag
          # regardless of which caller (this workflow, a manual SSM
          # RunCommand, a future CLI wrapper) is driving it.
          FORCE_INPUT: ${{ inputs.force }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          SKIP_DB_PASSWORD_CHECK_INPUT: ${{ inputs.skip_db_password_check }}
        run: |
          set -euo pipefail

          to01() { [ "$1" = "true" ] && echo 1 || echo 0; }
          FORCE="$(to01 "$FORCE_INPUT")"
          DRY_RUN="$(to01 "$DRY_RUN_INPUT")"
          SKIP_DB_PASSWORD_CHECK="$(to01 "$SKIP_DB_PASSWORD_CHECK_INPUT")"

          {
            echo '#!/bin/bash'
            echo "# Generated by .github/workflows/provision.yml -- do not edit on the box."
            echo "DEPLOY_ENV='${DEPLOY_ENV}'"
            echo "REGION='${AWS_REGION}'"
            echo "PARAM_PREFIX='${PARAM_PREFIX}'"
            echo "BACKUP_BUCKET='${BACKUP_BUCKET}'"
            echo "KMS_KEY_ID='${KMS_KEY_ID}'"
            echo "FQDN='${FQDN}'"
            echo "ECR_REGISTRY='${ECR_REGISTRY}'"
            echo "ACME_EMAIL='${ACME_EMAIL}'"
            echo "DATA_DEVICE='${DATA_DEVICE}'"
            echo "BOOTSTRAP_SHA256='${BOOTSTRAP_SHA256}'"
            echo "FORCE='${FORCE}'"
            echo "DRY_RUN='${DRY_RUN}'"
            echo "SKIP_DB_PASSWORD_CHECK='${SKIP_DB_PASSWORD_CHECK}'"
            # Shared host helpers, INLINED — not fetched (R-05/R-06). This payload
            # is the first thing that runs on a hand-created box, so nothing is on
            # its disk yet: remote-bootstrap.sh needs apt_force_https before it can
            # install anything, which rules out downloading the library first.
            # It is also uploaded to s3://<bucket>/config/host-common.sh above, for
            # bootstrap-ec2.sh §1b, which DOES run with the CLI available.
            #
            # Order matters: after the prelude so the assignments win, before
            # remote-bootstrap.sh so its functions are defined when that script
            # calls them. remote-bootstrap.sh asserts this with a
            # `command -v apt_force_https` check rather than failing obscurely.
            cat infra/scripts/lib/host-common.sh
            cat .github/scripts/remote-bootstrap.sh
          } > remote.sh

          echo "path=remote.sh" >> "$GITHUB_OUTPUT"
          echo "force=${FORCE}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

      # bootstrap-ec2.sh itself runs in ~6 minutes; the 35-minute window
      # leaves headroom for apt-get full-upgrade on a box with a large
      # pending patch set.
      - name: Provision via SSM RunCommand
        uses: ./.github/actions/ssm-run
        with:
          script-path: ${{ steps.build-payload.outputs.path }}
          instance-id: ${{ steps.aws.outputs.instance-id }}
          aws-region: ${{ steps.aws.outputs.region }}
          comment: "velocityai provision ${{ inputs.environment }} (force=${{ steps.build-payload.outputs.force }} dry_run=${{ steps.build-payload.outputs.dry_run }})"
          execution-timeout-seconds: "1800"
          poll-timeout-minutes: "35"
