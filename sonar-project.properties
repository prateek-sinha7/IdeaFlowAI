# SonarCloud Project Configuration
# 
# This file defines project-level analysis parameters for SonarScanner.
# It can be used locally or in CI, and serves as documentation for your
# SonarCloud setup.
#
# Reference: https://docs.sonarcloud.io/advanced-setup/analysis-scope/

# ============================================================================
# Project Identity (must match SonarCloud project)
# ============================================================================
sonar.organization=velocityai
sonar.projectKey=velocityai
sonar.projectName=VelocityAI
sonar.projectVersion=1.0.0

# ============================================================================
# Source Code
# ============================================================================
# Production source only. This was `sonar.sources=.`, i.e. the entire repo:
# Terraform, shell scripts, .github/, docs, .planning/, evals/ and every test
# file were all analysed as production code, which inflates the denominator on
# every coverage and duplication metric and buries real findings in noise from
# files no coverage report can ever cover.
sonar.sources=\
  backend/app,\
  backend/agents,\
  frontend/src

# Test code is declared, not excluded. Sonar applies a different (test-aware)
# rule set to sources listed here, and — importantly — it must know these files
# are tests to attribute coverage correctly rather than counting them as
# uncovered production code.
sonar.tests=\
  backend/tests,\
  frontend/e2e
sonar.test.inclusions=\
  backend/tests/**,\
  frontend/e2e/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/**/*.spec.ts,\
  frontend/src/**/*.spec.tsx

# Files/directories to exclude from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/.venv/**,\
  backend/alembic/versions/**

# ============================================================================
# Coverage Reports
# ============================================================================
# LANGUAGE-SPECIFIC properties, one per analyser. This replaces the previous
# single `sonar.coverageReportPaths=...` entry, which pointed both reports at
# the wrong property: `sonar.coverageReportPaths` accepts ONLY Sonar's own
# "Generic Test Data" XML schema (<coverage version="1"><file path=...>), not
# Coverage.py's Cobertura output and not istanbul's JSON/XML. Sonar parsed
# neither file and reported 0% for both languages — while the scanner still
# exited 0, so nothing anywhere said so.
#
# Both paths are relative to the scanner's working directory (the repo root) and
# are populated by ci.yml's sonarcloud-analysis job, which downloads:
#   backend/coverage.xml        <- `coverage xml` in the test-results job
#   frontend/coverage/lcov.info <- vitest v8 provider's lcov reporter
# That job hard-fails if either file is missing or empty.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Files to exclude from coverage analysis (test files)
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test/**,\
  **/*_test.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# ============================================================================
# Language Configuration
# ============================================================================
# Python-specific settings
#
# 3.13 to match agents/ci/pin_authority.py `sonar_python_version`, pyproject.toml
# `requires-python = ">=3.13.0"` / `target-version = "py313"`, and the
# python:3.13-slim-bookworm base image. This said 3.12, which made SonarCloud
# analyse the tree against the wrong grammar/stdlib: 3.13-only syntax parses as
# an issue, and 3.13 deprecations go unreported. Same root cause as the
# setup-backend action default — see the note there.
sonar.python.version=3.13

# ============================================================================
# Pull Request / New Code Definition
# ============================================================================
# On PRs, SonarCloud compares against the base branch (main) to focus on
# new/changed code. This reduces noise from pre-existing issues.
sonar.newCode.referenceBranch=main

# ============================================================================
# Logging (adjust as needed)
# ============================================================================
# sonar.log.level=DEBUG  # Set to DEBUG for troubleshooting

# ============================================================================
# Quality Gate & Rules
# ============================================================================
# These are set in SonarCloud UI; this file is for reference.
# See docs/SONARCLOUD_INTEGRATION.md for quality gate details.
#
# ci.yml passes -Dsonar.qualitygate.wait=true, so the scanner blocks on the
# server's verdict and the "SonarCloud analysis" job fails when the gate fails.
# That job is NOT part of `ci-required` (SonarCloud is an external service), so
# the SonarCloud quality gate must ALSO be a required status check in the
# repository ruleset for it to block a merge.
#
# Quality Gate Thresholds — CLEAN AS YOU CODE (conditions on NEW code):
#   - Coverage on New Code: >= 80%
#   - Duplicated Lines on New Code: <= 3%
#   - New Blocker/Critical Issues: = 0
#   - Maintainability / Reliability / Security Rating on New Code: A
#
# The previous ">= 85% OVERALL coverage" line was unreachable and should not be
# restored: measured overall coverage is ~80% backend and ~46% frontend, so an
# overall gate fails every PR regardless of what that PR changed. New-code
# conditions hold new work to 80% without asking each PR to retro-test the whole
# legacy surface. frontend/vitest.config.ts holds separate ratchet floors that
# stop OVERALL frontend coverage from regressing below its current baseline.
