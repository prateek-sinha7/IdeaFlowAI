# SonarCloud Project Configuration
# 
# This file defines project-level analysis parameters for SonarScanner.
# It can be used locally or in CI, and serves as documentation for your
# SonarCloud setup.
#
# Reference: https://docs.sonarcloud.io/advanced-setup/analysis-scope/

# ============================================================================
# Project Identity (must match SonarCloud project)
# ============================================================================
sonar.organization=velocityai
sonar.projectKey=velocityai
sonar.projectName=VelocityAI
sonar.projectVersion=1.0.0

# ============================================================================
# Source Code
# ============================================================================
# Analysis root — includes backend and frontend source
sonar.sources=.

# Files/directories to exclude from analysis
sonar.exclusions=\
  node_modules/**,\
  __pycache__/**,\
  .next/**,\
  .git/**,\
  dist/**,\
  build/**,\
  .pytest_cache/**,\
  .ruff_cache/**,\
  .hypothesis/**,\
  coverage/**,\
  htmlcov/**,\
  .venv/**,\
  venv/**

# ============================================================================
# Coverage Reports
# ============================================================================
# Path to coverage reports (backend pytest + frontend vitest)
# Multiple paths separated by comma
sonar.coverageReportPaths=\
  sonarcloud-coverage/coverage-backend.xml,\
  sonarcloud-coverage/coverage-frontend.xml

# Files to exclude from coverage analysis (test files)
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test/**,\
  **/*_test.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# ============================================================================
# Language Configuration
# ============================================================================
# Python-specific settings
sonar.python.version=3.12

# JavaScript/TypeScript settings
sonar.javascript.node_modules.survey=java

# ============================================================================
# Pull Request / New Code Definition
# ============================================================================
# On PRs, SonarCloud compares against the base branch (main) to focus on
# new/changed code. This reduces noise from pre-existing issues.
sonar.newCode.referenceBranch=main

# ============================================================================
# Logging (adjust as needed)
# ============================================================================
# sonar.log.level=DEBUG  # Set to DEBUG for troubleshooting

# ============================================================================
# Quality Gate & Rules
# ============================================================================
# These are set in SonarCloud UI; this file is for reference.
# See docs/SONARCLOUD_INTEGRATION.md for quality gate details.
#
# Quality Gate Thresholds (Moderate Baseline):
#   - Overall Coverage: >= 85%
#   - Blocker Issues: = 0
#   - Critical Issues: <= 5
#   - Code Smells: <= 30
#   - Duplications: <= 3%
#   - Maintainability Rating: A
#   - Security Rating: A
