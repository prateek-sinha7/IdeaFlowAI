[project]
name = "velocityai"
version = "0.1.0"
description = "Enterprise-grade AI SaaS platform backend"
requires-python = ">=3.13.0"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.3.1",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.12",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.7.1",
    "python-jose[cryptography]==3.5.0",
    "langchain==1.3.9",
    "langchain-core==1.4.6",
    "langchain-anthropic==1.4.6",
    "langchain-mistralai==1.1.4",
    "langgraph==1.2.4",
    "langchain-aws==1.4.6",
    "boto3==1.43.2",
    "deepagents==0.6.7",
    "langsmith==0.8.18",
    "langgraph-checkpoint-postgres==3.1.1",
    "psycopg[binary]==3.2.4",
    "websockets==15.0.1",
    "python-dotenv==1.2.2",
    "python-frontmatter==1.1.0",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "langchain-mcp-adapters==0.2.2",
    "mcp==1.28.1",
    "sse-starlette==3.0.2",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "pypdf==6.16.1",
    # Browser automation for headless render validation. PRODUCTION, not test:
    # app/agents/render_check.py imports playwright.async_api at runtime and
    # app/agents/validators/html_render.py registers it as a Validator
    # capability. It also backs the build-time thumbnail pre-render in
    # scripts/generate_template_thumbnails.py.
    #
    # It previously lived in [dependency-groups].dev, which the Dockerfile's
    # `uv export --frozen --no-dev` strips — so /opt/venv had no `playwright`
    # and the runtime stage's `RUN playwright install --with-deps chromium`
    # died with exit 127 (`playwright: not found`), failing every image build.
    #
    # The wheel does NOT bundle the browser binary; `playwright install
    # --with-deps chromium` in backend/Dockerfile fetches that separately.
    # Version is owned by tools/ci/pin_authority.py::playwright_package_version.
    "playwright==1.60.0",
]

# ---------------------------------------------------------------------------
# Dev/test dependencies (PEP 735 dependency group).
#
# THIS is the resolution authority (Task 3.16): CI installs with `uv sync
# --frozen --group dev` against the committed backend/uv.lock (see
# .github/actions/setup-backend/action.yml), and local development's bare
# `uv sync` reads this list directly. requirements-dev.txt mirrors this
# group as a human-readable convenience file (kept in sync by
# backend/tests/ci/test_dependency_lock_contracts.py) but is not itself read
# by CI or `uv sync`.
#
# History: before uv.lock was committed, the two lists WERE the only source
# of truth and drifted — pyproject declared 3 dev pins while
# requirements-dev.txt declared 12, so `uv sync` uninstalled every tool
# missing here (pytest, ruff, pyright, vulture, import-linter, bandit,
# pip-audit, httpx, playwright) and downgraded pytest-cov 7.1.0 -> 5.0.0. The
# committed lock plus the equality test above is what now prevents that.
#
# `dependency-groups` (not `project.optional-dependencies`) because uv installs
# the `dev` group by default on a bare `uv sync`; an extra would need
# `--extra dev`. The legacy `[tool.uv] dev-dependencies` key it replaces is
# deprecated and was a THIRD, separately-drifting copy of the same list.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    # Testing framework — pytest 8.3.4 carried PYSEC-2026-1845; 9.0.3 is the
    # fix, and it drags pytest-asyncio/pytest-cov forward as a set. See the
    # note in requirements-dev.txt.
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.122.3",
    # HTTP testing client
    "httpx==0.28.1",
    # NOTE: playwright is NOT here — it moved to [project.dependencies]. It is a
    # runtime capability (render_check / the html_render Validator), and the
    # Docker build installs prod deps with `uv export --no-dev`, so declaring it
    # dev-only removed it from the image and broke the build. Declaring it in
    # project.dependencies also keeps it installed for dev/E2E, so nothing is
    # lost here — a bare `uv sync` still gets it.
    # Code-quality toolchain (invoked in CI via `uv run --no-sync`)
    "ruff==0.7.4",
    "pyright==1.1.384",
    "vulture==2.14",
    "import-linter==2.1",
    # Coverage — 5.0.0 predates pytest 9.
    "pytest-cov==7.1.0",
    # Security scanning: SAST + dependency CVE audit. The [toml] extra is what
    # lets `bandit -c pyproject.toml` read [tool.bandit] below.
    "bandit[toml]==1.9.4",
    "pip-audit==2.10.1",
    # Hardened XML parsing for the CI report readers (tools/ci/*). They read
    # coverage.xml and JUnit XML, and bandit B314 blocks
    # xml.etree.ElementTree.parse/fromstring outright — the documented
    # remediation is the defusedxml equivalent, not a suppression. It was
    # already resolvable in uv.lock as a transitive dependency of
    # pip-audit -> cyclonedx-python-lib -> py-serializable; declaring it here
    # makes that an intentional, pinned edge instead of an accident that a
    # pip-audit bump could remove. Dev-only on purpose: nothing under
    # app/ imports tools.ci, so the production image never needs it.
    "defusedxml==0.7.1",
    # NOTE: checkov is deliberately NOT here. checkov 3.2.x pins
    # boto3==1.34.25, which conflicts with this project's boto3==1.43.2, so
    # adding it makes the lock unresolvable. It is a standalone CLI, not a
    # library this code imports, so .github/scripts/ci-iac-scan.sh runs it in an
    # isolated environment with `uv tool run --from checkov==<version>`, taking
    # the version from tools/ci/pin_authority.py. That keeps one version
    # authority without dragging a conflicting dependency graph into the project.
]

[tool.uv]
# This project is a source tree run in place (`uv run` from backend/), not a
# distribution — there is no [build-system], and nothing imports `velocityai`
# as an installed package. Declaring it explicitly stops uv from attempting to
# build/install the root project during `uv sync`.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated tests with no real I/O",
    "integration: tests requiring real PostgreSQL or other managed infrastructure",
    "contract: API schema and consumer contract tests",
    "e2e: full-stack user journeys",
    "performance: opt-in latency or throughput tests",
    "security: adversarial authentication and hardening tests",
    "property: generated-input invariant tests",
    "smoke: deployed-environment liveness checks",
    "requires_api_key: test requires a live LLM provider (Bedrock/Anthropic) — skipped in CI without credentials",
    "eval: issue-scoped eval suite (evals/hybrid) — offline scripted-model tests; select with -m eval",
    "requires_postgres: test requires a live PostgreSQL service — skipped without a DB (SQLite-default suites exclude this marker)",
    "requires_postgres_populated_migration: test requires a live PostgreSQL service with migration chain testing from 0014 to head",
    "live: test makes a live network/provider call — excluded from default offline runs",
]

# Coverage configuration for pytest-cov
[tool.coverage.run]
# `tools` is the build-time/CI package (tools/ci/*), exercised by tests/ci/. It
# is measured because it used to live at agents/ci/ and was therefore already
# inside `agents` here — dropping it on the move would have quietly lowered the
# denominator that `fail_under` is judged against. ci.yml's two pytest shards
# pass a matching `--cov=tools`.
source = ["app", "agents", "tools"]
# Store and report RELATIVE file paths instead of absolute ones.
#
# Two reasons, both load-bearing in CI:
#
# 1. `coverage combine` in the test-results job merges .coverage.* files
#    produced on FOUR DIFFERENT runners. With absolute paths, combining only
#    works because GitHub-hosted runners happen to use an identical workspace
#    path — a coincidence, not a guarantee.
# 2. `coverage xml` was emitting
#    `<source>/home/runner/work/velocityai/velocityai/backend/app</source>`
#    with bare `filename="main.py"` attributes, so SonarCloud had to join an
#    absolute path from the SHARD runner against files checked out on the
#    SONAR runner. When that join fails, Sonar reports 0% coverage and the
#    scanner still exits 0 — a silent wrong answer, which is the failure mode
#    this whole coverage chain already had once.
#
# With relative_files, `filename` becomes repo-relative-to-`backend/` (e.g.
# `app/main.py`). ci.yml's test-results job then rewrites the `<source>` root to
# `backend` so the paths resolve from the scanner's base directory (the repo
# root) — see the "Normalise coverage.xml source paths" step there.
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "alembic/versions/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "class .*\\(Protocol\\):",
    "^\\s*\\.\\.\\.$",
    "^\\s*pass\\s*$",
]
precision = 2
show_missing = true
# Coverage threshold: 80% overall required before merge
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.hypothesis]
max_examples = 100

# ---------------------------------------------------------------------------
# Ruff — static analysis for the Python backend.
#
# Scope: CORRECTNESS only. We intentionally do NOT enable formatter-style
# rules (line length, quote style, import sorting, etc.) because we are
# adding ruff to a live codebase and a cascade of cosmetic fixes would
# obscure real bugs and create merge conflicts.
#
# The motivating bug for this config was a lazy import to a deleted module
# (`from app.agents.pipeline import PipelineExecutor` after `pipeline.py`
# was removed in a merge). Pyflakes (`F` rules) catches this as F401
# (unused import — would also be F821 if the symbol were referenced at
# module-load time) because ruff resolves intra-project imports.
# ---------------------------------------------------------------------------
[tool.ruff]
# Match the project's Python version so syntax-level checks line up.
target-version = "py313"
# Anchor src so first-party imports (`app.*`) resolve for unresolved-import
# detection.
src = ["."]
extend-exclude = [
    # Auto-generated and vendored content.
    "alembic/versions",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enabled rule families:
#   F  — Pyflakes: undefined names, unused imports, redefined names, etc.
#        This is the family that catches the deleted-module lazy import.
#   E  — pycodestyle ERRORS only (syntax-adjacent issues like E9*, E7*).
#        We exclude E501 (line too long) because it's stylistic and would
#        flood the report.
#   W  — pycodestyle WARNINGS that indicate real bugs (W605 invalid escape).
#   B  — flake8-bugbear: likely bugs (mutable default args, B008 etc.).
#   PLE — Pylint ERRORS only (no convention/refactor noise).
select = ["F", "E", "W", "B", "PLE"]
ignore = [
    # Line length — stylistic, not correctness; would generate hundreds of
    # findings on the existing codebase. Reviewers can opt-in later.
    "E501",
    # Ambiguous variable name — many existing single-letter loop vars; not
    # a correctness issue.
    "E741",
    # B008 — function calls in argument defaults. FastAPI's `Depends(...)`
    # is the canonical idiom and would generate hundreds of false positives.
    "B008",
    # B904 — `raise ... from err`. Stylistic; reviewers can adopt
    # incrementally. Not a correctness regression.
    "B904",
    # B007 — unused loop control variable. Common in (idx, item) patterns.
    "B007",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use unused imports (for side effects / fixtures),
# magic numbers, and asserts.
"tests/**" = ["F401", "F811"]
# Alembic env.py runs at migration time and imports models for metadata
# introspection — those imports look "unused" to static analysis.
"alembic/env.py" = ["F401"]
# __init__.py files re-export symbols; that's not "unused".
"**/__init__.py" = ["F401"]

# ---------------------------------------------------------------------------
# import-linter — import-boundary enforcement (Ports & Adapters / hexagonal).
#
# 003 §31 / D-11 / D-12. The kernel of the workflow runtime must depend ONLY
# on capability ports — never on legacy engine/factory internals or on
# workflow-specific code. Ruff/pyright cannot express "module A must not import
# module B"; import-linter can. Run with `cd backend && lint-imports`.
#
# GREEN SCAFFOLD (D-12) — read before tightening:
#   Today the "kernel" is still the monolithic `agents.execution_engine.engine`
#   module (the split into `kernel.py` + `capabilities/base.py` lands in
#   Phase 2/8). So we cannot yet author the FINAL contract ("kernel must not
#   import factory/engine internals") — those target modules don't exist as a
#   separable layer yet. Instead we ship a contract that:
#     1. HOLDS on the current tree (exit 0 — no false red on day one), and
#     2. is shaped so Phase 7/8 only ADDS forbidden modules / promotes layers,
#        never rewrites the block.
#
#   INTENDED FINAL FORM (Phase 7/8 — do NOT add yet; documented so the tighten
#   is a diff, not a rewrite). Once kernel.py + capabilities/base.py exist, the
#   contract below simply ADDS the kernel as a source and the legacy internals
#   as forbidden targets — same `forbidden` type, same `root_packages`:
#     [[tool.importlinter.contracts]]
#     name = "kernel imports only capability ports"
#     type = "forbidden"
#     source_modules = ["agents.kernel"]
#     forbidden_modules = [
#         "agents.factory",                  # kernel must not reach into the factory
#         "agents.execution_engine.engine",  # nor the legacy monolith
#         "app.api",                         # (already enforced by the scaffold below)
#     ]
#   When `agents.kernel` lands, point `source_modules` at it and populate
#   `forbidden_modules`. The scaffold below is the same contract type so the
#   migration is purely additive.
#
# NOTE on contract shape (D-12 fallback applied): every `agents.*` subpackage is
# transitively reachable from engine.py today (engine -> factory -> ~everything),
# so a `forbidden` rule naming any `agents.*` target would be BROKEN on the
# current tree. We therefore anchor the scaffold on a boundary that IS already
# respected: the kernel must never import the web/API layer (`app.api.*`). The
# API layer calls INTO the kernel (run_pipeline), never the reverse — classic
# dependency inversion. This requires widening root to both `agents` and `app`.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["agents", "app", "tools"]

[[tool.importlinter.contracts]]
name = "kernel imports only capability ports (scaffold)"
type = "forbidden"
# The kernel (today = engine.py) must NOT import the web/API layer. The HTTP /
# WebSocket layer (`app.api.*`) is the caller — it invokes the engine via
# `run_pipeline`; the engine must never reach back up into it. This is a REAL,
# already-respected boundary (verified: engine.py reaches app.agents/core/
# models/services but NEVER app.api), so the contract is NON-VACUOUS yet exits 0
# on the current tree. It is the green scaffold for D-12 — Phase 7/8 promotes it
# to the INTENDED FINAL FORM documented above by adding the kernel source +
# legacy-internals targets (additive tighten, never a rewrite).
source_modules = ["agents.execution_engine.engine"]
forbidden_modules = ["app.api"]

# ---------------------------------------------------------------------------
# Ports & Adapters boundary (§32 / SAFE-05): the declaration layer
# (`agents.workflows`) and the capability port layer (`agents.capabilities`)
# are INNER — they must never import the execution kernel
# (`agents.execution_engine`) nor the web/API layer (`app`). The kernel and
# the API call INTO these packages, never the reverse. Both directions are
# already respected on the current tree (the compiler/manifest/plan and the
# capability ports import only stdlib + each other), so these contracts are
# NON-VACUOUS and exit 0 today — they lock the boundary so a future accidental
# inward import is caught by CI.
# ---------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "agents.workflows must not import the execution kernel or the web layer"
type = "forbidden"
source_modules = ["agents.workflows"]
forbidden_modules = ["agents.execution_engine", "app"]

[[tool.importlinter.contracts]]
name = "agents.capabilities must not import the execution kernel or the web layer"
type = "forbidden"
source_modules = ["agents.capabilities"]
forbidden_modules = ["agents.execution_engine", "app"]

# ---------------------------------------------------------------------------
# Runtime port boundary (Phase 09 / RUNTIME-01 / T-09-01-03): the runtime port
# layer (`agents.runtime`) is INNER like the workflow/capability port layers —
# it must never import the execution kernel (`agents.execution_engine`) nor the
# web/app layer (`app`). The kernel imports ONLY the runtime PORTS; the concrete
# `LocalSandboxRuntime` lives app-side (`app.agents.runtime`) and is reached via
# the `ctx.runner` handle, never imported by the kernel. This locks the ECS-swap
# seam (D-01): a later `EcsRuntime` plugs in as a backend swap, not an engine
# rewrite. Non-vacuous + green once `agents/runtime/base.py` stays stdlib-only.
# ---------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "agents.runtime must not import the execution kernel or the web layer"
type = "forbidden"
source_modules = ["agents.runtime"]
forbidden_modules = ["agents.execution_engine", "app"]

# ---------------------------------------------------------------------------
# Build-time tooling boundary: shipped code must not import `tools`.
#
# `tools/ci/*` is the CI gate + evidence pipeline. It is invoked by GitHub
# Actions (`python -m tools.ci.ci_gate ...`) and by backend/tests/, never by the
# service. Two things depend on that staying true: backend/Dockerfile does not
# COPY tools/ into the image, and `defusedxml` (imported by ci_gate.py,
# report_parsers.py, report_merger_cli.py) is pinned in the DEV group only, so
# it is absent from the production venv. An `app` or `agents` import of `tools`
# would therefore not fail here — it would fail at runtime in the container,
# which is the worst place to find out.
#
# This package spent its life at `agents/ci/`, inside the product's agent
# runtime package and inside `COPY agents/`, purely because its docstring opened
# with the word "agents". Nothing imported it from app/ or agents/ in that time,
# so this contract is non-vacuous and green on the tree as moved.
# ---------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "shipped code must not import the build-time tooling package"
type = "forbidden"
source_modules = ["app", "agents"]
forbidden_modules = ["tools"]

# ---------------------------------------------------------------------------
# vulture — dead-code / orphaned-symbol detection (D-13).
#
# Complements ruff (which only flags unused-WITHIN-a-file F401/F811) by finding
# functions/classes/attributes that are defined but referenced NOWHERE in the
# scanned packages — the orphans a refactor leaves behind. Run with
# `cd backend && vulture app/ agents/`.
#
# Allow-list strategy (D-13): vulture cannot see dynamic/framework use, so it
# false-positives on FastAPI route handlers, pydantic models, pytest fixtures,
# `@tool`-decorated stub params (the LLM populates them — the signature IS the
# tool schema), and TYPE_CHECKING-only imports used solely in STRING
# annotations (vulture does not resolve forward-ref strings). We:
#   - exclude generated/vendored trees (alembic + any migrations),
#   - raise min_confidence to 80 (only high-signal dead code),
#   - ignore framework decorators (routes/fixtures/tools/validators), and
#   - ignore the specific names that are dynamically/annotation-only used.
# Keeping the allow-list as in-repo pyproject config (not ad-hoc CLI flags) is
# the D-13 mandate, so the bare `vulture app/ agents/` invocation (the same one
# CI runs) is green WITHOUT touching any runtime code. Each ignore_name below is
# a verified false positive, NOT real dead code — re-audit before removing.
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["app", "agents", "tools"]
min_confidence = 80
exclude = ["alembic/versions/", "*/migrations/*"]
ignore_decorators = ["@app.*", "@router.*", "@pytest.fixture", "@tool", "@field_validator", "@validator", "@property"]
ignore_names = [
    # Pydantic dynamic config attrs.
    "model_config",
    "Config",
    # TYPE_CHECKING-only imports used solely in string ("forward ref")
    # annotations — vulture cannot see usage inside quoted type hints.
    "ModelRequest",
    "ModelResponse",
    "BaseChatModel",
    # `@tool` stub-tool parameters: the LLM fills these; the signature is the
    # tool's input schema, so the params are "unused" only to static analysis
    # (agents/planner/tools.py infer_constraints / assess_readiness).
    "stated_goal",
    "explicit_constraints",
    "implicit_constraints",
    "missing_information",
    # Capability Protocol-port method parameter (agents/capabilities/base.py):
    # interface-only signatures (no bodies — impls are Phase 7), so the params
    # are "unused" only to static analysis. The signature IS the port contract.
    "step",
    # Optional-dependency shim symbol (agents/capabilities/hooks/otel_tracing.py):
    # `from opentelemetry import trace` is paired with `trace = None` in the
    # ImportError branch so the module-level name exists either way. Nothing
    # reads it today; the symmetric shim is deliberate and self-documenting, so
    # this is an "imported to establish the name" case, not dead code.
    "trace",
    # Context-manager protocol parameter (agents/execution_engine/fanout.py
    # `_suppress_cancel.__exit__`): Python calls `__exit__(exc_type, exc, tb)`
    # positionally, so the traceback slot must exist even when unread.
    "tb",
    # Used ONLY inside a quoted forward-ref annotation
    # (app/agents/cached_invoke.py: `messages: "str | Sequence[BaseMessage]"`).
    # Same class as ModelRequest/ModelResponse above — vulture does not resolve
    # string annotations, ruff correctly sees the import as used.
    "Sequence",
]

# ---------------------------------------------------------------------------
# Bandit — Python static security scanning (SAST).
#
# Detects common security anti-patterns: hardcoded secrets, SQL injection risks,
# insecure cryptography, dangerous deserialization, etc. Runs in `app` and
# `agents` packages (kernel code path).
#
# Configuration:
#   level: MEDIUM+  ( -ll flag) — report medium-severity findings and above
#   skips: See below — known false positives on LangChain/SDK patterns
# 
# Baseline: no production secrets in app/agents/, so clean initial baseline.
# Adoption strategy: blocking gate from day one (not a warn-only step). New
# findings are triaged immediately in the offending PR rather than
# accumulating in a backlog.
# ---------------------------------------------------------------------------
[tool.bandit]
level = "medium"
exclude_dirs = ["tests", "alembic/versions", "*/__pycache__"]
skips = [
    # B602: shell=True in subprocess — false positive on LangChain provider
    # invocation (providers intentionally accept shell commands as strings from
    # the LLM, never user input directly).
    "B602",
    # B307: Use of pickle — false positive on LLM deserialization patterns
    # (Pydantic serialization, not pickle.loads() of untrusted data).
    "B307",
]

# ---------------------------------------------------------------------------
# Test sharding — NO pytest-split config here, deliberately.
#
# A `[tool.pytest_split]` table used to sit at this spot claiming it "replaces
# the manual pytest-agents-a/pytest-agents-b lists in ci.yml". It did not, and
# could not: `pytest-split` is not in requirements-prod.txt or
# requirements-dev.txt, so it is not installed in backend/.venv, and ci.yml
# still passes explicit file lists to pytest with no `--splits`/`--group`
# anywhere. The table was inert configuration for an absent plugin — pytest
# ignores unknown `[tool.*]` sections, so it never errored and never did
# anything either. Config that reads as active but is not is worse than no
# config: the next person to touch sharding trusts it.
#
# The drift it was meant to prevent (a new tests/agents/test_*.py silently
# belonging to no shard, which already happened once to two INV-3
# characterization goldens) is instead prevented by an ENFORCED check: the
# "Verify pytest shard coverage (tests/agents/)" step in ci.yml's test-debt job
# re-derives both shard lists from ci.yml itself and diffs them against the
# files on disk, failing the PR when one is missing. That is a blocking gate,
# not a comment, so removing the dead table loses no protection.
#
# Migrating to pytest-split is still a reasonable future change, but it is not a
# config-only edit: ci.yml's shards write per-shard coverage files by exact name
# (.coverage.agents-a / .coverage.agents-b) which the test-results job combines
# positionally, so a real migration has to move those too. Doing it as a
# drive-by alongside a pin cleanup would risk the coverage chain for no gain.
# ---------------------------------------------------------------------------
