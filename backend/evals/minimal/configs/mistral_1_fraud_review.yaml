# Mistral run 1 of 3 — ONE row, all 5 stages. The A-side of the provider A/B.
#
#   ./eval.sh configs/mistral_1_fraud_review.yaml --advise
#
# THE PAIR: this and configs/aws_1_fraud_review.yaml differ in exactly one
# key — `provider` — and read the SAME dataset file. Same brief, same rubric,
# same judge, same activated prompt version. So a score gap between the two
# runs is attributable to the provider and to nothing else, which is the only
# reason to spend twice on one row.
#
# Compare them when both have finished:
#   python3.11 -m evals.minimal.cli compare <MISTRAL_RUN_ID> <BEDROCK_RUN_ID>
# ...or per stage: `compare <RUN>:build <RUN>:build`. Note `compare` refuses a
# verdict below n=2 — with one row per provider it reports the delta and the
# noise band, not a verdict. Treat a single pair as a signal to investigate,
# never as proof.
#
# ORDER OF PLAY: run this side first. It is the cheaper provider, and a brief
# that breaks a stage here (an empty response, a truncated spec) would have
# broken it on Bedrock too — for free rather than for money.
#
# THIS ROW: fraud_review_queue (Banking) — see configs/aws_1_fraud_review.yaml
# for why this row was chosen.
dataset_id: prototype_mistral_1_fraud_review
dataset: aws_fraud_review_queue.json

# The default anyway (run.py's DEFAULT_PROVIDER), stated explicitly because
# this config's whole purpose is to be the named counterpart of a bedrock one.
# An unstated default reads as an oversight next to `provider: bedrock`.
provider: mistral

order: [specify, plan, analyze, build, validate]

# `seed_as` is the filename each stage's output is written to in the shared
# sandbox, so the next agent finds it where its AGENT.md says to look.
agents:
  specify:
    agent_id: prototype-specify
    seed_as: spec.md
  plan:
    agent_id: prototype-plan
    seed_as: tasks.md
  analyze:
    agent_id: prototype-analyze
    seed_as: analysis.md
  build:
    agent_id: prototype-build
    deliverable: prototype.html
  validate:
    # One global deliverable, as production does — validate edits build's file
    # in place. See configs/small.yaml for why a separate filename broke this.
    agent_id: prototype-validate
    deliverable: prototype.html
