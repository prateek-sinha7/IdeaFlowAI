# AWS run 1 of 3 — ONE row, all 5 stages, dispatched on Bedrock.
#
#   ./eval.sh configs/aws_1_fraud_review.yaml --advise
#
# THE SET: aws_1_fraud_review / aws_2_reservations / aws_3_permits are three
# separate one-row configs, not one three-row config, so each is its own run
# id and its own report row. Run them in order and read the report between —
# the point of splitting them is that run 2 is a decision you make AFTER
# seeing run 1, not a cost you commit to up front.
#
# THIS ROW: fraud_review_queue (Banking) — a review queue where rows move
# between dispositions. Chosen because status badges carry meaning here, and
# status colours are exactly where the raw-hex-outside-`:root` defect (46% of
# the 49 prototypes surveyed) and alert()-as-feedback (40%) surface. If v4's
# complete-token-set rule works, it should show here first.
#
# Provider/judge/cost rationale: see configs/ten_aws.yaml. In short — dispatch
# on Bedrock, judge stays pinned to mistral-large in rubrics/*.yaml so the
# instrument doesn't move with the thing being measured.
dataset_id: prototype_aws_1_fraud_review
dataset: aws_fraud_review_queue.json

provider: bedrock

order: [specify, plan, analyze, build, validate]

# `seed_as` is the filename each stage's output is written to in the shared
# sandbox, so the next agent finds it where its AGENT.md says to look.
agents:
  specify:
    agent_id: prototype-specify
    seed_as: spec.md
  plan:
    agent_id: prototype-plan
    seed_as: tasks.md
  analyze:
    agent_id: prototype-analyze
    seed_as: analysis.md
  build:
    agent_id: prototype-build
    deliverable: prototype.html
  validate:
    # One global deliverable, as production does — validate edits build's file
    # in place. See configs/small.yaml for why a separate filename broke this.
    agent_id: prototype-validate
    deliverable: prototype.html
