# 10 rows across 10 industries, all 5 stages. The real sweep.
#
#   ./eval.sh configs/ten.yaml --advise
#
# RUN configs/small.yaml FIRST. This config is ~10x its cost and every failure
# mode small.yaml would have caught costs ten times as much to discover here.
#
# COST: a full chain ran ~440k tokens in / 30k out at build and ~1.5M in at
# validate for a SINGLE row (the per-task build loop re-sends the growing HTML
# each turn). Ten rows is on the order of 20M input tokens. This is not a
# config to iterate with.
#
# Why 10 rows and not repeats of one: score.py's `compare` refuses a verdict
# below n=2 and `noise_band` cannot observe variance from a single sample. Ten
# DIFFERENT industries also means a prompt edit that only helps one vertical
# shows up as disagreement between rows rather than averaging away.
#
# Stage-at-a-time (`--stage X --into RUN_ID`) works here too, and is the
# cheaper way to run it: check the stage's report before paying for the next.
dataset_id: prototype_ten
dataset: ten.json

order: [specify, plan, analyze, build, validate]

# `seed_as` is the filename each stage's output is written to in the shared
# sandbox, so the next agent finds it where its AGENT.md says to look
# (prototype-build opens `spec.md` and `design.md` by name). Without this the
# downstream agent reads nothing and invents its own inputs.
agents:
  specify:
    agent_id: prototype-specify
    seed_as: spec.md
  plan:
    agent_id: prototype-plan
    seed_as: tasks.md
  analyze:
    agent_id: prototype-analyze
    seed_as: analysis.md
  build:
    agent_id: prototype-build
    deliverable: prototype.html
  validate:
    # See configs/small.yaml — the same single global deliverable production
    # uses; validate edits build's file in place.
    agent_id: prototype-validate
    deliverable: prototype.html
