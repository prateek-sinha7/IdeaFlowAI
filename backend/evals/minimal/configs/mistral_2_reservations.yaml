# Mistral run 2 of 3 — ONE row, all 5 stages. Pairs with aws_2_reservations.
#
#   ./eval.sh configs/mistral_2_reservations.yaml --advise
#
# Same dataset file as configs/aws_2_reservations.yaml; `provider` is the only
# difference between them. See configs/mistral_1_fraud_review.yaml for how to
# compare a pair and why one pair is a signal rather than a verdict.
#
# THIS ROW: restaurant_reservations (Hospitality) — the time-grid shape. Worth
# watching on this side specifically: this is the longest of the three briefs
# to render, and Mistral's 120s client default was what truncated a long
# generation into a mid-stream ReadTimeout before model_factory started
# passing LLM_CALL_TIMEOUT_SECONDS. If a stage here dies mid-response, check
# that before blaming the prompt.
dataset_id: prototype_mistral_2_reservations
dataset: aws_restaurant_reservations.json

provider: mistral

order: [specify, plan, analyze, build, validate]

# `seed_as` is the filename each stage's output is written to in the shared
# sandbox, so the next agent finds it where its AGENT.md says to look.
agents:
  specify:
    agent_id: prototype-specify
    seed_as: spec.md
  plan:
    agent_id: prototype-plan
    seed_as: tasks.md
  analyze:
    agent_id: prototype-analyze
    seed_as: analysis.md
  build:
    agent_id: prototype-build
    deliverable: prototype.html
  validate:
    # One global deliverable, as production does — validate edits build's file
    # in place. See configs/small.yaml for why a separate filename broke this.
    agent_id: prototype-validate
    deliverable: prototype.html
