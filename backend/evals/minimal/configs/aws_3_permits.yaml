# AWS run 3 of 3 — ONE row, all 5 stages, dispatched on Bedrock.
#
#   ./eval.sh configs/aws_3_permits.yaml --advise
#
# Run this AFTER reading runs 1 and 2.
#
# THIS ROW: municipal_permits (Government) — a record advancing through named
# review stages, with a detail route. Chosen because it is the row where the
# spec's enum rules have to survive all the way to the built page: the spec
# must state the condition selecting each stage, and the list, the stage
# indicator and the detail route must then agree. It is also the shape that
# most exposes the analyze-stage defects v4 targets — a risk register whose
# entries cite no finding (8 of 11 analyses) and bare category nouns (7 of 11).
#
# Provider/judge/cost rationale: see configs/ten_aws.yaml.
dataset_id: prototype_aws_3_permits
dataset: aws_municipal_permits.json

provider: bedrock

order: [specify, plan, analyze, build, validate]

# `seed_as` is the filename each stage's output is written to in the shared
# sandbox, so the next agent finds it where its AGENT.md says to look.
agents:
  specify:
    agent_id: prototype-specify
    seed_as: spec.md
  plan:
    agent_id: prototype-plan
    seed_as: tasks.md
  analyze:
    agent_id: prototype-analyze
    seed_as: analysis.md
  build:
    agent_id: prototype-build
    deliverable: prototype.html
  validate:
    # One global deliverable, as production does — validate edits build's file
    # in place. See configs/small.yaml for why a separate filename broke this.
    agent_id: prototype-validate
    deliverable: prototype.html
