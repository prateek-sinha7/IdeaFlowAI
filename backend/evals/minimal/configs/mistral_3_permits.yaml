# Mistral run 3 of 3 — ONE row, all 5 stages. Pairs with aws_3_permits.
#
#   ./eval.sh configs/mistral_3_permits.yaml --advise
#
# Same dataset file as configs/aws_3_permits.yaml; `provider` is the only
# difference between them. See configs/mistral_1_fraud_review.yaml for how to
# compare a pair.
#
# THIS ROW: municipal_permits (Government) — staged review + detail route. The
# stage most worth reading side by side here is `analyze`: it is a text-only
# agent (`tools: []`), so its score is a clean read on the model's reasoning
# with no filesystem behaviour mixed in. If the two providers diverge on
# analyze but agree on build, the difference is reasoning, not tool use.
dataset_id: prototype_mistral_3_permits
dataset: aws_municipal_permits.json

provider: mistral

order: [specify, plan, analyze, build, validate]

# `seed_as` is the filename each stage's output is written to in the shared
# sandbox, so the next agent finds it where its AGENT.md says to look.
agents:
  specify:
    agent_id: prototype-specify
    seed_as: spec.md
  plan:
    agent_id: prototype-plan
    seed_as: tasks.md
  analyze:
    agent_id: prototype-analyze
    seed_as: analysis.md
  build:
    agent_id: prototype-build
    deliverable: prototype.html
  validate:
    # One global deliverable, as production does — validate edits build's file
    # in place. See configs/small.yaml for why a separate filename broke this.
    agent_id: prototype-validate
    deliverable: prototype.html
