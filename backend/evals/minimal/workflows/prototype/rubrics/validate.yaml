# Grading config for prototype-validate — the workflow's FINAL stage and last
# quality gate. Seeded with prototype-build's prototype.html, it fixes every
# defect it finds in place, and the FIXED FILE is what is graded (run.py reads
# the deliverable back; it REPLACES the streamed one-liner).
#
# The only stage graded on a DELTA rather than an artifact: `defect_repair_delta`
# compares the pre-fix file (in the prompt block) against the post-fix file, so
# an agent that returned its input unchanged is separable from one that
# actually repaired it. Industry-agnostic: nothing here may name a vertical.
#
# Only `judge`, `scoring`, `dimensions`, `rubric` and `upstream` are read.

# Upstream artifacts handed to the judge as evidence. `prototype.html` is the
# PRE-repair build output and is what `defect_repair_delta` (35%) diffs against —
# without it that dimension asked "what did you fix?" with nothing to compare to,
# and judges priced the missing evidence as the artifact's failure. `spec.md`
# backs `page_completeness` (45%). `tasks.md`/`analysis.md` are omitted: no
# validate dimension reads them.
upstream:
  - spec.md
  - prototype.html

judge:
  provider: mistral
  model: mistral-large-latest      # identical to every other stage, so stages stay comparable


# Score from what the findings COST (judge.SEVERITY_COST), not the number the
# judge volunteers — see rubrics/specify.yaml for the runs that forced this.
scoring: severity_priced


# No anchors block, deliberately. A fixed scale gave the judge round numbers
# to snap to; severity pricing replaced it.
dimensions:
  - id: page_completeness
    weight: 45
    description: >
      Is every `<section data-page>` a real, usable page — a header,
      substantive components, tables carrying enough rows of domain-plausible
      data to demonstrate the page's purpose? A section holding nothing but a
      heading is the #1 structural defect. Flag hardest a page whose content
      does not match its own page id.

  - id: defect_repair_delta
    weight: 35
    description: >
      Compare the PRE-FIX prototype in the prompt against the POST-FIX
      prototype in the response — the same file before and after this agent
      edited it. Did it repair what was broken (empty or thin sections
      filled, dead nav links wired, sections made reachable, missing handlers
      defined) AND preserve what already worked? Returning the input
      essentially unchanged while real defects remain scores very low.
      Rewriting or deleting working content is equally a defect. If the input
      was genuinely already clean, say so and judge the preservation half
      alone.

  - id: token_and_chrome_consistency
    weight: 20
    description: >
      Is the prototype internally consistent as one artifact — colours applied
      through `var(--…)` rather than raw hex, one CSS class system across
      every page, shared chrome identical apart from the active nav state?
      INTERNAL consistency only: no design system is injected during evals, so
      keeping the seed token values is correct and must not be penalised.

rubric: |
  Grading the FINAL QUALITY GATE of a prototype pipeline. The agent was given
  a built single-file HTML prototype, told to fix every problem it found in
  place, and the FIXED FILE is what you are looking at — not its one-sentence
  summary, which is not part of the deliverable.

  The prompt block holds the prototype BEFORE this agent touched it; the
  response holds the SAME FILE AFTER. Read them as a before/after pair —
  this stage's job is an improvement, not an artifact.

  Its job stated plainly: LEAVE NO P0 DEFECTS BEHIND. A P0 is anything making
  the prototype unusable in front of a user — an empty page, navigation that
  dead-ends, a control with no handler, content contradicting its own page
  id. Any P0 surviving into the response is this agent's failure regardless of
  who introduced it, and polish elsewhere does not compensate.

  Structural and render checks run SEPARATELY and deterministically; a row
  failing them is forced to zero regardless of what you score. Judge the
  content and the repair, not the structure those checks already cover.

  Return an entry for EVERY dimension listed. A partial list is discarded in
  full.

  FINDINGS ARE THE SCORE. Per dimension, list every real defect in
  `weaknesses` as a string PREFIXED with its severity — `"blocking: ..."`,
  `"major: ..."`, `"minor: ..."`:
  - blocking — a P0 survived, or the agent regressed working content: an empty
    page, a dead nav link, a control with no handler, content contradicting
    its page id, or deleted content that worked before.
  - major — a real gap that degrades the result: a thin page left thin, a
    defect partly repaired, raw hex replacing token usage.
  - minor — nit; nobody looking at the prototype would notice.

  The tag IS the deduction. Tag honestly: never withhold a finding to protect
  a score, never inflate a nit. No real defects = empty `weaknesses` = a
  legitimate 100. Do not invent a flaw to avoid giving one.

  `score`: your own 0-100. Recorded for comparison, NOT the score of record.
  Answer it honestly, not strategically.

  `evidence`: quote specific page ids, elements or data points from THIS
  response, and for `defect_repair_delta` name at least one concrete
  difference (or state concretely that there is none). Text that would fit
  any other prototype is a non-answer.
