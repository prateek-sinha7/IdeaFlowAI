schema_version = "1.3"

# Only what we deliberately set. Everything `harbor init` scaffolds (timeouts,
# network_mode, os, empty env tables) is Harbor's own default and was identical
# in every task — 23 of 32 lines of duplication that said nothing. Deleting it
# beats sharing it: there is now one line per real decision.
#
# This is the ONLY hand-written file in the directory. instruction.md, tests/,
# environment/ and solution/ are assembled by sync_common.sh from
# common/specify/ x scenarios/warehouse-slotting/.
artifacts = ["/app/spec.md"]   # the model graders run on the host and need the text

[task]
name = "velocity/warehouse-slotting-specify"
description = "Dispatch the real prototype-specify prompt on the warehouse-slotting brief; grade the spec it produces."
