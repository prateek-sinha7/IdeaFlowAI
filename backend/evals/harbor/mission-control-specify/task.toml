schema_version = "1.3"

# The only hand-written file here; the rest is assembled by sync_common.sh
# from common/specify/ x scenarios/mission-control/.
#
# mission-control is the harder of the two scenarios by design: 7 pages against
# warehouse-slotting's 6, two dynamic routes against one, and a brief that asks
# for diagrams rather than tables. Its reference answer is the pipeline-produced
# golden at evals/minimal/golden/mission_control/, so the oracle here is a spec
# that is genuinely good — not the deliberately-minimal floor-passer that
# warehouse-slotting uses.
artifacts = ["/app/spec.md"]

[task]
name = "velocity/mission-control-specify"
description = "Dispatch the real prototype-specify prompt on the mission-control brief; grade the spec it produces."
