schema_version = "1.3"

# tasks.md is the deliverable; spec.md is the INPUT it gets graded against.
# The only hand-written file here; the rest is assembled by sync_common.sh
# from common/plan/ x scenarios/mission-control/.
artifacts = ["/app/tasks.md", "/app/spec.md"]

[task]
name = "velocity/mission-control-plan"
description = "Dispatch the real prototype-plan prompt against an upstream mission-control spec; grade the task list against that spec."
