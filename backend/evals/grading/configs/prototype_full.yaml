# FULL — every implemented stage, every row, judged. 23 model calls today.
#
# Mistral small under test, Mistral large judging. That split matters: the one
# run on record used mistral-small as BOTH, and returned exactly 95 on all 11
# rows — a judge no more capable than the thing it grades cannot separate good
# output from bad. Whether large is enough is what this run measures.
#
# Watch `distinct_score_count` in the score artifact first. If it is 1 the judge
# is dead again and every other number is meaningless, however good it looks;
# `baseline.min_distinct_scores: 3` fails the run rather than let it hide in an
# average.
#
#   ./evals/grading/grade.sh plan full      # free — prints the blast radius
#   ./evals/grading/grade.sh full           # 12 agent + 11 judge calls

run_id: full

track: model
workflow: prototype

dataset: datasets/ten-industries.json

# Every stage with `status: implemented`, in workflow order. Only
# prototype-specify is onboarded today, so this stops after stage 1 and reports
# the rest as not run — it deliberately does NOT skip ahead, because running a
# later stage against an empty upstream produces artifacts that look valid and
# mean nothing. As stages are onboarded this config covers them with no edit.
agents: all

from_run: null
rows: null                    # all 12: 11 real briefs + 1 negative test
limit: null

agent_under_test:
  provider: mistral
  model: mistral-small-latest

# Overrides the rubric's pinned judge, which is recorded as an override.
# CONSEQUENCE: because the judge differs from the rubric's pin, the baseline
# verdict comes back REFUSED rather than PASS/FAIL — this run is not comparable
# to a baseline calibrated on a different judge. You still get every score,
# per-dimension aggregate and weakness cluster; only the pass/fail is withheld.
judge:
  provider: mistral
  model: mistral-large-latest
  threshold: null             # null = the rubric's 70

options:
  # Mistral rate-limits harder than Anthropic and every row is two calls. A 429
  # mid-run costs a whole stage, and this is not latency-sensitive.
  concurrency: 2
  no_judge: false
  # One pass leaves `compare` with no variance data, so a later comparison says
  # `unknown-variance` rather than calling a delta an improvement. Set 3 when
  # you want that guard armed — it triples cost and turns a score into a
  # measurement.
  repeats: 1
