# SMALL — the debugging loop. Fast, cheap, and NOT for grading prompts.
#
# Use this while changing the harness: the rubric, the precheck, a hook, the
# judge schema, a new stage. It exercises the whole judged path — dispatch,
# precheck, judge, scoring, baseline, report — on briefs that cap their own
# length, so a full cycle costs roughly a third of a real one.
#
#   ./evals/grading/grade.sh plan small    # free preview
#   ./evals/grading/grade.sh small         # LIVE, ~4 model calls
#
# ⚠️ SCORES FROM THIS CONFIG ARE NOT COMPARABLE TO ANYTHING ELSE.
# The briefs in datasets/prototype_small.json order the agent to be brief, which is not
# what the real prompt is being asked to do. Use it to prove the machinery works
# and is stable; use `full` to judge whether a prompt got better.

run_id: small

track: model
workflow: prototype

# Two compact positive briefs that demand working interactions (filters,
# state-changing buttons, dynamic detail routes), so the judge and the code
# track both have room to differentiate. The negative-test row lives in
# ten-industries; run it there (optionally with --propagate-negative to watch
# the whole chain digest it).
dataset: datasets/prototype_small.json

agents: all
from_run: null

rows: ["warehouse_slotting"]
limit: null


# ── MODELS ────────────────────────────────────────────────────────────────
# Identical to smoke/full/partial, deliberately: debugging a harness against a
# different provider than the one you will run for real just moves the bug.
agent_under_test:
  provider: mistral
  model: mistral-small-latest

judge:
  provider: mistral
  model: mistral-large-latest
  threshold: null


options:
  # All three rows at once — the whole point is a short turnaround.
  concurrency: 3
  # Flip to true to drop the judge entirely and check only dispatch + precheck.
  no_judge: false
  # Set to 3 when you want to measure the harness's own run-to-run noise
  # cheaply, before paying for the same measurement on `full`.
  repeats: 1
