# Grading config for prototype-build — the prototype workflow's fourth stage,
# which turns the plan's task list into the single-file HTML deliverable.
#
# WHAT IS ACTUALLY GRADED: not the streamed text. This agent is tool-using
# (tools: [prototype_emit_only]); it writes prototype.html into the sandbox with
# write_file/edit_file and its reply is one confirmation sentence. dispatch.run_row
# reads the deliverable back and REPLACES the response with it, so every rule
# below applies to the CONTENT OF prototype.html.
#
# Deliberately industry-agnostic: the briefs vary by vertical and live in the
# dataset file. Nothing here may reference a specific one.

agent_id: prototype-build


# ── PRECHECK ──────────────────────────────────────────────────────────────
precheck:
  # `<!doctype html>` is not closed by inserting a slash, so precheck.closing_tag
  # cannot derive the closing form — `close_wrapper` states it explicitly.
  # Both ends are compared case-insensitively against the STRIPPED response, so
  # this also catches a prototype with prose wrapped around it.
  wrapper: "<!doctype html>"
  close_wrapper: "</html>"

  # Pages are `<section data-page="...">`. Attribute order varies
  # (`<section class="page" data-page="x">` is as common as the reverse), so the
  # tag is matched rather than a fixed byte sequence. `data-page` belongs on
  # <section> only — never on an <a> — which is why <section is anchored here.
  section_pattern: '<section\b[^>]*\bdata-page\s*='
  min_sections: 4          # a prototype worth grading has >= 4 pages, as the spec does

  # NARROWED, with evidence. The founding bug of this harness was forbidding the
  # bare substrings "placeholder" and "stub", which failed 7 of 11 CORRECT
  # outputs in run 260729-083126-ten-industries. That list is even more dangerous
  # against HTML than against a spec: `placeholder` is a real input attribute, and
  # `<input placeholder="Search invoices...">` is exactly what a good prototype
  # contains. Every pattern below is anchored so it cannot match correct HTML.
  #
  # The judgement call — filler content passed off as substance — is NOT here. It
  # lives in the DATA REALISM dimension, where it can be weighed in context.
  forbidden:
    - pattern: '(?i)lorem ipsum'
      reason: "filler text instead of real invented data; cannot occur in domain-plausible content"
    - pattern: '(?i)>\s*TBD\s*<'
      reason: "unresolved element TEXT; anchored between tags so an attribute value or a real word containing 'tbd' cannot match"
    - pattern: '(?i)>\s*coming soon\s*<'
      reason: "deferred page content rendered to the user; anchored to element text, not prose or a CSS class"
    - pattern: '(?i)placeholder (text|content|data)'
      reason: "explicit filler — narrower than bare 'placeholder', which is a legitimate HTML input attribute (placeholder=\"...\" is always followed by a quote, never a space)"
    - pattern: '(?i)>\s*(Customer|Client|User|Item|Product|Row)\s+[1-3A-C]\s*<'
      reason: "generic invented data ('Item 1') rendered as a table cell; anchored between tags so it cannot match a heading, class name, or real record"

  validate: ./prototype_build_validate.py:check


# ── JUDGE ─────────────────────────────────────────────────────────────────
# Identical to prototype-specify, deliberately: the two stages' scores are read
# side by side, and a different judge would make that comparison meaningless.
judge:
  provider: mistral
  model: mistral-large-latest      # a small judge could not separate these rows
  threshold: 70
  skip_on_precheck_failure: true


# ── RUBRIC ────────────────────────────────────────────────────────────────
# Each dimension is scored 0-100 by the judge; `weight` is applied afterwards in
# Python (total = sum(score_i * weight_i) / 100).
#
# STRUCTURE IS NOT SCORED HERE. Routes resolving to sections, the routes map,
# handler definitions, one is-active page — those are deterministic, they belong
# to the `code/` track and to precheck's validate hook (which reuses production's
# static_check), and re-scoring them with a judge would double-count a single
# defect and let a subjective opinion override a deterministic fact. Every
# dimension below is something only a reader of the rendered page can see.
dimensions:
  - id: data_realism
    weight: 40
    description: >
      Is the sample data rendered into the tables, charts and forms plausible and
      specific for THIS brief's industry — records, ids, amounts, dates and
      statuses a practitioner in that field would accept as a real export —
      rather than generic rows that would suit any vertical? Tables should carry
      real depth (several distinct records, not one repeated), and charts real
      values with labelled axes.

  - id: page_completeness
    weight: 35
    description: >
      Does EVERY page carry the content its spec promised, or are some pages a
      heading over a mostly bare shell? The precheck only proves a section is
      non-empty; this asks whether a page a user navigates to actually answers
      the job it exists for, and whether the depth is even across pages rather
      than one rich landing page and four thin ones.

  - id: visual_coherence
    weight: 25
    description: >
      Do the pages read as one designed product — consistent chrome, spacing and
      component vocabulary, colours drawn from the `:root` DS tokens (--bg, --fg,
      --accent, --surface, --border, --muted) rather than raw hex sprinkled
      through the markup — with a visual density suited to the brief's audience
      and product type?

anchors:
  95: >
    Reference quality — you hunted for a weakness and found none worth
    reporting. A user could complete every flow the brief implies; the data
    reads as a real export on every page; the dynamic routes render distinct
    records; one token system with zero drift.
  85: >
    Data a domain practitioner would accept as a real export, with depth on every
    page. Every page fully answers its purpose. One coherent visual system, DS
    tokens used throughout, chrome identical across pages.
  70: >
    Data is plausible but generic in places (round numbers, stock company names).
    Every page has real content but one is noticeably thinner. Design is
    consistent with minor drift — a stray hex colour, uneven spacing.
  50: >
    Data is recognisably invented filler. Several pages are generic admin-console
    furniture rather than answers to this brief. Styling is a default grid with
    no domain fit, or visibly different page to page.
  30: >
    Data is interchangeable with any other industry, most pages are a heading
    over a near-empty shell, and the prototype would look the same for a
    different brief.

rubric: |
  You are grading a single-file HTML PROTOTYPE — the `prototype.html` an agent
  wrote to disk, read back from the sandbox and given to you verbatim. Read it as
  the rendered page a user would see, not as source code to review. The brief
  describes a real product in a specific industry — read the seeded spec to know
  which; these dimensions apply regardless of which one it is.

  The deterministic pre-check has ALREADY verified: the document is a complete
  `<!doctype html>...</html>` with no preamble, it has at least four
  `<section data-page>` pages, no forbidden filler strings appear, every nav
  route resolves to a real section, the routes map and inline handlers are
  complete, and no page section is empty. DO NOT re-score any of that. Code
  structure and correctness are graded separately in the `code/` track — a
  comment on the router or the CSS architecture is not an answer here.

  Score each dimension SEPARATELY from 0 to 100 against the anchors, and return
  each sub-score as its own field. Do not return a single overall number — the
  weighted total is computed from your sub-scores.

  For every dimension, quote specific pages, records or data points from THIS
  document as evidence. A rationale that would read the same for a different
  prototype is not a rationale, and will be treated as a non-answer. If a
  dimension is genuinely excellent, say what specifically makes it so; if you
  find yourself giving every response the same score, you are not reading
  closely enough.

  REPORTING FINDINGS. Everything you find wrong goes in that dimension's
  `findings`, each tagged `blocking`, `major` or `minor` — the definitions are
  in the scoring-discipline block above. The tag is what decides the cost, so a
  nit is cheap and a real gap is not: report freely and tag honestly rather than
  withholding a criticism to protect a number. Score the dimension for the
  quality you actually see and let the findings do the deducting; do not
  pre-deduct for them yourself.


# ── BASELINE ──────────────────────────────────────────────────────────────
# Excluded from the rubric hash.
#
# CALIBRATED AGAINST THE GOLDEN ARTIFACTS (2026-07-30). golden/<brief>/ holds
# hand-written reference outputs that pass every precheck and score 100 on the
# code track — proof these thresholds are satisfiable, not aspiration. The
# thresholds are floors a competent run must clear, not the golden ceiling:
#
#   min_precheck_pass_rate 1.0 — the golden proves flawless structure is
#     achievable; any malformed row fails the stage.
#   min_average_score 70 — RE-DERIVED from `grade.sh calibrate` (2026-07-30)
#     under severity pricing: the worst golden brief scored 90.96, and the floor
#     sits ~20 below that observed ceiling. It lands on the same 70 the retired
#     cap scale used, which is a coincidence of arithmetic, not a carry-over —
#     the number was recomputed from a live run, not kept. Previously: the
#     golden ceiling sits in the high 80s-to-95 band.
#
# set_from pins ONLY the rubric hash and the judge: config_hash and
# dataset_hash are deliberately omitted so any dataset and any agent under
# test evaluates against this baseline. Editing the rubric (anchors,
# dimensions, precheck) changes the hash and correctly flips runs back to
# REFUSED until this block is re-pinned.
baseline:
  min_precheck_pass_rate: 1.0
  min_average_score: 70

  # The negative-test row must actually be rejected wherever the dataset
  # carries one; a dataset with no negatives skips this check.
  min_negative_correct: 1.0

  # THE DEAD-JUDGE GUARD (the constant-95 run). Sample-size gated in scoring:
  # it arms only when judged rows >= 2x this value, so a 1-2 row debug run is
  # never failed over a tie while an 11-row constant still is.
  min_distinct_scores: 3
  max_expected_stddev: null

  set_from:
    rubric_hash: "sha256:94b7f7499fff889f603f217c9ba87894afd707098908d188a9de42ff325451e9"
    judge_resolved_model_id: "mistral-large-latest"
    calibrated: "grade.sh calibrate, 2026-07-30 — golden ceiling 90.96 (worst of 6 briefs), hollow fixture 53.62, separation 37.34; severity pricing per spec 008-grading-calibration"
