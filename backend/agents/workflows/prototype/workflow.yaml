# prototype — the SC-001 parity manifest (Spec-Kit Approach 2+3).
# 4 agents: specify -> plan -> build -> validate. The build step is the only one
# that uses strategy: task_loop (per-task sub-agent build loop) with a
# heading_tasks task parser, html_static + html_render validators, and the
# html_skeleton compaction. specify/plan declare gates: [human] (their AGENT.md
# gate: Human_Gate). deliverable: single_file (prototype.html).
# planner: run — SKIP_PLANNER_FOR_PROTOTYPE=False today (agents/prototype/
# pipeline.py:63), so prototype runs the planner like every other pipeline (NOT
# planner: skip, despite §10's illustrative YAML — parity trap #1).
# context_providers: [opendesign] (OD flavor declared; injection stays behavioral
# until Phase 7). clarify.defaults verbatim from
# engine._pipeline_defaults["prototype"] (engine.py:756).
id: prototype
version: 1
# Catalog (Plan 20-01): declared launchability + wizard launch surface — inert
# metadata read by GET /api/workflows, never by the compiler/kernel (INV-3 parity).
user_launchable: true
display_name: "Interactive Prototype"
description: "Navigable, high-fidelity HTML prototype from a brief or story set."
launch_surface: "wizard"
planner: run
clarify:
  # FIX-010: od_prototype goes through the wizard (user already provided brief +
  # template + design system). Clarification is redundant and destructive —
  # the clarify engine runs 3 rounds (38s) with no answers → proceeds with just
  # the brief → spec writer has insufficient context → asks clarifying questions.
  # Use mode: skip so the spec writer gets the brief directly without wasting time.
  mode: skip
  defaults: [target_audience, scope, priority, style]
deliverable:
  strategy: single_file
  name: prototype.html
context_providers: [opendesign]
seed_files: {}
steps:
  - agent: prototype-specify
    strategy: single_shot
    gates: [human]
  - agent: prototype-plan
    strategy: single_shot
    gates: [human]
  - agent: prototype-build
    strategy: task_loop
    gates: []
    task_source:
      kind: parsed
      parser: heading_tasks
      target: tasks.md
      source_step: prototype-plan
      spec_step: prototype-specify
    validators: [html_static, html_render]
    compaction: html_skeleton
  - agent: prototype-validate
    strategy: single_shot
    gates: []
