id: prototype
version: 1
user_launchable: true
is_beta: false
display_name: "Build an interactive prototype (Fast)"
short_name: Prototype
icon: Layout
chained_from:
- id: user_stories
  beta: false
  text: Mockup these stories
- id: ppt
  beta: false
  text: Build the interactive demo
- id: ppt_v2
  beta: false
  text: Build the interactive demo
description: Navigable, high-fidelity HTML prototype from a brief or story set.
launch_surface: wizard
planner: run
clarify:
  # KAN-74: Changed from skip to auto so the prototype pipeline asks clarifying
  # questions like all other workflows. The wizard collects brief + template +
  # design system; clarification then captures target audience, scope, style,
  # user journeys, and interactions before the agents run.
  # Extended defaults from 4 to 8 to match KAN-74 intent-capture requirements.
  # ISS-056: rounds: 2 lets a second round pick up genuinely unresolved topics
  # from the 8 (skipped early if nothing is left; never forced on a skip).
  rounds: 2
  mode: auto
  defaults:
  - target_audience
  - scope
  - priority
  - style
  - user_journeys
  - key_screens
  - interactions
  - personas
deliverable:
  strategy: single_file
  name: prototype.html
  # T3-chaining-reachable: prototype.html is written to sandbox disk by the
  # build loop (native write_file/edit_file), so build_flat_payload always
  # materializes it — a genuine chainable source (Req 4 AC 4 / Req 6).
  chains_from: true
context_providers:
- opendesign
- chain_context
input_providers:
- run_images
seed_files: {}
steps:
- strategy: single_shot
  depends_on: []
  model:
    model: eu.anthropic.claude-sonnet-4-6
  agent: design-ingestor-html
  instance_id: design-ingestor-html
  name: HTML Design Ingestor
  condition: "source_type == 'html'"
  tools:
    read_files: true
    write_files: true
    exec: false
  gates: []
- strategy: single_shot
  depends_on: []
  model:
    model: eu.anthropic.claude-sonnet-4-6
  agent: design-ingestor-figma
  instance_id: design-ingestor-figma
  name: Figma Design Ingestor
  condition: "source_type == 'figma'"
  tools:
    read_files: true
    write_files: true
    exec: false
  gates: []
- agent: prototype-specify
  strategy: single_shot
  tools:
    read_files: true
    write_files: false
    exec: false
  skills: [velocity-design]
  gates: []
- agent: prototype-plan
  strategy: single_shot
  gates: []
- agent: prototype-analyze
  strategy: single_shot
  gates: []
- agent: prototype-build
  tools: {read_files: true, write_files: true}
  strategy: task_loop
  gates: []
  task_source:
    kind: parsed
    parser: heading_tasks
    target: tasks.md
    source_step: prototype-plan
    spec_step: prototype-specify
  validators:
  - html_static
  - html_render
  require_render: true
  compaction: html_skeleton
- agent: prototype-validate
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates: []
name: Prototype
