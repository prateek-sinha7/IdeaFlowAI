    `.context/design/template/assets/template.html` (else `.context/design/template/example.html`). Keep its chrome,
    layout regions, CSS and component markup; replace only its example content. Take every colour, font, spacing and
    radius from the design system (`tokens.css`, `design-system.md`); never write your own colour or font values.
    With no template, build the chrome from the design system's `components.html`. Follow `## Design` in spec.md.
    On later tasks do NOT read the whole page and do not explore it. Call `page_outline` once at the start: it gives
    the line range of every screen and script, and the line of every function and data-test. Read only the lines your
    task touches with read_file offset/limit (the region plus a few lines around it). grep the page only for a name
    the outline does not list, and never re-read a region you already read in this task unless you changed it.
    Change the page with edit_file only. Never rewrite prototype.html with write_file once it exists (the engine
    refuses it); to replace or remove a big block, pass that block as edit_file's old_string.
    Follow "UI and UX craft", the Design context, for a web tool "Goal — Working App Logic", and the
    Architecture section of spec.md (use the shared state and the shared XML writer — never emit your own XML
    document or declaration).
    Add every data-test name your task's acceptance files target.
    Build EVERYTHING your task lists before the first test run: every screen, field, rule and action, wired up. A
    failing test is acceptable; an unbuilt or half-built part is not.
    Testing is not your job; the fix step works through failures after the build. When the task is implemented,
    run `run_acceptance("<your task's ids>")` ONCE — only the ids in your task, never earlier tasks' ids, never
    "all". Then:
    - Most of your ids fail or error, or the page does not load: the base is broken (a script error, a missing
      screen, a broken parser). Fix that cause, run the same ids once more, and move on whatever the result.
    - Otherwise move on. Do not fix individual failures; the fix step handles them.
    `run_acceptance` at most TWICE in a task, never a third time — after the second run, call report_task_complete
    even if tests still fail.
    Before report_task_complete, write_file `build-notes-<task id>.md` (e.g. `build-notes-T03.md`): what you built,
    anything not finished and why, and the ids still failing with their failing step (edit_file it when it already
    exists). The fix step reads it first.
    Never write .goal/trace.json. Then call report_task_complete.
  write_paths: ["prototype.html", "build-*.md"]
  edit_only: ["prototype.html"]
  tools:
    read_files: true
    write_files: true
    exec: false
    # No playwright: the builder does not test by hand; run_acceptance (acceptance set) runs its task's ids once.
    tool_sets: [prototype_emit_only, ledger, acceptance]
  strategy: task_loop
  task_source:
    kind: parsed
    parser: json_tasks
    target: tasks.json
    source_step: custom-agent:spec
    spec_step: custom-agent:spec
  # Full render + click validation every 4th task and on the last one; the quick static check runs every task.
  fix: {max_attempts: 2, full_every: 4}
  validators:
  - html_static
  - html_render
  require_render: true
  compaction: html_skeleton
  gates: []

- agent: custom-agent
  instance_id: integrate
  name: Integration check
  depends_on: ["custom-agent:build"]
  model: {model: eu.anthropic.claude-sonnet-5-5}
  prompt: |
    # Goal — Integration Check

    The build made one task at a time. You look at the whole page once, as one product.

    ## Steps

    1. `page_outline` — learn the structure (screens, data-test names, app-script functions) without reading the
       whole file. Read only the parts you need.
    2. Architecture check against `spec.md` "Architecture": exactly one XML writer per output request type; no
       use-case code that emits its own `<?xml` declaration or root; one shared state; one output panel per
       workspace; no duplicate function names. `grep` for `<?xml` and for duplicate `function <name>(`.
    3. Walk every use case end to end once in the browser with the real sample files (`.uploads/`): load, choose,
       fill, generate. For every generated output check it is ONE well-formed document (one declaration, one root)
       and carries the ids and amounts of the sample.
    4. Fix integration faults with `edit_file` (never rewrite the page): duplicated envelopes, a use case not using
       the shared writer, state not shared, a broken step between tasks. Do not redesign; do not touch passing
       behaviour. Do not fix individual acceptance failures; the fix step works through them.
    5. `run_acceptance("all")` ONCE, last — its trace is the fix step's work list. Reply: integration faults found
       and fixed, then the runner summary line.

