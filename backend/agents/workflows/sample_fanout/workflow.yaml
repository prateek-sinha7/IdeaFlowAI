id: sample_fanout
# NOT launchable: `sample-fanout-plan` / `sample-fanout-worker` have no AGENT.md
# on disk, so a launch raises FileNotFoundError building the roster. Declared as
# DATA rather than hidden by a name list (SC-001 / ADR-0005).
user_launchable: false
is_beta: true
display_name: Fan-out task batch
short_name: Fan-out Batch
description: Split a task list across parallel workers and merge the results.
icon: Network
version: 1
planner: run
clarify:
  mode: auto
  defaults: []
deliverable:
  strategy: serialized_sandbox
context_providers: []
seed_files: {}
allowed_workers:
- sample-fanout-worker
steps:
- agent: sample-fanout-plan
  strategy: single_shot
  gates: []
  tools:
    read_files: true
    write_files: true
    exec: false
- agent: sample-fanout-worker
  strategy: fanout_batch
  gates: []
  on_conflict: human_gate
  task_source:
    kind: parsed
    parser: heading_tasks
    target: tasks.md
    source_step: sample-fanout-plan
  fanout:
    mode: parallel
    max_parallel: 3
    agent: self
    count: 3
  tools:
    read_files: true
    write_files: true
    exec: false
    spawn_subagents: true
name: Fan-out Batch
