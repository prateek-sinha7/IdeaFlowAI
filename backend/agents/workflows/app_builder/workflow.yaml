id: app_builder
version: 1
user_launchable: true
is_beta: false
short_name: App Builder
display_name: Build an end-to-end application
icon: Rocket
chained_from:
- id: prototype
  beta: true
  text: Build this from scratch
- id: ppt
  beta: true
  text: Develop the product
- id: user_stories
  beta: true
  text: Code the features
description: Full-stack code, tests, and infrastructure from a single requirement.
planner: run
clarify:
  mode: auto
  # KAN-74: extended from 4 to 8 defaults. Adds: user_journeys, data_model,
  # integrations, performance — critical for full-stack app generation quality.
  # ISS-056: rounds: 2 lets a second round surface topics beyond the ~5/round cap.
  rounds: 2
  defaults: [technology, scope, target_audience, security, user_journeys, data_model, integrations, performance]
deliverable:
  strategy: serialized_sandbox
  name: app
context_providers: []
seed_files: {}
steps:
- agent: material-analyzer
  strategy: single_shot
  gates: []
- agent: app-user-stories
  strategy: single_shot
  gates: []
- agent: app-system-design
  strategy: single_shot
  gates: []
- agent: app-security-architecture
  strategy: single_shot
  gates: []
- agent: app-ux-design
  strategy: single_shot
  gates: []
- agent: app-api-design
  strategy: single_shot
  gates: []
- agent: app-database-design
  strategy: single_shot
  gates: []
- agent: app-code-generator
  strategy: single_shot
  gates: []
- agent: app-feature-implementation
  strategy: single_shot
  gates: []
- agent: app-infra-generator
  strategy: single_shot
  gates: []
  post_step: api_prefix_audit
- agent: app-code-compliance
  strategy: single_shot
  gates: []
- agent: app-test-implementation
  strategy: single_shot
  gates: []
- agent: app-test-compliance
  strategy: single_shot
  gates: []
- agent: app-devops
  strategy: single_shot
  gates: []
- agent: app-sdlc-governance
  strategy: single_shot
  gates: []
name: App Builder
