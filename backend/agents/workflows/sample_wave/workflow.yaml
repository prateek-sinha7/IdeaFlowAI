id: sample_wave
# NOT launchable: `sample-wave-plan` / `sample-wave-worker` have no AGENT.md on
# disk, so a launch raises FileNotFoundError building the roster. Declared as
# DATA rather than hidden by a name list (SC-001 / ADR-0005).
user_launchable: false
is_beta: true
display_name: Wave-scheduled task batch
short_name: Wave Batch
description: Run dependency-ordered tasks in scheduled waves of parallel workers.
icon: Waves
version: 1
planner: run
clarify:
  mode: auto
  defaults: []
deliverable:
  strategy: serialized_sandbox
context_providers: []
seed_files: {}
allowed_workers:
- sample-wave-worker
steps:
- agent: sample-wave-plan
  strategy: single_shot
  gates: []
  tools:
    read_files: true
    write_files: true
    exec: false
- agent: sample-wave-worker
  strategy: wave_scheduler
  gates: []
  on_conflict: human_gate
  task_source:
    kind: parsed
    parser: json_tasks
    target: tasks.json
    source_step: sample-wave-plan
  fanout:
    mode: parallel
    max_parallel: 4
    agent: self
  tools:
    read_files: true
    write_files: true
    exec: false
    spawn_subagents: true
name: Wave Batch
