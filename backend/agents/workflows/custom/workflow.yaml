id: custom
version: 1
user_launchable: true
is_beta: false
display_name: Compose a custom workflow
short_name: Custom Workflow
icon: Puzzle
description: Assemble specialist agents for tasks outside the standard pipelines.
planner: run
clarify:
  mode: auto
  # KAN-74: extended from 4 to 8 defaults. Adds: output_format, constraints,
  # domain, assumptions — needed for custom workflows with diverse deliverables.
  # ISS-056: rounds: 2 lets a second round surface topics beyond the ~5/round cap.
  rounds: 2
  defaults: [target_audience, key_objectives, scope, priority, output_format, constraints, domain, assumptions]
deliverable:
  strategy: streamed_text
  name: output.md
context_providers: []
seed_files: {}
steps:
- agent: market-research-agent
  strategy: single_shot
  gates: []
- agent: swot-analyst
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: roadmap-planner
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: security-auditor
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: test-case-generator
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: performance-optimizer
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: documentation-agent
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: report-generator
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: task-list-planner
  tools: {read_files: true}
  strategy: single_shot
  gates: []
name: Custom Workflow
