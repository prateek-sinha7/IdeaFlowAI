id: sample_brownfield
# NOT launchable: `brownfield-analyze` / `brownfield-build` have no AGENT.md on
# disk, so a launch raises FileNotFoundError building the roster. This declares
# that fact as DATA rather than relying on a name list to hide the row
# (SC-001 / ADR-0005). Flip to true when the agents exist.
user_launchable: false
is_beta: true
display_name: Brownfield repository edit
short_name: Brownfield Edit
description: Clone a repository, apply a targeted edit, and produce a diff.
icon: GitPullRequest
version: 1
planner: run
clarify:
  mode: auto
  defaults: []
deliverable:
  strategy: repo_diff
  name: repo_diff
context_providers: [repo]
seed_files: {}
steps:
- agent: brownfield-analyze
  strategy: single_shot
  gates: []
  tools:
    read_files: true
    write_files: false
    exec: false
- agent: brownfield-build
  strategy: single_shot
  gates: []
  tools:
    read_files: true
    write_files: true
    exec: false
name: Brownfield Edit
