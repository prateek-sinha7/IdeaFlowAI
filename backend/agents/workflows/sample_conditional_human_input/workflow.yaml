# sample_conditional_human_input — hello-world for spec 014's HUMAN-GATE-AS-
# CONDITION-SOURCE case (A4).
#
# Steps (4 total):
#
#   1. greet (writes draft.txt) -> 2. review (gates:[human], PAUSES for user input)
#        ^                              -> 3. revise-check (gates:[conditional], produces:[route_decision],
#        |                                                  condition_agent: review)
#        |____________ outcome: revise __________|          |___ outcome: continue ___> 4. done (reads draft.txt, terminal)
#
# `review` (step 2) is an ordinary HUMAN gate; `revise-check` (step 3) does NOT judge its own
# output — route.condition_agent points at `review`, reading the human's captured response (R-05).
# route.outcomes on step 3: continue -> {step, done} | revise -> {step, greet} (loop, same as A1)
# loop_max_iterations: 3

id: sample_conditional_human_input
user_launchable: true
is_beta: true
display_name: Conditional Gate — condition from a human gate
short_name: Human Input Loop (Hello World)
icon: GitBranch
description: Smallest example of a conditional gate reading an earlier HUMAN gate's response.
version: 1
planner: skip
clarify:
  mode: skip
  defaults: []
deliverable:
  strategy: serialized_sandbox
context_providers: []
seed_files: {}
capabilities:
  internet: false
limits:
  wall_clock_seconds: 300

steps:
- agent: custom-agent
  instance_id: greet
  name: Greet
  prompt: Call write_file with path "draft.txt" and content "hi". Do not ask clarifying questions. Do not explain your reasoning. Do not use any other filename or content. Call write_file now with exactly this path and content, then stop.
  gates: []
  tools:
    read_files: true
    write_files: true
    exec: false

- agent: custom-agent
  instance_id: review
  name: Human Review
  produces: ["route_decision"]   # R-27 — revise-check's condition_agent reads THIS
  prompt: Call read_file with path "draft.txt", then present its content to the user and ask if it needs revising. Do not call write_file — you never need to write anything here.
  gates:
  - human           # ordinary existing gate — the run pauses here for input
  tools:
    read_files: true
    write_files: false
    exec: false

- agent: custom-agent
  instance_id: revise-check
  name: Revise Check
  produces: ["route_decision"]
  prompt: |
    Do not call any tools. You do not need to write anything. Based on the human reviewer's response above, respond with exactly one line:
    {"decision": "continue"} or {"decision": "revise"}
  gates:
  - conditional
  route:
    condition_agent: review     # NOT this step's own output — the human gate's
    outcomes:
      continue: {trigger: step, target: done}
      revise:   {trigger: step, target: greet}   # loop — same mechanism as A1
    loop_max_iterations: 3
  tools:
    read_files: false
    write_files: false
    exec: false

- agent: custom-agent
  instance_id: done
  name: Done
  prompt: Call read_file with path "draft.txt" to confirm it exists. Do not call write_file — you never need to write anything here.
  gates: []
  tools:
    read_files: true
    write_files: false
    exec: false

name: Human Input Loop (Hello World)
