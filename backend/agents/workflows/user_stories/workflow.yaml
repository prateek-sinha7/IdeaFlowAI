id: user_stories
version: 1
user_launchable: true
is_beta: false
display_name: Generate product requirements
short_name: User Stories
icon: FileText
description: Epics, user stories, and Gherkin acceptance criteria — ready for Jira.
chained_from:
- id: prototype
  beta: false
  text: Document the features
- id: ppt
  beta: false
  text: Define what to build
planner: run
clarify:
  mode: auto
  # KAN-74: extended from 4 to 8 defaults to capture full user intent for
  # short/vague prompts. The 4 original items covered basic context; the 4
  # new items cover the user-story-specific dimensions (personas/roles,
  # user journeys, business rules, compliance/integrations) that are
  # consistently missing from short prompts and materially affect epic/story
  # quality. ClarifyEngine caps at ~5 questions per round; rounds: 2 below lets
  # a second round pick up genuinely unresolved topics from the 8 (skipped
  # early if nothing is left, and never forced on a user who skips round 1).
  rounds: 2
  defaults: [target_audience, scope, priority, technology, personas, user_journeys, business_rules, compliance_security]
deliverable:
  strategy: streamed_text
  name: user_stories.md
context_providers: []
seed_files: {}
# ─────────────────────────────────────────────────────────────────────────────
# A/B EXPERIMENT — reproducing the R-22 filesystem-grant defect.
#
# These six agents all declare ``tools: []`` in their AGENT.md: they are prompted
# to RETURN text, not to write files. Under spec 012's R-22 universal grant they
# were handed read+write anyway, and story-estimator began writing its backlog to
# the sandbox instead of returning it — where ``deliverable: streamed_text`` could
# not see it.
#
# The permission system now takes its answer from THIS file. Currently set to
# FIX.
#
#   REPRODUCE   add ``write_files: true`` to the ``tools:`` lines below
#   FIX         ``read_files: true`` only — the state below
#
# Reproduction is NON-DETERMINISTIC: nothing forces an agent to use a tool it
# holds. Run 7c1e5028 had these rights and wrote only one orphaned file while
# still delivering correctly; a teammate's run wrote ten and lost the deliverable.
# The signal to look for is whether ANY file appears in the run sandbox from these
# agents' windows — that proves the mechanism regardless of whether the
# deliverable survived that particular run.
# ─────────────────────────────────────────────────────────────────────────────
steps:
- agent: domain-analyst
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: epic-architect
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: story-estimator
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: nfr-specialist
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: backlog-reviewer
  tools: {read_files: true}
  strategy: single_shot
  gates: []
- agent: backlog-compiler
  tools: {read_files: true}
  strategy: single_shot
  gates: []
name: User Stories
