id: user_stories
version: 1
user_launchable: true
is_beta: false
display_name: Generate product requirements
short_name: User Stories
icon: FileText
description: Epics, user stories, and Gherkin acceptance criteria — ready for Jira.
chained_from:
- id: prototype
  beta: false
  text: Document the features
- id: ppt
  beta: false
  text: Define what to build
planner: run
clarify:
  mode: auto
  # KAN-74: extended from 4 to 8 defaults to capture full user intent for
  # short/vague prompts. The 4 original items covered basic context; the 4
  # new items cover the user-story-specific dimensions (personas/roles,
  # user journeys, business rules, compliance/integrations) that are
  # consistently missing from short prompts and materially affect epic/story
  # quality. ClarifyEngine caps at ~5 questions per round; rounds: 2 below lets
  # a second round pick up genuinely unresolved topics from the 8 (skipped
  # early if nothing is left, and never forced on a user who skips round 1).
  rounds: 2
  defaults: [target_audience, scope, priority, technology, personas, user_journeys, business_rules, compliance_security]
deliverable:
  strategy: streamed_text
  name: user_stories.md
context_providers: []
seed_files: {}
steps:
- agent: domain-analyst
  strategy: single_shot
  gates: []
- agent: epic-architect
  strategy: single_shot
  gates: []
- agent: story-estimator
  strategy: single_shot
  gates: []
- agent: nfr-specialist
  strategy: single_shot
  gates: []
- agent: backlog-reviewer
  strategy: single_shot
  gates: []
- agent: backlog-compiler
  strategy: single_shot
  gates: []
name: User Stories
