# sample_conditional_previous_step — hello-world for spec 014's LOOP case (A1).
# NOT YET EXECUTABLE — see specs/014-conditional-gates/spec.md (gates: [conditional]
# and route: do not exist in the compiler yet). Reference fixture only.
#
# Steps (3 total):
#
#   1. greet (writes hello.txt) -> 2. check (gates:[conditional], produces:[route_decision])
#        ^                              |          |
#        |___________ outcome: retry ___|          |___ outcome: ok ___> 3. done (reads hello.txt, terminal)
#
# route.outcomes on step 2 ("check"): ok -> {step, done} | retry -> {step, greet} (loop)
# loop_max_iterations: 3 — fails closed after 3 total passes through the loop.
#
# deliverable: serialized_sandbox (whole-sandbox read) — deliberately NOT
# single_file, to sidestep GAP-01 (single_file's readback only trusts the
# LAST compiled step; see spec.md §6c).

id: sample_conditional_previous_step
user_launchable: true
is_beta: true
display_name: Conditional Gate — loop to previous step
short_name: Loop (Hello World)
icon: GitBranch
description: Smallest possible example of a conditional gate looping back to an earlier step.
version: 1
planner: skip
clarify:
  mode: skip
  defaults: []
deliverable:
  strategy: serialized_sandbox
context_providers: []
seed_files: {}
capabilities:
  internet: false
limits:
  wall_clock_seconds: 300

steps:
- agent: custom-agent
  instance_id: greet
  name: Greet
  prompt: Call write_file with path "hello.txt" and content "hello". Do not ask clarifying questions. Do not explain your reasoning. Do not use any other filename or content. Call write_file now with exactly this path and content, then stop.
  gates: []
  tools:
    read_files: true
    write_files: true
    exec: false

- agent: custom-agent
  instance_id: check
  name: Check
  produces: ["route_decision"]      # R-05b — dedicated typed decision, not free text
  prompt: |
    Call read_file with path "hello.txt". Do not call write_file — you never need to write anything here. If the file's content is "hello", respond {"decision": "ok"}; otherwise respond {"decision": "retry"}.
  gates:
  - conditional
  route:
    outcomes:
      ok:    {trigger: step, target: done}
      retry: {trigger: step, target: greet}   # loop back — R-06/R-07/R-08
    loop_max_iterations: 3
  tools:
    read_files: true
    write_files: false
    exec: false

- agent: custom-agent
  instance_id: done
  name: Done
  prompt: Call read_file with path "hello.txt" to confirm it exists. Do not call write_file — you never need to write anything here.
  gates: []
  tools:
    read_files: true
    write_files: false
    exec: false

name: Loop (Hello World)
