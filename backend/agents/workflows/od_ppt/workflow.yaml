# od_ppt — OpenDesign-flavored PPT pipeline (same 3 agents as ppt, own runner).
# REAL registry key (D-04) — own manifest. OpenDesign flavor declared via
# context_providers: [opendesign] (actual injection stays behavioral until Phase 7).
# clarify.defaults verbatim from engine._pipeline_defaults["od_ppt"] (engine.py:753).
id: od_ppt
version: 1
planner: run
clarify:
  mode: auto
  defaults: [target_audience, tone_and_style, key_objectives, slide_count]
deliverable:
  strategy: ppt
  name: presentation.pptx
context_providers: [opendesign]
seed_files: {}
steps:
  - agent: od-ppt-brief-analyst
    strategy: single_shot
    gates: []
  - agent: od-ppt-composer
    strategy: single_shot
    gates: []
  - agent: od-ppt-validator
    strategy: single_shot
    gates: []
