# goal_revision — revise a finished goal run. One pipeline that sizes the change itself.
#
# Runs in the finished run's folder (revision_context: workspace) and keeps every requirement passing:
#
#   size [conditional] --+--> small: change -------------------------------------------+
#                        |                                                              |
#                        +--> full: analyst [human] -> tests -> plan -> build (task loop)
#                                                                                       |
#                                          fix <--> verify [conditional] -> report  <--+
#                                          (retry while a failing id is not stuck, max 10)
#
# The branch not taken is skipped. Generated from goal/workflow.yaml: the shared prompt blocks and the
# Fix / Verify / Report steps are copied verbatim, so a change to goal's rules must be copied here too.
id: goal_revision
user_launchable: false
is_beta: true
name: Goal Revision
display_name: Revise goal deliverable
short_name: Goal Revision
icon: Target
description: Change a finished Goal run. A small change is made directly; a larger one gets a spec you review,
  tests first and a task-by-task build. Every requirement stays tested.
version: 1
planner: skip
clarify:
  mode: skip
  defaults: []
deliverable:
  strategy: single_file
  name: prototype.html
  revises_existing: true
  revision_context: workspace
context_providers:
- previous_run
- uploaded_files
seed_files:
  # The revision runs in the finished goal run's folder: never rewrite its spec.md, design.md or tasks.json.
  from_run: ["", "", ""]
limits:
  wall_clock_seconds: 10800
resilience:
  retry_window_seconds: 900
  stall_seconds: 600
  max_same_error: 3
  pause_after_seconds: 14400
  credential_probe_seconds: 300
steps:
- agent: custom-agent
  instance_id: size
  name: Size the change
  depends_on: []
  model: {model: eu.anthropic.claude-sonnet-4-6}
  produces: ["route_decision"]
  prompt: |
    # Goal — Revision

    A finished goal run is being revised in place, in its own folder: `prototype.html`, the ledger
    (`.goal/ledger.json`), the acceptance tests (`.goal/acceptance/*.json`), the trace (`.goal/trace.json`),
    `spec.md`, `tasks.json`, `.goal/report.md` and `.goal/blocked.json` are the finished run's, and you change
    them in place. The person's request is in your task message under `=== REVISION INSTRUCTION ===`; it is all
    you are given. If it mentions an attached file: `ls .uploads/`, then read the file beside it.

    - read_file `.context/run-id.txt`: that is <run_id>, this revision's id. This revision's own records live
      under `revisions/<run_id>/`; never read or write any other folder under `revisions/` — those belong to
      earlier revisions.
    - Every requirement that passes now must still pass after the revision. A change to what a requirement
      says changes its ledger row AND its acceptance test, never only one of them.
    - New requirement ids: follow the ledger's own id pattern when the request names an id; otherwise `REV-NN`,
      the next free number (grep the ledger).
    - `.goal/blocked.json` lists ids an earlier run could not fix, each with `how_to_fix`. When the request
      asks to resolve one, apply its `how_to_fix`; when your change makes a blocked id pass, remove its item.
    - Never write `.goal/trace.json` or `.goal/fail-history.json`; only `run_acceptance` writes them.

    # Your task

    You are the Size step. You change no file except your own note. Decide how big this revision is, so the
    run takes the right path: a small change goes straight to one Change step; a full change gets a spec the
    person reviews, tests first, a plan and a task-by-task build.
    1. Read the request. grep `.goal/ledger.json`, `spec.md` and `.goal/acceptance/` for its words and ids; call
       `page_outline` for prototype.html. Never read a whole large file.
    2. Decide:
       - small: a fix or a change to what already exists, in one to three places — a label, a rule, a field, a
         validation, a layout detail, a broken behaviour, resolving an item of `.goal/blocked.json`; at most a
         few requirements change and no new screen, use case or flow.
       - full: anything else — a new screen, use case, flow or capability; a change across many use cases;
         more than a few new or changed requirements; or anything you cannot place with confidence.
    3. write_file `revisions/<run_id>/size.md`: the decision, then one line per reason (what the request touches
       and where).
    Your final reply is exactly one line, no markdown: `{"decision": "small"}` or `{"decision": "full"}`.
  write_paths: ["revisions/*", "size-*.md"]
  tools:
    read_files: true
    write_files: true
    exec: false
    tool_sets: [ledger, acceptance]
  gates:
  - conditional
  route:
    default_next: analyst
    outcomes:
      small: {trigger: step, target: change}
      full: {trigger: step, target: analyst}

- agent: custom-agent
  instance_id: analyst
  name: Revision Analyst
  depends_on: ["custom-agent:size"]
  model: {model: eu.anthropic.claude-sonnet-4-6}
  prompt: |
    # Goal — Revision

    A finished goal run is being revised in place, in its own folder: `prototype.html`, the ledger
    (`.goal/ledger.json`), the acceptance tests (`.goal/acceptance/*.json`), the trace (`.goal/trace.json`),
    `spec.md`, `tasks.json`, `.goal/report.md` and `.goal/blocked.json` are the finished run's, and you change
    them in place. The person's request is in your task message under `=== REVISION INSTRUCTION ===`; it is all
    you are given. If it mentions an attached file: `ls .uploads/`, then read the file beside it.

    - read_file `.context/run-id.txt`: that is <run_id>, this revision's id. This revision's own records live
      under `revisions/<run_id>/`; never read or write any other folder under `revisions/` — those belong to
      earlier revisions.
    - Every requirement that passes now must still pass after the revision. A change to what a requirement
      says changes its ledger row AND its acceptance test, never only one of them.
    - New requirement ids: follow the ledger's own id pattern when the request names an id; otherwise `REV-NN`,
      the next free number (grep the ledger).
    - `.goal/blocked.json` lists ids an earlier run could not fix, each with `how_to_fix`. When the request
      asks to resolve one, apply its `how_to_fix`; when your change makes a blocked id pass, remove its item.
    - Never write `.goal/trace.json` or `.goal/fail-history.json`; only `run_acceptance` writes them.

    # Your task

    You are the Revision Analyst. You change no existing file. You find what the request touches and write a
    SPEC of the change; a person reviews it before anything changes, then the next steps do exactly what it says.

    YOUR REPLY IS THE SPEC. A message that calls a tool holds the tool call and nothing else. Your last message
    calls no tool: it is the spec, exactly as you wrote it to its file, from its `Spec:` line, and nothing else.

    1. Read the request to its end. If your task message also carries `=== ADDITIONAL INSTRUCTIONS (REVISE) ===`,
       the person read your earlier spec (under `=== PRIOR ARTIFACT UNDER REVISION ===`) and asked for changes:
       revise it as they ask and keep everything else.
    2. Find: grep `.goal/ledger.json`, `spec.md` and `.goal/acceptance/` for the request's words and ids; call
       `page_outline` for prototype.html and read only the regions you need. Never read a whole large file.
    3. write_file `revisions/<run_id>/revision-spec.md` (a revised spec: `revision-spec-<k>.md`, k = 2, 3, … the
       next free number — write_file cannot overwrite). Exactly this shape, in this order:
       `Spec: revisions/<run_id>/revision-spec.md` — the path you wrote
       `## Request` — the ask, restated in two to five sentences
       `## Findings` — what is there now and where, one `- <file>:<line or id>` line each
       `## Ledger changes` — per row: `- <id> (new | changed | removed): <requirement text>`, its use case and
         whether it is testable; `None` when no requirement changes
       `## Test changes` — per acceptance file: `- .goal/acceptance/<id>.json (new | changed): <what the test
         loads, does and expects>`; every new or changed testable row has one; `None` when none
       `## Page changes` — per screen or region of prototype.html: what is added or changed, the data-test
         names the tests target, the shared state and functions involved
       `## Out of scope` — what this revision will not do, with why; `None` when there is nothing
       `## Open questions` — what you could not decide; `None` when there is nothing
    4. Reply with the spec, verbatim.
  write_paths: ["revisions/*", "analyst-*.md"]
  tools:
    read_files: true
    write_files: true
    exec: false
    tool_sets: [ledger, acceptance]
  gates:
  - human
  reply: last_message

- agent: custom-agent
  instance_id: tests
  name: Revision tests
  depends_on: ["custom-agent:analyst"]
  model: {model: eu.anthropic.claude-sonnet-4-6}
  prompt: |
    # Goal — Revision

    A finished goal run is being revised in place, in its own folder: `prototype.html`, the ledger
    (`.goal/ledger.json`), the acceptance tests (`.goal/acceptance/*.json`), the trace (`.goal/trace.json`),
