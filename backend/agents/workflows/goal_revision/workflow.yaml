    1. write_file `revisions/<run_id>/tasks.json`: `{"tasks": [...]}`.
    2. Your last message is that same JSON in one ```json fenced block, and nothing else.
  write_paths: ["revisions/*", "plan-*.md"]
  tools:
    read_files: true
    write_files: true
    exec: false
    tool_sets: [ledger]
  gates: []

