id: mulesoft_to_springboot
version: 1
user_launchable: true
is_beta: true
display_name: MuleSoft to Spring Boot
short_name: MuleSoft to Spring Boot
description: Modernise a MuleSoft integration estate to Spring Boot on AWS.
icon: GitBranch
planner: run
clarify:
  mode: auto
  # KAN-74: extended from 4 to 8 defaults. Adds: integration_patterns,
  # target_infrastructure, data_migration, compliance_security — all critical
  # for a safe, complete MuleSoft → Spring Boot migration.
  # ISS-056: rounds: 2 lets a second round surface topics beyond the ~5/round cap.
  rounds: 2
  defaults: [scope, technology, timeline, priority, integration_patterns, target_infrastructure, data_migration, compliance_security]
deliverable:
  strategy: serialized_sandbox
  name: springboot-app
context_providers: []
seed_files: {}
steps:
- agent: mulesoft-inventory
  strategy: single_shot
  gates: []
- agent: mulesoft-user-stories
  strategy: single_shot
  gates: []
- agent: mulesoft-decomposition
  strategy: single_shot
  gates: []
- agent: mulesoft-security-architecture
  strategy: single_shot
  gates: []
- agent: mulesoft-springboot-scaffold
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates: []
- agent: mulesoft-feature-coding
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates: []
- agent: mulesoft-dataweave-translator
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates: []
- agent: mulesoft-aws-infra
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates: []
- agent: mulesoft-code-compliance
  strategy: single_shot
  gates: []
- agent: mulesoft-test-implementation
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates: []
- agent: mulesoft-test-compliance
  strategy: single_shot
  gates: []
- agent: mulesoft-validation
  strategy: single_shot
  gates: []
- agent: mulesoft-sdlc-governance
  strategy: single_shot
  gates: []
name: MuleSoft to Spring Boot
