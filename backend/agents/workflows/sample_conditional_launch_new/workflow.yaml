# sample_conditional_launch_new — hello-world for spec 014's CROSS-WORKFLOW TRIGGER
# case (A3). NOT YET EXECUTABLE — see specs/014-conditional-gates/spec.md.
# Reference fixture only; also needs `sample_conditional_target` (its own sibling
# workflow, see that file) to exist as a real, separately-launchable workflow for
# `target:` to resolve against.
#
# Steps in THIS run (2 total):
#
#   1. greet (responds "hi", no tools) -> 2. decide (gates:[conditional], produces:[route_decision])
#                                        |___ outcome: divert (trigger: workflow) ___> STOPS this run
#                                                                                       (status: diverted)
#                                                                                            |
#                                                                                            v
#                                                              NEW WorkflowRun: sample_conditional_target
#                                                              (parent_run_id = this run's id; see that
#                                                               file for its own steps)
#
# route.outcomes on step 2 ("decide"): divert -> {trigger: workflow, target: sample_conditional_target}
#
# Per R-13 (Option 2, the ONLY mode v1 supports): this run does NOT continue
# after the trigger fires. There is no default_next, no wait. The two runs
# show up as two linked cards in run history (R-20), not a merged timeline.

id: sample_conditional_launch_new
user_launchable: true
is_beta: true
display_name: Conditional Gate — trigger a different workflow
short_name: Launch New Workflow (Hello World)
icon: GitBranch
description: Smallest possible example of a conditional gate diverting to a separate workflow.
version: 1
planner: skip
clarify:
  mode: skip
  defaults: []
deliverable:
  strategy: serialized_sandbox
context_providers: []
seed_files: {}
capabilities:
  internet: false
limits:
  wall_clock_seconds: 300

steps:
- agent: custom-agent
  instance_id: greet
  name: Greet
  prompt: 'Respond with exactly: "hi"'
  gates: []
  tools:
    read_files: false
    write_files: false
    exec: false

- agent: custom-agent
  instance_id: decide
  name: Decide
  produces: ["route_decision"]
  prompt: |
    Respond with exactly:
    {"decision": "divert"}
  gates:
  - conditional
  route:
    outcomes:
      divert:
        trigger: workflow
        target: sample_conditional_target   # a DIFFERENT saved workflow
    # No default_next — R-13: a workflow-trigger outcome always stops this
    # run; there is no "continue in this run" fallback once it fires.
    trigger_max_depth: 5
  tools:
    read_files: false
    write_files: false
    exec: false

name: Launch New Workflow (Hello World)
