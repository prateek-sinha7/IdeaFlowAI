# No step declares `skills:` — deliberately. The `html-ppt` skill was attached to
# brief-analyst and composer, but its content already arrives through the TEMPLATE
# pipe: `context_providers: [opendesign]` + the agents' `injects:` deliver the very
# same file (skills/opendesign/design-templates/html-ppt/SKILL.md and
# backend/skills/global/html-ppt/SKILL.md are byte-identical), AND the engine seeds
# the template's `references/*.md` into the run sandbox at the paths that file names.
#
# Attaching it as a skill ALSO staged it at /skills/html-ppt/SKILL.md, and an agent
# reading that copy resolved its sibling references skill-relative —
# /skills/html-ppt/references/themes.md — which nothing seeds. Every such read failed
# while the real file sat at /references/themes.md. One source, two mount points, and
# the instructions only resolve from one of them.
#
# Safe because `load_ppt_od_context` has no blank-canvas branch (unlike prototype):
# a ppt run without a valid template raises LookupError, so the template is ALWAYS
# present and the skill can never be the sole source.
id: ppt
version: 1
user_launchable: true
is_beta: false
name: PPT
display_name: Pitch an idea
short_name: PPT
icon: Presentation
description: Executive-grade deck with charts, data, and a clear narrative.
launch_surface: wizard
chained_from:
- id: prototype
  beta: false
  text: Sell this design
- id: user_stories
  beta: false
  text: Pitch the requirements
planner: run
clarify:
  mode: auto
  # KAN-74: extended from 4 to 8 defaults to capture full intent for short prompts.
  # Covers: presentation structure, content depth, data availability, visual style.
  # ISS-056: rounds: 2 lets a second round surface topics beyond the ~5/round cap.
  rounds: 2
  defaults: [target_audience, tone_and_style, key_objectives, slide_count, content_depth, data_availability, visual_style, key_sections]
deliverable:
  strategy: ppt
  name: presentation.pptx
context_providers:
- opendesign
seed_files: {}
# ppt-validator declares no `injects:` either — deliberate: giving a structural
# validator the authoring guide is context it cannot act on. It receives the
# composed deck from the previous step, which is what it checks.
steps:
- agent: ppt-brief-analyst
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates: []
- agent: ppt-composer
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates: []
- agent: ppt-validator
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates: []