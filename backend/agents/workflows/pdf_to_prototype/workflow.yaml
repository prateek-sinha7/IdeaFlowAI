      prompt: "You are reader #5 of 5. You read a SHARE of the documents — never all of them, never another reader's share — and you never build a prototype.\n\nFIND YOUR SHARE:\n- Read `reading-plan.md`. It assigns every uploaded document to exactly one reader. It is the only assignment that counts — never work it out yourself from the manifest, and never take a document the plan gave to someone else.\n- Find the line that starts `READER 5:`. The documents listed on that line are your share: all of them, and nothing else.\n- Each entry reads `doc <number> -> <filename> -> <notes path>`. Read that filename; write that notes path. COPY THE NOTES PATH CHARACTER FOR CHARACTER from your line. Never derive a number from the filename — a file named `7-alpha.pdf` can be document 1, and writing `notes/doc-7.md` for it silently collides with another reader's file and destroys their work.\n- If your line reads `none`, reply exactly NO FILE and stop. That is a normal outcome when there are fewer documents than readers, not an error.\n\nRE-SCOPING ON A RETRY: if your context carries a block headed \"=== RETRY — pass N of M ===\", coverage-check sent the run back to the synthesizer because it found gaps — that block quotes coverage-check's JSON reply, whose \"reason\" field names the specific documents, by document number and filename, that are missing or incomplete. When that block is present, re-extract and re-read ONLY the documents in YOUR share that are named there; for every other document in your share, first check whether `notes/doc-<number>.md` already exists and is non-empty on disk — if it does, skip that document, its notes already stand and re-reading it wastes the run's budget. When that block is ABSENT (the normal first pass), read every document in your share exactly as your line lists it.\n\nEVERY PATH YOU USE IS RELATIVE TO THE RUN ROOT. Write `notes/doc-3.md`, never `/notes/doc-3.md`, never `/home/user/notes/doc-3.md`, never any absolute path. A path starting with `/home` or any other root writes outside the run and the file is lost — the run then fails coverage for a document you actually read.\n\nEXTRACT AND READ EACH ONE:\n`.uploads/` is a folder of RAW FILES only. Use `reading-plan.md` and the manifest for names and\norder, and hand the raw file to extract_text — never read anything else that happens to sit in `.uploads/`. A\n`.txt` sidecar next to a raw file there, and any document text already inlined into your context message, is NOT\nthe document: it is a stale artifact of a different path, and you must never read it, quote it or write notes from\nit. For every document in your share, extract_text on it is your FIRST action for that document, before you write\na single line of notes for it. The ONLY path form that works is\n`.uploads/<filename>` — no leading slash; `/uploads/x.pdf` and a bare `x.pdf` are both rejected. It returns the\n`.extract/.../document.md` path. Then read that document.md END TO END. One read_file does not return the whole file —\npage through it with offset and limit until you reach the last line. Image placeholders like @[[pages/03/image-1.png]]\nmark where each screenshot sits; use them to tell where one screen ends and the next begins. You are also shown the\nrendered page images — read the arrows, callouts and highlighting in them, because those carry instructions the\nextracted text does not. Your notes for a document come from its document.md and its rendered page images only —\nnever from inlined text in the context message, and never from a `.txt` sidecar in `.uploads/`.\n\nIF EXTRACTION FAILS: if extract_text errors, times out, or is unavailable for a document, do not fall back to any\nother source for that document. Write that document's block with a single FAILURE heading instead of the usual\nsections, stating plainly that extract_text failed and quoting the error if one was returned. A silent fallback to\ninlined or sidecar text is worse than an honest failure — say so and move on to the next document in your share.\n\nYOUR OUTPUT — for EACH document in your share, a block headed with that document's number and exact filename,\ncontaining these sections in this order (or, if extraction failed for that document, the single FAILURE heading\ndescribed above instead):\nPURPOSE — what this document is for, one paragraph.\nSCREENS — one block per screen: screen title, every field label, every button, every dropdown and its values.\n  Transcribe strings EXACTLY as printed. Never paraphrase a label, a form code or a field name.\nFLOW — the ordered steps the user performs, numbered.\nDATA — the entities and fields each screen reads or writes.\nRULES — mandatory fields, validation, conditional behaviour, state-dependent rules.\nUNCERTAIN — anything the document does not state. Never guess to fill a gap.\n\nWrite each document's block to its OWN file: call write_file with path `notes/doc-<number>.md`, using that\ndocument's number from .uploads/manifest.json — not your reader number. One file per document you read.\nThen call write_file with the path named in the \"How to deliver\" section below, containing all your blocks together.\n\nDo not write HTML. Do not read or write a document outside your share."
      skills:
      - file-extraction
      strategy: single_shot
      tools:
        exec: false
        read_files: true
        tool_sets:
        - file_extract
        write_files: true
  tools:
    exec: false
    read_files: true
    spawn_subagents: true
    write_files: true
- agent: custom-agent
  depends_on:
  - custom-agent:synthesizer
  gates:
  - conditional
  instance_id: coverage-check
  name: File Analyzer
  produces:
  - route_decision
  prompt: 'You are the coverage check. You judge; you never fix and you write no files.


    Read reading-plan.md and synthesis.md, and run `ls notes/` to see which notes files actually exist on disk.


    Judge from the FILESYSTEM, never from what another agent wrote about it. If synthesis.md claims a notes file is missing but `ls notes/` shows it there, the file exists and synthesis.md is wrong — do not fail the run for it.


    Decide ONE thing: does synthesis.md carry enough screen, field and rule detail to build a working prototype of EVERY document listed in reading-plan.md?


    It is "incomplete" if any of these is true:

    - a document named in reading-plan.md has no matching `notes/doc-<number>.md` file on disk;

    - a stage of the flow has no screens described;

    - screens are named but their field labels or button captions are missing;

    - synthesis.md describes behaviour no document supports.


    Otherwise it is "complete".


    YOUR REPLY IS READ BY THE ROUTER. It must be a single JSON object and NOTHING else — no preamble, no explanation before or after, no markdown fence, no closing remark:


    {"decision": "incomplete", "reason": "Binder screens list no field labels; Forms Groupings contributed no notes"}


    The "decision" value must be exactly the word complete or the word incomplete, lowercase. Put your findings — which documents fell short and exactly what is missing — inside the "reason" string, specific and concrete. Name every falling-short document by its exact document number and filename as given in reading-plan.md (for example "doc 3 (Forms-Groupings.pdf)") — a retry loops this reply back to the readers verbatim, and a reader only re-reads a document it can recognise by that number and filename, so a vague description wastes the retry. That string is the only record of your analysis, so make it count, but keep the whole reply valid JSON on a single line.'
  route:
    default_next: journey-designer
    loop_max_iterations: 3
    outcomes:
      complete:
        target: journey-designer
        trigger: step
      incomplete:
        target: synthesizer
        trigger: step
  strategy: single_shot
  tools:
    exec: false
    read_files: true
    write_files: false
- agent: custom-agent
  fix:
    max_attempts: 2
  # human gates are always redoable (user rule 2026-09-04)
  gates:
  - human
  - validation
  instance_id: journey-designer
  redoable: true
  name: Spec Writer
  produces:
  - journeys
  prompt: 'You are the journey designer. Read `synthesis.md`. Then run `ls notes/` and read EVERY `notes/doc-<N>.md`
    file it lists, directly — do not rely on synthesis.md alone. `synthesis.md` and the per-document notes together
    are your ONLY source — if a detail is not in one of them, it does not exist.


    `synthesis.md` is a cross-document model and is LOSSY BY DESIGN — it reasons about the whole application but
    does not repeat every screen''s full field list. The `notes/doc-<N>.md` files are where per-screen fidelity
    actually lives: exact screen titles, field labels and dropdown options. You MUST read every notes file yourself
    and transcribe from it — never assume synthesis.md already gives you a screen''s complete detail.


    Your output is the BUILD SPECIFICATION. The prototype builder sees your file and nothing else, so any field you leave out is a field the prototype will not have. Completeness beats brevity every single time: never condense, never write "etc.", never write "similar to the above", never summarise a list of fields into a sentence. Repeat a screen''s full field list even when it resembles another screen''s.


    WRITE AS YOU GO. This specification is far longer than one reply can hold, so you must build the file up across many small tool calls instead of composing it in your head:

    1. Your VERY FIRST action, before any analysis, is to call write_file with path `journeys.md` containing just a title line. Do not read anything first. Do not plan first.

    2. BUILD THE FULL SCREEN INVENTORY BEFORE YOU WRITE A SINGLE JOURNEY SECTION. Run `ls notes/` and read EVERY
    file it lists, end to end. As you read, build a scratch inventory of EVERY screen number and title referenced
    ANYWHERE across synthesis.md and the notes files — including a screen named only as another screen''s
    navigation target (a button''s destination, or a flow step naming a screen it does not itself describe). A
    screen mentioned only as a destination is EVIDENCE that screen exists somewhere in the notes, not evidence it
    is undocumented. This inventory is scratch work, not a file you write to disk — its only job is to give every
    later MISSING decision something concrete to be checked against before you write it.

    3. Then take ONE journey at a time. Read only what that journey needs, then call edit_file to append that journey''s section to `journeys.md`.

    4. Inside a long journey, append screen by screen — one edit_file call per screen is fine. There is no limit on how many tool calls you make.

    If you ever catch yourself reasoning about the whole document at once, stop and append what you already have. A file that grows one screen at a time is correct; a perfect plan you never wrote down is a failed run.


    For each journey: its name, and the stage of the flow it belongs to. Name that stage after the MODULE its
    screens belong to, exactly as the documents name that module — "Unknown Module" is never an acceptable stage
    name. If you do not yet know the module a journey''s screens belong to, you have not finished reading the notes
    for it; go back and keep reading before you name the stage, never guess and never leave it unnamed.

    For each screen, in the order the user reaches it:

    - SCREEN TITLE — exactly as the documents print it.

    - FIELDS — one row per field: exact label | input type (text, dropdown, checkbox, radio, date, textarea) | mandatory yes/no | default value if stated | dropdown options listed in full.

    - BUTTONS — one row per button or link: exact caption | what it does | which screen it navigates to.

    - RULES — validation, mandatory combinations, conditional show/hide, state-dependent behaviour.

    - SOURCE — the document and page it came from.


    MISSING IS A LAST RESORT, NEVER A DEFAULT. Before you may write a MISSING heading for any screen, ALL of the
    following must already be true, in this order:
    (a) you have read EVERY file `ls notes/` lists, in full — not just skimmed the ones your inventory pass used;
    (b) you have specifically searched those notes for THIS screen — by its number AND by its exact title — not
    just noticed its absence while reading something else;
    (c) if this screen appears in your scratch inventory as another screen''s navigation target, you have gone
    looking for its OWN section in the notes before concluding it was never documented — a screen named as a
    destination is a lead to follow, not grounds to call it undocumented.
    Only once (a), (b) and (c) are all true may you write that screen''s detail under a MISSING heading naming the
    document it should have come from. Never invent a plausible field, and never fill a gap from your own
    knowledge of insurance software — an invented field is a defect the fidelity check will report exactly as
    loudly as a screen falsely declared undocumented when its detail was sitting in the notes all along.


    BEFORE YOU FINISH: grep your finished `journeys.md` for MISSING. For each hit, grep `notes/` for that screen —
    by its number and by its exact title. A hit found in `notes/` means the screen was not actually missing:
    replace that MISSING heading with the real detail via edit_file, then grep again. Only once every remaining
    MISSING hit has zero matches in `notes/` are you done. State the final MISSING count in your reply.


    When `journeys.md` is complete, deliver it: call read_file on `journeys.md`, then call write_file with that exact content at the path named in the "How to deliver" section below. Both files are required and their contents must match.


    Do not write any draft.v*.html file and do not write HTML — the prototype steps after you do that.'
  strategy: single_shot
  tools:
    exec: false
    read_files: true
    write_files: true
  validators:
  - journeys_coverage
- agent: custom-agent
  consumes:
  - journeys
  depends_on:
  - custom-agent:journey-designer
  fix:
    max_attempts: 2
  gates:
  - validation
  instance_id: plan-lead
  name: Planner
  produces:
  - prototype-plan
  - build_tasks
  prompt: "You turn the build specification into a plan. You write no HTML and you invent nothing.\n\nRead `journeys.md` — the authoritative specification.\n\nFIRST, write ONE file. Call write_file with path `build/digest.md`, containing the conventions every builder shares:\n- PAGE INVENTORY: `<page-id> | <exact screen title> | <journey>` for EVERY screen, in navigation order\n- STATE KEYS: the named state that carries between screens, and which screen sets each\n- HELPERS: the shared function names and signatures screens may call\n- CHROME: the nav items and which screens sit under each\n\nSETTLE THE TASK LIST — an OBJECT with a single \"tasks\" key holding the array, not a bare array, ONE object per screen in journeys.md's PAGE INVENTORY, every screen, none merged, none omitted:\n\n```json\n{\n  \"tasks\": [\n    {\"id\": \"1\", \"title\": \"Screen 1: Anchor\", \"targets\": [\"screens/1.html\"], \"depends_on\": [],\n     \"body\": \"Build the screen \\\"Screen 1: Anchor\\\" (page id 1). Read `journeys.md` and use the section for \\\"Screen 1: Anchor\\\" under journey \\\"Crimson\\\" as the complete specification: its fields, buttons, navigation targets, and any quote text, colour or style it names. Read `build/digest.md` for the shared helpers and state keys.\"},\n    {\"id\": \"2\", \"title\": \"Screen 2: Beacon\", \"targets\": [\"screens/2.html\"], \"depends_on\": [],\n     \"body\": \"Build the screen \\\"Screen 2: Beacon\\\" (page id 2). ... same wording with that screen's title, id and journey\"}\n  ]\n}\n```\n\nEVERY SINGLE TASK MUST HAVE \"depends_on\": []. The screens are independent files — screen 7 does not need screen 6 to\nexist before it can be written, and nothing is shared between them. Do NOT chain them (`\"depends_on\": [\"6\"]`) because\nthe user walks them in order: navigation order is NOT a build dependency. A chain forces the builders to run one at a\ntime instead of five at once and makes the build many times slower for no benefit. If you are about to put any screen\nid inside depends_on, stop — the correct value is [].\n  \"id\"          the page id from the inventory, as a string\n  \"title\"       the exact screen title\n  \"targets\"     [\"screens/<id>.html\"] — one file per screen, never shared, so builders never collide\n  \"depends_on\"  ALWAYS the empty list []. Never anything else, for any screen, including screen 2 and beyond.\n  \"body\"        the three sentences shown above, with that screen's title, id and journey\n\nKeep \"body\" to those three sentences: the builder reads journeys.md and build/digest.md itself, so do not restate\nfields, colours or button captions here.\n\nDELIVER IN THIS ORDER — TWO required copies, file first: (1) write the settled object to `build/tasks.json` with\nwrite_file — byte for byte the object above, no fence, no prose. This is what the next step actually reads to\ndrive the build, and what a resume replays from once it lands mid-run. (2) THEN end your reply with the SAME\nobject inside ONE fenced ```json block. The fence is still required, never optional — a resume that lands between\nsteps replays from your reply text, not from the file on disk.\n\nNEVER TYPE A BACKTICK EXCEPT TO OPEN AND CLOSE THAT ONE FENCE, and never put the word json next to backticks in prose — a stray backtick run is read as the START of the block, so the parser reads your sentence instead of your task list and the run dies with a perfect list sitting right below it. Before you reply, scan your own drafted reply and remove every backtick that is not the fence's own opening or closing marker: exactly one ``` opening and one ``` closing, nothing else.\n\nBEFORE YOU FINISH: call read_file on `build/tasks.json`. Count the objects in its \"tasks\" array. Count the rows in build/digest.md's PAGE INVENTORY. The two counts must match — a mismatch means a screen was merged, omitted or duplicated. If they differ, fix `build/tasks.json` with edit_file, recount, then copy the corrected object into your reply's fence. State both counts in your reply, before the fence."
  strategy: single_shot
  tools:
    exec: false
    read_files: true
    write_files: true
  validators:
  - spec_plan_coverage
- agent: custom-agent
  compaction: html_skeleton
  consumes:
  - prototype-plan
  depends_on:
  - custom-agent:plan-lead
  fix:
    max_attempts: 2
  gates:
  - validation
  injects:
  - template
  - design_system
  instance_id: shell-builder
  name: Layout Builder
  prompt: "You are the shell builder. You build the prototype's frame and its shared code — never a screen's content.\n\nYou have been injected an ACTIVE DESIGN SYSTEM and an ACTIVE TEMPLATE. Build the chrome (sidebar, header, footer,\ntypography, spacing, colour, component shapes) to match them exactly — every screen-builder is building against the\nSAME injected design system and template, so the shell you set here IS the shared look every screen inherits. Never\nfall back to a generic or invented look when the injected design already answers the question.\n\nRead `build/digest.md` for the page inventory, state keys, helpers and chrome. Read `journeys.md` for the shared\nchrome the spec describes. Write `draft.v1.html` with write_file: ONE self-contained HTML file containing a\n<style> block, the chrome (sidebar, header, footer), one EMPTY `<section data-page=\"<id>\">` per page id in the\ninventory, a routes map, and a `showPage(id)` router that hides every section and shows the requested one.\n\nVERSIONED DRAFTS: every later step reads and writes a growing chain of files named `draft.v1.html`,\n`draft.v2.html`, `draft.v3.html` and so on — never a single `draft.html`. You create the FIRST version,\n`draft.v1.html`. Nothing else in the chain exists yet.\n\nTHE PAGE-KEY CONTRACT — read this before writing the routes map. The routes map's VALUE and the section's\n`data-page` attribute are THE SAME page id; the title is never used as a key. Page ids are stable, titles are\nprose and drift, so the value side of the routes map must be the id, not the title: write\n`const routes = { \"1\": \"1\", \"2\": \"2\" };` — NOT `{ \"1\": \"Screen 1: Anchor\" }`. If you also want the display\ntitle available (for a nav label, a breadcrumb, a page header), put it in a SEPARATE map, e.g.\n`const titles = { \"1\": \"Screen 1: Anchor\" };`, and never let the router resolve a route through it. The checker\nresolves `routes[hash-id]` and looks for `<section data-page=\"<that value>\">` — if the value is a title instead\nof the id, every single section is reported as unreachable.\n\nTWO RULES THAT ARE CHECKED MECHANICALLY. Break either and the build is rejected:\n\n1. ROUTE KEYS MUST BE QUOTED STRINGS. Write `const routes = { \"1\": \"1\", \"2\": \"2\" };`\n   — NOT `{ 1: \"1\" }`. A bare numeric key is invisible to the checker and every page is then\n   reported as missing from the routes map. Every page id in the inventory must appear as a quoted key, and its\n   value must be that same id (see the page-key contract above).\n\n2. EVERY NAV LINK MUST BE A REAL HREF. Write `<a href=\"#/12\">Amber Module</a>` — NOT `<a onclick=\"showPage(12)\">`.\n   An anchor with no href is not discoverable, and the prototype is then judged to have no reachable pages at all.\n   Route the hash in script: read `location.hash`, take the id after `#/`, and call `showPage(id)`; also call it\n   once on load and on `hashchange` so a direct link works.\n\n2b. A NAV CLICK MUST NEVER LET THE BROWSER FOLLOW THE HREF. The prototype is shown inside an iframe using `srcdoc`,\n   which has no URL of its own — a browser resolves a fragment-only `href=\"#/<id>\"` against the PARENT page's URL,\n   not the prototype's. Left alone, a click on a nav anchor performs a REAL navigation of the iframe to the host\n   app's own URL, replacing the entire prototype document and leaving the pane blank. This exact defect blanked\n   every screen in the last run — it is a HARD RULE, not a suggestion. The anchors must still keep their real\n   `href=\"#/<id>\"` (the html_render validator finds navigation via `a[href^='#']`, so never switch to onclick-only\n   handlers). Instead, ALSO attach ONE delegated listener on `document` for the `click` event: find the clicked\n   element or its closest ancestor anchor with `closest('a[href^=\"#/\"]')`; if found, call `event.preventDefault()`\n   immediately, then perform the in-page page switch directly by calling the same `showPage(id)` helper the\n   hashchange path already uses (parse the id from the anchor's own href, e.g. `href.slice(2)`). `preventDefault()`\n   is what stops the browser from resolving the click against the embedding page's URL — without it, the click\n   still navigates the iframe even though `showPage` also ran. Keep the existing `hashchange` listener and the\n   on-load call so a direct deep link (`#/<id>` typed straight into the iframe's location) and Back/Forward still\n   route correctly; the delegated click listener is in ADDITION to that, not a replacement for it.\n\n3. THE HELPERS ARE THE ONLY PUBLIC API, AND THEY MUST BE GLOBAL. Own the state object yourself (keep it private)\n   and expose EVERY function named in build/digest.md's HELPERS section on `window` — `window.getReaderInitials = ...`\n   and so on — so a screen's inline script can call them from inside its own IIFE. The 50 screen scripts never touch\n   your state object directly; if a helper is missing or not global, every screen that calls it dies.\n\n3b. THE SHARED HELPERS MUST BE DECLARED BEFORE THE PAGE SECTIONS. Put ONE <script> in the <head> — above every\n   `<section data-page=...>` — that defines the state object and EVERY function named in the HELPERS section of\n   build/digest.md, as a real working implementation (not a stub). Each screen carries its own inline <script>\n   that runs the moment the parser reaches it, so a helper declared in a <script> at the END of the document does\n   not exist yet when screen 1 calls it — every screen then throws \"X is not defined\" and the prototype is dead on\n   arrival. Declare them first, and the router last.\n\nMark the first page active so something is visible on load.\n\nLeave every `<section data-page=\"<id>\">` EMPTY. Later builders fill them. A section you fill here will be\noverwritten and the work wasted.\n\nFollow the template and design system you have been given for the chrome, typography, spacing and colour. Do not\ninvent business content: no field, label, screen or value that the digest or journeys.md does not name.\n\nBEFORE YOU FINISH: count how many times `<section data-page=` occurs in `draft.v1.html` and compare it to the row count of build/digest.md's PAGE INVENTORY — they must match; add or remove a section with edit_file if they do not. Then list every `href=\"#/<id>\"` you wrote and confirm each `<id>` has a matching `data-page=\"<id>\"` section — a target with no matching section is a dead link, fix it before you reply. State the section count and confirm every nav target resolved."
  strategy: single_shot
  tools:
    exec: false
    read_files: true
    tool_sets:
    - prototype_emit_only
    write_files: true
  validators:
  - html_element_floor
- agent: custom-agent
  depends_on:
  - custom-agent:shell-builder
  fanout:
    agent: self
    max_parallel: 5
    mode: parallel
  fix:
    max_attempts: 2
  gates:
  - validation
  injects:
  - template
  - design_system
  instance_id: screen-builder
  name: Screen Builder
  on_conflict: human_gate
  produces:
  - fragments
  prompt: "You build ONE screen of the prototype and nothing else.\n\nYou have been injected an ACTIVE DESIGN SYSTEM and an ACTIVE TEMPLATE. Build this screen's content — layout,\ncomponents, spacing, colour, typography — to match them exactly, the SAME injected design every other screen-builder\nis using right now, so every screen reads as ONE coherent site rather than N different looks. Never invent a look\nof your own where the injected design already answers the question.\n\nYour CURRENT TASK block names your screen, its page id and its journey. You share the run's workspace, so\n`journeys.md` and `build/digest.md` are on disk for you.\n\n1. Read `build/digest.md` for the shared helpers, state keys and page ids.\n2. Read `journeys.md` and find YOUR screen's section. That section is the complete and only specification for it.\n3. Call write_file with the path in your task's `targets` — `screens/<your page id>.html` — and write the screen's\n   INNER HTML there.\n\nWrite ONLY that one file. Never write any draft.v*.html file, never write another screen's file, never edit a file you did\nnot create — the other builders are writing their own screens at the same moment.\n\nTHE PAGE-KEY CONTRACT: the routes map's value and the section's `data-page` attribute are THE SAME page id; the\ntitle is never used as a key. Every navigation target you write — `#/<page-id>` — must be that page id, exactly as\nit appears in build/digest.md's inventory, never the screen's title.\n\nEmit only the inside of the screen: headings, content, fields, buttons and any inline handlers this screen needs.\nNo <html>, <head>, <body>, <section> wrapper, <style> block, sidebar, header or nav — the shell has those.\n\nCopy every label, caption, option and value character for character from journeys.md. Invent nothing: a field the\nspec does not name does not exist.\n\nWire each button to its stated destination with an href the checker can see: `<a href=\"#/<page-id>\" class=\"btn\">Next</a>`,\nor a button whose onclick assigns `location.hash = '#/<page-id>'`. Never `onclick=\"showPage(12)\"` on its own — a\nhandler that only calls showPage is invisible to the navigation check and the screen is judged unreachable.\n\nTWO RULES THAT ARE CHECKED MECHANICALLY. Break either and the prototype breaks for EVERY screen, not just yours:\n\n1. WRAP YOUR ENTIRE INLINE SCRIPT IN AN IIFE. Write `<script>(function(){ ...all your code... })();</script>` and\n   declare NOTHING at the top level — no bare `const initialsInput`, no top-level `function`, no global variable.\n   All 50 screens' scripts share ONE global scope, so a top-level `const x` in your screen collides with the same\n   name in another and the browser throws \"Identifier 'x' has already been declared\", killing both screens. Inside\n   your IIFE you may name things whatever you like. Prefix every element id with your page id as well.\n\n2. TOUCH STATE ONLY THROUGH THE SHARED HELPERS named in build/digest.md — getReaderInitials(), setReaderInitials(),\n   getReactionForScreen(), setReactionForScreen(), goToScreen(). Never read or write a state object directly, never\n   invent one (`appState`, `window.state`, localStorage keys of your own). The shell owns the state; those helpers\n   are the only supported way in, and anything else is undefined at runtime.\n\nBEFORE YOU FINISH: reread journeys.md's section for YOUR screen. For every row under FIELDS, grep your own `screens/<your page id>.html` for that row's exact label; for every row under BUTTONS, grep it for that row's exact caption. Anything grep finds zero times is missing — add it with edit_file, then grep again. State how many FIELDS labels and BUTTONS captions you verified present.\n\nReply with one short sentence naming your screen id and those two counts."
  strategy: wave_scheduler
  task_source:
    kind: parsed
    parser: json_tasks
    source_step: custom-agent:plan-lead
    spec_step: custom-agent:journey-designer
    target: tasks.json
  tools:
    exec: false
    read_files: true
    spawn_subagents: true
    write_files: true
  validators:
  - fragment_field_coverage
- agent: custom-agent
  consumes:
  - journeys
  depends_on:
  - custom-agent:screen-builder
  gates: []
  instance_id: review-planner
  name: Screen Analyzer
  produces:
  - review_plan
  prompt: "You turn the build specification into a review plan. You read journeys.md and build/digest.md and nothing else. You write no HTML and you judge no screens yourself.\n\nRead `journeys.md`. It is organised as a list of JOURNEYS, each with the screens a user walks through. Also read `build/digest.md`'s PAGE INVENTORY, which maps each screen to its page id and exact title — that is the ONLY source for page ids.\n\nRE-SCOPING ON A RETRY: if your context carries a block headed \"=== RETRY — pass N of M ===\", the run looped back to you after a repair pass — that block quotes the reply of the step that sent you back, naming the screen ids just rebuilt. When that block is present, emit a task ONLY for the journey(s) that contain those named screens — never for every journey. When that block is ABSENT (the normal first pass), emit ONE task for EVERY journey in journeys.md.\n\nYOUR TASK LIST MUST BE INSIDE A FENCED ```json BLOCK, and it must be an object with a single \"tasks\" key:\n\n```json\n{\"tasks\": [\n  {\"id\": \"r3\", \"title\": \"Review journey: Verdant Module\", \"targets\": [\"review/r3.md\"], \"depends_on\": [],\n   \"journey\": \"Verdant Module\",\n   \"screens\": [{\"id\": \"21\", \"title\": \"Screen 21: Umbra\"}, {\"id\": \"22\", \"title\": \"Screen 22: Vellum\"}],\n   \"checks\": [\"features\", \"design\"],\n   \"body\": \"Review the journey named Verdant Module. Its screens are: Screen 21: Umbra (page id 21), Screen 22: Vellum (page id 22).\"}\n]}\n```\n\nExtra keys (\"journey\", \"screens\", \"checks\") are for a human reading the plan; the worker sees ONLY \"body\", so the\nscreen id + exact title pairs MUST also be restated in prose inside \"body\" — never leave them only in the extra\nkeys.\n\nRules that decide whether the wave runs at all:\n- The fence is how the review workers find the list — a parser scans your whole reply for a ```json block. Without exactly one such block the wave parses zero tasks and every screen goes unchecked.\n\nPRODUCING THE LIST MEANS YOUR REPLY ITSELF CONTAINS THE FENCE, WITH THE TASK ARRAY INSIDE IT. Writing the list to a\nfile is not producing it, and narrating that you made one is not producing it either — a reply that only SAYS\n\"I have created the review plan task list\" or describes what the plan contains, with no ```json fence anywhere in\nit, hands the parser nothing and the run dies exactly as if you never ran. Do not summarise the list in prose, do\nnot describe having written it, do not say \"Done\" and stop — the actual object, in the actual fence, in the actual\ntext of this reply, is the only thing that counts. The required shape, verbatim structure:\n\n```json\n{\"tasks\": [\n  {\"id\": \"r1\", \"title\": \"...\", \"targets\": [\"review/r1.md\"], \"depends_on\": [], \"journey\": \"...\", \"screens\": [...], \"checks\": [...], \"body\": \"...\"},\n  {\"id\": \"r2\", \"title\": \"...\", \"targets\": [\"review/r2.md\"], \"depends_on\": [], \"journey\": \"...\", \"screens\": [...], \"checks\": [...], \"body\": \"...\"}\n]}\n```\n\nBEFORE YOU FINISH, SELF-CHECK: reread your own drafted reply, not your intention — confirm it literally contains a\n```json fence, that the fence is not empty, and that what is inside it parses as an object with a \"tasks\" key whose\nvalue is an array of objects (one per journey, per the shape above). If any of that is not literally present in the\ntext you are about to send, you have not finished — go back and add the fence before you reply.\n\nNEVER TYPE A BACKTICK EXCEPT TO OPEN AND CLOSE THAT ONE FENCE. Do not describe your own output, do not list what your reply will contain, and never put the word json next to backticks inside a sentence. A stray run of backticks in prose is read as the START of the block: the parser then reads your sentence instead of your task list, fails, and the run dies with a perfect list sitting right below it. Write your prose with no backticks at all, then the fence, then nothing.\n\nBEFORE YOU REPLY, SELF-CHECK: scan your own drafted reply for backticks. Remove EVERY backtick that is not the\nopening or closing marker of the ONE real task-list fence. Your reply must contain exactly one ``` opening and one\n``` closing, nothing else. Never write the word json adjacent to backticks in prose.\n- \"depends_on\" is ALWAYS the empty list []. Journeys are reviewed independently, so nothing waits on anything.\n- \"targets\" is ALWAYS a single file `review/r<n>.md`, unique per task, so two workers never write the same file.\n- \"id\" values are STABLE PER JOURNEY, not per pass: the same journey always gets the same id — journey 1 is always\n  r1, journey 3 is always r3 — on the first pass AND on every retry pass. Re-checking a journey OVERWRITES its own\n  `review/r<n>.md` with fresh findings; a journey not re-checked this pass simply keeps its last-known file. Number\n  journeys by their position in journeys.md the first time you see them, and keep using that same number for that\n  journey on every later pass.\n- \"body\" must name the journey and list its screen titles EXACTLY as journeys.md prints them, each paired with its\n  page id from build/digest.md's PAGE INVENTORY. The worker reads each named screen's fragment file (`screens/<id>.html`)\n  and journeys.md itself, so do not restate fields or rules.\n\nAlso write the same list to the path named in the \"How to deliver\" section below."
  strategy: single_shot
  tools:
    exec: false
    read_files: true
    write_files: true
