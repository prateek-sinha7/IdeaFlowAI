    inline-style-vs-CSS-class choice for a style journeys.md does name, as long as the rendered result is correct.
    Those are usability or implementation choices, not fidelity.


    Call write_file with the path in your task''s `targets` and write your findings as markdown, under the two
    headings above, a line per defect naming the exact screen, the exact field or design element, and whether it is
    missing, wrong or invented — or "no defects" under a heading if that heading is clean.

    End with a line `SCREENS <implemented>/<specified>` for your journey. Reply with one short sentence.'
