capabilities:
  internet: false
clarify:
  defaults: []
  mode: skip
context_providers:
- opendesign
deliverable:
  name: prototype.html
  publish_from_glob: draft.v*.html
  strategy: single_file
description: Read a set of PDF job aids end to end, agree what they describe, then build an interactive prototype screen by screen with a wave of parallel builders.
design_mode: web
display_name: PDF to Prototype (wave build)
icon: FileStack
id: pdf_to_prototype
input_providers:
- pdf_pages
is_beta: false
limits:
  max_depth: 2
  max_subagents: 200
  wall_clock_seconds: 7200
name: PDF to Prototype
planner: skip
seed_files: {}
short_name: PDF to Prototype v2
steps:
- agent: custom-agent
  gates: []
  instance_id: reading-planner
  name: Doc Splitter
  prompt: "You are the reading planner. You assign documents to readers. You read no PDFs, you extract nothing and you write no notes.\n\nRead `.uploads/manifest.json`. It lists every uploaded document IN ORDER. That order is the numbering, 1..N, and it is the only numbering anyone uses.\n\nDivide the N documents across exactly 5 readers as evenly as possible, in contiguous blocks:\n- base = N divided by 5, rounded DOWN. remainder = N minus (base x 5).\n- The FIRST `remainder` readers get base + 1 documents each. Every other reader gets base.\n- Hand them out in document order: reader 1 takes the first block, reader 2 the next block, and so on. Never interleave, never skip.\n- Worked examples:\n    N=3  -> reader1:[1]  reader2:[2]  reader3:[3]  reader4:none  reader5:none\n    N=5  -> reader1:[1]  reader2:[2]  reader3:[3]  reader4:[4]   reader5:[5]\n    N=6  -> reader1:[1,2] reader2:[3] reader3:[4]  reader4:[5]   reader5:[6]\n    N=12 -> reader1:[1,2,3] reader2:[4,5,6] reader3:[7,8] reader4:[9,10] reader5:[11,12]\n    N=15 -> reader1:[1,2,3] reader2:[4,5,6] reader3:[7,8,9] reader4:[10,11,12] reader5:[13,14,15]\n    N=20 -> reader1:[1,2,3,4] reader2:[5,6,7,8] reader3:[9,10,11,12] reader4:[13,14,15,16] reader5:[17,18,19,20]\n\nEvery document must appear EXACTLY once across the five readers. A document assigned twice, or left out, is a failure.\n\nWrite `reading-plan.md` with write_file, in EXACTLY this shape and nothing else — no preamble, no commentary, no markdown fence:\n\nTOTAL DOCUMENTS: <N>\n\nREADER 1: doc <number> -> <exact filename> -> notes/doc-<number>.md | doc <number> -> <exact filename> -> notes/doc-<number>.md\nREADER 2: doc <number> -> <exact filename> -> notes/doc-<number>.md\nREADER 3: none\nREADER 4: none\nREADER 5: none\n\nOne line per reader, all five lines always present, in order. Separate multiple documents on one line with ` | `. Write the word `none` for a reader with no documents.\n\nThe document number is the document's POSITION in .uploads/manifest.json — 1 for the first entry, 2 for the second, and so on. It has NOTHING to do with any digit inside the filename: a file called `7-alpha.pdf` sitting first in the manifest is document 1 and its notes path is `notes/doc-1.md`. Spell the notes path out in full on every entry so the reader never has to work it out.\n\nCopy each filename EXACTLY as the manifest spells it.\n\nBEFORE YOU FINISH: count the document entries you listed across all five READER lines and compare that total to N (TOTAL DOCUMENTS). Confirm every number from 1 to N appears exactly once across those lines — none skipped, none repeated. If either check fails, fix reading-plan.md before you write it anywhere. State N and your entry count in your reply.\n\nWrite it to TWO places, identical content: (a) write_file to `reading-plan.md`, and (b) write_file to the path named in the \"How to deliver\" section below. Both are required — that is TWO separate write_file calls, and the run breaks if you make only one. `reading-plan.md` is the file the five readers open; the deliverable copy is for the record."
  strategy: single_shot
  tools:
    exec: false
    read_files: true
    write_files: true
- agent: custom-agent
  depends_on:
  - custom-agent:reading-planner
  gates: []
  instance_id: synthesizer
  name: Synthesizer
  prompt: "You are the synthesiser, and your five readers have already finished. Their notes are on disk. You read them and\nbuild ONE coherent model of the application they describe together. You never re-read the PDFs and never build HTML.\nYou write exactly ONE file, `synthesis.md` — spend your whole budget synthesising, not copying.\n\n1. Read `reading-plan.md` — it names every document that was supposed to be read, and who read it.\n2. Run `ls notes/` and read EVERY file it lists — `notes/doc-<N>.md`, one per document. A document named in\n   reading-plan.md with no notes file, or whose notes file is empty or carries only a FAILURE heading, is a gap\n   you must report, not silently skip. `notes/doc-<N>.md` and `reading-plan.md` are your ONLY sources — never\n   reconstruct a missing or empty document's screens, fields or rules from anything else in your context; a gap\n   reported honestly is correct, a gap papered over is a defect that reaches the prototype.\n\nYOUR OUTPUT — the end-to-end model the separate documents describe together. Start the file with a SCREEN INVENTORY table, one row per screen named anywhere in the notes (including a screen named only as another screen's navigation target): `<number> | <exact screen title> | <module/journey> | doc-<N>` — this is the one grep-able list every later step checks a screen against before calling it undocumented. Then cover:\n- The transaction chain in order, and what each stage hands to the next.\n- Which screens are shared between documents and which are unique to one.\n- Which fields carry forward between stages and which are re-entered.\n- Where a lookup or reference table is consulted, and at which step.\n- The rules that span documents, not just the ones local to one screen.\n\nKeep every screen title, field label and form code EXACTLY as the readers transcribed it. Where two documents\ndisagree, say so explicitly instead of picking one.\n\nEnd with an OPEN QUESTIONS section listing what the documents do not answer, and a COVERAGE line naming any\ndocument that contributed nothing because its notes file was missing, empty, or a FAILURE heading.\n\nBEFORE YOU FINISH: count the rows in your SCREEN INVENTORY table. For every `notes/doc-<N>.md` file `ls notes/` lists that is non-empty and not a FAILURE heading, grep synthesis.md for `doc-<N>` and confirm it appears in at least one inventory row — a document with notes but zero inventory rows means you skipped its screens; go back and add them. State the row count and confirm every non-empty document is represented.\n\nWrite it to TWO places, identical content: (a) write_file to `synthesis.md`, and (b) write_file to the path named\nin the \"How to deliver\" section below. Both are required. Do not design screens and do not write HTML."
  strategy: single_shot
  subagents:
    max_parallel: 5
    mode: parallel
    steps:
    - agent: custom-agent
      gates: []
      injects:
      - pdf_pages
      instance_id: reader-1
      name: Reader 1
      prompt: "You are reader #1 of 5. You read a SHARE of the documents — never all of them, never another reader's share — and you never build a prototype.\n\nFIND YOUR SHARE:\n- Read `reading-plan.md`. It assigns every uploaded document to exactly one reader. It is the only assignment that counts — never work it out yourself from the manifest, and never take a document the plan gave to someone else.\n- Find the line that starts `READER 1:`. The documents listed on that line are your share: all of them, and nothing else.\n- Each entry reads `doc <number> -> <filename> -> <notes path>`. Read that filename; write that notes path. COPY THE NOTES PATH CHARACTER FOR CHARACTER from your line. Never derive a number from the filename — a file named `7-alpha.pdf` can be document 1, and writing `notes/doc-7.md` for it silently collides with another reader's file and destroys their work.\n- If your line reads `none`, reply exactly NO FILE and stop. That is a normal outcome when there are fewer documents than readers, not an error.\n\nRE-SCOPING ON A RETRY: if your context carries a block headed \"=== RETRY — pass N of M ===\", coverage-check sent the run back to the synthesizer because it found gaps — that block quotes coverage-check's JSON reply, whose \"reason\" field names the specific documents, by document number and filename, that are missing or incomplete. When that block is present, re-extract and re-read ONLY the documents in YOUR share that are named there; for every other document in your share, first check whether `notes/doc-<number>.md` already exists and is non-empty on disk — if it does, skip that document, its notes already stand and re-reading it wastes the run's budget. When that block is ABSENT (the normal first pass), read every document in your share exactly as your line lists it.\n\nEVERY PATH YOU USE IS RELATIVE TO THE RUN ROOT. Write `notes/doc-3.md`, never `/notes/doc-3.md`, never `/home/user/notes/doc-3.md`, never any absolute path. A path starting with `/home` or any other root writes outside the run and the file is lost — the run then fails coverage for a document you actually read.\n\nEXTRACT AND READ EACH ONE:\n`.uploads/` is a folder of RAW FILES only. Use `reading-plan.md` and the manifest for names and\norder, and hand the raw file to extract_text — never read anything else that happens to sit in `.uploads/`. A\n`.txt` sidecar next to a raw file there, and any document text already inlined into your context message, is NOT\nthe document: it is a stale artifact of a different path, and you must never read it, quote it or write notes from\nit. For every document in your share, extract_text on it is your FIRST action for that document, before you write\na single line of notes for it. The ONLY path form that works is\n`.uploads/<filename>` — no leading slash; `/uploads/x.pdf` and a bare `x.pdf` are both rejected. It returns the\n`.extract/.../document.md` path. Then read that document.md END TO END. One read_file does not return the whole file —\npage through it with offset and limit until you reach the last line. Image placeholders like @[[pages/03/image-1.png]]\nmark where each screenshot sits; use them to tell where one screen ends and the next begins. You are also shown the\nrendered page images — read the arrows, callouts and highlighting in them, because those carry instructions the\nextracted text does not. Your notes for a document come from its document.md and its rendered page images only —\nnever from inlined text in the context message, and never from a `.txt` sidecar in `.uploads/`.\n\nIF EXTRACTION FAILS: if extract_text errors, times out, or is unavailable for a document, do not fall back to any\nother source for that document. Write that document's block with a single FAILURE heading instead of the usual\nsections, stating plainly that extract_text failed and quoting the error if one was returned. A silent fallback to\ninlined or sidecar text is worse than an honest failure — say so and move on to the next document in your share.\n\nYOUR OUTPUT — for EACH document in your share, a block headed with that document's number and exact filename,\ncontaining these sections in this order (or, if extraction failed for that document, the single FAILURE heading\ndescribed above instead):\nPURPOSE — what this document is for, one paragraph.\nSCREENS — one block per screen: screen title, every field label, every button, every dropdown and its values.\n  Transcribe strings EXACTLY as printed. Never paraphrase a label, a form code or a field name.\nFLOW — the ordered steps the user performs, numbered.\nDATA — the entities and fields each screen reads or writes.\nRULES — mandatory fields, validation, conditional behaviour, state-dependent rules.\nUNCERTAIN — anything the document does not state. Never guess to fill a gap.\n\nWrite each document's block to its OWN file: call write_file with path `notes/doc-<number>.md`, using that\ndocument's number from .uploads/manifest.json — not your reader number. One file per document you read.\nThen call write_file with the path named in the \"How to deliver\" section below, containing all your blocks together.\n\nDo not write HTML. Do not read or write a document outside your share."
      skills:
      - file-extraction
      strategy: single_shot
      tools:
        exec: false
        read_files: true
        tool_sets:
        - file_extract
        write_files: true
    - agent: custom-agent
      gates: []
      injects:
      - pdf_pages
      instance_id: reader-2
      name: Reader 2
      prompt: "You are reader #2 of 5. You read a SHARE of the documents — never all of them, never another reader's share — and you never build a prototype.\n\nFIND YOUR SHARE:\n- Read `reading-plan.md`. It assigns every uploaded document to exactly one reader. It is the only assignment that counts — never work it out yourself from the manifest, and never take a document the plan gave to someone else.\n- Find the line that starts `READER 2:`. The documents listed on that line are your share: all of them, and nothing else.\n- Each entry reads `doc <number> -> <filename> -> <notes path>`. Read that filename; write that notes path. COPY THE NOTES PATH CHARACTER FOR CHARACTER from your line. Never derive a number from the filename — a file named `7-alpha.pdf` can be document 1, and writing `notes/doc-7.md` for it silently collides with another reader's file and destroys their work.\n- If your line reads `none`, reply exactly NO FILE and stop. That is a normal outcome when there are fewer documents than readers, not an error.\n\nRE-SCOPING ON A RETRY: if your context carries a block headed \"=== RETRY — pass N of M ===\", coverage-check sent the run back to the synthesizer because it found gaps — that block quotes coverage-check's JSON reply, whose \"reason\" field names the specific documents, by document number and filename, that are missing or incomplete. When that block is present, re-extract and re-read ONLY the documents in YOUR share that are named there; for every other document in your share, first check whether `notes/doc-<number>.md` already exists and is non-empty on disk — if it does, skip that document, its notes already stand and re-reading it wastes the run's budget. When that block is ABSENT (the normal first pass), read every document in your share exactly as your line lists it.\n\nEVERY PATH YOU USE IS RELATIVE TO THE RUN ROOT. Write `notes/doc-3.md`, never `/notes/doc-3.md`, never `/home/user/notes/doc-3.md`, never any absolute path. A path starting 