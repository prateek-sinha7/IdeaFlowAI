  instance_id: structure-check
  name: HTML Validator
  produces:
  - route_decision
  prompt: 'You check the ASSEMBLED prototype for structural defects a per-screen fragment review
    could never see — no fragment reviewer has read the shell, the routes map or another screen at
    the same time as yours, so this pass exists to catch what falls between those cracks. You judge
    AND you fix — you never delegate a repair to another step, because the defects that live here
    (a routes map, a duplicate declaration spanning two screens, a helper-ordering problem) are not
    inside any single screen fragment; a wave that rewrites `screens/<id>.html` files cannot touch a
    routes map at all, so it would be repairing the wrong file. You fix the assembled draft itself.


    READ IN THIS ORDER — cheaply, because a whole-document read here is expensive. A previous pass
    that read and rewrote this same file from context cost 7 minutes 15 seconds and 3.2 million
    tokens, and that cost only grows as more screens are added — never read the whole document
    before you have a specific reason to.

    1. `build/structure.json` FIRST — the skeleton the assembler wrote when it spliced the draft.
       Compare its `routes` keys/values against its `sections` list to find dead nav links (a route
       value with no matching section id) and missing sections WITHOUT reading the document at all.
    2. `build/digest.md` — the PAGE INVENTORY (page id <-> exact screen title), to name defects
       precisely.
    3. Only where the structure.json comparison points at a real problem, read the relevant part of
       the highest `draft.v<N>.html` — run `ls draft.v*.html`, take the HIGHEST N, never guess.
    4. `journeys.md` and the relevant `screens/<id>.html` — to CROSS-VERIFY what a section''s content
       SHOULD be before you change anything. Never infer the correct content from the broken
       document itself; confirm it against the source spec.


    Check specifically, across the WHOLE assembled document:

    - dead nav links — every `href="#/<id>"` (and every `routes` map value) must resolve to a real
    `<section data-page="<id>">`; a link or route entry pointing at an id with no matching section
    is a defect;

    - every screen present in the routes map has a matching section, and every section has a
    routes map entry — a screen missing either side is a defect;


    - UNREACHABLE screens — a section and a routes entry existing is not enough. Every page id
    in build/digest.md''s PAGE INVENTORY must also have at least one INCOMING link somewhere in
    the document, an `href="#/<id>"`, either in the persistent chrome/sidebar nav or on
    another screen (a Next/Back control, a card, a menu item). Check this CHEAPLY with grep:
    search the highest draft.v<N>.html for every `href="#/<id>"` occurrence to build the set
    of ids that receive a link, then diff that set against the full id list in the PAGE
    INVENTORY. A screen that is built, sectioned and routed but never linked TO from anywhere is
    a defect — a working route with no way for a user to ever click into it; verify this
    yourself before you finish, it is not optional;

    - duplicate top-level declarations — the same element id, the same top-level function name, or
    the same global declared twice across screens (each screen''s script must be wrapped in its own
    IIFE; a bare top-level declaration colliding with another screen''s is a defect);

    - helper-before-use ordering — a screen calling a HELPERS function that is declared AFTER it in
    the document (or not declared at all) is a defect;

    - JS reference errors — anything a screen''s script calls or reads that does not exist anywhere
    in the document.


    These are ALL things a single-screen fragment reviewer structurally cannot see; do not
    re-report a FEATURE or DESIGN defect the earlier review pass already covers (a missing field,
    a wrong caption, an off-design colour) — this pass is structural wiring only.


    FIX THE ROOT CAUSE, NOT EACH SYMPTOM. In an earlier run, ONE wrong routes map produced 108 dead-
    link findings across 108 sections. Find the single shared cause first — usually the routes map,
    a helper declaration, or one duplicated id — and fix it ONCE. Patching 108 sections one at a
    time when they all trace back to one wrong map is the wrong fix even if it happens to work.


    EDIT, NEVER REWRITE. Use edit_file for every change — targeted, surgical, against what you just
    read off disk. You MUST NEVER write_file the whole document from context: a prior step re-
    emitted a whole document from memory and silently destroyed 49 Cancel controls and an entire
    section that was never even part of the change. Write your fixed result to a BRAND-NEW file,
    `draft.v<N+1>.html` — never overwrite `draft.v<N>.html`. The one exception: if reproducing the
    whole document into `draft.v<N+1>.html` would itself force a rewrite from memory instead of an
    edit (the document is too large for edit_file alone to safely duplicate), you may edit
    `draft.v<N>.html` in place instead — but only then, and only if you flag it exactly as described
    below, in both the decision object and your prose report.


    AFTER fixing, re-count and report BOTH numbers, before and after your edits: the number of
    `<section data-page=` occurrences, `<input`, `<select`, and `<button` elements. A destructive
    edit must be VISIBLE in your report, never silent — if any count DROPPED, say so loudly and
    treat the result as "broken", even if the structural defect you set out to fix is gone.


    YOUR REPLY HAS THREE PARTS, IN THIS EXACT ORDER, and the order is load-bearing:

    1. FIRST, a PROSE REPORT for the human reading this gate — modelled on the report shape in
    `app/agents/revision_analyzer.py` (read that file for the shape). It must carry: sections found
    vs. expected; every dead nav link, naming the exact page id and screen title; duplicate
    declarations; helper-ordering problems; JS reference errors; the before/after element counts
    above; plainly what you changed and why; and, if you edited `draft.v<N>.html` in place instead
    of writing `draft.v<N+1>.html`, say so and why.

    2. THEN nothing else.

    3. LAST, the trailing decision object and NOTHING after it — no closing remark, not even a
    blank line:


    {"decision": "ok"}


    If you edited `draft.v<N>.html` in place instead of creating `draft.v<N+1>.html` (the size
    exception above), add two more keys instead, still with nothing after the object:
    {"decision": "ok", "edited_in_place": true, "final_draft": "draft.v<N>.html"}. Omit both keys
    when you did create a new version.


    "decision" is exactly ok or broken, lowercase — ok once everything is verified clean after your
    fixes, broken if you could not fix something or a count dropped. The router reads the STRICTLY
    TRAILING JSON object at the very end of your reply and fails closed if anything follows it.


    THERE IS NO TASK-LIST FENCE IN THIS REPLY — you fix things yourself, you do not hand a list to
    another step. NEVER type a backtick anywhere in your reply, for any reason.'
  route:
    default_next: story-layer
    loop_max_iterations: 2
    outcomes:
      ok:
        target: story-layer
        trigger: step
      broken:
        target: structure-check
        trigger: step
  strategy: single_shot
  tools:
    exec: false
    read_files: true
    write_files: true
  validators:
  - html_element_floor
# Save-step design decision (fix for the run a786cc27 truncation defect): the old save step made
# story-layer read_file the finished draft.v<N>.html and write_file that content to a brand-new
# draft.v<N+1>.html, so publish_from_glob (highest draft.v*.html wins) would ship the copy. That
# round trip forces a ~65KB document through a model reply/tool-call argument, which is exactly
# what got truncated to 20KB with 9 of 10 screens gone. There is no exec/cp here and no native
# "copy" tool — read_file->write_file is the ONLY way to duplicate a file with this toolset, and
# it carries the identical reproduce-from-memory risk regardless of whether it runs before or
# after the edits. That means a genuine "keep draft.v<N> pristine as a fallback" is unreachable
# without re-introducing the very risk being fixed. Call made: drop the duplicate entirely — edit
# draft.v<N>.html in place with edit_file (as the affordance edits already do) and let it stand as
# the highest-numbered draft.v*.html, so nothing ever needs to be reproduced whole. Traded away:
# an untouched pre-story-layer snapshot on disk. Mitigated by: the mandatory before/after element
# self-check below, which must catch and repair any drop before the step is allowed to finish, and
# by the human/validation gates immediately after this step, which stop a bad result before publish.
- agent: custom-agent
  consumes:
  - html_file
  - review_report
  depends_on:
  - custom-agent:structure-check
  fix:
    max_attempts: 2
  # human gates are always redoable (user rule 2026-09-04)
  gates:
  - human
  - validation
  instance_id: story-layer
  name: Prototype Validator
  produces:
  - html_file
  prompt: "You make the prototype usable without changing a single fact in it.\n\nFIND THE DRAFT: run `ls draft.v*.html`, find the HIGHEST version number N present, and read that file,\n`draft.v<N>.html` — never guess which version is current, never read an older one.\n\nBASELINE COUNT, before any edit: count how many times `<section data-page=`, `<input`, `<select` and `<button`\neach occur in `draft.v<N>.html` exactly as you just read it, and hold those four numbers — you will re-count the\nsame four after your edits and compare.\n\nADD THE AFFORDANCES, with edit_file, to `draft.v<N>.html`:\n- a landing screen that names the workbench and lists the journeys, each a link to that journey's first screen;\n- one plain sentence at the top of each screen saying what the screen is for, derived only from its own content;\n- Back and Next controls following the navigation the screens already declare;\n- a step indicator showing position within the current journey;\n- grouping of long content under headings that already exist.\n\nHARD LIMIT: you may not add, remove or reword any field, label, caption, option, value or rule, and you may not add a\nscreen that carries business content. Everything you add is navigation, orientation or grouping.\n\nReply with a list of exactly what you added, so it can be recorded as an accepted deviation.\n\nYOU EDIT `draft.v<N>.html` IN PLACE — you never create `draft.v<N+1>.html` and you never call read_file then\nwrite_file to reproduce the whole document. That round trip forces a document far bigger than any reply can hold\nback through the model, and the model silently re-authors a truncated fraction of it from memory instead of\ncopying it byte for byte — that is the exact defect this rule exists to prevent. Your edit_file calls above already\nlanded on `draft.v<N>.html`, so it is already the finished draft the moment they are done, and it is already the\nhighest-numbered `draft.v*.html` file on disk. You never write `prototype.html` yourself — after you finish, the\nengine copies the highest-numbered `draft.v<N>.html` to `prototype.html` byte-for-byte, mechanically. Your job ends\nthe moment your edits to `draft.v<N>.html` are correct and verified below.\n\nSELF-CHECK BEFORE YOU FINISH: re-count the same four things — `<section data-page=`, `<input`, `<select` and\n`<button` — in `draft.v<N>.html` now that your edits are applied, and compare each to your BASELINE count from\nbefore you started. If any of the four dropped, you destroyed content: go back and fix it with edit_file before\nyou reply — never finish with a dropped count. State all four numbers, before and after, in your reply.\n\nCOMPUTE THE FIDELITY COUNT YOURSELF: nothing hands you an aggregate count, so build it from source. Run\n`ls review/` and read every `review/r<n>.md` file it lists — each ends with a line `SCREENS <implemented>/<specified>`\nfor that journey. Sum the implemented numbers and sum the specified numbers across every file to get the run's total\nimplemented/specified count, and note any screen or field those same files report missing or invented. That sum is\nwhat point 4 below reports — never estimate it.\n\nTHEN present the finished result, in plain prose — this reply IS the presentation:\n1. WHAT WAS BUILT — draft.v<N>.html, its size, and how many screens it actually contains.\n2. SOURCE DOCUMENTS — the documents from reading-plan.md that fed it.\n3. WHAT IT COVERS — each journey by name with its screens, in flow order.\n4. FIDELITY — the implemented/specified counts you just summed from every `review/r<n>.md` file, and any screen or\n   field those files report still missing or invented. Do not soften this.\n5. WHAT I ADDED — the affordances above, listed as accepted deviations.\n6. INTEGRITY CHECK — the four before/after counts from your SELF-CHECK above (`<section data-page=`, `<input`,\n   `<select`, `<button`), stated plainly.\nEvery number comes from a file you read, never an estimate."
  redoable: true
  require_render: true
  strategy: single_shot
  tools:
    exec: false
    read_files: true
    tool_sets:
    - prototype_emit_only
    write_files: true
  validators:
  - html_element_floor
- agent: custom-agent
  consumes:
  - html_file
  depends_on:
  - custom-agent:story-layer
  gates:
  - validation
  instance_id: publish
  mechanical: publish
  name: Publisher
  produces:
  - html_file
  require_render: true
  validators:
  - html_static
  - html_render
user_launchable: true
version: 1
