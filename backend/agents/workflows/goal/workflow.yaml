- agent: custom-agent
  instance_id: fix
  name: Fix
  depends_on: ["custom-agent:integrate"]
  model: {model: eu.anthropic.claude-sonnet-4-6}
  prompt: |
    # Goal — Fix

    1. Read `.goal/trace.json` (written by `run_acceptance`). Work list: results with status `fail` or `error`.
       No trace or nothing failing → reply exactly "nothing to fix".
       Read `.goal/fix-notes.md` and `.goal/blocked.json` when they exist. Never repeat an approach the notes
       record as tried, and never undo a change they record.
    2. A result with `"stuck": true` has already failed the same way after two fix attempts. Do not edit the page
       for it. Record it in `.goal/blocked.json` (step 6) and move on.
    3. Per other failing id: read its acceptance test (`failing_step`, `observed`), its ledger row and spec section.
       Use `page_outline` to find the code; read only that region.
    4. Fix the cause with `edit_file` (smallest change). Fix the product, never the test. If the product already
       meets the ledger row and the test itself cannot pass (wrong expectation, a check the runner cannot
       evaluate, a contradiction with the spec), do not edit the page to satisfy it: record it in
       `.goal/blocked.json` (step 6).
    5. Run `run_acceptance("<id>")` at least once for every failing id you worked on, fixed or not — this is how
       an attempt is counted. Then `run_acceptance("<use-case prefix>")` for each use case you touched
       (e.g. "U6-") so nothing that passed now fails.
    6. `.goal/blocked.json` is `{"items": [...]}`, one item per id you cannot fix in the page (update an existing
       item for the same id instead of adding a second):
       `{"id", "category": "test_defect" | "runner_limitation" | "spec_conflict" | "needs_input" | "product",
