# ex_A4_human_gate — hello-world for spec 014's HUMAN-AS-CONDITION-SOURCE case (A4).
#
# Deliberately the SAME 3-way language branch as ex_A2_branch, so the ONLY variable
# between the two fixtures is WHO decides: A2's `language` step infers it from the
# launch message; here a HUMAN types it at a review gate.
#
#   1. ask          "(awaiting language choice)"   ← a placeholder the human overwrites
#        |
#   2. pick-language   gates: [human, conditional]
#        |   PRE  human gate  -> run pauses; the human's approve-with-edits payload, a
#        |                       {"decision": ...} JSON string, replaces `ask`'s output
#        |                       (a NEW artifact version)
#        |   generates        -> consumes route_decision, emits {"decision": ...}
#        |   POST conditional -> routes on `ask`'s artifact (condition_agent: ask), NOT
#        |                       on the line it just generated
#        |
#        |__ english ___> 3a. say-hello   "Hello, world!"
#        |__ spanish ___> 3b. say-hola    "Hola, mundo!"
#        |__ dutch   ___> 3c. say-hallo   "Hallo, wereld!"
#
# WHY IT IS SHAPED THIS WAY — the review gate has only three outcomes (engine.py
# _run_review_gate): approve, reject, and approve-with-edits. Only the last carries the
# human's text, and `_apply_declared_gate_edit` writes it to the PREVIOUS step's typed
# artifact. So a human cannot hand text forward directly; they can only overwrite the
# artifact of the step being reviewed. `ask` exists to BE that artifact — a slot whose
# placeholder the human replaces. The edit lands as a new ref version and
# `_latest_typed_content` serves it (ART-03) to the conditional gate, which reads
# `ask` directly and parses it as strict JSON: the answer must be
# {"decision": "<outcome>"}, and a bare word blocks the gate and fails the run.
#
# NOTE both gates sit on ONE step on purpose: `human` is a PRE-step gate and
# `conditional` is POST-step (`_POST_STEP_GATES`), and `_evaluate_gates` filters by
# phase — so they fire on opposite sides of the same generation without interfering.
#
# `condition_agent: ask` (ADR-0026) points the gate at the human's answer, not at
# pick-language's reply. Routing on that reply made a model re-emit a decision the
# human already made, and the run failed closed whenever it answered with prose.
# pick-language's own output is NOT read by the gate.
#
# ORDERING: every step after `ask` declares `depends_on` explicitly. `consumes` gives the
# resolver a REAL dag edge (ask -> pick-language, artifact_type human_choice), and it then
# re-sorts the manifest — the three branch steps have no edges of their own, so on the
# first run they floated AHEAD of pick-language. Execution order came out
# ask, say-hello, say-hola, say-hallo, pick-language; say-hello is a leaf, so the run
# ended at step 2 and the human gate never fired. ex_A2_branch never hits this because it
# declares no `consumes` and therefore has no edges at all. Per ADR-0004 a declared
# depends_on overrides the inferred DAG where they disagree, so pinning the chain is the fix.
#
# Approve WITHOUT editing and the placeholder survives; pick-language then has no real
# choice to read and the run ends at the gate with no matching outcome (there is no
# default_next, by design — same as A2).

id: ex_A4_human_gate
user_launchable: true
is_beta: false
display_name: "Let a reviewer choose the path"
short_name: Human Gate
icon: GitBranch
description: "The run pauses at a review gate and a person picks which branch comes next."
version: 1
planner: skip
clarify:
  mode: skip
  defaults: []
deliverable:
  strategy: single_file
  name: greeting.md
context_providers: []
seed_files: {}
capabilities:
  internet: false
limits:
  wall_clock_seconds: 300

steps:
- agent: custom-agent
  instance_id: ask
  name: Ask For Language
  # The human's chip click is written HERE by the pre-step gate edit
  # (_apply_declared_gate_edit rewrites the PREVIOUS step's artifact), so this
  # step — not pick-language — is the real decision source. R-27 requires the
  # source to declare the typed kind the conditional gate reads.
  produces: ["route_decision"]
  prompt: 'Respond with exactly: "(awaiting language choice)"'
  gates: []
  tools:
    read_files: false
    write_files: false
    exec: false

- agent: custom-agent
  instance_id: pick-language
  name: Pick Language
  produces: ["route_decision"]
  consumes: ["route_decision"]   # ask now produces this kind (see its comment)
  depends_on: ["custom-agent:ask"]
  prompt: |
    The human's language choice is shown above. Map it to one of three languages and reply with the JSON as your text answer — this must be your reply, not a file. Respond with exactly one line, no markdown, no code fences, no explanation. Use exactly one of:
    {"decision": "english"}
    {"decision": "spanish"}
    {"decision": "dutch"}
  gates:
  # PRE-step: pauses before this step generates and reviews the PREVIOUS step's
  # output, so the human's edit becomes THIS step's input. Spelled `human` until the
  # HITL split; `human` now means the POST-step review of a step's OWN output, which
  # is a different thing and would break this fixture.
  - before-human
  - conditional
  route:
    # Read the HUMAN's choice, not this step's model output. Without this the
    # gate reads pick-language's reply, which means a model has to re-emit a
    # decision the human already made — observed live: it answered "Hola"
    # instead of {"decision":"spanish"} and the run failed closed.
    condition_agent: ask
    outcomes:
      english: {trigger: step, target: say-hello}
      spanish: {trigger: step, target: say-hola}
      dutch:   {trigger: step, target: say-hallo}
    # No default_next — an unrecognised choice terminates the run here.
  tools:
    read_files: false
    write_files: false
    exec: false

- agent: custom-agent
  instance_id: say-hello
  depends_on: ["custom-agent:pick-language"]
  name: Say Hello
  prompt: 'Respond with exactly: "Hello, world!"'
  gates: []
  tools:
    read_files: false
    write_files: false
    exec: false

- agent: custom-agent
  instance_id: say-hola
  depends_on: ["custom-agent:pick-language"]
  name: Say Hola
  prompt: 'Respond with exactly: "Hola, mundo!"'
  gates: []
  tools:
    read_files: false
    write_files: false
    exec: false

- agent: custom-agent
  instance_id: say-hallo
  depends_on: ["custom-agent:pick-language"]
  name: Say Hallo
  prompt: 'Respond with exactly: "Hallo, wereld!"'
  gates: []
  tools:
    read_files: false
    write_files: false
    exec: false

name: Human Gate
