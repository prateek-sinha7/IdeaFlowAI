id: prototype_revision
user_launchable: false
is_beta: true
display_name: Revise prototype
short_name: Prototype Revision
description: Apply a revision instruction to a prior interactive prototype.
icon: Layout
version: 1
# ISS-050 / KAN-156: planner changed from run to skip. The derived alias
# prototype_output → prototype_revision is reachable from the generic
# chat-lane revision channel (route_chat_turn / CHANNEL_REVISION, Phase 29).
# CR-02 at engine.py:5906 rejects any planner: run target pre-dispatch.
# Skipping the planner is safe: the agent receives the real original artifact
# + instruction directly via revision_context — the planner call was low-value
# here. Matches the already-live ppt_revision / od_ppt_revision precedent.
# clarify.mode: skip was already correct and stays unchanged.
planner: skip
clarify:
  mode: skip
  defaults:
  - target_audience
  - key_objectives
  - scope
  - priority
deliverable:
  strategy: single_file
  name: prototype.html
  revises_existing: true
context_providers:
- previous_run
- uploaded_files
seed_files: {}
steps:
# Step 0: Analyze the revision and produce a solution plan
- agent: prototype-revision-analyzer
  strategy: single_shot
  gates: []
  produces_solution_plan: true
  tools: {read_files: false}

# Step 1: Apply the revision (was step 0)
- agent: prototype-revision-agent
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates:
  - validation
  validators:
  - html_static
  - html_render
  require_render: true
  post_step: revision_validation
- agent: prototype-validate
  tools: {read_files: true, write_files: true}
  strategy: single_shot
  gates: []
name: Prototype Revision
