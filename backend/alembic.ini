# Flowin Alembic configuration.
#
# The DB URL is intentionally NOT set here. ``alembic/env.py`` reads
# ``DATABASE_URL`` from ``app.core.config.settings`` at runtime so we have a
# single source of truth: the same env-driven config the application uses.
# Hardcoding ``sqlalchemy.url`` here would let dev/prod drift silently.
#
# A test or operator may still override it on the CLI with
# ``-x sqlalchemy.url=...`` or by editing the configured Config object
# programmatically (see backend/tests/unit/test_alembic.py).

[alembic]
# path to migration scripts (relative to this file)
script_location = alembic

# template used to generate migration file names
# default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone left at default (localtime).

# version path separator; "os" uses os.pathsep on the running OS.
version_path_separator = os

# sqlalchemy.url is intentionally left empty. env.py supplies it from
# app.core.config.settings.DATABASE_URL. Do NOT set this here.
# sqlalchemy.url =


[post_write_hooks]
# No post-write hooks configured. Add black/ruff here if/when the project
# adopts a formatter.


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
