<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Admin</title>
<style>
  :root {
    --bg: #fafaf7; --fg: #1a1a18; --accent: #c96442;
    --surface: #ffffff; --border: #e2e0da; --muted: #6b6a66;
    --font-body: system-ui, sans-serif;
  }
  body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--fg); }
  .topbar { padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topbar h1 { margin: 0; font-size: 16px; }
  .layout { display: flex; }
  .sidebar { width: 180px; padding: 16px; border-right: 1px solid var(--border); }
  .nav-item { display: block; padding: 8px 10px; color: var(--fg); text-decoration: none; border-radius: 6px; }
  .nav-item.active { background: var(--accent); color: var(--surface); }
  main { flex: 1; padding: 20px; }
  section[data-page] { display: none; }
  section[data-page].is-active { display: block; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
  button { padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--accent); color: var(--surface); cursor: pointer; }
  label { display: block; margin: 10px 0 4px; color: var(--muted); }
  input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div class="topbar"><h1>Acme Admin</h1></div>
<div class="layout">
  <nav class="sidebar">
    <a class="nav-item" href="#/dashboard">Dashboard</a>
    <a class="nav-item" href="#/settings">Settings</a>
  </nav>
  <main>
    <section id="dashboard" data-page="dashboard" class="is-active">
      <h2>Dashboard</h2>
      <table>
        <tr><th>Metric</th><th>Value</th></tr>
        <tr><td>Active users</td><td>1,204</td></tr>
        <tr><td>Open orders</td><td>87</td></tr>
        <tr><td>Revenue (7d)</td><td>$12,430</td></tr>
      </table>
    </section>
    <section id="settings" data-page="settings">
      <h2>Settings</h2>
      <form>
        <label for="org">Organization name</label>
        <input id="org" value="Acme Inc.">
        <label for="email">Contact email</label>
        <input id="email" value="ops@acme.test">
        <p><button type="button" id="save-btn">Save</button></p>
      </form>
      <!-- NOTE: the Save button intentionally has NO handler — this is the
           "dead button" the S1 revision instruction targets. -->
    </section>
  </main>
</div>
<script>
  const routes = { dashboard: '#/dashboard', settings: '#/settings' };
  function route() {
    const hash = location.hash || '#/dashboard';
    const id = hash.replace('#/', '');
    document.querySelectorAll('section[data-page]').forEach(function (s) {
      s.classList.toggle('is-active', s.dataset.page === id);
    });
    document.querySelectorAll('.nav-item').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('href') === hash);
    });
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('load', route);
</script>
</body>
</html>
