# Scenario matrix for the revision-fulfillment evals (design.md D-05).
# Intent lives here; the scripted tool-call mechanics live in
# test_scenarios.py keyed by these ids.
#
# status today (pre-fix):
#   S1/S2 — the pipeline reports success while the instruction is unmet
#           → their eval tests are xfail(strict=True) until Phase 3 lands.
#   S3   — genuinely satisfied; must stay green before AND after the fix.

scenarios:
  - id: S1
    name: no-op edit
    instruction: "Make the Save button on Settings actually save"
    scripted_behavior: >
      The revision agent edits an unrelated HTML comment (structurally clean,
      zero new static/console issues) and reports success. The Save button
      still has no handler.
    desired: >
      The pipeline detects the instruction was not satisfied and retries the
      revision agent with the residual; the delivered prototype.html wires the
      Save button to a real handler.
    today: passes-silently   # FINDINGS A2 — selection has no fulfillment lane

  - id: S2
    name: partial fix
    instruction: "Add a Reports page reachable from the sidebar"
    scripted_behavior: >
      The agent adds the <section data-page="reports"> AND the routes-map
      entry, but never adds the sidebar nav link — the page exists and the
      route resolves, so static_check sees only an advisory warning (section
      with no nav entry) and render_check sees no dead nav. "Reachable from
      the sidebar" is unmet.
    desired: >
      The fulfillment check flags the missing sidebar link; the retry adds
      the nav item.
    today: passes-silently

  - id: S3
    name: control / happy path
    instruction: "Change the topbar title to 'Acme Console'"
    scripted_behavior: >
      The agent performs exactly the requested edit.
    desired: >
      No retry fires; exactly one revision-agent invocation; the run
      completes with the edit applied. Guards the common case against the
      fix adding cost or regressions.
    today: passes
