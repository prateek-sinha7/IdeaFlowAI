<div class="form-container">
  <p class="stage-label">Stage 1: Crimson</p>
  <h1>Screen 2: Beacon</h1>
  <p class="subtitle">Chroma Quote Workbench — Module: Crimson</p>
  <p class="purpose">Confirms the coverage limits and optional add-ons for the quote.</p>
  
  <form id="beacon-form">
    <!-- Liability Limit Dropdown -->
    <div class="form-group">
      <label for="beacon-liability-limit">Liability Limit <span class="mandatory">*</span></label>
      <select id="beacon-liability-limit" class="form-input" required>
        <option value="">-- Select Liability Limit --</option>
        <option value="50000">$50,000</option>
        <option value="100000">$100,000</option>
        <option value="300000">$300,000</option>
        <option value="500000">$500,000</option>
      </select>
    </div>

    <!-- Deductible Dropdown -->
    <div class="form-group">
      <label for="beacon-deductible">Deductible <span class="mandatory">*</span></label>
      <select id="beacon-deductible" class="form-input" required>
        <option value="">-- Select Deductible --</option>
        <option value="250">$250</option>
        <option value="500">$500</option>
        <option value="1000">$1,000</option>
      </select>
    </div>

    <!-- Roadside Assistance Checkbox -->
    <div class="form-group checkbox-group">
      <input type="checkbox" id="beacon-roadside" name="roadside">
      <label for="beacon-roadside">Add Roadside Assistance</label>
    </div>

    <!-- Rental Reimbursement Checkbox -->
    <div class="form-group checkbox-group">
      <input type="checkbox" id="beacon-rental" name="rental">
      <label for="beacon-rental">Add Rental Reimbursement</label>
    </div>

    <!-- Tagline -->
    <p class="tagline tagline-italic">
      A beacon does not move; it simply refuses to go out.
    </p>

    <!-- Error Message -->
    <div id="beacon-error-message" class="error-message" style="display: none;"></div>

    <!-- Buttons -->
    <div class="button-group">
      <button type="button" class="btn btn-secondary" onclick="navigateTo(1)">Back</button>
      <button type="button" id="beacon-continue-btn" class="btn btn-primary" disabled>Continue</button>
    </div>
  </form>
</div>

<script>
(function() {
  const form = document.getElementById('beacon-form');
  const liabilitySelect = document.getElementById('beacon-liability-limit');
  const deductibleSelect = document.getElementById('beacon-deductible');
  const roadsideCheckbox = document.getElementById('beacon-roadside');
  const rentalCheckbox = document.getElementById('beacon-rental');
  const continueBtn = document.getElementById('beacon-continue-btn');
  const errorMessage = document.getElementById('beacon-error-message');

  // Helper function to validate the form
  function validateForm() {
    errorMessage.style.display = 'none';
    errorMessage.textContent = '';

    const liabilityValue = liabilitySelect.value;
    const deductibleValue = deductibleSelect.value;

    // Check mandatory fields
    if (!liabilityValue) {
      errorMessage.textContent = 'Liability Limit is required.';
      errorMessage.style.display = 'block';
      continueBtn.disabled = true;
      return false;
    }

    if (!deductibleValue) {
      errorMessage.textContent = 'Deductible is required.';
      errorMessage.style.display = 'block';
      continueBtn.disabled = true;
      return false;
    }

    // Validate deductible is lower than liability limit
    if (!validateDeductibleBelowLiabilityLimit(deductibleValue, liabilityValue)) {
      errorMessage.textContent = 'Deductible must be lower than the Liability Limit.';
      errorMessage.style.display = 'block';
      continueBtn.disabled = true;
      return false;
    }

    continueBtn.disabled = false;
    return true;
  }

  function validateDeductibleBelowLiabilityLimit(deductible, liability) {
    return parseInt(deductible) < parseInt(liability);
  }

  // Event listeners for form inputs
  liabilitySelect.addEventListener('change', function() {
    window.beaconLiability = this.value;
    validateForm();
  });

  deductibleSelect.addEventListener('change', function() {
    window.beaconDeductible = this.value;
    validateForm();
  });

  roadsideCheckbox.addEventListener('change', function() {
    window.beaconRoadside = this.checked;
  });

  rentalCheckbox.addEventListener('change', function() {
    window.beaconRental = this.checked;
  });

  // Continue button handler
  continueBtn.addEventListener('click', function() {
    if (validateForm()) {
      window.beaconLiability = liabilitySelect.value;
      window.beaconDeductible = deductibleSelect.value;
      window.beaconRoadside = roadsideCheckbox.checked;
      window.beaconRental = rentalCheckbox.checked;
      navigateTo(3);
    }
  });

  // Initialize form with stored values (if any)
  if (window.beaconLiability) {
    liabilitySelect.value = window.beaconLiability;
  }
  if (window.beaconDeductible) {
    deductibleSelect.value = window.beaconDeductible;
  }
  if (window.beaconRoadside) {
    roadsideCheckbox.checked = window.beaconRoadside;
  }
  if (window.beaconRental) {
    rentalCheckbox.checked = window.beaconRental;
  }

  // Initial validation
  validateForm();
})();
</script>
