# GitLab CI for Flowin — see docs/SIMPLE_AWS_DEPLOYMENT.md §12.1 for the
# release procedure this pipeline implements.
#
# Required CI variables (Settings → CI/CD → Variables):
#   AWS_ACCOUNT_ID   — 12-digit AWS account hosting prod
#   AWS_ROLE_ARN     — IAM role the pipeline assumes via OIDC (preferred) or
#                      a static key pair AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#   DEPLOY_HOST      — public DNS / EIP of the production EC2
#   DEPLOY_FQDN      — public FQDN the frontend is reachable at (NEXT_PUBLIC_*)
#   DEPLOY_SSH_KEY   — file-type variable; private key for flowin-deploy@$DEPLOY_HOST
#
# The deploy job ONLY runs on `main` and requires manual approval — single-EC2
# topology has no blue/green; auto-deploy is a foot-gun. Rollback procedure is
# in docs/SIMPLE_AWS_DEPLOYMENT.md §12.3.

stages:
  - lint
  - test
  - build_and_deploy

variables:
  AWS_REGION: eu-central-1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# ─── Backend ────────────────────────────────────────────────────────────

backend:lint:
  stage: lint
  image: python:3.13-slim
  cache:
    key: pip-py313
    paths: [.pip-cache/]
  before_script:
    - pip install --cache-dir .pip-cache -r backend/requirements.txt
    # Dev tooling (pinned): ruff + import-linter + vulture. Installing the dev
    # file (instead of a one-off ruff pin) brings the import-boundary +
    # dead-code gates into CI with the SAME versions devs run locally. (003 §31
    # / SAFE-05 / D-11 / D-13 / D-17)
    - pip install --cache-dir .pip-cache -r backend/requirements-dev.txt
  script:
    - cd backend && ruff check app/
    # import-linter: kernel import-boundary contract (reads pyproject
    # [tool.importlinter]; green scaffold today, tightens in Phase 7/8).
    - cd backend && lint-imports
    # vulture: dead-code / orphaned-symbol scan (reads pyproject [tool.vulture];
    # allow-listed so framework entrypoints do not false-fail).
    - cd backend && vulture app/ agents/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Offline safety-net ratchets (003 SAFE-07 / D-16 / D-17). CRITICAL: the
# existing backend:test runs ONLY tests/unit, so the tests/agents
# characterization, migration-ledger, and banned-pattern gates are NOT run in
# CI without this job — the entire Phase-1 safety net would be false-green.
# This job is fully OFFLINE (no DB / API key / Bedrock vars): the scripted-model
# harness drives the engine end-to-end without network. Kept in the `test`
# stage so the ledger + banned-pattern tests act as hard ratchets.
backend:characterization:
  stage: test
  image: python:3.13-slim
  cache:
    key: pip-py313
    paths: [.pip-cache/]
  variables:
    ENV: "test"
  before_script:
    - pip install --cache-dir .pip-cache -r backend/requirements.txt
  script:
    - cd backend && python -m pytest
        tests/agents/test_characterization_prototype.py
        tests/agents/test_characterization_od_prototype.py
        tests/agents/test_characterization_prototype_revision.py
        tests/agents/test_characterization_od_ppt.py
        tests/agents/test_characterization_app_builder.py
        tests/agents/test_migration_ledger.py
        tests/agents/test_banned_patterns.py
        -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

backend:test:
  stage: test
  image: python:3.13-slim
  cache:
    key: pip-py313
    paths: [.pip-cache/]
  variables:
    DATABASE_URL: "sqlite:///./test.db"
    SECRET_KEY: "ci-test-secret-key-not-for-production-use-only"
    AWS_REGION: "eu-central-1"
    BEDROCK_INFERENCE_PROFILE_ID: "eu.anthropic.claude-haiku-4-5-20251001-v1:0"
    BEDROCK_MODEL_ID: "anthropic.claude-haiku-4-5-20251001-v1:0"
    ENV: "test"
  before_script:
    - pip install --cache-dir .pip-cache -r backend/requirements.txt
  script:
    - cd backend && python -m pytest tests/unit -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Frontend ───────────────────────────────────────────────────────────

frontend:lint:
  stage: lint
  image: node:20-alpine
  cache:
    key: npm-node20
    paths: [frontend/.npm-cache/]
  before_script:
    - cd frontend && npm ci --cache .npm-cache --prefer-offline
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

frontend:typecheck:
  stage: test
  image: node:20-alpine
  cache:
    key: npm-node20
    paths: [frontend/.npm-cache/]
  before_script:
    - cd frontend && npm ci --cache .npm-cache --prefer-offline
  script:
    - npx tsc --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Build + push + deploy ──────────────────────────────────────────────

build_and_deploy:
  stage: build_and_deploy
  image: docker:27
  services:
    - docker:27-dind
  variables:
    ECR_REGISTRY: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    BACKEND_REPO: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/flowin-prod-backend
    FRONTEND_REPO: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/flowin-prod-frontend
  before_script:
    - apk add --no-cache aws-cli openssh-client
    - aws ecr get-login-password --region "$AWS_REGION"
        | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
    - chmod 0600 ~/.ssh/id_ed25519
  script:
    - export TAG="v$(date -u +%Y%m%d)-$CI_COMMIT_SHORT_SHA"
    - echo "Building $TAG"
    # Backend — no build args
    - docker build -t "$BACKEND_REPO:$TAG" backend/
    # Frontend — FQDN baked in at build time (Next public env)
    - docker build
        --build-arg NEXT_PUBLIC_API_URL="https://$DEPLOY_FQDN"
        --build-arg NEXT_PUBLIC_WS_URL="wss://$DEPLOY_FQDN/ws/chat"
        -t "$FRONTEND_REPO:$TAG" frontend/
    - docker push "$BACKEND_REPO:$TAG"
    - docker push "$FRONTEND_REPO:$TAG"
    # SSH to the EC2 and update /etc/flowin/app.env to point at the new tags,
    # then restart. The wrapper script (flowin-update-image-tag) validates
    # inputs; the sudoers stanza permits only that command + the systemctl
    # restart (see docs §12.1 + Appendix D §13).
    - |
      ssh -o StrictHostKeyChecking=accept-new flowin-deploy@$DEPLOY_HOST <<EOF
        set -e
        sudo /usr/local/bin/flowin-update-image-tag backend  "$BACKEND_REPO:$TAG"
        sudo /usr/local/bin/flowin-update-image-tag frontend "$FRONTEND_REPO:$TAG"
        sudo systemctl restart flowin-app.service
      EOF
  environment:
    name: production
    url: https://$DEPLOY_FQDN
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
