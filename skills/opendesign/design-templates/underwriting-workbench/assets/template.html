const routes = {
  accounts: '#/accounts',
  account: '#/account',
  txn: '#/txn',
  submissions: '#/submissions',
  tasks: '#/tasks',
  reports: '#/reports'
};
function navigateTo(pageId){ window.location.hash = routes[pageId] || ('#/' + pageId); }
function handleRouteChange(){
  const hash = window.location.hash.replace(/^#\/?/, '') || 'accounts';
  document.querySelectorAll('section[data-page]').forEach(function(s){ s.classList.remove('is-active'); });
  const page = document.querySelector('section[data-page="' + hash + '"]');
  if (page) page.classList.add('is-active');
  document.querySelectorAll('a[data-page-link]').forEach(function(a){ a.classList.remove('active'); });
  const navKey = (hash === 'account' || hash === 'txn') ? 'accounts' : hash;
  document.querySelectorAll('a[data-page-link="' + navKey + '"]').forEach(function(a){ a.classList.add('active'); });
  render();
}
function render(){ /* [REPLACE] repaint the active page from `store` */ }
function closeModal(){ document.querySelectorAll('.overlay').forEach(function(o){ o.classList.remove('open'); }); }
function stopProp(e){ e.stopPropagation(); }
window.addEventListener('hashchange', handleRouteChange);
window.addEventListener('load', handleRouteChange);
</script>
