function route(mode,view){ui.mode=mode;if(mode==='consumer'){ui.step=Number(view);if(state.confirmed&&ui.step!==6)ui.step=6;}else ui.backend=view;ui.modal=null;document.getElementById('dialog')?.close();location.hash=mode==='consumer'?`consumer/${ui.step}`:`backend/${view}`;render();window.scrollTo(0,0);}
function readRoute(){const [m,v]=location.hash.slice(1).split('/');if(m==='backend'&&['register','workspace','history'].includes(v)){ui.mode=m;ui.backend=v;}else if(m==='consumer'&&Number.isInteger(Number(v))&&Number(v)>=0&&Number(v)<=6){ui.mode=m;ui.step=state.confirmed?6:Math.min(Number(v),state.completed);}else if(location.pathname.includes('example')){ui.mode='backend';ui.backend='workspace';}else if(state.confirmed){ui.step=6;}}
window.addEventListener('hashchange',()=>{readRoute();render();});readRoute();
const btn=(text,action,cls='primary',attrs='')=>`<button type="button" class="${cls}" data-action="${action}" ${attrs}>${text}</button>`;
const statusBadge=(text,cls='')=>`<span class="badge ${cls}">${text}</span>`;
function demoBar(){return `<div class="demo-bar"><div><span class="demo-dot">●</span><strong>ONE Order</strong> <span class="hide">&nbsp; / &nbsp; Unisys × Iberia &nbsp; / &nbsp; Scenario 02</span></div><div class="demo-controls">${btn('Consumer','consumer','demo-switch '+(ui.mode==='consumer'?'active':''))}${btn('Unisys backend','backend','demo-switch '+(ui.mode==='backend'?'active':''))}${btn('Demo guide','guide','demo-switch')}${btn('Reset','reset','demo-switch')}</div></div>`;}

function progress(){return `<nav class="steps" aria-label="Booking progress">${steps.map((x,i)=>`<button class="step ${i===ui.step?'active':i<ui.step?'done':''}" data-action="step" data-value="${i}" ${i>state.completed||state.confirmed&&i!==6?'disabled':''} ${i===ui.step?'aria-current="step"':''}><i>${i<ui.step?'✓':i+1}</i>${x}</button>`).join('')}</nav>`;}
function flightBlock(f,compact=false){return `<div class="flight"><div class="flight-top"><span>${statusBadge(f.label)} &nbsp; <strong>${f.shortDate}</strong></span><span class="muted">${f.number} · Economy</span></div><div class="route"><div><div class="time">${f.depart}</div><strong>${f.from}</strong> <span class="muted small">${compact?'':f.origin}</span></div><div class="flight-center"><span>${f.duration} · Direct</span><div class="flightline">${ic('plane')}</div><span>Local airport times</span></div><div class="alignright"><div class="time">${f.arrive}</div><strong>${f.to}</strong> <span class="muted small">${compact?'':f.destination}</span></div></div></div>`;}
function summary(){const t=state.confirmed?state.confirmed.totals:totals();return `<aside class="summary"><div class="card"><div class="summary-title">${ic('plane')}<h3>Your journey</h3></div><div class="mini-route"><strong>MAD</strong><span>⇄</span><strong>LHR</strong></div><p class="small muted">Madrid to London Heathrow<br>10 – 13 November 2026 · 2 adults</p><hr><div class="price-row"><span>Return flights <span class="muted">× 2</span></span><strong>${EUR(t.flights)}</strong></div><div class="price-row"><span>Seat selections <span class="muted">× ${lines().filter(x=>x.seat).length}</span></span><strong>${EUR(t.seats)}</strong></div><div class="price-row"><span>Checked baggage</span><strong>${EUR(t.bags)}</strong></div><hr><div class="price-row total-line"><div><strong>Total</strong><div class="muted small">Taxes included · EUR</div></div><span class="total" data-testid="order-total" aria-live="polite">${EUR(t.total)}</span></div>${!state.confirmed&&ui.step>0?btn('View passenger breakdown','breakdown','link'):''}</div><div class="summary-note">${ic('layers')}<div><strong>Two travellers. One order.</strong><br>Individual services, connected in one consistent commercial record.</div></div><div class="small muted secure">${ic('shield')} Simulated booking · No real payment</div></aside>`;}
function actions(nextLabel='Continue',back=true){return `<div class="actions">${back?btn('← Back','back','secondary'):'<span class="small muted">All prices include taxes</span>'}${btn(nextLabel+' '+ic('arrow'),'next','primary')}</div>`;}
function heading(kicker,title,desc){return `<div class="page-heading"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="muted">${desc}</p></div>`;}
function searchView(){return `<section class="search-hero"><div class="hero-overlay"><span class="eyebrow">A little escape. A world of possibilities.</span><h1>London is calling.</h1><p>Two travellers. One unforgettable journey.</p><span class="hero-label">LONDON · UNITED KINGDOM</span></div><div class="search-panel"><div class="search-tabs"><span class="selected">${ic('plane')} FLIGHTS</span><span>RETURN JOURNEY</span><span class="small muted">Economy · Taxes included</span></div><form id="search-form"><div class="search-fields"><div><label for="from">Departure</label><select id="from" name="from"><option value="MAD" ${state.search.from==='MAD'?'selected':''}>Madrid (MAD)</option><option value="LHR" ${state.search.from==='LHR'?'selected':''}>London Heathrow (LHR)</option></select></div><div><label for="to">Destination</label><select id="to" name="to"><option value="LHR" ${state.search.to==='LHR'?'selected':''}>London Heathrow (LHR)</option><option value="MAD" ${state.search.to==='MAD'?'selected':''}>Madrid (MAD)</option></select></div><div><label for="departure">Departure date</label><input id="departure" name="out" type="date" value="${E(state.search.out)}" required></div><div><label for="return">Return date</label><input id="return" name="back" type="date" value="${E(state.search.back)}" required></div><div><label for="adults">Passengers</label><select id="adults" name="adults"><option value="2" ${state.search.adults==='2'?'selected':''}>2 adults</option><option value="1" ${state.search.adults==='1'?'selected':''}>1 adult</option><option value="3" ${state.search.adults==='3'?'selected':''}>3 adults</option></select></div><button type="submit" class="primary search-btn">Search flights ${ic('search')}</button></div></form><div class="search-bottom"><span>Round trip &nbsp; · &nbsp; Economy</span>${btn('Restore scenario details','restore-search','link')}</div></div></section><div class="intro-grid"><div><span class="intro-number">01</span><h3>Choose your journey</h3><p class="muted small">Return economy fares with taxes and cabin baggage included.</p></div><div><span class="intro-number">02</span><h3>Make it yours</h3><p class="muted small">Pick seats and baggage separately for each traveller and flight.</p></div><div><span class="intro-number">03</span><h3>Everything in one order</h3><p class="muted small">One reference connects your journey, services and payment.</p></div></div><div class="search-offer"><div>${statusBadge('SCENARIO 02')}<h2>Madrid ⇄ London Heathrow</h2><p class="muted">10 – 13 November 2026 &nbsp; · &nbsp; 2 adults &nbsp; · &nbsp; Direct flights</p></div><div class="alignright"><span class="muted small">Return fare per adult</span><div class="total">€280</div><span class="small muted">€560 for two adults</span></div></div>`;}
function offerView(){return heading('Choose your flights','Your next stop: London','A return journey for two, with room to make it your own.')+`<div class="card offer"><span class="offer-tag">${state.offer?'✓ Selected offer':'Available return offer'}</span><div class="offer-heading"><div><h2>Economy</h2><span class="small muted">Madrid ⇄ London Heathrow · 2 adults</span></div><div class="alignright"><div class="total">€280 <span class="small muted">/ adult</span></div><strong>€560 total return</strong></div></div>${flights.map(f=>flightBlock(f)).join('')}<div class="checklist"><span>Taxes included</span><span>Cabin baggage included</span><span>Seats and checked bags optional</span></div><div class="actions">${btn('Fare details','fare-details','link')}${btn(state.offer?'✓ Return offer selected':'Select return offer','select-offer',state.offer?'selected-button':'primary')}</div></div><div class="notice">${ic('info')} Prices are simulated for this demonstration. €280 covers both flights for one adult.</div>${actions('Traveller details')}`;}
function travellersView(){return heading('Your travelling companions','Who’s coming along?','Each traveller gets their own services, all connected to one order.')+`<form id="traveller-form">${state.passengers.map((p,i)=>`<div class="card"><div class="traveller-header"><div class="avatar">${E(initials(p))}</div><div><h3>Adult ${i+1} · ${E(name(p))}</h3><div class="small muted">Passenger ${i+1} of 2</div></div>${statusBadge('Return economy · €280')}</div><div class="grid2"><div class="field"><label for="${p.id}-first">First name</label><input id="${p.id}-first" name="${p.id}-first" value="${E(p.first)}" required maxlength="40" autocomplete="off"></div><div class="field"><label for="${p.id}-last">Last name</label><input id="${p.id}-last" name="${p.id}-last" value="${E(p.last)}" required maxlength="40" autocomplete="off"></div></div><div><label for="${p.id}-email">Demo email</label><input id="${p.id}-email" name="${p.id}-email" type="email" value="${E(p.email)}" required autocomplete="off"></div></div>`).join('')}<div class="notice">${ic('shield')} Use fictional details only. Nothing is submitted to an airline.</div><div class="actions">${btn('← Back','back','secondary')}<button type="submit" class="primary">Choose your seats ${ic('arrow')}</button></div></form>`;}
function flightTabs(){return `<div class="tabs" role="group" aria-label="Choose flight">${flights.map(f=>`<button class="${ui.flight===f.id?'active':''}" data-action="flight" data-value="${f.id}" aria-pressed="${ui.flight===f.id}">${ic('plane')}<span><strong>${f.label} · ${f.from} → ${f.to}</strong><br><span class="small">${f.shortDate} · ${f.number}</span></span></button>`).join('')}</div>`;}
function personTabs(){return `<div class="selector" role="group" aria-label="Choose traveller">${state.passengers.map(p=>`<button class="person ${ui.passenger===p.id?'active':''}" data-action="passenger" data-value="${p.id}" aria-pressed="${ui.passenger===p.id}"><span class="avatar">${E(initials(p))}</span><span><strong>${E(name(p))}</strong><br><span class="small muted">${ui.step===3?(state.seats[p.id][ui.flight]?'Seat '+state.seats[p.id][ui.flight]:'Choose a seat'):(state.bags[p.id][ui.flight]?'1 checked bag · 23 kg':'No checked baggage')}</span></span>${ui.passenger===p.id?'<span class="select-indicator">✓</span>':''}</button>`).join('')}</div>`;}
function seatsView(){const p=state.passengers.find(x=>x.id===ui.passenger),f=flights.find(x=>x.id===ui.flight);return heading('A place for everyone','Choose your favourite seat','Select a traveller and a flight. Each seat selection is €18.')+flightTabs()+personTabs()+`<div class="card seat-card"><div class="seat-area"><div class="plane-wrap"><div class="plane-label">FRONT OF AIRCRAFT</div><div class="plane"><div class="cockpit"></div><div class="seatrow letters">${['A','B','C','','D','E','F'].map(x=>`<span>${x}</span>`).join('')}</div>${[10,11,12,13,14,15].map(r=>`<div class="seatrow">${['A','B','C','row','D','E','F'].map(c=>{if(c==='row')return `<span class="num">${r}</span>`;const seat=r+c,owner=state.passengers.find(x=>state.seats[x.id][ui.flight]===seat),blocked=['10A','10F','11D','14B','14E','15F'].includes(seat);return `<button class="seat ${blocked?'blocked':owner?.id===ui.passenger?'selected':owner?'other':''}" data-action="seat" data-value="${seat}" ${blocked||owner&&owner.id!==ui.passenger?'disabled':''} aria-label="Seat ${seat}${blocked?' unavailable':owner?' assigned to '+E(name(owner)):' available, €18'}" title="${seat} · ${blocked?'Unavailable':owner?E(name(owner)):'€18'}">${owner?E(initials(owner)):blocked?'×':seat}</button>`;}).join('')}</div>`).join('')}<div class="wing-label">ECONOMY · ILLUSTRATIVE SEAT MAP</div></div><div class="legend"><span><i></i>Available</span><span><i class="red"></i>Selected</span><span><i class="gold"></i>Companion</span></div></div><div class="seat-detail"><span class="eyebrow">Your selection</span><h2>${E(name(p))}</h2><p class="muted small">${f.label} · ${f.number}<br>${f.from} → ${f.to} · ${f.shortDate}</p><div class="selected-seat">${ic('seat')}<strong>${state.seats[p.id][f.id]||'—'}</strong><span>${state.seats[p.id][f.id]?EUR(18):'No seat selected'}</span></div>${state.seats[p.id][f.id]?btn('Remove this seat','remove-seat','link'):''}<hr><h3>Scenario seats</h3><p class="small muted">Elena: 12A on both flights.<br>Alex: 12B on both flights.</p>${btn('Apply all scenario seats','scenario-seats','secondary full')}<div class="notice">${ic('info')} Your choice only updates this traveller on this flight.</div></div></div></div><div class="card compact"><div class="section-title"><h3>Seat assignments</h3><span class="small muted">${lines().filter(x=>x.seat).length} of 4 selected · ${EUR(totals().seats)}</span></div>${assignmentTable('seats')}</div>${actions('Choose baggage')}`;}
function bagView(){const p=state.passengers.find(x=>x.id===ui.passenger),f=flights.find(x=>x.id===ui.flight),bag=state.bags[p.id][f.id];return heading('Pack for your plans','Your baggage, your choice','Add checked baggage separately for each traveller and each flight.')+flightTabs()+personTabs()+`<div class="card"><div class="section-title"><div><span class="eyebrow">${f.label} · ${f.from} → ${f.to}</span><h2 style="margin-top:8px">${E(name(p))}’s baggage</h2></div>${ic('bag','large-icon')}</div><div class="included-strip">${ic('check')} Cabin baggage is included in your economy fare</div>${[0,1].map(n=>`<button class="bag-option ${bag===n?'active':''}" data-action="bag" data-value="${n}" aria-pressed="${bag===n}"><span class="radio-dot">${bag===n?'●':''}</span>${ic('bag','large-icon')}<span><strong>${n?'1 checked bag · 23 kg':'No checked baggage'}</strong><br><span class="small muted">${n?'One piece, up to 23 kg · This flight only':'Travel with your included cabin baggage'}</span></span><span class="right"><strong>${EUR(n*35)}</strong><br><span class="small muted">${n?'per passenger / flight':'Included'}</span></span></button>`).join('')}<div class="notice">${ic('info')} Editing ${E(p.first)}’s ${f.label.toLowerCase()} bag does not change the other traveller or flight.</div></div><div class="card compact"><div class="section-title"><h3>Checked baggage across your journey</h3>${btn('Apply scenario baggage','scenario-bags','link')}</div>${assignmentTable('bags')}<p class="small muted">Scenario: Elena has one 23 kg outbound bag; all other checked baggage entitlements are zero.</p></div>${actions('Review your journey')}`;}
function assignmentTable(kind,order=null){const l=order?order.services:lines();return `<div class="table-scroll"><table><thead><tr><th>Traveller</th><th>Outbound · IB 0711</th><th>Return · IB 0712</th></tr></thead><tbody>${(order?order.passengers:state.passengers).map(p=>`<tr><td><strong>${E(name(p))}</strong></td>${flights.map(f=>{const x=l.find(x=>x.passengerId===p.id&&x.flightId===f.id);return `<td>${kind==='seats'?(x.seat?`Seat ${x.seat} <span class="muted small">· €18</span>`:'Not selected'):(x.bag?'<strong>1 × 23 kg</strong> <span class="muted small">· €35</span>':'No checked bag')}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`;}
function breakdown(order=null,editable=false){const ps=order?order.passengers:state.passengers,l=order?order.services:lines();return ps.map(p=>{const rows=l.filter(x=>x.passengerId===p.id),total=280+rows.reduce((a,x)=>a+x.seatPrice+x.bagPrice,0);return `<div class="card passenger-breakdown"><div class="traveller-header"><span class="avatar">${E(initials(p))}</span><div><h3>${E(name(p))}</h3><span class="small muted">Adult · Return economy fare €280</span></div><strong class="passenger-total">${EUR(total)}</strong></div>${rows.map(x=>{const f=flights.find(f=>f.id===x.flightId);return `<div class="journey-service"><div class="service-flight"><strong>${f.from} → ${f.to}</strong><span>${f.shortDate} · ${f.number} · ${f.depart}–${f.arrive}</span></div><div class="entitlement"><span>${ic('check')}Cabin baggage included</span><span>${ic('seat')} ${x.seat?'Seat '+x.seat+' · €18':'No seat selected'}</span><span class="${x.bag?'bag-added':''}">${ic('bag')}${x.bag?'1 × 23 kg checked bag · €35':'No checked bag'}</span></div>${editable?`<div class="edit-service">${btn('Edit seat','edit-seat','link',`data-p="${p.id}" data-f="${f.id}"`)}${btn('Edit baggage','edit-bag','link',`data-p="${p.id}" data-f="${f.id}"`)}</div>`:''}</div>`;}).join('')}</div>`;}).join('');}
function reviewView(){return heading('Almost there','One journey. All the details.','Review each traveller’s services before confirming your simulated booking.')+`<div class="section-title"><h2>Your travellers & services</h2>${btn('Edit travellers','edit-travellers','link')}</div>`+breakdown(null,true)+`<div class="card"><div class="section-title"><h2>${ic('card')} Simulated payment</h2>${statusBadge('DEMO ONLY','blue')}</div><p class="muted small">Use the built-in demo token. No card details or real funds are needed.</p><div class="payment-token">${ic('shield')}<div><strong>Demo payment token</strong><br><span class="small muted">EUR · One consolidated order payment</span></div><strong>${EUR(totals().total)}</strong></div><div class="field"><label for="pay-result">Payment simulation</label><select id="pay-result" data-change="payment"><option value="success" ${ui.payResult==='success'?'selected':''}>Successful payment</option><option value="decline" ${ui.payResult==='decline'?'selected':''}>Declined payment — demonstrate retry</option></select></div><label class="checkbox"><input id="terms" type="checkbox" ${ui.terms?'checked':''} data-change="terms"><span>I understand this is a simulated booking and no real payment will be made.</span></label></div><div class="actions">${btn('← Back','back','secondary')}${btn('Simulate payment · '+EUR(totals().total),'pay','primary')}</div>`;}
function confirmationView(){const o=currentOrder();if(!o)return heading('Your order','Complete your booking first','Your confirmation will appear after simulated payment.')+btn('Continue booking','continue-booking');return `<div class="confirmation-banner"><div class="success">${ic('check')}</div><div><div class="eyebrow">Your journey is confirmed</div><h1>London, here you come.</h1><p class="muted">Two travellers. Individual services. Everything in one order.</p></div></div><div class="card order-confirmation"><div><div class="small muted">Your single order reference</div><div class="ref">${o.reference}</div>${btn('Copy reference','copy-ref','link')}</div><div class="alignright"><span class="small muted">Total paid · Simulated</span><div class="total">${EUR(o.totals.total)}</div><div class="pill-row">${statusBadge(o.status,'green')}${statusBadge(o.payment.status,'blue')}${statusBadge(o.delivery.status,'amber')}</div></div></div><div class="confirmation-flights">${flights.map(f=>`<div class="card compact">${flightBlock(f,true)}</div>`).join('')}</div>${breakdown(o)}<div class="notice">${ic('clock')} Service delivery is Pending. Confirmation records purchased entitlements; it does not mark seats, flights or baggage as delivered.</div><div class="actions">${btn('Download order JSON','download-order','secondary')}${btn('Inspect in Unisys backend '+ic('arrow'),'open-workspace','primary')}</div>`;}
function backendHeader(){return `<header><div class="top"><div class="backend-brand">unisys<span class="brand-mark"></span><span class="brand-sub">AIRLINE COMMERCE</span></div><div class="toplinks"><span class="hide">Order management workspace</span><span class="badge blue">Sandbox</span><span class="operator-avatar">OP</span></div></div></header>`;}
function side(){return `<aside class="side"><div class="eyebrow">ONE Order console</div>${[['register','layers','Order register'],['workspace','plane','Order workspace'],['history','clock','Creation history']].map(([v,i,t])=>btn(ic(i)+t,'backend-view','side-item '+(ui.backend===v?'active':''),`data-value="${v}"`)).join('')}<div class="side-bottom"><div class="small muted">DEMO ENVIRONMENT</div><p class="small">Single commercial record<br>Passenger-level entitlements</p>${btn('Scenario guide','guide','link')}</div></aside>`;}
function backend(){return `<div class="backend">${demoBar()}${backendHeader()}<div class="back-layout">${side()}<main class="wrap">${ui.backend==='register'?registerView():ui.backend==='workspace'?workspaceView():historyView()}</main></div>${footer()}</div>`;}
function emptyBackend(){return `<div class="card empty"><div class="empty-icon">${ic('layers')}</div><h2>No created order yet</h2><p class="muted">Complete the consumer booking, or load the completed scenario to explore.</p><div class="empty-actions">${btn('Continue consumer booking','consumer','secondary')}${btn('Load completed scenario · €667','load-scenario','primary')}</div><p class="small muted">Loading the scenario replaces the current simulated draft.</p></div>`;}
function registerView(){const o=currentOrder();return heading('Operations / Orders','Order register','Find one commercial record and inspect every passenger and service.')+`<div class="metric-grid"><div class="metric"><span class="small muted">Created orders</span><strong>${o?'1':'0'}</strong></div><div class="metric"><span class="small muted">Recorded payment · Simulated</span><strong>${o?EUR(o.totals.total):'€0'}</strong></div><div class="metric"><span class="small muted">Service delivery</span><strong>${o?'Pending':'—'}</strong></div></div><div class="card"><div class="section-title"><h2>Orders</h2>${statusBadge('Mock data only','blue')}</div><form id="order-search" class="search-register"><div><label for="order-query">Order reference or passenger name</label><input id="order-query" name="query" placeholder="Search IB-ORD-26002, Elena or Alex" value="${E(ui.query)}"></div><button class="primary" type="submit">${ic('search')} Find order</button>${btn('Clear','clear-search','secondary')}</form>${o?registerTable(o):''}</div>${o?'':emptyBackend()}`;}
function registerTable(o){const matched=(o.reference+' '+o.passengers.map(name).join(' ')).toLowerCase().includes(ui.query.toLowerCase());return matched?`<div class="table-scroll"><table class="register-table"><thead><tr><th>Order reference</th><th>Travellers & journey</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody><tr><td><button data-action="open-workspace" class="link strong">${o.reference}</button><div class="small muted">ONE Order · EUR</div></td><td><strong>${o.passengers.map(p=>E(name(p))).join('<br>')}</strong><div class="small muted">MAD ⇄ LHR · 10–13 Nov 2026</div></td><td>${statusBadge(o.status,'green')}<div class="small muted">${o.payment.status}</div></td><td><strong>${EUR(o.totals.total)}</strong></td><td>${btn('Open →','open-workspace','secondary')}</td></tr></tbody></table></div>`:`<div class="empty"><h3>No matching orders</h3><p class="muted small">Try IB-ORD-26002, Elena or Alex.</p></div>`;}
function filters(){return `<div class="filter-bar"><span class="small">${ic('filter')} Inspect services</span><div><label class="sr-only" for="filter-passenger">Filter passenger</label><select id="filter-passenger" data-change="filterP"><option value="all">All passengers</option>${state.confirmed.passengers.map(p=>`<option value="${p.id}" ${ui.filterP===p.id?'selected':''}>${E(name(p))}</option>`).join('')}</select></div><div><label class="sr-only" for="filter-flight">Filter flight</label><select id="filter-flight" data-change="filterF"><option value="all">All flights</option>${flights.map(f=>`<option value="${f.id}" ${ui.filterF===f.id?'selected':''}>${f.label} · ${f.number}</option>`).join('')}</select></div>${btn('Reset filters','clear-filters','link')}</div>`;}
function filteredServices(o){return o.services.filter(x=>(ui.filterP==='all'||x.passengerId===ui.filterP)&&(ui.filterF==='all'||x.flightId===ui.filterF));}
function serviceTable(o){const rows=filteredServices(o);return `<div class="table-scroll"><table><thead><tr><th>Passenger / flight</th><th>Flight service</th><th>Seat service</th><th>Checked bag</th><th>Delivery</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${E(x.passenger)}</strong><div class="small muted">${x.flight} · ${x.route}</div></td><td>Economy<div class="small muted">Cabin baggage included</div></td><td>${x.seat?`<strong>${x.seat}</strong><div class="small muted">${EUR(x.seatPrice)}</div>`:'Not selected'}</td><td>${x.bag?`<strong>1 × 23 kg</strong><div class="small muted">€35</div>`:'None'}</td><td>${statusBadge('Pending','amber')}</td><td>${btn('Inspect','inspect','link',`data-p="${x.passengerId}" data-f="${x.flightId}"`)}</td></tr>`).join('')}</tbody></table></div><div class="table-foot small muted">${rows.length} of 4 passenger–flight associations shown · Filters do not change the order total</div>`;}
function workspaceView(){const o=currentOrder();if(!o)return heading('Operations / Order workspace','Order workspace','Inspect passenger and flight service associations.')+emptyBackend();return `<div class="workspace-heading"><div class="breadcrumbs">Order register / Order workspace</div><div class="section-title"><div><h1>${o.reference}</h1><p class="muted">Madrid ⇄ London Heathrow · 2 adults · 10–13 November 2026</p></div>${btn(ic('download')+' Export order','download-order','secondary')}</div><div class="pill-row">${statusBadge(o.status,'green')}${statusBadge(o.payment.status,'blue')}${statusBadge('Delivery '+o.delivery.status,'amber')}</div></div><div class="metric-grid"><div class="metric"><span class="small muted">Order value</span><strong>${EUR(o.totals.total)}</strong><span class="small muted">EUR · Taxes included</span></div><div class="metric"><span class="small muted">Passengers / flight services</span><strong>2 <span class="muted">/</span> 4</strong><span class="small muted">Every passenger on both flights</span></div><div class="metric"><span class="small muted">Ancillary selections</span><strong>${o.services.filter(x=>x.seat).length} seats <span class="muted">·</span> ${o.services.reduce((a,x)=>a+x.bag,0)} bag${o.services.reduce((a,x)=>a+x.bag,0)===1?'':'s'}</strong><span class="small muted">Explicit passenger & flight references</span></div></div><div class="tabs workspace-tabs" role="group" aria-label="Workspace sections">${[['overview','Order overview'],['services','Services & delivery'],['financials','Payment & totals']].map(([v,t])=>btn(t,'order-tab',ui.orderTab===v?'active':'',`data-value="${v}"`)).join('')}</div>${ui.orderTab==='financials'?financials(o):`<div class="layout"><div>${ui.orderTab==='overview'?`<div class="card accepted-offer"><div class="section-title"><h2>Accepted offer</h2>${statusBadge('Accepted','green')}</div><div class="section-title"><div><strong>${o.acceptedOffer.id} · Return economy</strong><p class="small muted">${o.acceptedOffer.description} · Taxes and cabin baggage included</p></div><div class="alignright"><strong class="offer-total">€560</strong><div class="small muted">€280 per adult</div></div></div><div class="flight-chips">${flights.map(f=>`<span>${ic('plane')} ${f.number} · ${f.from} → ${f.to} · ${f.shortDate}</span>`).join('')}</div></div>`:''}<div class="card services-card"><div class="section-title"><h2>Passenger & flight services</h2>${statusBadge('Linked entitlements','blue')}</div>${filters()}${serviceTable(o)}</div></div><aside><div class="card position"><h3>${ic('card')} Payment position</h3><div class="position-value">${EUR(o.payment.amount)}</div>${statusBadge(o.payment.status,'blue')}<p class="small muted">${o.payment.reference}<br>One payment for the entire order.</p>${btn('Inspect payment','payment-detail','link')}</div><div class="card position"><h3>${ic('clock')} Delivery position</h3><div class="position-value">Pending</div><p class="small muted">No services delivered yet.<br>Flights, seats and checked bags are recorded as entitlements.</p>${btn('View creation history →','open-history','link')}</div><div class="summary-note">${ic('layers')}<div><strong>One commercial record</strong><br>The same order powers consumer confirmation and this workspace.</div></div></aside></div>`}`;}
function financials(o){return `<div class="layout"><div><div class="card"><h2>Consolidated financial position</h2><div class="table-scroll"><table><thead><tr><th>Commercial item</th><th>Quantity</th><th>Unit price</th><th>Amount</th></tr></thead><tbody><tr><td>Return economy fare · Taxes included</td><td>2 adults</td><td>€280</td><td>€560</td></tr><tr><td>Seat selections</td><td>${o.services.filter(x=>x.seat).length}</td><td>€18</td><td>${EUR(o.totals.seats)}</td></tr><tr><td>23 kg checked bags</td><td>${o.services.reduce((a,x)=>a+x.bag,0)}</td><td>€35</td><td>${EUR(o.totals.bags)}</td></tr></tbody></table></div><div class="price-row"><strong>Total order value</strong><strong class="total">${EUR(o.totals.total)}</strong></div></div><div class="card"><h2>Passenger allocation</h2>${o.passengers.map(p=>{const ps=o.services.filter(x=>x.passengerId===p.id);return `<div class="price-row"><span>${E(name(p))}<span class="muted small"> · Return fare + individual services</span></span><strong>${EUR(280+ps.reduce((a,x)=>a+x.seatPrice+x.bagPrice,0))}</strong></div>`;}).join('')}</div></div><aside class="card position"><h3>Payment reconciliation</h3><div class="position-value">${EUR(o.payment.amount)}</div>${statusBadge('Simulated paid','blue')}<hr><div class="price-row"><span>Order value</span><strong>${EUR(o.totals.total)}</strong></div><div class="price-row"><span>Recorded payment</span><strong>${EUR(o.payment.amount)}</strong></div><div class="price-row"><span>Outstanding</span><strong>€0</strong></div><p class="small muted">${o.payment.reference}<br>No live payment integration.</p></aside></div>`;}
function historyView(){const o=currentOrder();return heading('Operations / Creation history','From offer to one order','An illustrative creation sequence for the same commercial record.')+(o?`<div class="card history-meta"><div><span class="small muted">Order reference</span><h2>${o.reference}</h2></div><div class="pill-row">${statusBadge('5 events','blue')}${statusBadge(o.status,'green')}${btn('Open order →','open-workspace','link')}</div></div><div class="card"><div class="section-title"><h2>Creation timeline</h2><span class="small muted">Illustrative timestamps · Local display time</span></div><div class="timeline">${state.events.map((ev,i)=>`<div class="event"><div class="section-title"><div><span class="eyebrow">0${i+1} · ${ev.kind}</span><h3>${ev.title}</h3></div><time class="small muted">${new Date(ev.time).toLocaleTimeString('en-GB',{hour12:false})}</time></div><p class="muted">${ev.detail}</p>${btn(ui.expanded===i?'Hide event details':'Inspect event details','event','link',`data-value="${i}"`)}${ui.expanded===i?`<div class="event-payload"><div class="price-row"><span>Correlation</span><code>${o.reference}</code></div><div class="price-row"><span>Event</span><code>EVT-26002-0${i+1}</code></div><div class="price-row"><span>Outcome</span><span>Completed · Simulated</span></div><p class="small muted">${E(ev.time)}</p></div>`:''}</div>`).join('')}</div></div><div class="notice">${ic('info')} This demonstrates ONE Order concepts using mock data, not a production IATA message implementation.</div>`:emptyBackend());}
function footer(){return `<footer class="footer"><span>Iberia-inspired consumer experience · Unisys ONE Order concept demo</span><span>English · EUR · Simulated data only</span></footer>`;}
function render(){document.body.classList.toggle('design-export',new URLSearchParams(location.search).has('design'));document.getElementById('app').innerHTML=ui.mode==='backend'?backend():`${demoBar()}${header()}<main class="wrap">${progress()}${ui.step===0?searchView():ui.step===6?confirmationView():`<div class="layout"><section>${[null,offerView,travellersView,seatsView,bagView,reviewView][ui.step]()}</section>${summary()}</div>`}</main>${footer()}`;if(ui.modal)showModal(ui.modal.title,ui.modal.html,ui.modal.wide,false);}
function showModal(title,html,wide=false,save=true){const old=document.getElementById('dialog');if(old)old.remove();if(save)ui.modal={title,html,wide};const dlg=document.createElement('dialog');dlg.id='dialog';dlg.className=wide?'wide':'';dlg.innerHTML=`<div class="modal-heading"><h2 id="dialog-title">${title}</h2>${btn(ic('close'),'close-modal','close-button','aria-label="Close dialog"')}</div><div class="modal-content">${html}</div>`;dlg.setAttribute('aria-labelledby','dialog-title');document.body.append(dlg);dlg.showModal();dlg.addEventListener('click',e=>{if(e.target===dlg)closeModal();});dlg.addEventListener('close',()=>{ui.modal=null;dlg.remove();});}
function closeModal(){ui.modal=null;document.getElementById('dialog')?.close();}
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),3500);}
function saveTravellers(){const form=document.getElementById('traveller-form');if(!form)return true;if(!form.reportValidity())return false;const fd=new FormData(form);for(const p of state.passengers){p.first=String(fd.get(p.id+'-first')).trim();p.last=String(fd.get(p.id+'-last')).trim();p.email=String(fd.get(p.id+'-email')).trim();if(!p.first||!p.last){toast('Enter a first and last name for each traveller.');return false;}}persist();return true;}
function progressTo(n){state.completed=Math.max(state.completed,n);persist();route('consumer',n);}
function next(){if(ui.step===1&&!state.offer){toast('Please select the return offer first.');return;}if(ui.step===3){const missing=lines().filter(x=>!x.seat);if(missing.length){showModal('Continue without all seats?',`<p>${missing.length} seat selection${missing.length>1?'s are':' is'} still empty. You can continue without optional seats or apply the scenario’s four selections.</p><div class="modal-actions">${btn('Keep choosing seats','close-modal','secondary')}${btn('Continue without seats','skip-seats','primary')}</div>`);return;}}progressTo(ui.step+1);}
function inspect(p,f){const o=currentOrder(),s=o.services.find(x=>x.passengerId===p&&x.flightId===f),flight=flights.find(x=>x.id===f);showModal('Service association',`<span class="badge blue">${o.reference}</span><h2 style="margin-top:20px">${E(s.passenger)}</h2><p class="muted">${flight.label} · ${s.flight} · ${s.route}<br>${flight.date} · ${flight.depart}–${flight.arrive} local</p><div class="association-line">${ic('user')}<span>Passenger <strong>${s.passengerId}</strong></span>${ic('arrow')}${ic('plane')}<span>Flight <strong>${s.flightId}</strong></span></div><div class="price-row"><span>Flight service</span><strong>Economy · Cabin baggage included</strong></div><div class="price-row"><span>Seat</span><strong>${s.seat||'Not selected'} · ${EUR(s.seatPrice)}</strong></div><div class="price-row"><span>Checked baggage</span><strong>${s.bag?'1 × 23 kg':'None'} · ${EUR(s.bagPrice)}</strong></div><hr><div class="price-row"><span>Service delivery</span>${statusBadge('Pending','amber')}</div><p class="small muted">These entitlements belong only to this passenger and this flight.</p>`);}
function guide(){showModal('Your ONE Order demo guide',`<span class="badge blue">SCENARIO 02 · TWO PASSENGERS</span><h2 style="margin-top:18px">Different services. One consistent order.</h2><ol class="guide-list"><li>Search MAD ⇄ LHR, 10–13 November, two adults.</li><li>Select the return economy offer: €280 each, €560 total.</li><li>Review Elena Ruiz and Alex Martin separately.</li><li>Select 12A for Elena and 12B for Alex on both flights. Use “Apply all scenario seats” for a quick demo. Total: €632.</li><li>Add one 23 kg bag to Elena’s outbound only. Total: €667.</li><li>Review each passenger and flight, then simulate payment.</li><li>Open Unisys backend to inspect the same order and its creation history.</li></ol><div class="notice">Scenario controls are shortcuts. Individual selections remain fully editable before confirmation.</div><div class="modal-actions">${btn('Explore current booking','close-modal','secondary')}${btn('Load completed scenario','load-scenario','primary')}</div>`,true);}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;switch(a){
case 'consumer':closeModal();route('consumer',state.confirmed?6:ui.step);break;
case 'backend':closeModal();route('backend','register');break;
case 'backend-view':route('backend',v);break;
case 'open-workspace':route('backend','workspace');break;
case 'open-history':route('backend','history');break;
case 'order-tab':ui.orderTab=v;render();break;
case 'step':if(ui.step===2&&!saveTravellers())return;route('consumer',v);break;
case 'next':next();break;
case 'back':if(ui.step===2&&!saveTravellers())return;route('consumer',ui.step-1);break;
case 'continue-booking':route('consumer',Math.min(5,state.completed));break;
case 'select-offer':state.offer=true;persist();render();toast('Return offer selected · €560 for two adults');break;
case 'flight':ui.flight=v;render();break;
case 'passenger':ui.passenger=v;render();break;
case 'seat':{if(state.confirmed)return;const other=state.passengers.find(p=>p.id!==ui.passenger&&state.seats[p.id][ui.flight]===v);if(other){toast('That seat is assigned to your companion.');return;}state.seats[ui.passenger][ui.flight]=state.seats[ui.passenger][ui.flight]===v?null:v;persist();render();break;}
case 'remove-seat':state.seats[ui.passenger][ui.flight]=null;persist();render();break;
case 'scenario-seats':for(const p of state.passengers)for(const f of flights)state.seats[p.id][f.id]=p.id==='elena'?'12A':'12B';persist();render();toast('Four scenario seats assigned · €72');break;
case 'skip-seats':closeModal();progressTo(4);break;
case 'bag':state.bags[ui.passenger][ui.flight]=Number(v);persist();render();toast(`${name(state.passengers.find(p=>p.id===ui.passenger))} · ${flights.find(f=>f.id===ui.flight).label}: ${Number(v)?'1 × 23 kg':'No checked bag'}`);break;
case 'scenario-bags':for(const p of state.passengers)for(const f of flights)state.bags[p.id][f.id]=p.id==='elena'&&f.id==='out'?1:0;persist();render();toast('Elena’s outbound bag added; other checked baggage is zero.');break;
case 'edit-seat':case 'edit-bag':ui.passenger=b.dataset.p;ui.flight=b.dataset.f;route('consumer',a==='edit-seat'?3:4);break;
case 'edit-travellers':route('consumer',2);break;
case 'breakdown':showModal('Your passenger-by-flight breakdown',breakdown(),true);break;
case 'fare-details':showModal('Return economy fare',`<h2>€280 per adult · €560 for two</h2><p>MAD ⇄ LHR · 10–13 November 2026</p><div class="checklist"><span>Both flights included</span><span>Taxes included</span><span>Cabin baggage included</span></div><hr><p>Seat selection: €18 per person per flight.<br>Checked bag: €35 for one 23 kg bag per person per flight.</p><p class="small muted">Fare conditions in this prototype are illustrative. No live airline offer or ticket is issued.</p>`);break;
case 'pay':if(!ui.terms){toast('Please acknowledge the simulated booking checkbox.');document.getElementById('terms').focus();return;}if(ui.payResult==='decline'){showModal('Simulated payment declined',`<p>No order has been confirmed and no funds have moved. Your travellers and selections are preserved.</p><p>Set the payment simulation to “Successful payment” and try again.</p>${btn('Return to payment','close-modal','primary')}`);return;}if(state.confirmed)return;state.confirmed=buildOrder();state.events=historyFor(state.confirmed);state.completed=6;persist();route('consumer',6);toast('Order IB-ORD-26002 created · Simulated paid');break;
case 'load-scenario':closeModal();scenario();ui.filterP='all';ui.filterF='all';route('backend','workspace');toast('Completed scenario loaded · €667');break;
case 'reset':showModal('Start a fresh demo?',`<p>This clears this prototype’s simulated order and returns to the journey search.</p><div class="modal-actions">${btn('Keep current journey','close-modal','secondary')}${btn('Reset demo','confirm-reset','primary')}</div>`);break;
case 'confirm-reset':closeModal();state=defaultState();persist();ui={...ui,step:0,passenger:'elena',flight:'out',terms:false,query:'',filterP:'all',filterF:'all'};route('consumer',0);break;
case 'restore-search':closeModal();state.search=defaultState().search;persist();render();toast('Scenario search details restored');break;
case 'clear-search':ui.query='';render();break;
case 'clear-filters':ui.filterP='all';ui.filterF='all';render();break;
case 'inspect':inspect(b.dataset.p,b.dataset.f);break;
case 'event':ui.expanded=ui.expanded===Number(v)?null:Number(v);render();break;
case 'payment-detail':showModal('Payment position',`<h2>${EUR(currentOrder().payment.amount)}</h2>${statusBadge('Simulated paid','blue')}<p>One consolidated payment is associated with <strong>IB-ORD-26002</strong>.</p><div class="price-row"><span>Payment reference</span><strong>SIM-PAY-26002</strong></div><div class="price-row"><span>Method</span><strong>Demo payment token</strong></div><div class="price-row"><span>Outstanding balance</span><strong>€0</strong></div><p class="small muted">This is a simulation. There are no card details, live authorisations or real payments.</p>`);break;
case 'copy-ref':try{await navigator.clipboard.writeText('IB-ORD-26002');toast('Order reference copied');}catch{showModal('Your order reference','<p class="ref selectable">IB-ORD-26002</p><p>Select and copy the reference above.</p>');}break;
case 'download-order':{const payload={...currentOrder(),creationHistory:state.events};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='IB-ORD-26002.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Order JSON downloaded');break;}
case 'guide':guide();break;
case 'close-modal':closeModal();break;
case 'book':if(state.confirmed)showModal('Your journey is confirmed','<p>Use Reset in the demo navigation to start a fresh simulated booking.</p>');else route('consumer',0);break;
case 'myjourney':if(state.confirmed)route('consumer',6);else showModal('Your journey so far',`<p>Your draft is saved in this browser. Complete the booking to create order IB-ORD-26002.</p>${btn('Continue booking','continue-booking','primary')}`);break;
case 'help':showModal('How can we help?',`<h3>Using this demonstration</h3><p>Choose your flights, add services for each traveller and simulate payment. Switch to the Unisys backend using the dark demo bar.</p><p>All prices are in EUR. Dates and flights follow the supplied scenario. No live availability or customer support is connected.</p>${btn('Open demo guide','guide','primary')}`);break;
case 'prepare':showModal('Prepare your trip',`<h3>Before your journey</h3><p>Both passengers have cabin baggage included. Checked bags and seats are managed per passenger and per flight.</p><p>Departure and arrival times use each airport’s local time.</p><p class="small muted">Travel-document checks and check-in are outside this scenario.</p>`);break;
case 'experience':showModal('The Iberia-inspired experience',`<p>This consumer concept uses Iberia’s red masthead, white navigation, flight-search layout and destination imagery as visual references.</p><p>It demonstrates an independent Unisys ONE Order scenario. It is not an official booking service.</p>`);break;
}});
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();const fd=new FormData(e.target);state.search=Object.fromEntries(fd.entries());persist();const d=defaultState().search;if(Object.keys(d).some(k=>state.search[k]!==d[k])){showModal('This route is outside the demo scenario',`<p>The available mock offer is Madrid (MAD) to London Heathrow (LHR), departing 10 November and returning 13 November 2026, for two adults.</p><p>Your entries are preserved. Restore the scenario details to continue.</p>${btn('Restore scenario details','restore-search','primary')}`);return;}progressTo(1);}if(e.target.id==='traveller-form'){e.preventDefault();if(saveTravellers())progressTo(3);}if(e.target.id==='order-search'){e.preventDefault();ui.query=String(new FormData(e.target).get('query')).trim();render();}});
document.addEventListener('change',e=>{const a=e.target.dataset.change;if(a==='terms')ui.terms=e.target.checked;if(a==='payment')ui.payResult=e.target.value;if(a==='filterP'||a==='filterF'){ui[a]=e.target.value;render();}});
render();
</script></body></html>
