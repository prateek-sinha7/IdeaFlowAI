# Pre-commit hooks for the Flowin monorepo.
#
# Install once per clone:
#     pip install pre-commit==4.0.1
#     pre-commit install
#
# Run manually against the whole repo:
#     pre-commit run --all-files
#
# The two ruff hooks (lint + format check) run on every `git commit` — they are
# sub-second and mirror CI's mandatory `ruff-lint` / `ruff-format` checks
# exactly, so a formatting drift is caught locally instead of by CI (CI run
# 36718805906 went red on eight files formatted by a newer, unpinned ruff).
# Every other hook is `stages: [manual]`; run those with
# `pre-commit run --all-files --hook-stage manual`.
# CI does not run pre-commit itself — it runs the equivalent checks directly
# (ci/*-checks.json and the `security` matrix in .github/workflows/ci.yml).
# The point of these hooks is to catch obvious regressions before they ever
# reach review.
#
# Versions are pinned exactly. Do not use `master` / floating refs.

repos:
  # ---------------------------------------------------------------------
  # Backend: ruff (correctness rules only — see backend/pyproject.toml).
  # ---------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must equal backend/pyproject.toml's `ruff==` dev pin, or the hook and
    # CI's `ruff check` disagree about which rules exist. (Was v0.8.4 against a
    # 0.7.4 dev pin.) Frozen to the commit the v0.7.4 tag pointed at when it was
    # verified (`git ls-remote https://github.com/astral-sh/ruff-pre-commit
    # refs/tags/v0.7.4`), so a repointed tag cannot change what runs here.
    rev: cafecb2f683a620516412e109877570ca7648cbd  # frozen: v0.7.4
    hooks:
      - id: ruff
        name: ruff (backend, tools, scripts)
        # IMPORTANT: no --fix. We do not auto-modify code in a hook; the
        # developer must decide. See backend/pyproject.toml header.
        # --force-exclude: pre-commit passes explicit file paths, which ruff
        # otherwise lints even when [tool.ruff] extend-exclude lists them
        # (alembic/versions, ../tools/loadtest). This keeps the hook's scope
        # identical to CI's `ruff check --config pyproject.toml . ../tools
        # ../scripts` from one exclude list.
        args: [--force-exclude, --config=backend/pyproject.toml]
        files: ^(backend|tools|scripts)/.*\.py$
      - id: ruff-format
        name: ruff format --check (backend, tools, scripts)
        # Report-only, same policy as the lint hook: `--diff` fails the commit
        # and shows the exact change without touching the file. Apply it with
        #     cd backend; uv run --frozen ruff format --config pyproject.toml <file>
        # (the locked 0.7.4 — NOT an editor-bundled or global ruff, whose newer
        # style is what CI rejects).
        args: [--diff, --force-exclude, --config=backend/pyproject.toml]
        files: ^(backend|tools|scripts)/.*\.py$
        # NOTE: --config is explicit on both hooks. ruff auto-discovers
        # pyproject.toml by walking up from each file, which finds
        # backend/pyproject.toml for backend/ files only; repo-root tools/ and
        # scripts/ have no config above them and would silently get ruff's
        # defaults instead of the rules CI applies.

  # ---------------------------------------------------------------------
  # Backend: pyright (import resolution only — see backend/pyrightconfig.json).
  #
  # We use `language: system` so the hook runs the locally-installed
  # pyright (from `pip install -r backend/requirements-dev.txt`). This
  # is intentional: pyright needs to see the installed third-party deps
  # (fastapi, sqlalchemy, etc.) to resolve imports correctly. The
  # standalone mirror at pre-commit-mirrors-pyright runs in an isolated
  # venv where those deps don't exist, which would produce false
  # positives on every commit.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pyright
        name: pyright (backend imports)
        # Pre-commit passes paths relative to the repo root (e.g.
        # `backend/app/foo.py`). After `cd backend`, those paths would
        # double up to `backend/backend/app/foo.py`. We strip the leading
        # `backend/` from each argument with a tiny bash transform.
        entry: bash -c 'cd backend && exec pyright "${@/#backend\//}"' --
        language: system
        types: [python]
        files: ^backend/.*\.py$
        pass_filenames: true
        stages: [manual]
        # Pyright reads backend/pyrightconfig.json. typeCheckingMode is
        # `off` there; only `reportMissingImports` is `error`. This means
        # the hook catches deleted-module imports without surfacing the
        # tens of thousands of latent type errors in an untyped codebase.

  # ---------------------------------------------------------------------
  # Frontend: ESLint via the npm-local install.
  #
  # We deliberately use `language: system` + the project-local eslint
  # binary so the hook runs the exact same eslint and plugins as
  # `npm run lint`. Using the upstream eslint pre-commit mirror would
  # install a separate eslint into pre-commit's venv, which would not
  # know about eslint-config-next or any other project-local plugins.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        # `--max-warnings=-1` keeps the default behavior (warnings allowed).
        # We do NOT auto-fix in the hook.
        entry: bash -c 'cd frontend && ./node_modules/.bin/eslint "$@"' --
        language: system
        files: ^frontend/src/.*\.(ts|tsx|js|jsx)$
        # Strip the leading `frontend/` prefix so eslint receives paths
        # relative to its cwd. Pre-commit always passes repo-relative
        # paths; the bash wrapper above changes into `frontend/`.
        # Pre-commit doesn't have a built-in prefix-strip option, so we
        # do it via a small inline sed-equivalent below.
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false
        stages: [manual]
        # Why pass_filenames=false: the bash wrapper would need to
        # rewrite paths from "frontend/src/foo.tsx" to "src/foo.tsx"
        # before passing to eslint. Simpler to let eslint use its own
        # config-driven file discovery via `npm run lint` semantics.
        # The trade-off: this lints the WHOLE frontend on any frontend
        # change, not just the changed files. For ~50 source files this
        # is fast enough (sub-second on a warm cache) and avoids a
        # whole class of "I changed a file but the hook didn't fire on
        # the right paths" bugs.

  # ---------------------------------------------------------------------
  # Infra: tflint (Terraform lint — mirrors the `security` matrix leg `iac` in
  # .github/workflows/ci.yml, which runs the identical command against the
  # same infra/terraform/.tflint.hcl ruleset via TFLINT_CONFIG_FILE).
  #
  # Uses the locally-installed tflint binary (language: system), the same
  # pattern as pyright/eslint above. One-time setup per clone:
  #     # install tflint (see https://github.com/terraform-linters/tflint):
  #     brew install tflint        # or the install script / your package mgr
  #     # fetch the pinned plugins declared in infra/terraform/.tflint.hcl:
  #     tflint --chdir=infra/terraform --init
  #
  # The hook does NOT run `--init` itself (that hits the network on every
  # commit). If plugins are missing, tflint fails with a clear "run --init"
  # message — same "install once" contract as the other system hooks.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: tflint
        name: tflint (infra)
        # Absolute TFLINT_CONFIG_FILE so recursive mode lints every layer +
        # module against the shared ruleset, identical to the CI invocation.
        # pass_filenames=false: tflint discovers .tf files via the recursive
        # walk, so it lints the whole suite on any infra/terraform change.
        entry: bash -c 'export TFLINT_CONFIG_FILE="$(pwd)/infra/terraform/.tflint.hcl"; exec tflint --chdir=infra/terraform --recursive --minimum-failure-severity=error'
        language: system
        files: ^infra/terraform/.*\.tf$
        pass_filenames: false
        stages: [manual]

  # ---------------------------------------------------------------------
  # Knowledge base — ONE hook, three phases.
  #
  # This was three separate hooks (architecture / domains / sync). They had to
  # run in a fixed order, they shared a `git add`, and each printed its own
  # unlabelled block -- so a developer watching a commit saw three disconnected
  # stanzas with no way to tell which had done anything. The ordering
  # constraint also lived here in YAML, where nothing enforced it, and getting
  # it wrong failed INTERMITTENTLY: a commit deleting a source file failed
  # twice and passed on the third try as the hooks converged.
  #
  # Now the order, the logging and the exit code live in one place --
  # `rebuild_knowledge.py --hook` -- which already owned the stage sequence and
  # asserts it.
  #
  #   [1/3] architecture   ~0.2s glob; pays the ~40s extractor run ONLY when a
  #                        source file was actually added or removed
  #   [2/3] domain cards   ms unless a domain's SYMBOLS moved; then headless
  #                        claude re-authors just the affected cards and
  #                        re-inlines their diagrams into ARCHITECTURE.md
  #   [3/3] index/context  ~1.6s, always
  #
  # Only phase 3 can fail the commit. Phases 1 and 2 regenerate documentation,
  # and losing a documentation refresh must never cost someone their commit --
  # a teammate without the `claude` CLI is unaffected. A broken link in phase 3
  # IS a real failure and blocks.
  #
  # `verbose: true` because pre-commit hides a passing hook's output, and the
  # whole point of the phase logging is to see what happened.
  #
  # always_run, NOT `files: ^\.knowledge/`: pre-commit passes a hook the files
  # that EXIST, so a commit whose only change is a DELETED card matches nothing
  # and the hook is skipped -- exactly when the index most needs regenerating,
  # because it still advertises a card that is gone. That shipped a broken
  # INDEX.md in commit 07394989.
  #
  # `SKIP=knowledge git commit ...` opts out for one commit.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: knowledge
        name: knowledge base (architecture -> domains -> index)
        entry: python3 tools/knowledge/rebuild_knowledge.py --hook
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        # Off by default during the soft-rollout window: `git commit` will
        # NOT run this hook. Run it manually with
        #     pre-commit run knowledge --hook-stage manual
        # To make it auto again, delete the stages line below.
        stages: [manual]

