[pytest]
testpaths = suites

# `framework` is imported by name, so this directory has to be importable.
pythonpath = .

# importlib mode, so two suites may both hold a `test_tabs.py` without the
# second silently shadowing the first. The default (prepend) resolves test
# modules by basename across the whole tree, which breaks the moment 24 areas
# start reusing obvious names.
addopts =
    -m "not live"
    -q
    --import-mode=importlib
    --browser-channel chrome
    --base-url http://localhost:3000

# --browser-channel chrome drives /Applications/Google Chrome.app, NOT
# Playwright's bundled "Chrome for Testing": the screenshots should show the
# browser the product is actually used in.
#
# Skipping the live tier is the DEFAULT, not a flag anyone has to remember:
#   pytest                        offline only
#   pytest -m live                real Bedrock (a CLI -m overrides the one above)
#   pytest -m "live or not live"  everything
#   pytest suites/01_auth         one area

# Offline default. Live tests raise it with @pytest.mark.timeout(600).
timeout = 180

markers =
    scenario(id): the Gherkin scenario in ../screens/ that this test implements
    issue(id): the ISS card this test proves; paired with xfail until the fix lands
    live: really calls Bedrock — costs money, skipped by default
    destructive: mutates shared state, needs a reset first
    defect: asserts today's wrong behaviour, not the desired one
    anonymous: start with NO session — for scenarios that drive sign-in itself
    role(name): start signed in as that seeded account (admin/enterprise/pro/basic)
