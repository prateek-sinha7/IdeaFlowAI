# =============================================================================
# VelocityAI gitleaks configuration.
# =============================================================================
# Consumed by .github/workflows/ci.yml (`security-scan` job) — previously by
# the retired infra/buildspec.yml pre_build phase, same invocation.
# Extends gitleaks' built-in rule set (so all default detectors stay active on
# real, shipping code) and adds a PATH allowlist for directories that
# legitimately contain EXAMPLE / TEST / PLACEHOLDER secret-shaped strings.
#
# Rationale: the CI gate runs `gitleaks detect --no-git --redact --no-banner -v
# --source .` over the entire working tree. Without this allowlist it flags
# fixtures and docs that are intentionally fake (e.g. the AWS documentation
# example keys, RSA test blocks, `ghp_0123...` fixtures, `CHANGE_ME` env
# placeholders). Those are not real credentials, so they are scoped out by
# path here.
#
# IMPORTANT: only NON-SHIPPING paths are allowlisted. Application source
# (backend/app, backend/agents non-test, frontend/src), and real infrastructure
# (infra/terraform except the localstack throwaway layer, infra/scripts) are
# still scanned with the full default rule set. Do NOT add shipping paths here.
# If a genuine secret needs scoping, prefer a narrow regex/stopword over a path.

title = "VelocityAI gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Non-shipping paths containing example/test/placeholder secrets."
paths = [
  # Test fixtures (deliberately fake secrets used to exercise detection logic).
  '''backend/tests/.*''',
  '''frontend/e2e/.*''',
  # Documentation and planning artifacts (illustrative examples only).
  '''docs/.*''',
  '''\.planning/.*''',
  # Committed local AI-tooling skills — example tokens in their docs.
  '''skills/.*''',
  # Env templates: placeholders only (CHANGE_ME / GENERATE-... / dev-secret-...).
  '''env-templates/.*''',
  # Any committed *.example template (e.g. app.env.example, *.tfvars.example).
  '''.*\.example$''',
  # LocalStack throwaway layer — values are explicit placeholders, never real.
  '''infra/terraform/localstack/.*''',
]

# Belt-and-suspenders: well-known *example* credentials that are published as
# fakes (AWS docs keys; Stripe-style sample keys used in API tutorials embedded
# in frontend/src/data/skills.ts). Recognize them as examples wherever they
# appear so a sample never trips the gate. Keep these SPECIFIC, never broad.
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  '''sk_live_abc123''',
]

# Fingerprint allowlist (gitleaks --source . --no-git scans the FULL git log,
# not just the working tree — a finding's commit can predate any path/regex
# rule added above and still surface on every future scan). Each entry below
# is `<commit>:<file>:<rule>:<line>` from a `gitleaks detect -v` run and was
# manually triaged:
#
#   - identity.py:133 / identity.py:159 / velocityai-alb/README.md:14 /
#     foundation/README.md:13 — false positives. generic-api-key matched
#     ordinary code (`verify_exp=not allow_expired`) or prose ("Secrets:
#     none created..." / "Secrets: `app_secret_key` / `db_password`
#     default empty..."). No secret-shaped value is present.
#   - FINDINGS.md:167 (aws-access-token, `ASIA3S4PSEJ5EQAD7HOA`) — a real
#     STS temporary session ID pasted into a debugging doc. Confirmed
#     EXPIRED by the doc's own text (session died ~23 min after issue,
#     months before this scan) and the file no longer exists on any branch.
#   - .vscode/settings.json:5 (jwt) — a real signed JWT committed to a local
#     REST Client config. Decoded `exp` is in the past (confirmed expired)
#     and the file no longer exists on any branch (also gitignored going
#     forward — see `.gitignore`).
#
# Rotate-then-allowlist, never allowlist-first: both real findings were
# independently confirmed dead (expired) before being added here.
fingerprints = [
  "5da5de51ecc5a232f98693bd5fa3f74dec7bc8c9:infra/terraform/velocityai-alb/README.md:generic-api-key:14",
  "8f8d5efeb831525af0a8fe661b369e4898575476:backend/app/core/identity.py:generic-api-key:133",
  "8f8d5efeb831525af0a8fe661b369e4898575476:backend/app/core/identity.py:generic-api-key:159",
  "231f8c0711094f27579bbf3d46a18696d9a7138c:backend/evals/minimal/OPUS-AUTOMATIC/FINDINGS.md:aws-access-token:167",
  "62853fcd7e1562c78b7217d99094c0f672ae220f:.vscode/settings.json:jwt:5",
  "e1a3a4959c0b51a8c4a502742a96aeda412967e7:infra/terraform/foundation/README.md:generic-api-key:13",
]
